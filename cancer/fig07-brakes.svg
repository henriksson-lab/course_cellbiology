<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2a3a"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0L5 10" stroke="#1b2a3a" stroke-width="3"/></marker></defs>
  <!-- Left: Rb -->
  <rect x="10" y="10" width="530" height="450" rx="14" fill="#fbfaf5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="275" y="44" font-size="22" font-weight="700" text-anchor="middle">Rb: the gate from G1 into S phase</text>
  <rect x="40" y="76" width="170" height="46" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="125" y="105" font-size="17" text-anchor="middle">cyclin D–CDK4/6</text>
  <rect x="40" y="160" width="80" height="40" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="80" y="186" font-size="16" text-anchor="middle">p16</text>
  <line x1="80" y1="158" x2="80" y2="126" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#t)"/>
  <text x="130" y="186" font-size="15">CDK inhibitor</text>
  <line x1="212" y1="99" x2="300" y2="99" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="256" y="90" font-size="15" text-anchor="middle">P</text>
  <rect x="304" y="76" width="200" height="46" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="404" y="105" font-size="17" text-anchor="middle">Rb lets go of E2F</text>
  <line x1="404" y1="124" x2="404" y2="166" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="304" y="170" width="200" height="46" rx="8" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="404" y="199" font-size="17" text-anchor="middle">S-phase genes on</text>
  <text x="40" y="262" font-size="17" font-weight="700">In cancer the gate is forced open:</text>
  <text x="40" y="290" font-size="16">• cyclin D or CDK4 amplified (more push)</text>
  <text x="40" y="316" font-size="16">• p16 deleted or silenced (no inhibitor)</text>
  <text x="40" y="342" font-size="16">• RB1 lost (no gate at all)</text>
  <text x="40" y="368" font-size="16">• or a virus protein binds Rb (HPV E7)</text>
  <rect x="40" y="390" width="470" height="56" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="56" y="414" font-size="16"><tspan fill="#e8590c" font-weight="700">Palbociclib</tspan> blocks CDK4/6: the gate closes again,</text>
  <text x="56" y="436" font-size="16">but only if the cell still has Rb.</text>
  <!-- Right: p53 -->
  <rect x="560" y="10" width="530" height="450" rx="14" fill="#fbfaf5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="825" y="44" font-size="22" font-weight="700" text-anchor="middle">p53: the guardian of the genome</text>
  <rect x="600" y="76" width="170" height="46" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="685" y="105" font-size="17" text-anchor="middle">DNA damage, stress</text>
  <line x1="772" y1="99" x2="842" y2="99" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="846" y="76" width="110" height="46" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="901" y="105" font-size="18" text-anchor="middle" font-weight="700">p53</text>
  <rect x="972" y="80" width="98" height="38" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="1021" y="105" font-size="15" text-anchor="middle">MDM2</text>
  <line x1="972" y1="99" x2="960" y2="99" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#t)"/>
  <text x="1021" y="138" font-size="13" text-anchor="middle">degrades p53</text>
  <g stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)">
    <line x1="880" y1="124" x2="680" y2="176"/><line x1="901" y1="124" x2="870" y2="176"/><line x1="922" y1="124" x2="1010" y2="176"/>
  </g>
  <rect x="590" y="180" width="160" height="62" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="670" y="206" font-size="16" text-anchor="middle">pause (p21)</text><text x="670" y="228" font-size="15" text-anchor="middle">and repair</text>
  <rect x="780" y="180" width="150" height="62" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="855" y="206" font-size="16" text-anchor="middle">senescence</text><text x="855" y="228" font-size="15" text-anchor="middle">(stop for good)</text>
  <rect x="950" y="180" width="125" height="62" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="1012" y="206" font-size="16" text-anchor="middle">apoptosis</text><text x="1012" y="228" font-size="15" text-anchor="middle">(PUMA, NOXA)</text>
  <text x="590" y="290" font-size="17" font-weight="700">In cancer:</text>
  <text x="590" y="318" font-size="16">• TP53 mutated in about half of all cancers</text>
  <text x="590" y="344" font-size="16">• or MDM2 amplified (p53 destroyed)</text>
  <text x="590" y="370" font-size="16">• inherited TP53 mutation: Li–Fraumeni syndrome</text>
  <rect x="590" y="390" width="470" height="56" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="606" y="414" font-size="16">Without p53, damaged cells keep dividing:</text>
  <text x="606" y="436" font-size="16">mutations pile up faster (genome instability).</text>
</svg>
