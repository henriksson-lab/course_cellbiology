<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2a3a"/></marker></defs>
<text x="160" y="32" font-size="19" font-weight="700" text-anchor="middle">At diagnosis</text>
<circle cx="160" cy="140" r="95" fill="#a9c9ef" stroke="#2754a3" stroke-width="2"/>
<circle cx="146.8" cy="166.4" r="4" fill="#d6457a"/>
<circle cx="148.0" cy="123.4" r="4" fill="#d6457a"/>
<circle cx="115.2" cy="129.8" r="4" fill="#d6457a"/>
<circle cx="210.6" cy="159.3" r="4" fill="#d6457a"/>
<circle cx="208.7" cy="151.7" r="4" fill="#d6457a"/>
<circle cx="180.7" cy="149.7" r="4" fill="#d6457a"/>
<circle cx="98.6" cy="171.6" r="4" fill="#d6457a"/>
<circle cx="185.6" cy="165.2" r="4" fill="#d6457a"/>
<circle cx="108.4" cy="87.0" r="4" fill="#d6457a"/>
<text x="40" y="268" font-size="16">10<tspan dy="-7" font-size="12">9</tspan><tspan dy="7"> </tspan>cells; if 1 in 10<tspan dy="-7" font-size="12">7</tspan><tspan dy="7"> </tspan>is resistant</text>
<text x="40" y="290" font-size="16">to drug A: about <tspan font-weight="700">100 resistant cells</tspan></text>
<text x="40" y="312" font-size="16">are already there</text>
<line x1="270" y1="110" x2="400" y2="80" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="335" y="72" font-size="16" fill="#e8590c" font-weight="700" text-anchor="middle">drug A</text>
<circle cx="450" cy="80" r="16" fill="#d6457a" stroke="#8f1d4a" stroke-width="2"/>
<text x="440" y="128" font-size="16">shrinks to the resistant cells …</text>
<line x1="474" y1="82" x2="680" y2="88" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="740" cy="90" r="52" fill="#d6457a" stroke="#8f1d4a" stroke-width="2"/>
<text x="810" y="84" font-size="17" font-weight="700">… which regrow:</text><text x="810" y="106" font-size="17" font-weight="700">relapse in months</text>
<line x1="270" y1="180" x2="400" y2="215" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="335" y="236" font-size="16" fill="#e8590c" font-weight="700" text-anchor="middle">A + B</text>
<circle cx="450" cy="220" r="5" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="3 3"/>
<text x="480" y="214" font-size="16">a cell must resist both: 10<tspan dy="-7" font-size="12">9</tspan><tspan dy="7"> </tspan>× 10<tspan dy="-7" font-size="12">−7</tspan><tspan dy="7"> </tspan>× 10<tspan dy="-7" font-size="12">−7</tspan><tspan dy="7"> </tspan>= 0.00001</text>
<text x="480" y="236" font-size="16">→ most likely <tspan font-weight="700">no</tspan> such cell exists at the start</text>
<text x="480" y="258" font-size="15" fill="#555">(the same logic as combination therapy for HIV and tuberculosis)</text>
<rect x="20" y="330" width="1060" height="100" rx="12" fill="#fbfaf5" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="40" y="358" font-size="17" font-weight="700">Ways out for a cancer cell:</text>
<text x="40" y="384" font-size="16">• the target changes (gatekeeper mutation: EGFR T790M, BCR-ABL T315I) · • another pathway takes over (bypass)</text>
<text x="40" y="410" font-size="16">• the drug is pumped out (P-glycoprotein, an ABC transporter) · • the cell changes type (lineage switch) · • drug cannot reach it</text>
</svg>