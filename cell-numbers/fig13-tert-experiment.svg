<g font-size="16">
<text x="590" y="60" font-weight="bold">Cells with added TERT:</text>
<text x="590" y="88">• keep long telomeres</text>
<text x="590" y="114">• divide far past the</text>
<text x="602" y="136">Hayflick limit</text>
<text x="590" y="162">• keep normal</text>
<text x="602" y="184">chromosomes</text>
<text x="590" y="210">• still stop at confluence</text>
<text x="602" y="232">and need serum</text>
<text x="590" y="266" font-weight="bold">Immortal is not the</text>
<text x="590" y="288" font-weight="bold">same as cancer.</text>
</g>
