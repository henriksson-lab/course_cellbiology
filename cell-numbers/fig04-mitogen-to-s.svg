<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <!-- membrane at left, vertical -->
  <rect x="78" y="10" width="20" height="150" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="48" cy="60" r="12" fill="#2b8a3e"/>
  <text x="48" y="100" text-anchor="middle" font-size="15">mitogen</text>
  <rect x="80" y="45" width="16" height="44" rx="5" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="88" y="182" text-anchor="middle" font-size="14" fill="#8a6a12">membrane</text>
  <!-- cytosol chain -->
  <rect x="125" y="45" width="135" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="192" y="71" text-anchor="middle">RTK → Ras</text>
  <line x1="262" y1="65" x2="300" y2="65" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="304" y="45" width="190" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="399" y="71" text-anchor="middle">RAF → MEK → ERK</text>
  <text x="399" y="112" text-anchor="middle" font-size="14" fill="#555">kinase cascade (earlier lecture)</text>
  <line x1="496" y1="65" x2="560" y2="65" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- nucleus -->
  <rect x="565" y="10" width="325" height="360" rx="30" fill="#efebf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="878" y="358" text-anchor="end" font-size="15" fill="#6b4fa0">nucleus</text>
  <rect x="590" y="40" width="275" height="50" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="727" y="62" text-anchor="middle">Myc, AP-1 (transcription)</text>
  <text x="727" y="82" text-anchor="middle" font-size="15">→ make cyclin D</text>
  <line x1="727" y1="92" x2="727" y2="122" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="610" y="126" width="235" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="727" y="152" text-anchor="middle">cyclin D–CDK4/6</text>
  <line x1="727" y1="168" x2="727" y2="198" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="737" y="190" font-size="14">phosphorylates</text>
  <rect x="590" y="202" width="275" height="50" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="727" y="224" text-anchor="middle">Rb–P lets go of E2F</text>
  <text x="727" y="244" text-anchor="middle" font-size="15">E2F turns on S-phase genes</text>
  <line x1="727" y1="254" x2="727" y2="290" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="610" y="294" width="235" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="727" y="320" text-anchor="middle">cyclin E–CDK2 → S phase</text>
  <!-- positive feedback -->
  <path d="M847,314 C885,300 885,240 868,228" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#ao)"/>
  <!-- restriction point label -->
  <rect x="120" y="205" width="410" height="78" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="325" y="232" text-anchor="middle" font-weight="bold" fill="#c2410c">Restriction point</text>
  <text x="325" y="256" text-anchor="middle" font-size="15">Before it: no mitogen → rest in G0.</text>
  <text x="325" y="275" text-anchor="middle" font-size="15">After it: committed, no mitogen needed.</text>
  <line x1="532" y1="235" x2="586" y2="228" stroke="#e8590c" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="325" y="330" text-anchor="middle" font-size="15" fill="#555">Positive feedback (orange loop) makes the switch all-or-none</text>
  <text x="325" y="350" text-anchor="middle" font-size="15" fill="#555">(the cell-cycle control lecture).</text>
</svg>
