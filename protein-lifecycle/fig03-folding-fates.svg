<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a61e4d"/></marker>
  </defs>
  <!-- ribosome and new chain -->
  <ellipse cx="80" cy="200" rx="58" ry="30" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <ellipse cx="80" cy="160" rx="42" ry="22" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="80" y="206" text-anchor="middle" font-size="15">ribosome</text>
  <path d="M112,150 q12,-18 24,-4 t24,-6 t22,-4" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="139" cy="146" r="5" fill="#8a6a12"/><circle cx="170" cy="138" r="5" fill="#8a6a12"/>
  <text x="80" y="262" text-anchor="middle">new chain,</text>
  <text x="80" y="282" text-anchor="middle">about 5 amino</text>
  <text x="80" y="302" text-anchor="middle">acids per second</text>
  <line x1="196" y1="170" x2="282" y2="190" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- partly folded intermediate -->
  <path d="M300,190 c10,-40 70,-48 92,-18 c22,28 6,58 -24,62 c-30,6 -78,-6 -68,-44 z" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <path d="M392,172 q18,6 22,24" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="318" cy="170" r="7" fill="#8a6a12"/><circle cx="380" cy="222" r="7" fill="#8a6a12"/><circle cx="414" cy="198" r="7" fill="#8a6a12"/>
  <text x="352" y="268" text-anchor="middle">partly folded:</text>
  <text x="352" y="288" text-anchor="middle">hydrophobic patches</text>
  <text x="352" y="308" text-anchor="middle">(brown) exposed</text>
  <!-- chaperone loop -->
  <path d="M318,140 C300,70 410,70 392,140" fill="none" stroke="#a61e4d" stroke-width="2.5" marker-end="url(#ahr)"/>
  <text x="355" y="62" text-anchor="middle" fill="#a61e4d" font-weight="bold">chaperones bind,</text>
  <text x="355" y="82" text-anchor="middle" fill="#a61e4d" font-weight="bold">release, try again</text>
  <!-- outcomes -->
  <line x1="430" y1="165" x2="620" y2="78" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="508" y="104" text-anchor="middle" transform="rotate(-24 508 104)">folds</text>
  <line x1="436" y1="200" x2="620" y2="200" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="528" y="190" text-anchor="middle">sticks to others</text>
  <line x1="430" y1="232" x2="620" y2="318" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="560" y="358" text-anchor="middle">tagged, destroyed</text>
  <!-- native -->
  <circle cx="668" cy="70" r="40" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <circle cx="668" cy="70" r="16" fill="#8a6a12" fill-opacity="0.85"/>
  <text x="722" y="58">native protein:</text>
  <text x="722" y="78">hydrophobic core</text>
  <text x="722" y="98">buried inside</text>
  <!-- aggregate -->
  <g fill="#d0ebff" stroke="#1971c2" stroke-width="2">
    <circle cx="645" cy="188" r="18"/><circle cx="676" cy="180" r="18"/><circle cx="661" cy="212" r="18"/><circle cx="694" cy="208" r="18"/>
  </g>
  <g fill="#8a6a12"><circle cx="660" cy="184" r="5"/><circle cx="676" cy="200" r="5"/><circle cx="652" cy="200" r="4"/><circle cx="685" cy="193" r="4"/></g>
  <text x="722" y="192">aggregate</text>
  <text x="722" y="212">(amyloid fibrils)</text>
  <!-- proteasome -->
  <g fill="#dee2e6" stroke="#495057" stroke-width="2">
    <rect x="636" y="300" width="18" height="44" rx="4"/><rect x="656" y="300" width="18" height="44" rx="4"/><rect x="676" y="300" width="18" height="44" rx="4"/>
  </g>
  <text x="722" y="318">proteasome:</text>
  <text x="722" y="338">back to amino acids</text>
  <!-- stress -->
  <path d="M630,96 C560,128 470,140 434,152" fill="none" stroke="#1b2a3a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="560" y="150" font-size="15" font-style="italic">heat, stress</text>
</svg>
