<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- ER with antibodies -->
  <rect x="20" y="40" width="200" height="130" rx="30" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="120" y="66" text-anchor="middle" fill="#2a7f8f" font-weight="bold">ER of a plasma cell</text>
  <g stroke="#1971c2" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M60,140 v-22 l-12,-14 M60,118 l12,-14"/><path d="M100,150 v-22 l-12,-14 M100,128 l12,-14"/><path d="M140,140 v-22 l-12,-14 M140,118 l12,-14"/>
  </g>
  <path d="M176,128 q10,-24 22,-6 t10,14" fill="none" stroke="#1971c2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="186" cy="118" r="5" fill="#8a6a12"/>
  <text x="120" y="196" text-anchor="middle" font-size="15">thousands of antibody</text>
  <text x="120" y="214" text-anchor="middle" font-size="15">molecules per second;</text>
  <text x="120" y="232" text-anchor="middle" font-size="15">some always misfold</text>
  <line x1="226" y1="122" x2="318" y2="122" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="272" y="110" text-anchor="middle" font-size="15">ERAD</text>
  <!-- proteasome blocked -->
  <g fill="#dee2e6" stroke="#495057" stroke-width="2">
    <rect x="330" y="96" width="20" height="54" rx="4"/><rect x="352" y="96" width="20" height="54" rx="4"/><rect x="374" y="96" width="20" height="54" rx="4"/>
  </g>
  <path d="M318,80 l90,90 M408,80 l-90,90" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
  <text x="362" y="66" text-anchor="middle" fill="#e8590c" font-weight="bold">bortezomib</text>
  <text x="362" y="196" text-anchor="middle" font-size="15">proteasome</text>
  <text x="362" y="214" text-anchor="middle" font-size="15">blocked</text>
  <line x1="420" y1="122" x2="500" y2="122" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- pile up -->
  <g fill="#d0ebff" stroke="#1971c2" stroke-width="2">
    <circle cx="530" cy="110" r="14"/><circle cx="552" cy="100" r="14"/><circle cx="548" cy="126" r="14"/><circle cx="572" cy="118" r="14"/><circle cx="530" cy="136" r="14"/>
  </g>
  <text x="550" y="176" text-anchor="middle" font-size="15">misfolded protein</text>
  <text x="550" y="194" text-anchor="middle" font-size="15">piles up: ER stress</text>
  <line x1="600" y1="122" x2="680" y2="122" stroke="#1b2a3a" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- apoptosis -->
  <circle cx="740" cy="122" r="44" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="726" cy="112" r="9" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/><circle cx="752" cy="132" r="7" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="740" y="196" text-anchor="middle" font-size="15">unfolded protein</text>
  <text x="740" y="214" text-anchor="middle" font-size="15">response fails:</text>
  <text x="740" y="232" text-anchor="middle" font-size="15" font-weight="bold">the cell dies (apoptosis)</text>
  <text x="450" y="280" text-anchor="middle" font-size="15">Normal cells make far less secreted protein, so they cope better with a partly blocked proteasome.</text>
</svg>
