<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <g id="ub"><circle r="15" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="13" font-weight="bold">Ub</text></g>
  </defs>
  <!-- free Ub -->
  <use href="#ub" x="40" y="110"/>
  <line x1="60" y1="110" x2="92" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- E1 -->
  <rect x="100" y="80" width="100" height="60" rx="12" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="2.2"/>
  <text x="150" y="117" text-anchor="middle" font-weight="bold">E1</text>
  <use href="#ub" x="200" y="74"/>
  <text x="150" y="168" text-anchor="middle" font-size="15">activates Ub,</text>
  <text x="150" y="188" text-anchor="middle" font-size="15">uses ATP</text>
  <line x1="210" y1="110" x2="262" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- E2 -->
  <rect x="270" y="80" width="100" height="60" rx="12" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="2.2"/>
  <text x="320" y="117" text-anchor="middle" font-weight="bold">E2</text>
  <use href="#ub" x="370" y="74"/>
  <text x="320" y="168" text-anchor="middle" font-size="15">carries Ub</text>
  <line x1="380" y1="110" x2="432" y2="110" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- E3 + substrate -->
  <path d="M440,70 h120 a14,14 0 0 1 14,14 v70 a14,14 0 0 1 -14,14 h-120 a14,14 0 0 1 -14,-14 v-70 a14,14 0 0 1 14,-14 z" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/>
  <text x="500" y="112" text-anchor="middle" font-weight="bold" fill="#0b7285">E3 ligase</text>
  <text x="500" y="134" text-anchor="middle" font-size="15" fill="#0b7285">binds the substrate</text>
  <g transform="translate(-12 0)">
  <path d="M588,120 c0,-36 60,-46 80,-16 c18,26 4,54 -30,56 c-30,2 -50,-6 -50,-40 z" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="630" y="134" text-anchor="middle" font-size="15">substrate</text>
  <rect x="604" y="92" width="18" height="12" fill="#e8590c" fill-opacity="0.25" stroke="#e8590c" stroke-width="1.5"/>
  </g>
  <text x="560" y="210" text-anchor="middle" font-size="15">E3 recognises a degron (orange) and</text>
  <text x="560" y="230" text-anchor="middle" font-size="15">moves Ub from E2 onto a lysine</text>
  <!-- chain on substrate -->
  <line x1="660" y1="86" x2="676" y2="62" stroke="#1b2a3a" stroke-width="2"/>
  <use href="#ub" x="684" y="50"/><use href="#ub" x="712" y="36"/><use href="#ub" x="740" y="22"/><use href="#ub" x="768" y="36"/>
  <text x="800" y="70" font-size="15">repeat: a</text>
  <text x="800" y="90" font-size="15">Ub chain</text>
  <!-- numbers -->
  <text x="40" y="260" font-weight="bold">How many kinds in human cells?</text>
  <text x="40" y="284">2 E1 → about 40 E2 → about 600 E3. The E3s decide which proteins are tagged.</text>
  <!-- chain types -->
  <rect x="30" y="306" width="420" height="82" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <use href="#ub" x="60" y="347"/><use href="#ub" x="90" y="347"/><use href="#ub" x="120" y="347"/><use href="#ub" x="150" y="347"/>
  <text x="180" y="340" font-size="15">chain linked through Lys48</text>
  <text x="180" y="362" font-size="15">(4 or more Ub): to the</text>
  <text x="180" y="382" font-size="15" font-weight="bold">proteasome, destroyed</text>
  <rect x="470" y="306" width="410" height="82" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
  <use href="#ub" x="500" y="347"/>
  <text x="525" y="340" font-size="15">one Ub, or chains through Lys63:</text>
  <text x="525" y="362" font-size="15" font-weight="bold">a signal, not a death mark:</text>
  <text x="525" y="382" font-size="15">endocytosis, signalling, DNA repair</text>
</svg>
