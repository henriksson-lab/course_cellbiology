<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
<rect x="20" y="14" width="400" height="44" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
<text x="34" y="34" font-size="15">Add <tspan font-weight="bold" fill="#e8590c">cycloheximide</tspan> at 0 h: ribosomes stop,</text>
<text x="34" y="52" font-size="15">no new protein. Lyse cells at each time.</text>
<rect x="100" y="96" width="320" height="150" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
<text x="144" y="88" text-anchor="middle" font-size="15">0 h</text>
<rect x="122" y="122" width="44" height="14" rx="4" fill="rgb(40,40,40)"/>
<rect x="122" y="192" width="44" height="14" rx="4" fill="rgb(50,50,50)"/>
<text x="204" y="88" text-anchor="middle" font-size="15">1 h</text>
<rect x="182" y="122" width="44" height="14" rx="4" fill="rgb(102,102,102)"/>
<rect x="182" y="192" width="44" height="14" rx="4" fill="rgb(50,50,50)"/>
<text x="264" y="88" text-anchor="middle" font-size="15">2 h</text>
<rect x="242" y="122" width="44" height="14" rx="4" fill="rgb(147,147,147)"/>
<rect x="242" y="192" width="44" height="14" rx="4" fill="rgb(50,50,50)"/>
<text x="324" y="88" text-anchor="middle" font-size="15">4 h</text>
<rect x="302" y="122" width="44" height="14" rx="4" fill="rgb(201,201,201)"/>
<rect x="302" y="192" width="44" height="14" rx="4" fill="rgb(50,50,50)"/>
<text x="384" y="88" text-anchor="middle" font-size="15">8 h</text>
<rect x="362" y="122" width="44" height="14" rx="4" fill="rgb(241,241,241)"/>
<rect x="362" y="192" width="44" height="14" rx="4" fill="rgb(50,50,50)"/>
<text x="92" y="134" text-anchor="end" font-size="15">protein X</text>
<text x="92" y="196" text-anchor="end" font-size="15">loading</text>
<text x="92" y="214" text-anchor="end" font-size="15">control</text>
<text x="260" y="278" text-anchor="middle" font-size="15">Western blot: antibody against X,</text>
<text x="260" y="298" text-anchor="middle" font-size="15">and against a stable protein (actin)</text>
<text x="260" y="318" text-anchor="middle" font-size="15">to check equal loading</text>
<line x1="540" x2="860" y1="80.0" y2="80.0" stroke="#e9ecef"/>
<text x="532" y="85.0" text-anchor="end" font-size="14">100 %</text>
<line x1="540" x2="860" y1="124.0" y2="124.0" stroke="#e9ecef"/>
<text x="532" y="129.0" text-anchor="end" font-size="14">50 %</text>
<line x1="540" x2="860" y1="168.0" y2="168.0" stroke="#e9ecef"/>
<text x="532" y="173.0" text-anchor="end" font-size="14">25 %</text>
<line x1="540" x2="860" y1="212.0" y2="212.0" stroke="#e9ecef"/>
<text x="532" y="217.0" text-anchor="end" font-size="14">12.5 %</text>
<line x1="540" x2="860" y1="256.0" y2="256.0" stroke="#e9ecef"/>
<text x="532" y="261.0" text-anchor="end" font-size="14">6 %</text>
<text x="540.0" y="322" text-anchor="middle" font-size="15">0</text>
<text x="620.0" y="322" text-anchor="middle" font-size="15">2</text>
<text x="700.0" y="322" text-anchor="middle" font-size="15">4</text>
<text x="780.0" y="322" text-anchor="middle" font-size="15">6</text>
<text x="860.0" y="322" text-anchor="middle" font-size="15">8</text>
<line x1="540" x2="860" y1="300" y2="300" stroke="#1b2a3a" stroke-width="1.5"/><line x1="540" x2="540" y1="300" y2="70" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="700.0" y="346" text-anchor="middle" font-size="15">hours after cycloheximide</text>
<text x="470" y="58" font-size="15">band of X (log scale)</text>
<line x1="540.0" y1="80.0" x2="860.0" y2="256.0" stroke="#1971c2" stroke-width="3"/>
<circle cx="540.0" cy="80.0" r="6" fill="#1971c2"/>
<circle cx="580.0" cy="102.0" r="6" fill="#1971c2"/>
<circle cx="620.0" cy="124.0" r="6" fill="#1971c2"/>
<circle cx="700.0" cy="168.0" r="6" fill="#1971c2"/>
<circle cx="860.0" cy="256.0" r="6" fill="#1971c2"/>
<line x1="540" y1="124.0" x2="620.0" y2="124.0" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="620.0" y1="124.0" x2="620.0" y2="300" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="630.0" y="94.0" font-size="15" fill="#e8590c" font-weight="bold">t½ = 2 h</text>
<text x="724.0" y="130.0" font-size="15">straight line:</text>
<text x="724.0" y="148.0" font-size="15">slope = −k_d</text>
</svg>