<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <g id="ub"><circle r="12" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="bold">Ub</text></g>
    <g id="p"><circle r="11" fill="#ffec99" stroke="#e67700" stroke-width="2"/><text y="5" text-anchor="middle" font-size="13" font-weight="bold">P</text></g>
  </defs>
  <!-- nucleus -->
  <path d="M600,250 h300 v130 h-300 z" fill="#efebf7" stroke="none"/>
  <path d="M600,380 v-120 a10,10 0 0 1 10,-10 h290" fill="none" stroke="#6b4fa0" stroke-width="3"/>
  <text x="886" y="372" text-anchor="end" fill="#6b4fa0" font-weight="bold">nucleus</text>
  <!-- 1 resting -->
  <rect x="40" y="70" width="90" height="50" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="85" y="101" text-anchor="middle" font-weight="bold">NF-κB</text>
  <path d="M40,70 q45,-40 90,0" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="85" y="40" text-anchor="middle" font-weight="bold" fill="#1971c2">IκB</text>
  <text x="85" y="150" text-anchor="middle" font-size="15">1. IκB holds NF-κB</text>
  <text x="85" y="170" text-anchor="middle" font-size="15">in the cytosol</text>
  <line x1="150" y1="90" x2="232" y2="90" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="191" y="80" text-anchor="middle" font-size="15">signal</text>
  <!-- 2 phosphorylated -->
  <rect x="250" y="70" width="90" height="50" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="295" y="101" text-anchor="middle" font-weight="bold">NF-κB</text>
  <path d="M250,70 q45,-40 90,0" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <use href="#p" x="268" y="44"/><use href="#p" x="292" y="38"/>
  <text x="295" y="150" text-anchor="middle" font-size="15">2. a kinase (IKK) adds</text>
  <text x="295" y="170" text-anchor="middle" font-size="15">two phosphates:</text>
  <text x="295" y="190" text-anchor="middle" font-size="15">now a degron</text>
  <line x1="360" y1="90" x2="442" y2="90" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- 3 ubiquitinated -->
  <rect x="460" y="70" width="90" height="50" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="505" y="101" text-anchor="middle" font-weight="bold">NF-κB</text>
  <path d="M460,70 q45,-40 90,0" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <use href="#p" x="478" y="44"/><use href="#p" x="502" y="38"/>
  <use href="#ub" x="536" y="40"/><use href="#ub" x="556" y="24"/><use href="#ub" x="578" y="16"/><use href="#ub" x="600" y="24"/>
  <text x="505" y="150" text-anchor="middle" font-size="15">3. an E3 reads the</text>
  <text x="505" y="170" text-anchor="middle" font-size="15">phospho-degron and</text>
  <text x="505" y="190" text-anchor="middle" font-size="15">adds a Ub chain</text>
  <line x1="570" y1="90" x2="652" y2="90" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- 4 proteasome eats IkB -->
  <g fill="#dee2e6" stroke="#495057" stroke-width="2">
    <rect x="680" y="50" width="16" height="44" rx="4"/><rect x="698" y="50" width="16" height="44" rx="4"/><rect x="716" y="50" width="16" height="44" rx="4"/>
    <rect x="676" y="38" width="60" height="14" rx="5"/>
  </g>
  <text x="760" y="70" font-size="15">IκB destroyed</text>
  <text x="760" y="90" font-size="15">in minutes</text>
  <rect x="680" y="120" width="90" height="50" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/>
  <text x="725" y="151" text-anchor="middle" font-weight="bold">NF-κB</text>
  <text x="790" y="142" font-size="15">4. free</text>
  <line x1="725" y1="176" x2="725" y2="268" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="740" y="296" font-size="15">5. turns on genes for</text>
  <text x="740" y="316" font-size="15">inflammation and cell</text>
  <text x="740" y="336" font-size="15">survival, including IκB</text>
  <!-- feedback -->
  <path d="M700,300 C560,330 200,320 90,190" fill="none" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
  <text x="110" y="352" font-size="15">new IκB switches NF-κB off again (negative feedback)</text>
</svg>
