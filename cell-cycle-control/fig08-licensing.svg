<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig08: replication licensing (schematic). In G1, with CDK activity low, helicase rings (MCM) are loaded at origins with the help of Cdt1. When CDK activity rises in S, loaded origins fire and no new rings can be loaded until CDK activity falls at the end of mitosis. So each origin fires once per cycle. -->
<defs>
<marker id="ar" markerWidth="14" markerHeight="14" refX="6" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker>
</defs>
<g font-size="20" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
<text x="180" y="34">G1: license</text>
<text x="550" y="34">S: fire, once</text>
<text x="920" y="34">G2 and M: no new licences</text>
</g>
<!-- panel 1: DNA with MCM double rings -->
<line x1="40" y1="110" x2="320" y2="110" stroke="#6b4fa0" stroke-width="5"/>
<g fill="#ffe8cc" stroke="#d9822b" stroke-width="2.5">
<ellipse cx="95" cy="110" rx="9" ry="18"/><ellipse cx="113" cy="110" rx="9" ry="18"/>
<ellipse cx="185" cy="110" rx="9" ry="18"/><ellipse cx="203" cy="110" rx="9" ry="18"/>
<ellipse cx="265" cy="110" rx="9" ry="18"/><ellipse cx="283" cy="110" rx="9" ry="18"/>
</g>
<text x="180" y="160" font-size="16" text-anchor="middle" fill="#1b2a3a">helicase rings (MCM) loaded</text>
<text x="180" y="181" font-size="16" text-anchor="middle" fill="#1b2a3a">at every origin (needs Cdt1)</text>
<!-- arrow -->
<line x1="335" y1="110" x2="385" y2="110" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<!-- panel 2: replication bubbles -->
<g fill="none" stroke="#6b4fa0" stroke-width="5">
<path d="M410,110 L440,110 C455,85 495,85 510,110 L540,110 C552,92 575,92 587,110 L620,110 C640,80 670,80 690,110"/>
<path d="M440,110 C455,135 495,135 510,110 M540,110 C552,128 575,128 587,110 M620,110 C640,140 670,140 690,110"/>
</g>
<g fill="#ffe8cc" stroke="#d9822b" stroke-width="2">
<ellipse cx="444" cy="103" rx="6" ry="11"/><ellipse cx="506" cy="117" rx="6" ry="11"/>
<ellipse cx="543" cy="103" rx="6" ry="10"/><ellipse cx="584" cy="117" rx="6" ry="10"/>
<ellipse cx="624" cy="103" rx="6" ry="11"/><ellipse cx="686" cy="117" rx="6" ry="11"/>
</g>
<text x="550" y="160" font-size="16" text-anchor="middle" fill="#1b2a3a">rising S-CDK fires the origins:</text>
<text x="550" y="181" font-size="16" text-anchor="middle" fill="#1b2a3a">rings move off with the forks</text>
<line x1="705" y1="110" x2="755" y2="110" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<!-- panel 3: two copies, no rings -->
<line x1="780" y1="98" x2="1060" y2="98" stroke="#6b4fa0" stroke-width="5"/>
<line x1="780" y1="122" x2="1060" y2="122" stroke="#6b4fa0" stroke-width="5"/>
<text x="920" y="160" font-size="16" text-anchor="middle" fill="#1b2a3a">two copies, no rings: high CDK</text>
<text x="920" y="181" font-size="16" text-anchor="middle" fill="#1b2a3a">and geminin block new loading</text>
<!-- CDK activity curve -->
<line x1="40" y1="350" x2="1060" y2="350" stroke="#1b2a3a" stroke-width="2"/>
<line x1="40" y1="350" x2="40" y2="225" stroke="#1b2a3a" stroke-width="2"/>
<text x="26" y="290" font-size="16" text-anchor="middle" fill="#1b2a3a" transform="rotate(-90 26 290)">CDK activity</text>
<path d="M40,340 L330,338 C360,336 380,300 420,290 C560,268 760,262 900,245 C960,238 990,232 1010,232 L1025,345 L1060,345" fill="none" stroke="#e8590c" stroke-width="4"/>
<text x="185" y="325" font-size="16" text-anchor="middle" fill="#1b2a3a">low: loading allowed</text>
<text x="700" y="300" font-size="16" text-anchor="middle" fill="#1b2a3a">high: origins fire, loading blocked</text>
<text x="1040" y="372" font-size="15" text-anchor="end" fill="#1b2a3a">end of M: CDK falls</text>
</svg>
