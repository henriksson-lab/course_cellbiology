<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" font-family="Helvetica, Arial, sans-serif">
<!-- fig04: fission yeast cell-cycle mutants (schematic). Normal cells divide at a set length; a temperature-sensitive cdc mutant keeps growing but cannot divide at the high temperature; a wee1 mutant divides too early, at a small size. Cartoon, lengths not to scale. -->
<defs>
<marker id="ar" markerWidth="14" markerHeight="14" refX="6" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker>
</defs>
<g fill="#1b2a3a">
<text x="160" y="32" font-size="20" font-weight="bold" text-anchor="middle">normal (wild type)</text>
<text x="505" y="32" font-size="20" font-weight="bold" text-anchor="middle">cdc mutant at 36 °C</text>
<text x="860" y="32" font-size="20" font-weight="bold" text-anchor="middle">wee1 mutant</text>
</g>
<!-- wild type: growing rods, one dividing -->
<g stroke="#8a6a12" stroke-width="2.5" fill="#f6f0de">
<rect x="60" y="70" width="110" height="34" rx="17"/>
<rect x="60" y="125" width="150" height="34" rx="17"/>
<rect x="60" y="180" width="200" height="34" rx="17"/>
<rect x="60" y="235" width="98" height="34" rx="17"/><rect x="162" y="235" width="98" height="34" rx="17"/>
</g>
<g fill="#efebf7" stroke="#6b4fa0" stroke-width="2">
<circle cx="115" cy="87" r="10"/><circle cx="135" cy="142" r="10"/><circle cx="135" cy="197" r="10"/><circle cx="185" cy="197" r="10"/>
<circle cx="109" cy="252" r="10"/><circle cx="211" cy="252" r="10"/>
</g>
<text x="160" y="305" font-size="16" text-anchor="middle" fill="#1b2a3a">grow, then divide at</text>
<text x="160" y="326" font-size="16" text-anchor="middle" fill="#1b2a3a">a set length (~14 µm)</text>
<!-- cdc mutant: very long cells -->
<g stroke="#8a6a12" stroke-width="2.5" fill="#f6f0de">
<rect x="360" y="70" width="290" height="34" rx="17"/>
<rect x="360" y="125" width="250" height="34" rx="17"/>
<rect x="360" y="180" width="300" height="34" rx="17"/>
<rect x="360" y="235" width="270" height="34" rx="17"/>
</g>
<g fill="#efebf7" stroke="#6b4fa0" stroke-width="2">
<circle cx="505" cy="87" r="11"/><circle cx="485" cy="142" r="11"/><circle cx="510" cy="197" r="11"/><circle cx="495" cy="252" r="11"/>
</g>
<text x="505" y="305" font-size="16" text-anchor="middle" fill="#1b2a3a">keep growing, never divide:</text>
<text x="505" y="326" font-size="16" text-anchor="middle" fill="#1b2a3a">all stop at the same point of the cycle</text>
<!-- wee1: small cells -->
<g stroke="#8a6a12" stroke-width="2.5" fill="#f6f0de">
<rect x="790" y="70" width="72" height="34" rx="17"/><rect x="866" y="70" width="72" height="34" rx="17"/>
<rect x="800" y="125" width="100" height="34" rx="17"/>
<rect x="800" y="180" width="85" height="34" rx="17"/>
<rect x="800" y="235" width="120" height="34" rx="17"/>
</g>
<g fill="#efebf7" stroke="#6b4fa0" stroke-width="2">
<circle cx="826" cy="87" r="9"/><circle cx="902" cy="87" r="9"/><circle cx="850" cy="142" r="9"/><circle cx="842" cy="197" r="9"/><circle cx="860" cy="252" r="9"/>
</g>
<text x="860" y="305" font-size="16" text-anchor="middle" fill="#1b2a3a">divide too early,</text>
<text x="860" y="326" font-size="16" text-anchor="middle" fill="#1b2a3a">at about half the size</text>
<!-- separators -->
<line x1="320" y1="55" x2="320" y2="335" stroke="#dee2e6" stroke-width="2"/>
<line x1="720" y1="55" x2="720" y2="335" stroke="#dee2e6" stroke-width="2"/>
<text x="520" y="368" font-size="16" text-anchor="middle" fill="#555">One cell is about 3–4 µm wide. Cartoon: lengths not to scale.</text>
</svg>
