<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" font-family="Helvetica, Arial, sans-serif">
  <!-- fig09: a membrane protein keeps its orientation: ER lumen side ends up outside the cell -->
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="20" y="40" width="230" height="110" fill="#dbe7f3"/>
  <rect x="20" y="150" width="230" height="110" fill="#fbfaf5"/>
  <rect x="20" y="140" width="230" height="20" fill="#e6f3f5" stroke="none"/>
  <line x1="20" y1="140" x2="250" y2="140" stroke="#2a7f8f" stroke-width="3"/>
  <line x1="20" y1="160" x2="250" y2="160" stroke="#2a7f8f" stroke-width="3"/>
  <rect x="20" y="40" width="230" height="220" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="32" y="64" font-size="16" fill="#1b2a3a" font-weight="bold">ER lumen</text>
  <text x="32" y="248" font-size="16" fill="#1b2a3a" font-style="italic">cytosol</text>
  <g transform="translate(175.0 150) rotate(0)">
    <rect x="-5" y="-20" width="10" height="40" rx="3" fill="#e8590c"/>
    <circle cx="0" cy="-34" r="14" fill="#e8590c"/>
    <path d="M 0 -48 L 0 -58 M 0 -58 L -7 -66 M 0 -58 L 7 -66" stroke="#1b2a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 20 q 7 8 0 14 t 0 14" stroke="#e8590c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="300" y="40" width="230" height="220" fill="#fbfaf5" stroke="#c9d3dd" stroke-width="1.5"/>
  <circle cx="415.0" cy="150" r="72" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
  <circle cx="415.0" cy="150" r="62" fill="#dbe7f3" stroke="#2a7f8f" stroke-width="3"/>
  <g transform="translate(415.0 217) rotate(0)">
    <rect x="-5" y="-20" width="10" height="40" rx="3" fill="#e8590c"/>
    <circle cx="0" cy="-34" r="14" fill="#e8590c"/>
    <path d="M 0 -48 L 0 -58 M 0 -58 L -7 -66 M 0 -58 L 7 -66" stroke="#1b2a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 20 q 7 8 0 14 t 0 14" stroke="#e8590c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="415.0" y="120" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="middle">vesicle</text>
  <text x="415.0" y="140" font-size="16" fill="#1b2a3a" font-weight="bold" text-anchor="middle">lumen</text>
  <text x="312" y="64" font-size="16" fill="#1b2a3a" font-style="italic">cytosol</text>
  <rect x="580" y="40" width="230" height="110" fill="#dbe7f3"/>
  <rect x="580" y="150" width="230" height="110" fill="#fbfaf5"/>
  <rect x="580" y="140" width="230" height="20" fill="#fbeedd" stroke="none"/>
  <line x1="580" y1="140" x2="810" y2="140" stroke="#d9822b" stroke-width="3"/>
  <line x1="580" y1="160" x2="810" y2="160" stroke="#d9822b" stroke-width="3"/>
  <rect x="580" y="40" width="230" height="220" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="592" y="64" font-size="16" fill="#1b2a3a" font-weight="bold">Golgi lumen</text>
  <text x="592" y="248" font-size="16" fill="#1b2a3a" font-style="italic">cytosol</text>
  <g transform="translate(735.0 150) rotate(0)">
    <rect x="-5" y="-20" width="10" height="40" rx="3" fill="#e8590c"/>
    <circle cx="0" cy="-34" r="14" fill="#e8590c"/>
    <path d="M 0 -48 L 0 -58 M 0 -58 L -7 -66 M 0 -58 L 7 -66" stroke="#1b2a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 20 q 7 8 0 14 t 0 14" stroke="#e8590c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="860" y="40" width="230" height="110" fill="#dbe7f3"/>
  <rect x="860" y="150" width="230" height="110" fill="#fbfaf5"/>
  <rect x="860" y="140" width="230" height="20" fill="#f6f0de" stroke="none"/>
  <line x1="860" y1="140" x2="1090" y2="140" stroke="#8a6a12" stroke-width="3"/>
  <line x1="860" y1="160" x2="1090" y2="160" stroke="#8a6a12" stroke-width="3"/>
  <rect x="860" y="40" width="230" height="220" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="872" y="64" font-size="16" fill="#1b2a3a" font-weight="bold">Outside the cell</text>
  <text x="872" y="248" font-size="16" fill="#1b2a3a" font-style="italic">cytosol</text>
  <g transform="translate(1015.0 150) rotate(0)">
    <rect x="-5" y="-20" width="10" height="40" rx="3" fill="#e8590c"/>
    <circle cx="0" cy="-34" r="14" fill="#e8590c"/>
    <path d="M 0 -48 L 0 -58 M 0 -58 L -7 -66 M 0 -58 L 7 -66" stroke="#1b2a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 20 q 7 8 0 14 t 0 14" stroke="#e8590c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <line x1="256" y1="150" x2="294" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="536" y1="150" x2="574" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="816" y1="150" x2="854" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="135" y="26" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">1. Made in the ER membrane</text>
  <text x="415" y="26" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2. Buds off in a vesicle</text>
  <text x="695" y="26" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">3. Fuses with the Golgi</text>
  <text x="975" y="26" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">4. Reaches the cell surface</text>
  <text x="550" y="296" font-size="17" fill="#1b2a3a" text-anchor="middle">The domain that faces the ER lumen (with its sugar chain) ends up facing the outside of the cell.</text>
  <text x="550" y="322" font-size="17" fill="#1b2a3a" text-anchor="middle">The tail that starts in the cytosol stays in the cytosol. No membrane is crossed on the way.</text>
</svg>
