<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: course map. From molecules (known) to compartments, machines and decisions (this course). -->
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="10" y="70" width="120" height="150" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="70" y="102" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Molecules</text>
  <text x="70" y="128" font-size="15" fill="#1b2a3a" text-anchor="middle" >DNA, RNA,</text>
  <text x="70" y="148" font-size="15" fill="#1b2a3a" text-anchor="middle" >proteins,</text>
  <text x="70" y="168" font-size="15" fill="#1b2a3a" text-anchor="middle" >lipids, ΔG, K</text>
  <text x="70" y="204" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">you know this</text>
  <line x1="134" y1="145.0" x2="160" y2="145.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="166" y="70" width="118" height="150" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="225.0" y="106" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell and</text>
  <text x="225.0" y="126" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">methods</text>
  <text x="225.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 1</text>
  <text x="225.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L1–L3</text>
  <rect x="294" y="70" width="118" height="150" rx="10" fill="#f6f0de" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="353.0" y="106" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Membranes</text>
  <text x="353.0" y="126" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">and transport</text>
  <text x="353.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 2</text>
  <text x="353.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L4–L6</text>
  <rect x="422" y="70" width="118" height="150" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="481.0" y="106" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Proteins and</text>
  <text x="481.0" y="126" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">organelles</text>
  <text x="481.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 4, 5</text>
  <text x="481.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L7–L13</text>
  <rect x="550" y="70" width="118" height="150" rx="10" fill="#f3f5f8" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="609.0" y="116" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Signalling</text>
  <text x="609.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 3</text>
  <text x="609.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L14–L17</text>
  <rect x="678" y="70" width="118" height="150" rx="10" fill="#eeeeee" stroke="#555555" stroke-width="2.5"/>
  <text x="737.0" y="116" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cytoskeleton</text>
  <text x="737.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 6</text>
  <text x="737.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L18–L20</text>
  <rect x="806" y="70" width="118" height="150" rx="10" fill="#efebf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="865.0" y="116" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell cycle</text>
  <text x="865.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 7</text>
  <text x="865.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L21–L23</text>
  <rect x="934" y="70" width="118" height="150" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2.5"/>
  <text x="993.0" y="116" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Cell death</text>
  <text x="993.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 8</text>
  <text x="993.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L24–L25</text>
  <rect x="1062" y="70" width="118" height="150" rx="10" fill="#fdeee4" stroke="#e8590c" stroke-width="2.5"/>
  <text x="1121.0" y="116" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Disease</text>
  <text x="1121.0" y="170" font-size="15" fill="#1b2a3a" text-anchor="middle">ELO 9</text>
  <text x="1121.0" y="194" font-size="15" fill="#1b2a3a" text-anchor="middle">L26–L28</text>
  <path d="M 170 62 L 170 52 L 536 52 L 536 62" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="353.0" y="42" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Compartments</text>
  <path d="M 554 62 L 554 52 L 792 52 L 792 62" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="673.0" y="42" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Signals and machines</text>
  <path d="M 810 62 L 810 52 L 1048 52 L 1048 62" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="929.0" y="42" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Decisions</text>
  <path d="M 1066 62 L 1066 52 L 1176 52 L 1176 62" fill="none" stroke="#e8590c" stroke-width="1.5"/>
  <text x="1121.0" y="42" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">When it fails</text>
  <line x1="166" y1="250" x2="1180" y2="250" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="673.0" y="276" font-size="16" fill="#1b2a3a" text-anchor="middle" font-style="italic">Follow a molecule, a signal or a cell decision through the cell, and see how drugs and disease act on it</text>
</svg>
