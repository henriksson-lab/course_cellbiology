<rect x="326" y="164" width="52" height="22" rx="11" fill="#7a4e2d"/>
<text x="352" y="214" font-size="15" fill="#7a4e2d" font-weight="700" text-anchor="middle">Listeria</text>
<text x="40" y="108" font-size="16" fill="#555555" font-weight="700" text-anchor="start">actin comet tail:</text>
<text x="40" y="128" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">host Arp2/3 switched on</text>
<text x="40" y="148" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">by the bacterial protein ActA</text>
<text x="40" y="250" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">The tail pushes the bacterium</text>
<text x="40" y="270" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">into the next cell, never outside:</text>
<text x="40" y="290" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">hidden from antibodies</text>
<text x="755" y="26" font-size="19" fill="#1b2a3a" font-weight="700" text-anchor="middle">Cholera toxin: locks a signal on</text>
<text x="640" y="62" font-size="15" fill="#1b2a3a" font-weight="700" text-anchor="start">gut lumen</text>
<rect x="520" y="74" width="470" height="18" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
<rect x="520" y="92" width="470" height="210" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
<text x="530" y="292" font-size="15" fill="#8a6a12" font-weight="700" text-anchor="start">gut epithelial cell</text>
<circle cx="580" cy="58" r="13" fill="#e8590c" opacity=".25" stroke="#c92a2a" stroke-width="2"/>
<text x="600" y="46" font-size="15" fill="#c92a2a" font-weight="700" text-anchor="start">toxin</text>
<path d="M580 74 L580 124" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<rect x="532" y="130" width="182" height="34" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="623.0" y="153" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="middle">Gαs stuck on (GTP)</text>
<rect x="532" y="190" width="164" height="34" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="614.0" y="213" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="middle">adenylyl cyclase</text>
<rect x="720" y="190" width="101" height="34" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="770.5" y="213" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="middle">cAMP high</text>
<rect x="720" y="130" width="47" height="34" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="743.5" y="153" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="middle">PKA</text>
<path d="M600 166 L600 186" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M686 207 L716 207" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M766 188 L766 168" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M788 128 Q820 110 842 96" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="840" y="68" width="12" height="30" rx="3" fill="#2b8a3e"/><rect x="862" y="68" width="12" height="30" rx="3" fill="#2b8a3e"/>
<path d="M857 92 L857 40" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
<text x="884" y="52" font-size="16" fill="#2b8a3e" font-weight="700" text-anchor="start">CFTR open:</text>
<text x="866" y="138" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">chloride, sodium</text>
<text x="866" y="158" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">and water flow</text>
<text x="866" y="178" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">into the gut:</text>
<text x="866" y="198" font-size="16" fill="#c92a2a" font-weight="700" text-anchor="start">litres per day</text>
<line x1="500" y1="44" x2="500" y2="350" stroke="#ced4da" stroke-width="1.5"/>
<text x="530" y="334" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">Oral rehydration (salt + glucose) uses SGLT,</text>
<text x="530" y="354" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">which the toxin leaves intact.</text>
<text x="10" y="334" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">Treated with antibiotics that enter cells.</text>
</svg>