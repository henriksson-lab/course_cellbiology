<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1000" height="352" fill="#ffffff"/>
<rect x="8" y="14" width="184" height="44" rx="10" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
<text x="100.0" y="42" font-size="17" fill="#6b4fa0" font-weight="700" text-anchor="middle">DNA</text>
<path d="M193 36 L202 36" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="203" y="14" width="184" height="44" rx="10" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
<text x="295.0" y="42" font-size="17" fill="#6b4fa0" font-weight="700" text-anchor="middle">pre-mRNA</text>
<path d="M388 36 L397 36" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="398" y="14" width="184" height="44" rx="10" fill="#f6f7f9" stroke="#1b2a3a" stroke-width="2"/>
<text x="490.0" y="42" font-size="17" fill="#1b2a3a" font-weight="700" text-anchor="middle">mRNA</text>
<path d="M583 36 L592 36" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="593" y="14" width="184" height="44" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="2"/>
<text x="685.0" y="42" font-size="17" fill="#2a7f8f" font-weight="700" text-anchor="middle">protein in the cell</text>
<path d="M778 36 L787 36" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
<rect x="788" y="14" width="184" height="44" rx="10" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
<text x="880.0" y="42" font-size="17" fill="#8a6a12" font-weight="700" text-anchor="middle">protein outside</text>
<path d="M100.0 60 L100.0 78" stroke="#ced4da" stroke-width="2"/>
<rect x="8" y="80" width="184" height="262" rx="10" fill="#fbfaf5" stroke="#e8590c" stroke-width="2"/>
<text x="20" y="110" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">Gene therapy</text>
<text x="20" y="162" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">deliver a working</text>
<text x="20" y="181" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">gene (AAV virus)</text>
<text x="20" y="228" font-size="14" fill="#666666" font-weight="400" text-anchor="start">Example:</text>
<text x="20" y="250" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">onasemnogene (SMA)</text>
<rect x="20" y="300" width="160" height="30" rx="15" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="100.0" y="321" font-size="15" fill="#2b8a3e" font-weight="700" text-anchor="middle">adds function</text>
<path d="M295.0 60 L295.0 78" stroke="#ced4da" stroke-width="2"/>
<rect x="203" y="80" width="184" height="262" rx="10" fill="#fbfaf5" stroke="#e8590c" stroke-width="2"/>
<text x="215" y="110" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">ASO: change</text>
<text x="215" y="131" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">splicing</text>
<text x="215" y="162" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">covers a splice site,</text>
<text x="215" y="181" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">exon kept or skipped</text>
<text x="215" y="228" font-size="14" fill="#666666" font-weight="400" text-anchor="start">Example:</text>
<text x="215" y="250" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">nusinersen (SMA)</text>
<rect x="215" y="300" width="160" height="30" rx="15" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="295.0" y="321" font-size="15" fill="#2b8a3e" font-weight="700" text-anchor="middle">adds function</text>
<path d="M490.0 60 L490.0 78" stroke="#ced4da" stroke-width="2"/>
<rect x="398" y="80" width="184" height="262" rx="10" fill="#fbfaf5" stroke="#e8590c" stroke-width="2"/>
<text x="410" y="110" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">siRNA or ASO:</text>
<text x="410" y="131" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">destroy mRNA</text>
<text x="410" y="162" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">less of one protein</text>
<text x="410" y="181" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">is made</text>
<text x="410" y="228" font-size="14" fill="#666666" font-weight="400" text-anchor="start">Example:</text>
<text x="410" y="250" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">patisiran (TTR)</text>
<text x="410" y="269" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">inclisiran (PCSK9)</text>
<rect x="410" y="300" width="160" height="30" rx="15" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/>
<text x="490.0" y="321" font-size="15" fill="#c92a2a" font-weight="700" text-anchor="middle">removes a protein</text>
<path d="M685.0 60 L685.0 78" stroke="#ced4da" stroke-width="2"/>
<rect x="593" y="80" width="184" height="262" rx="10" fill="#fbfaf5" stroke="#e8590c" stroke-width="2"/>
<text x="605" y="110" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">Small molecule</text>
<text x="605" y="162" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">corrector, stabiliser,</text>
<text x="605" y="181" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">potentiator; inhibitor</text>
<text x="605" y="228" font-size="14" fill="#666666" font-weight="400" text-anchor="start">Example:</text>
<text x="605" y="250" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">CFTR modulators,</text>
<text x="605" y="269" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">tafamidis, mavacamten,</text>
<text x="605" y="288" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">lonafarnib, statins</text>
<rect x="605" y="300" width="160" height="30" rx="15" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text x="685.0" y="321" font-size="15" fill="#495057" font-weight="700" text-anchor="middle">adds or removes</text>
<path d="M880.0 60 L880.0 78" stroke="#ced4da" stroke-width="2"/>
<rect x="788" y="80" width="184" height="262" rx="10" fill="#fbfaf5" stroke="#e8590c" stroke-width="2"/>
<text x="800" y="110" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">Antibody;</text>
<text x="800" y="131" font-size="17" fill="#e8590c" font-weight="700" text-anchor="start">enzyme replacement</text>
<text x="800" y="162" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">block a protein; or</text>
<text x="800" y="181" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">infuse an enzyme that</text>
<text x="800" y="200" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">enters by endocytosis</text>
<text x="800" y="228" font-size="14" fill="#666666" font-weight="400" text-anchor="start">Example:</text>
<text x="800" y="250" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">anti-PCSK9;</text>
<text x="800" y="269" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start" font-style="italic">imiglucerase (Gaucher)</text>
<rect x="800" y="300" width="160" height="30" rx="15" fill="#ffffff" stroke="#495057" stroke-width="2"/>
<text x="880.0" y="321" font-size="15" fill="#495057" font-weight="700" text-anchor="middle">adds or removes</text>
</svg>