<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<rect width="1000" height="392" fill="#ffffff"/>
<text x="110" y="24" font-size="17" fill="#1b2a3a" font-weight="700" text-anchor="middle">Level</text>
<text x="200" y="24" font-size="17" fill="#1b2a3a" font-weight="700" text-anchor="start">What we measure</text>
<text x="620" y="24" font-size="17" fill="#1b2a3a" font-weight="700" text-anchor="start">Example: cystic fibrosis</text>
<rect x="40" y="40" width="140" height="66" rx="8" fill="#8a6a12"/>
<text x="110" y="79.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Clinic</text>
<rect x="190" y="40" width="400" height="66" rx="8" fill="#f6f7f9"/>
<rect x="610" y="40" width="380" height="66" rx="8" fill="#fbfaf5" stroke="#8a6a12" stroke-width="1.5"/>
<text x="204" y="69.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">symptoms, family history,</text>
<text x="204" y="89.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">imaging</text>
<text x="624" y="69.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">salty skin, chest infections,</text>
<text x="624" y="89.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">poor growth</text>
<rect x="40" y="110" width="140" height="66" rx="8" fill="#c2255c"/>
<text x="110" y="149.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Body fluids</text>
<rect x="190" y="110" width="400" height="66" rx="8" fill="#f6f7f9"/>
<rect x="610" y="110" width="380" height="66" rx="8" fill="#fbfaf5" stroke="#c2255c" stroke-width="1.5"/>
<text x="204" y="139.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">sweat, blood, urine:</text>
<text x="204" y="159.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">ions, lipids, enzymes</text>
<text x="624" y="149.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">sweat chloride 98 mmol/L</text>
<rect x="40" y="180" width="140" height="66" rx="8" fill="#d9822b"/>
<text x="110" y="219.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Tissue</text>
<rect x="190" y="180" width="400" height="66" rx="8" fill="#f6f7f9"/>
<rect x="610" y="180" width="380" height="66" rx="8" fill="#fbfaf5" stroke="#d9822b" stroke-width="1.5"/>
<text x="204" y="209.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">biopsy, histology,</text>
<text x="204" y="229.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">stains, electron microscopy</text>
<text x="624" y="219.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">mucus plugs in the airways</text>
<rect x="40" y="250" width="140" height="66" rx="8" fill="#2a7f8f"/>
<text x="110" y="289.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Cell</text>
<rect x="190" y="250" width="400" height="66" rx="8" fill="#f6f7f9"/>
<rect x="610" y="250" width="380" height="66" rx="8" fill="#fbfaf5" stroke="#2a7f8f" stroke-width="1.5"/>
<text x="204" y="279.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">patient cells in culture: blots,</text>
<text x="204" y="299.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">imaging, transport assays</text>
<text x="624" y="279.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">CFTR stuck in the ER</text>
<text x="624" y="299.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">(band B only)</text>
<rect x="40" y="320" width="140" height="66" rx="8" fill="#6b4fa0"/>
<text x="110" y="359.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Molecule</text>
<rect x="190" y="320" width="400" height="66" rx="8" fill="#f6f7f9"/>
<rect x="610" y="320" width="380" height="66" rx="8" fill="#fbfaf5" stroke="#6b4fa0" stroke-width="1.5"/>
<text x="204" y="349.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">gene sequencing, protein</text>
<text x="204" y="369.0" font-size="16" fill="#1b2a3a" font-weight="400" text-anchor="start">structure and function</text>
<text x="624" y="359.0" font-size="16" fill="#1b2a3a" font-weight="700" text-anchor="start">F508del on both copies</text>
<path d="M20 50 L20 376" stroke="#e8590c" stroke-width="4" marker-end="url(#ar)"/>
</svg>