<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <g id="rec"><line x1="0" y1="10" x2="0" y2="-12" stroke="#3d4f63" stroke-width="3"/><path d="M-7,-20 L0,-12 L7,-20" fill="none" stroke="#3d4f63" stroke-width="3"/></g>
  </defs>
  <rect x="0" y="0" width="1000" height="322" fill="#fff"/>
  <rect x="0" y="92" width="1000" height="230" fill="#fbfaf5"/>
  <text x="10" y="22" font-weight="bold">Outside</text>
  <text x="10" y="312" font-weight="bold">Cytosol</text>
  <!-- membrane: flat (0-140), shallow pit (200-320), deep pit (390-540), flat (560-1000) -->
  <path d="M0,90 L215,90 C232,90 228,128 260,128 C292,128 288,90 305,90 L410,90 C420,90 420,108 425,130 C430,170 440,186 470,186 C500,186 510,170 515,130 C520,108 520,90 530,90 L1000,90" fill="none" stroke="#8a6a12" stroke-width="6"/>
  <!-- step 1: receptors with cargo and adaptors -->
  <use href="#rec" x="60" y="90"/><use href="#rec" x="110" y="90"/>
  <circle cx="60" cy="58" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <circle cx="110" cy="58" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <rect x="50" y="102" width="20" height="13" rx="4" fill="#3b8bd0"/>
  <rect x="100" y="102" width="20" height="13" rx="4" fill="#3b8bd0"/>
  <!-- step 2: shallow pit with clathrin -->
  <use href="#rec" transform="translate(245 114) rotate(-15)"/><use href="#rec" transform="translate(275 114) rotate(15)"/>
  <circle cx="240" cy="84" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <circle cx="282" cy="84" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <path d="M222,112 C236,152 284,152 298,112" fill="none" stroke="#7d8b99" stroke-width="7" stroke-dasharray="6 4"/>
  <!-- step 3: deep pit with dynamin collar -->
  <use href="#rec" transform="translate(455 168) rotate(-20)"/><use href="#rec" transform="translate(485 168) rotate(20)"/>
  <circle cx="452" cy="140" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <circle cx="490" cy="140" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <path d="M432,150 C436,208 504,208 508,150" fill="none" stroke="#7d8b99" stroke-width="7" stroke-dasharray="6 4"/>
  <rect x="403" y="104" width="14" height="22" rx="4" fill="#7048e8"/>
  <rect x="523" y="104" width="14" height="22" rx="4" fill="#7048e8"/>
  <!-- step 4: coated vesicle -->
  <circle cx="680" cy="190" r="36" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
  <circle cx="680" cy="190" r="45" fill="none" stroke="#7d8b99" stroke-width="7" stroke-dasharray="6 4"/>
  <circle cx="670" cy="180" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <circle cx="692" cy="198" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <!-- step 5: uncoated vesicle -> endosome -->
  <circle cx="850" cy="200" r="36" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
  <circle cx="840" cy="190" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <circle cx="862" cy="208" r="9" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/>
  <g stroke="#7d8b99" stroke-width="3"><path d="M905,172 l12,-6 M912,188 l14,-2 M922,150 l10,-8"/></g>
  <path d="M735,195 L795,198" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M890,236 L930,268" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="955" y="292" text-anchor="end" fill="#2e8b57" font-weight="bold">to the early endosome</text>
  <!-- step labels -->
  <g font-weight="bold">
    <text x="85" y="150" text-anchor="middle">1</text><text x="260" y="182" text-anchor="middle">2</text>
    <text x="470" y="236" text-anchor="middle">3</text><text x="680" y="258" text-anchor="middle">4</text><text x="850" y="112" text-anchor="middle">5</text>
  </g>
  <text x="85" y="172" text-anchor="middle">adaptors bind</text>
  <text x="85" y="191" text-anchor="middle">receptor tails</text>
  <text x="260" y="204" text-anchor="middle">clathrin lattice</text>
  <text x="260" y="223" text-anchor="middle">bends membrane</text>
  <text x="470" y="258" text-anchor="middle">dynamin collar</text>
  <text x="470" y="277" text-anchor="middle">pinches the neck</text>
  <text x="680" y="280" text-anchor="middle">coated vesicle</text>
  <text x="680" y="299" text-anchor="middle">(about 100 nm)</text>
  <text x="850" y="134" text-anchor="middle">coat comes off</text>
  <!-- legend -->
  <g font-size="15">
    <circle cx="590" cy="30" r="8" fill="#e0a800" stroke="#8a6a00" stroke-width="1.5"/><text x="604" y="35">cargo (e.g. LDL)</text>
    <rect x="370" y="22" width="18" height="12" rx="4" fill="#3b8bd0"/><text x="394" y="34">adaptor (AP2)</text>
    <line x1="582" y1="58" x2="602" y2="58" stroke="#7d8b99" stroke-width="7" stroke-dasharray="6 4"/><text x="610" y="63">clathrin</text>
    <rect x="372" y="50" width="14" height="18" rx="4" fill="#7048e8"/><text x="394" y="64">dynamin</text>
  </g>
</svg>
