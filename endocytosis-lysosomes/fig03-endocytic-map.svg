<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker>
  </defs>
  <!-- outside and cytosol -->
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <rect x="10" y="78" width="980" height="452" rx="18" fill="#fbfaf5"/>
  <text x="20" y="26" font-weight="bold">Outside the cell</text>
  <!-- plasma membrane with a clathrin pit (x 150), a ruffle (x 520) and phagocytic cup (x 830) -->
  <path d="M10,80 L120,80 C130,80 128,118 150,118 C172,118 170,80 180,80 L455,80 C462,80 470,40 485,34 C495,30 498,52 495,80 L560,80 C556,52 560,30 572,34 C585,40 590,80 598,80 L740,80 C745,80 748,40 760,34 C770,30 776,70 790,80 L860,80 C875,70 882,30 892,34 C903,40 905,80 912,80 L990,80" fill="none" stroke="#8a6a12" stroke-width="5"/>
  <!-- clathrin coat on the pit -->
  <path d="M128,98 C134,124 166,124 172,98" fill="none" stroke="#7d8b99" stroke-width="4" stroke-dasharray="4 3"/>
  <text x="150" y="58" text-anchor="middle">clathrin-coated pit</text>
  <!-- bacterium being engulfed -->
  <rect x="800" y="44" width="80" height="26" rx="13" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="826" y="24" text-anchor="middle">phagocytosis (bacterium)</text>
  <!-- macropinocytosis label -->
  <text x="530" y="24" text-anchor="middle">macropinocytosis (gulp of fluid)</text>

  <!-- coated vesicle -->
  <circle cx="150" cy="165" r="17" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
  <circle cx="150" cy="165" r="22" fill="none" stroke="#7d8b99" stroke-width="4" stroke-dasharray="4 3"/>
  <!-- early (sorting) endosome -->
  <ellipse cx="320" cy="250" rx="62" ry="44" fill="#e3f3ea" stroke="#2e8b57" stroke-width="3"/>
  <path d="M378,236 L428,206" stroke="#2e8b57" stroke-width="7" stroke-linecap="round"/>
  <text x="320" y="246" text-anchor="middle" font-weight="bold">early</text>
  <text x="320" y="265" text-anchor="middle" font-weight="bold">endosome</text>
  <text x="320" y="318" text-anchor="middle">pH 6.0–6.5: sorting</text>
  <path d="M164,184 L262,226" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <!-- recycling route -->
  <path d="M428,200 C440,160 420,120 390,92" stroke="#2e8b57" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="418" y="150" text-anchor="end">recycling to</text>
  <text x="418" y="168" text-anchor="end">the surface</text>
  <!-- macropinosome -->
  <circle cx="560" cy="175" r="30" fill="#f4faf6" stroke="#8a6a12" stroke-width="3"/>
  <text x="598" y="180">macropinosome</text>
  <path d="M545,202 C510,250 490,300 480,332" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <!-- late endosome / MVB -->
  <circle cx="470" cy="380" r="44" fill="#d3ebdd" stroke="#2e8b57" stroke-width="3"/>
  <circle cx="455" cy="368" r="9" fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="482" cy="362" r="9" fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="470" cy="392" r="9" fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="494" cy="392" r="8" fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="448" cy="396" r="8" fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"/>
  <path d="M352,288 L436,348" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <text x="470" y="446" text-anchor="middle" font-weight="bold">late endosome</text>
  <text x="470" y="465" text-anchor="middle">pH 5.0–5.5</text>
  <!-- lysosome -->
  <circle cx="680" cy="390" r="46" fill="#b9dfc8" stroke="#2e8b57" stroke-width="4"/>
  <text x="680" y="386" text-anchor="middle" font-weight="bold">lysosome</text>
  <text x="680" y="405" text-anchor="middle">pH 4.5–5</text>
  <path d="M516,383 L628,388" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <!-- phagosome -->
  <ellipse cx="845" cy="200" rx="58" ry="32" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
  <rect x="805" y="187" width="80" height="26" rx="13" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="845" y="256" text-anchor="middle">phagosome</text>
  <path d="M812,268 L716,352" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <!-- autophagosome -->
  <circle cx="880" cy="420" r="44" fill="#fbfaf5" stroke="#2e8b57" stroke-width="3"/>
  <circle cx="880" cy="420" r="36" fill="none" stroke="#2e8b57" stroke-width="3"/>
  <ellipse cx="880" cy="420" rx="24" ry="13" fill="#f8e9ec" stroke="#a8324a" stroke-width="2.5"/>
  <text x="880" y="488" text-anchor="middle">autophagosome</text>
  <text x="880" y="507" text-anchor="middle">(inside material)</text>
  <path d="M834,414 L732,398" stroke="#1b2a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  <!-- Golgi delivering enzymes -->
  <g fill="#fbeedd" stroke="#d9822b" stroke-width="3">
    <path d="M110,430 C160,410 220,410 270,430" fill="none"/>
    <path d="M115,448 C165,428 215,428 265,448" fill="none"/>
    <path d="M120,466 C170,446 210,446 260,466" fill="none"/>
  </g>
  <text x="190" y="402" text-anchor="middle" font-weight="bold" fill="#b3631a">Golgi</text>
  <path d="M272,440 L420,400" stroke="#d9822b" stroke-width="2.5" fill="none" marker-end="url(#arg)"/>
  <text x="200" y="500" fill="#b3631a">new lysosomal enzymes</text>
  <text x="200" y="519" fill="#b3631a">(mannose-6-phosphate tag)</text>
</svg>
