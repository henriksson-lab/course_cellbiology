<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
  <!-- inputs -->
  <circle cx="60" cy="70" r="9" fill="#c2255c"/><text x="78" y="76">cytochrome c</text>
  <rect x="40" y="110" width="40" height="22" rx="6" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><text x="92" y="127">APAF1</text>
  <text x="40" y="170" font-size="15">+ dATP (energy)</text>
  <line x1="200" y1="110" x2="270" y2="110" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- wheel -->
  <g transform="translate(360 110)">
    <circle r="22" fill="#cdd6ee" stroke="#3b5bab" stroke-width="2"/><line x1="0.0" y1="-20.0" x2="0.0" y2="-60.0" stroke="#3b5bab" stroke-width="7"/><circle cx="0.0" cy="-60.0" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="0.0" cy="-60.0" r="6" fill="#c2255c"/><line x1="15.6" y1="-12.5" x2="46.9" y2="-37.4" stroke="#3b5bab" stroke-width="7"/><circle cx="46.9" cy="-37.4" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="46.9" cy="-37.4" r="6" fill="#c2255c"/><line x1="19.5" y1="4.5" x2="58.5" y2="13.4" stroke="#3b5bab" stroke-width="7"/><circle cx="58.5" cy="13.4" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="58.5" cy="13.4" r="6" fill="#c2255c"/><line x1="8.7" y1="18.0" x2="26.0" y2="54.1" stroke="#3b5bab" stroke-width="7"/><circle cx="26.0" cy="54.1" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="26.0" cy="54.1" r="6" fill="#c2255c"/><line x1="-8.7" y1="18.0" x2="-26.0" y2="54.1" stroke="#3b5bab" stroke-width="7"/><circle cx="-26.0" cy="54.1" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="-26.0" cy="54.1" r="6" fill="#c2255c"/><line x1="-19.5" y1="4.5" x2="-58.5" y2="13.4" stroke="#3b5bab" stroke-width="7"/><circle cx="-58.5" cy="13.4" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="-58.5" cy="13.4" r="6" fill="#c2255c"/><line x1="-15.6" y1="-12.5" x2="-46.9" y2="-37.4" stroke="#3b5bab" stroke-width="7"/><circle cx="-46.9" cy="-37.4" r="15" fill="#e9eef8" stroke="#3b5bab" stroke-width="2"/><circle cx="-46.9" cy="-37.4" r="6" fill="#c2255c"/>
  </g>
  <text x="360" y="208" text-anchor="middle" font-weight="700">apoptosome</text>
  <text x="360" y="230" text-anchor="middle" font-size="15">(a wheel of 7 APAF1)</text>
  <line x1="450" y1="110" x2="520" y2="110" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="485" y="96" text-anchor="middle" font-size="15">recruits</text>
  <!-- caspase 9 -->
  <rect x="530" y="86" width="150" height="48" rx="10" fill="#f2a7a0" stroke="#c92a2a" stroke-width="2"/>
  <text x="605" y="116" text-anchor="middle" font-weight="700">caspase-9</text>
  <text x="605" y="160" text-anchor="middle" font-size="15">initiator, active</text>
  <text x="605" y="180" text-anchor="middle" font-size="15">on the wheel</text>
  <line x1="684" y1="110" x2="760" y2="110" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="722" y="96" text-anchor="middle" font-size="15" fill="#c92a2a">cuts</text>
  <rect x="770" y="86" width="170" height="48" rx="10" fill="#f2a7a0" stroke="#c92a2a" stroke-width="2"/>
  <text x="855" y="116" text-anchor="middle" font-weight="700">caspase-3, -7</text>
  <line x1="944" y1="110" x2="990" y2="110" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="996" y="106" font-weight="700">cell is</text>
  <text x="996" y="128" font-weight="700">taken apart</text>
</svg>