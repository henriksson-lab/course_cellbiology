<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a"><text x="370" y="22" text-anchor="middle" font-size="16" font-weight="700">hours after an anticancer drug</text><text x="265.0" y="46" text-anchor="middle">0 h</text><text x="335.0" y="46" text-anchor="middle">2 h</text><text x="405.0" y="46" text-anchor="middle">4 h</text><text x="475.0" y="46" text-anchor="middle">8 h</text><rect x="224" y="56" width="292" height="250" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="216" y="88" text-anchor="end" font-size="15">PARP-1, full (116 kDa)</text><rect x="240" y="77" width="50" height="14" rx="6" fill="rgb(35,35,35)"/><rect x="310" y="77" width="50" height="14" rx="6" fill="rgb(65,65,65)"/><rect x="380" y="77" width="50" height="14" rx="6" fill="rgb(145,145,145)"/><rect x="450" y="77" width="50" height="14" rx="6" fill="rgb(205,205,205)"/><text x="216" y="136" text-anchor="end" font-size="15">PARP-1, cut (89 kDa)</text><rect x="240" y="125" width="50" height="14" rx="6" fill="rgb(229,229,229)"/><rect x="310" y="125" width="50" height="14" rx="6" fill="rgb(195,195,195)"/><rect x="380" y="125" width="50" height="14" rx="6" fill="rgb(115,115,115)"/><rect x="450" y="125" width="50" height="14" rx="6" fill="rgb(55,55,55)"/><text x="216" y="184" text-anchor="end" font-size="15">procaspase-3 (32 kDa)</text><rect x="240" y="173" width="50" height="14" rx="6" fill="rgb(35,35,35)"/><rect x="310" y="173" width="50" height="14" rx="6" fill="rgb(75,75,75)"/><rect x="380" y="173" width="50" height="14" rx="6" fill="rgb(155,155,155)"/><rect x="450" y="173" width="50" height="14" rx="6" fill="rgb(205,205,205)"/><text x="216" y="232" text-anchor="end" font-size="15">cleaved caspase-3 (17 kDa)</text><rect x="240" y="221" width="50" height="14" rx="6" fill="rgb(231,231,231)"/><rect x="310" y="221" width="50" height="14" rx="6" fill="rgb(175,175,175)"/><rect x="380" y="221" width="50" height="14" rx="6" fill="rgb(85,85,85)"/><rect x="450" y="221" width="50" height="14" rx="6" fill="rgb(35,35,35)"/><text x="216" y="280" text-anchor="end" font-size="15">actin (loading control)</text><rect x="240" y="269" width="50" height="14" rx="6" fill="rgb(55,55,55)"/><rect x="310" y="269" width="50" height="14" rx="6" fill="rgb(55,55,55)"/><rect x="380" y="269" width="50" height="14" rx="6" fill="rgb(55,55,55)"/><rect x="450" y="269" width="50" height="14" rx="6" fill="rgb(55,55,55)"/><text x="270" y="342" text-anchor="middle" font-size="15">Caspase-3 is cut into its active form, and PARP-1 is one of its targets.</text></svg>