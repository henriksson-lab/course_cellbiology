    <g fill="#c2255c"><circle cx="-60" cy="-96" r="5"/><circle cx="20" cy="-96" r="5"/><circle cx="90" cy="96" r="5"/><circle cx="-120" cy="-20" r="5"/><circle cx="-40" cy="10" r="5"/><circle cx="40" cy="-40" r="5"/><circle cx="120" cy="0" r="5"/><circle cx="-80" cy="50" r="5"/><circle cx="0" cy="40" r="5"/><circle cx="-200" cy="0" r="5"/></g>
    <text x="160" y="60" text-anchor="middle" font-size="15">matrix</text>
  </g>
  <text x="40" y="350" font-size="16">outer membrane: smooth; inner membrane: folded (cristae)</text>
  <circle cx="48" cy="372" r="5" fill="#c2255c"/><text x="60" y="377" font-size="16">cytochrome c: in the space between the membranes</text>
  <text x="60" y="399" font-size="16">and inside the cristae, carrying electrons</text>

  <text x="830" y="26" text-anchor="middle" font-size="19" font-weight="700">MOMP: holes in the outer membrane</text>
  <g transform="translate(830 205)">
    <rect x="-210" y="-105" width="420" height="210" rx="105" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
    <rect x="-192" y="-88" width="384" height="176" rx="88" fill="#fdf6f7" stroke="#a8324a" stroke-width="2"/>
