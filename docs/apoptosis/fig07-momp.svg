  </g>
  <text x="620" y="356" font-size="16"><tspan fill="#7b3fbf" font-weight="700">BAX/BAK</tspan> gather in the outer membrane and</text>
  <text x="620" y="378" font-size="16">make pores. Proteins of the intermembrane</text>
  <text x="620" y="400" font-size="16">space escape: <tspan fill="#c2255c" font-weight="700">cytochrome c</tspan>, <tspan fill="#f08c00" font-weight="700">SMAC</tspan></text>
  <line x1="490" y1="205" x2="580" y2="205" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="535" y="190" text-anchor="middle" font-size="15">stress</text>
