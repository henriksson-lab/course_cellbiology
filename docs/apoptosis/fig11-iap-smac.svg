<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
  <text x="250" y="28" text-anchor="middle" font-size="19" font-weight="700">Brake on: XIAP holds caspases</text>
  <g transform="translate(250 140)">
    <path d="M-150,0 Q-150,-60 -60,-60 L60,-60 Q150,-60 150,0 Q150,60 60,60 L-60,60 Q-150,60 -150,0 Z" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-weight="700" font-size="20">XIAP</text>
    <rect x="-200" y="-100" width="130" height="44" rx="10" fill="#f9dcd6" stroke="#c92a2a" stroke-width="2"/>
    <text x="-135" y="-72" text-anchor="middle" font-size="16">caspase-9</text>
    <rect x="70" y="-100" width="130" height="44" rx="10" fill="#f9dcd6" stroke="#c92a2a" stroke-width="2"/>
    <text x="135" y="-72" text-anchor="middle" font-size="16">caspase-3/7</text>
  </g>
  <text x="250" y="240" text-anchor="middle" font-size="16">A few caspases switched on by accident</text>
  <text x="250" y="262" text-anchor="middle" font-size="16">are caught: no death by mistake.</text>

  <line x1="490" y1="140" x2="580" y2="140" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="535" y="126" text-anchor="middle" font-size="15">MOMP</text>

  <text x="830" y="28" text-anchor="middle" font-size="19" font-weight="700">Brake off: SMAC takes XIAP away</text>
  <g transform="translate(800 150)">
    <path d="M-120,0 Q-120,-50 -50,-50 L50,-50 Q120,-50 120,0 Q120,50 50,50 L-50,50 Q-120,50 -120,0 Z" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-weight="700" font-size="20">XIAP</text>
    <rect x="-100" y="-84" width="60" height="38" rx="6" fill="#f08c00"/><text x="-70" y="-59" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">SMAC</text>
    <rect x="40" y="-84" width="60" height="38" rx="6" fill="#f08c00"/><text x="70" y="-59" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">SMAC</text>
  </g>
  <rect x="940" y="60" width="140" height="44" rx="10" fill="#f2a7a0" stroke="#c92a2a" stroke-width="2.5"/>
  <text x="1010" y="88" text-anchor="middle" font-size="16" font-weight="700">caspase-9</text>
  <rect x="940" y="160" width="140" height="44" rx="10" fill="#f2a7a0" stroke="#c92a2a" stroke-width="2.5"/>
  <text x="1010" y="188" text-anchor="middle" font-size="16" font-weight="700">caspase-3/7</text>
  <text x="1010" y="230" text-anchor="middle" font-size="15" fill="#c92a2a" font-weight="700">free and active</text>
  <text x="620" y="262" font-size="16">SMAC comes out of mitochondria with cytochrome c.</text>
  <text x="620" y="284" font-size="16">"SMAC mimetic" drugs copy it (in cancer trials).</text>
</svg>
