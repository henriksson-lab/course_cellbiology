<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" font-family="Helvetica, Arial, sans-serif">
<!-- fig12: how do we know? (A) purified pump in liposomes moves Na+ and K+ when ATP is added; (B) ouabain blocks the pump from the outside only -->
<defs>
<marker id="ar" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker>
<marker id="ab" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1c4fa0"/></marker>
<marker id="ap" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#8e44ad"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c2255c"/></marker>
<marker id="ay" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#b8860b"/></marker>
<marker id="ah" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1098ad"/></marker>
</defs>
<text x="105.5" y="28" font-size="18" fill="#1b2a3a" font-weight="bold"><tspan>A. Rebuild it: pure pump in a liposome</tspan></text>
<rect x="10" y="45" width="520" height="375" fill="#eef3f8"/>
<circle cx="250" cy="215" r="120" fill="#f6f0de" stroke="#8a6a12" stroke-width="3"/>
<circle cx="250" cy="215" r="96" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<g transform="translate(358.0 215.0) rotate(0)"><rect x="-26" y="-24" width="52" height="48" rx="10" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><ellipse cx="44" cy="0" rx="20" ry="16" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/></g>
<g transform="translate(148.5 178.1) rotate(200)"><rect x="-26" y="-24" width="52" height="48" rx="10" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><ellipse cx="-44" cy="0" rx="20" ry="16" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/></g>
<text x="418" y="185" font-size="16" fill="#e8590c" font-weight="bold"><tspan>ATP</tspan></text>
<line x1="430" y1="191" x2="416" y2="205" stroke="#e8590c" stroke-width="2.5" marker-end="url(#ao)"/>
<circle cx="410" cy="285" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="394.5" y="290" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="392" y1="273" x2="298" y2="235" stroke="#1c4fa0" stroke-width="2.5" marker-end="url(#ab)"/>
<circle cx="280" cy="220" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="264.5" y="225" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="240" cy="185" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="224.5" y="190" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="220" cy="245" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="204.5" y="250" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="290" cy="155" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="280.0" y="160" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="310" y1="165" x2="398" y2="137" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#ap)"/>
<circle cx="410" cy="123" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="400.0" y="128" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<text x="26" y="72" font-size="14" fill="#1b2a3a" font-style="italic">outside the liposome</text>
<text x="78.2" y="379" font-size="16" fill="#1b2a3a"><tspan>Only lipid, pump and ATP: Na</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> and K</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> still move.</tspan></text>
<text x="108.0" y="401" font-size="16" fill="#1b2a3a"><tspan>So the pump protein alone does the job.</tspan></text>
<text x="660.4" y="28" font-size="18" fill="#1b2a3a" font-weight="bold"><tspan>B. Block it: ouabain works from outside</tspan></text>
<rect x="570" y="45" width="520" height="125" fill="#eef3f8"/><rect x="570" y="220" width="520" height="110" fill="#fbfaf5"/><rect x="570" y="170" width="520" height="50" fill="#f6f0de"/><line x1="570" y1="170" x2="1090" y2="170" stroke="#8a6a12" stroke-width="3"/><line x1="570" y1="220" x2="1090" y2="220" stroke="#8a6a12" stroke-width="3"/>
<rect x="680" y="156" width="80" height="78" rx="14" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<path d="M696,154 l12,-26 l24,0 l12,26 z" fill="#e8590c" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="750" y="136" font-size="16" fill="#e8590c" font-weight="bold">ouabain</text>
<circle cx="702" cy="266" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="686.5" y="271" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="702" y1="248" x2="702" y2="240" stroke="#1c4fa0" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M704,180 l32,32 M736,180 l-32,32" stroke="#e8590c" stroke-width="5"/>
<text x="647.0" y="320" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>Na</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> pumping stops</tspan></text>
<rect x="920" y="156" width="80" height="78" rx="14" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<path d="M1006,268 l12,-26 l24,0 l12,26 z" fill="#e8590c" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="942" cy="266" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="926.5" y="271" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="942" y1="248" x2="942" y2="110" stroke="#1c4fa0" stroke-width="2.5" marker-end="url(#ab)"/>
<circle cx="942" cy="90" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="926.5" y="95" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<text x="895.7" y="320" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>ouabain inside: no effect</tspan></text>
<text x="580" y="70" font-size="14" fill="#1b2a3a" font-style="italic">outside</text>
<text x="580" y="274" font-size="14" fill="#1b2a3a" font-style="italic">cytosol</text>
<text x="678.6" y="356" font-size="16" fill="#1b2a3a"><tspan>The drug binds the outer face of the pump.</tspan></text>
<text x="669.8" y="378" font-size="16" fill="#1b2a3a"><tspan>Same for digoxin, a heart drug from foxglove.</tspan></text>
</svg>
