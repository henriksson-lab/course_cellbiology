<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <!-- fig13: ER-associated degradation: retrotranslocation, ubiquitination, extraction by p97, proteasome -->
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="0" y="0" width="1000" height="190" fill="#fbfaf5"/>
  <rect x="0" y="224" width="1000" height="196" fill="#e6f3f5"/>
  <rect x="0" y="190" width="1000" height="34" fill="#2a7f8f" opacity="0.35"/>
