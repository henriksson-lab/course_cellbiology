  <text x="446" y="278" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">(channel + E3 ligase)</text>
  <path d="M340,290 C 360,270 400,260 400,224 L 400,190 C 400,150 440,130 490,120" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
