  <text x="90" y="24" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">A signal sequence comes</text>
  <text x="90" y="43" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">out of the ribosome</text>
  <circle cx="310" cy="26" r="14" fill="#1b2a3a"/>
  <text x="310" y="32" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
  <text x="330" y="24" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">SRP binds it and</text>
  <text x="330" y="43" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">pauses translation</text>
  <circle cx="560" cy="26" r="14" fill="#1b2a3a"/>
  <text x="560" y="32" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
  <text x="580" y="24" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">SRP docks on its receptor</text>
  <text x="580" y="43" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">next to the translocon</text>
  <circle cx="790" cy="26" r="14" fill="#1b2a3a"/>
  <text x="790" y="32" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
  <text x="810" y="24" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">SRP leaves; the chain is</text>
  <text x="810" y="43" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">threaded into the lumen</text>
  <text x="12" y="240" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">cytosol</text>
  <text x="12" y="414" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">ER lumen</text>
  <text x="844" y="318" font-size="15" text-anchor="end" font-weight="normal" fill="#1b2a3a">signal peptidase</text>
  <text x="844" y="336" font-size="15" text-anchor="end" font-weight="normal" fill="#1b2a3a">cuts off the signal</text>
