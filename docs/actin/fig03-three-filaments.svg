<text x="935.0" y="112.0" font-size="15" text-anchor="middle" fill="#1b2a3a">10 nm wide; a rope</text>
<text x="935.0" y="130.8" font-size="15" text-anchor="middle" fill="#1b2a3a">of fibrous proteins</text>
<line x1="20.0" y1="161.0" x2="1080.0" y2="161.0" stroke="#dee2e6" stroke-width="1" />
<text x="30.0" y="183.0" font-size="18" text-anchor="start" fill="#1b2a3a" font-weight="bold">Subunit</text>
<text x="300.0" y="183.0" font-size="17" text-anchor="middle" fill="#1b2a3a">actin (globular), binds ATP</text>
<text x="620.0" y="183.0" font-size="17" text-anchor="middle" fill="#1b2a3a">αβ-tubulin dimer, binds GTP</text>
<text x="935.0" y="183.0" font-size="17" text-anchor="middle" fill="#1b2a3a">many kinds: keratins,</text>
<text x="935.0" y="204.2" font-size="17" text-anchor="middle" fill="#1b2a3a">vimentin, lamins …</text>
<line x1="20.0" y1="211.0" x2="1080.0" y2="211.0" stroke="#dee2e6" stroke-width="1" />
<text x="30.0" y="233.0" font-size="18" text-anchor="start" fill="#1b2a3a" font-weight="bold">Polarity</text>
<text x="300.0" y="233.0" font-size="17" text-anchor="middle" fill="#1b2a3a">yes: barbed (+) and</text>
<text x="300.0" y="254.2" font-size="17" text-anchor="middle" fill="#1b2a3a">pointed (−) end</text>
<text x="620.0" y="233.0" font-size="17" text-anchor="middle" fill="#1b2a3a">yes: plus and minus end</text>
<text x="935.0" y="233.0" font-size="17" text-anchor="middle" fill="#1b2a3a">no</text>
<line x1="20.0" y1="261.0" x2="1080.0" y2="261.0" stroke="#dee2e6" stroke-width="1" />
<text x="30.0" y="283.0" font-size="18" text-anchor="start" fill="#1b2a3a" font-weight="bold">Dynamics</text>
<text x="300.0" y="283.0" font-size="17" text-anchor="middle" fill="#1b2a3a">fast: treadmilling,</text>
<text x="300.0" y="304.2" font-size="17" text-anchor="middle" fill="#1b2a3a">turned over in minutes</text>
<text x="620.0" y="283.0" font-size="17" text-anchor="middle" fill="#1b2a3a">fast: dynamic instability</text>
<text x="935.0" y="283.0" font-size="17" text-anchor="middle" fill="#1b2a3a">slow, very stable</text>
<line x1="20.0" y1="311.0" x2="1080.0" y2="311.0" stroke="#dee2e6" stroke-width="1" />
<text x="30.0" y="333.0" font-size="18" text-anchor="start" fill="#1b2a3a" font-weight="bold">Motors</text>
<text x="300.0" y="333.0" font-size="17" text-anchor="middle" fill="#1b2a3a">myosins</text>
<text x="620.0" y="333.0" font-size="17" text-anchor="middle" fill="#1b2a3a">kinesins, dynein</text>
<text x="935.0" y="333.0" font-size="17" text-anchor="middle" fill="#1b2a3a">none</text>
<line x1="20.0" y1="361.0" x2="1080.0" y2="361.0" stroke="#dee2e6" stroke-width="1" />
<text x="30.0" y="383.0" font-size="18" text-anchor="start" fill="#1b2a3a" font-weight="bold">Main jobs</text>
<text x="300.0" y="383.0" font-size="17" text-anchor="middle" fill="#1b2a3a">shape, crawling, cortex,</text>
<text x="300.0" y="404.2" font-size="17" text-anchor="middle" fill="#1b2a3a">contraction, cytokinesis</text>
<text x="620.0" y="383.0" font-size="17" text-anchor="middle" fill="#1b2a3a">long-range transport,</text>
<text x="620.0" y="404.2" font-size="17" text-anchor="middle" fill="#1b2a3a">spindle, cilia</text>
<text x="935.0" y="383.0" font-size="17" text-anchor="middle" fill="#1b2a3a">mechanical strength,</text>
<text x="935.0" y="404.2" font-size="17" text-anchor="middle" fill="#1b2a3a">nuclear lamina</text>
</svg>
