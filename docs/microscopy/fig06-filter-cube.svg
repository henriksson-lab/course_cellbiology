<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="Helvetica, Arial, sans-serif">
  <!-- fig06: light path in an epifluorescence microscope with a filter cube -->
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f6fdf"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a9d48"/>
    </marker>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7be08f"/>
      <stop offset="1" stop-color="#2a9d48" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- filter cube outline -->
  <rect x="180" y="92" width="300" height="210" rx="8" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="192" y="114" font-size="16" font-weight="bold" fill="#1b2a3a">Filter cube</text>

  <!-- light source -->
  <circle cx="62" cy="200" r="30" fill="#fff8d6" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M50,200 q6,-14 12,0 q6,14 12,0" fill="none" stroke="#d9822b" stroke-width="2.5"/>
  <text x="62" y="254" font-size="15" fill="#1b2a3a" text-anchor="middle">Lamp or LED</text>
  <text x="62" y="272" font-size="15" fill="#1b2a3a" text-anchor="middle">(many colours)</text>

  <!-- white light: three colour stripes from lamp to excitation filter -->
  <line x1="93" y1="194" x2="196" y2="194" stroke="#2f6fdf" stroke-width="3"/>
  <line x1="93" y1="200" x2="196" y2="200" stroke="#2a9d48" stroke-width="3"/>
  <line x1="93" y1="206" x2="196" y2="206" stroke="#d64545" stroke-width="3"/>

  <!-- excitation filter -->
  <rect x="198" y="168" width="14" height="64" fill="#9fc0f5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="246" y="256" font-size="15" fill="#1b2a3a" text-anchor="middle">Excitation filter</text>
  <text x="246" y="274" font-size="15" fill="#1b2a3a" text-anchor="middle">passes blue only</text>

  <!-- blue beam to dichroic, then down to sample -->
  <line x1="214" y1="200" x2="392" y2="200" stroke="#2f6fdf" stroke-width="4"/>
  <line x1="392" y1="200" x2="392" y2="420" stroke="#2f6fdf" stroke-width="4" marker-end="url(#ab)"/>

  <!-- green beam from sample up to camera -->
  <line x1="410" y1="418" x2="410" y2="66" stroke="#2a9d48" stroke-width="4" marker-end="url(#ag)"/>

  <!-- dichroic mirror (drawn over the beams) -->
  <line x1="352" y1="160" x2="448" y2="256" stroke="#1b2a3a" stroke-width="6"/>
  <line x1="352" y1="160" x2="448" y2="256" stroke="#c9d8f3" stroke-width="3"/>

  <!-- emission filter -->
  <rect x="368" y="118" width="84" height="14" fill="#a8e2b6" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- camera -->
  <rect x="372" y="16" width="76" height="40" rx="5" fill="#dfe4ea" stroke="#1b2a3a" stroke-width="2"/>
  <text x="410" y="42" font-size="15" fill="#1b2a3a" text-anchor="middle">camera</text>

  <!-- objective lens -->
  <path d="M352,330 L468,330 L450,372 L370,372 Z" fill="#dfe4ea" stroke="#1b2a3a" stroke-width="2"/>
  <ellipse cx="410" cy="378" rx="34" ry="7" fill="#e9f3fb" stroke="#1b2a3a" stroke-width="1.5"/>

  <!-- sample: glass slide with a cell -->
  <rect x="320" y="448" width="180" height="12" fill="#e9f3fb" stroke="#1b2a3a" stroke-width="1.5"/>
  <ellipse cx="410" cy="438" rx="62" ry="12" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="400" cy="436" r="14" fill="url(#glow)"/>

  <!-- right-hand labels with leaders -->
  <g font-size="15" fill="#1b2a3a">
    <line x1="456" y1="125" x2="512" y2="125" stroke="#1b2a3a" stroke-width="1"/>
    <text x="518" y="122">Emission filter: passes green,</text>
    <text x="518" y="140">blocks stray blue light</text>

    <line x1="440" y1="236" x2="512" y2="210" stroke="#1b2a3a" stroke-width="1"/>
    <text x="518" y="200">Dichroic mirror: reflects</text>
    <text x="518" y="218">blue, lets green through</text>

    <line x1="472" y1="350" x2="512" y2="350" stroke="#1b2a3a" stroke-width="1"/>
    <text x="518" y="347">Objective: focuses blue</text>
    <text x="518" y="365">light, collects green light</text>

    <line x1="476" y1="438" x2="512" y2="438" stroke="#1b2a3a" stroke-width="1"/>
    <text x="518" y="435">Cell with a fluorophore:</text>
    <text x="518" y="453">absorbs blue, emits green</text>

    <line x1="452" y1="36" x2="512" y2="36" stroke="#1b2a3a" stroke-width="1"/>
    <text x="518" y="41">Camera or eyepiece</text>
  </g>

  <!-- beam legend -->
  <g font-size="15" fill="#1b2a3a">
    <line x1="24" y1="352" x2="64" y2="352" stroke="#2f6fdf" stroke-width="4"/>
    <text x="72" y="357">excitation light</text>
    <line x1="24" y1="382" x2="64" y2="382" stroke="#2a9d48" stroke-width="4"/>
    <text x="72" y="387">emitted light</text>
  </g>
</svg>
