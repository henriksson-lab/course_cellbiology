<svg xmlns="http://www.w3.org/2000/svg" width="890" height="380" viewBox="0 0 890 380" font-family="Helvetica, Arial, sans-serif">
  <!-- fig03: channel (open pore) versus transporter (alternating access) -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="a8e44ad" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#8e44ad"/></marker><marker id="ae8590c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
<text x="215" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Channel</text>
<rect x="20" y="150" width="390" height="70" fill="#f6f0de"/><line x1="20" y1="150" x2="410" y2="150" stroke="#8a6a12" stroke-width="4"/><line x1="20" y1="220" x2="410" y2="220" stroke="#8a6a12" stroke-width="4"/>
<rect x="152.0" y="136" width="46" height="98" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="232.0" y="136" width="46" height="98" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<text x="30" y="140" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">outside</text>
<text x="30" y="248" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">inside</text>
<circle cx="215" cy="60" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="206.7" y="65" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<circle cx="215" cy="100" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="206.7" y="105" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<circle cx="215" cy="185" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="206.7" y="190" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<circle cx="215" cy="262" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="206.7" y="267" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<circle cx="176" cy="66" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="167.7" y="71" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<circle cx="254" cy="70" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1"/><text x="245.7" y="75" font-size="13" text-anchor="start" font-weight="bold" fill="#ffffff">K<tspan font-size="8.8" dy="-5.5">+</tspan></text>
<line x1="285" y1="70" x2="285" y2="270" stroke="#8e44ad" stroke-width="4" marker-end="url(#a8e44ad)"/>
<text x="305" y="92" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">open pore:</text>
<text x="305" y="112" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">ions stream through</text>
<text x="305" y="132" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">down their gradient</text>
<text x="30" y="310" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• up to 10<tspan font-size="11.6" dy="-7.1">8</tspan><tspan dy="7.1"> ions per second</tspan></text>
<text x="30" y="338" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• selective: one kind of ion</text>
<text x="30" y="366" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• gated: opens and closes</text>
<text x="675" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Transporter</text>
<rect x="470" y="150" width="410" height="70" fill="#f6f0de"/><line x1="470" y1="150" x2="880" y2="150" stroke="#8a6a12" stroke-width="4"/><line x1="470" y1="220" x2="880" y2="220" stroke="#8a6a12" stroke-width="4"/>
<path d="M505,136 L551,136 L561,234 L505,234 Z" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2" stroke-linejoin="round"/><path d="M625,136 L579,136 L569,234 L625,234 Z" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="565" cy="158" r="11" fill="#e0a800" stroke="#1b2a3a"/>
<path d="M725,136 L781,136 L771,234 L725,234 Z" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2" stroke-linejoin="round"/><path d="M845,136 L789,136 L799,234 L845,234 Z" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="785" cy="212" r="11" fill="#e0a800" stroke="#1b2a3a"/>
<line x1="640" y1="175" x2="706" y2="175" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a1b2a3a)"/>
<line x1="710" y1="198" x2="644" y2="198" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a1b2a3a)"/>
<text x="565" y="108" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">open to outside</text>
<text x="565" y="128" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">solute binds</text>
<text x="785" y="108" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">shape change:</text>
<text x="785" y="128" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">open to inside</text>
<text x="480" y="310" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• about 10<tspan font-size="11.6" dy="-7.1">2</tspan><tspan dy="7.1">–10</tspan><tspan font-size="11.6" dy="-7.1">4</tspan><tspan dy="7.1"> molecules per second</tspan></text>
<text x="480" y="338" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• never open to both sides at once</text>
<text x="480" y="366" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a">• can couple to ATP or another gradient</text>
<line x1="440" y1="20" x2="440" y2="380" stroke="#ced4da" stroke-width="2"/>
</svg>
