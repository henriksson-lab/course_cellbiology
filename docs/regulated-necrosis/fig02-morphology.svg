<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Helvetica, Arial, sans-serif">
<!-- fig02: two ways to die: apoptosis (shrink, package, be eaten) vs necrosis (swell, burst, spill) -->
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
<!-- row titles -->
<text x="250" y="30" font-size="20" font-weight="bold" fill="#1b2a3a">Apoptosis: shrink, package, get eaten</text>
<text x="250" y="270" font-size="20" font-weight="bold" fill="#1b2a3a">Necrosis: swell, burst, spill</text>
<!-- normal cell -->
<ellipse cx="105" cy="240" rx="80" ry="55" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
<ellipse cx="100" cy="240" rx="28" ry="22" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
<ellipse cx="155" cy="222" rx="14" ry="6" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
<ellipse cx="60" cy="262" rx="14" ry="6" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
<text x="105" y="325" font-size="17" text-anchor="middle" fill="#1b2a3a">healthy cell</text>
<path d="M175,200 C200,150 215,130 245,120" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M175,280 C200,330 215,350 245,365" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- apoptosis row (y = 120) -->
<circle cx="315" cy="120" r="44" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
<circle cx="312" cy="118" r="17" fill="#6b4fa0"/>
<text x="315" y="200" font-size="16" text-anchor="middle" fill="#1b2a3a">shrinks; chromatin</text>
<text x="315" y="220" font-size="16" text-anchor="middle" fill="#1b2a3a">condenses</text>
<line x1="368" y1="120" x2="418" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="485" cy="120" r="40" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
<circle cx="518" cy="88" r="13" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<circle cx="525" cy="140" r="14" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<circle cx="448" cy="150" r="12" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<circle cx="450" cy="90" r="11" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<circle cx="476" cy="112" r="10" fill="#6b4fa0"/><circle cx="496" cy="128" r="9" fill="#6b4fa0"/><circle cx="474" cy="134" r="7" fill="#6b4fa0"/>
<text x="485" y="200" font-size="16" text-anchor="middle" fill="#1b2a3a">blebs; nucleus</text>
<text x="485" y="220" font-size="16" text-anchor="middle" fill="#1b2a3a">fragments</text>
<line x1="550" y1="120" x2="600" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="640" cy="95" r="20" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/><circle cx="640" cy="95" r="7" fill="#6b4fa0"/>
<circle cx="680" cy="135" r="17" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/><circle cx="680" cy="135" r="6" fill="#6b4fa0"/>
<circle cx="630" cy="145" r="14" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<circle cx="690" cy="90" r="13" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<text x="660" y="200" font-size="16" text-anchor="middle" fill="#1b2a3a">apoptotic bodies,</text>
<text x="660" y="220" font-size="16" text-anchor="middle" fill="#1b2a3a">membrane intact</text>
<line x1="715" y1="120" x2="765" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- phagocyte -->
<path d="M790,120 C790,60 860,45 905,70 C955,95 975,140 945,175 C910,210 820,200 800,170 C792,158 790,140 790,120 Z" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
<ellipse cx="920" cy="150" rx="22" ry="16" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
<circle cx="850" cy="110" r="22" fill="#e3f3ea" stroke="#2e8b57" stroke-width="3"/>
<circle cx="850" cy="110" r="8" fill="#6b4fa0"/>
<text x="875" y="230" font-size="16" text-anchor="middle" fill="#1b2a3a">eaten by a phagocyte:</text>
<text x="875" y="250" font-size="16" text-anchor="middle" fill="#2b8a3e" font-weight="bold">no inflammation</text>
<!-- necrosis row (y = 370) -->
<circle cx="320" cy="370" r="68" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
<ellipse cx="315" cy="370" rx="27" ry="23" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
<ellipse cx="365" cy="335" rx="16" ry="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
<ellipse cx="282" cy="412" rx="16" ry="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
<text x="320" y="465" font-size="16" text-anchor="middle" fill="#1b2a3a">cell and organelles swell</text>
<line x1="398" y1="370" x2="448" y2="370" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M545,302 A70,70 0 0,1 600,350" fill="none" stroke="#8a6a12" stroke-width="4"/>
<path d="M603,375 A70,70 0 0,1 520,438" fill="none" stroke="#8a6a12" stroke-width="4"/>
<path d="M505,434 A70,70 0 0,1 527,304" fill="none" stroke="#8a6a12" stroke-width="4"/>
<ellipse cx="530" cy="370" rx="26" ry="22" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
<g fill="#e8590c"><circle cx="618" cy="355" r="5"/><circle cx="635" cy="372" r="4"/><circle cx="625" cy="390" r="5"/><circle cx="492" cy="432" r="4"/><circle cx="478" cy="422" r="5"/><circle cx="534" cy="292" r="4"/><circle cx="652" cy="360" r="4"/></g>
<text x="545" y="465" font-size="16" text-anchor="middle" fill="#1b2a3a">membrane bursts, contents spill</text>
<line x1="665" y1="370" x2="715" y2="370" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- immune cells arriving -->
<g fill="#e8590c"><circle cx="745" cy="345" r="5"/><circle cx="760" cy="395" r="5"/><circle cx="740" cy="380" r="4"/></g>
<circle cx="830" cy="345" r="34" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<path d="M815,333 q8,-10 16,0 q8,10 16,0" fill="none" stroke="#6b4fa0" stroke-width="5"/>
<circle cx="900" cy="400" r="34" fill="#fbfaf5" stroke="#8a6a12" stroke-width="3"/>
<path d="M885,393 q8,-10 16,0 q8,10 16,0" fill="none" stroke="#6b4fa0" stroke-width="5"/>
<text x="860" y="455" font-size="16" text-anchor="middle" fill="#1b2a3a">immune cells arrive:</text>
<text x="860" y="475" font-size="16" text-anchor="middle" fill="#c92a2a" font-weight="bold">inflammation</text>
</svg>
