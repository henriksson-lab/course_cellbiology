<text x="30" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">A chain reaction in the membrane</text>
<text x="30" y="56" font-size="16" fill="#1b2a3a">Fe<tspan font-size="11" dy="-6">2+</tspan><tspan dy="6"> turns a lipid peroxide into a radical (orange dot). The radical steals an H atom</tspan></text>
<text x="30" y="80" font-size="16" fill="#1b2a3a">from the next polyunsaturated tail, which becomes a radical in turn …</text>
<text x="256" y="122" font-size="16" font-weight="bold" fill="#1b2a3a">Fe<tspan font-size="11" dy="-6">2+</tspan></text>
<line x1="298" y1="122" x2="330" y2="190" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
<text x="640" y="104" font-size="16" font-weight="bold" fill="#e8590c">ferrostatin-1, vitamin E:</text>
<text x="640" y="124" font-size="16" fill="#e8590c">trap the radical</text>
<line x1="636" y1="112" x2="600" y2="162" stroke="#e8590c" stroke-width="3"/><line x1="588" y1="155" x2="610" y2="168" stroke="#e8590c" stroke-width="5"/>
<text x="30" y="372" font-size="16" fill="#1b2a3a">Kinked tails = polyunsaturated (several C=C): easy to attack. Straight tails = saturated: resistant.</text>
<text x="30" y="398" font-size="16" fill="#1b2a3a">Oxidised tails bend and break the packing: the bilayer becomes leaky and finally ruptures.</text>
</svg>