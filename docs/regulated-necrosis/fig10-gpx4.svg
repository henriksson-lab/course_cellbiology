<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
<!-- fig10: the guard against ferroptosis: cystine import -> glutathione -> GPX4 detoxifies lipid peroxides -->
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
<text x="980" y="40" font-size="16" text-anchor="end" fill="#1b2a3a">outside</text>
<rect x="20" y="50" width="960" height="22" fill="#f6f0de"/>
<line x1="20" y1="50" x2="980" y2="50" stroke="#8a6a12" stroke-width="3"/><line x1="20" y1="72" x2="980" y2="72" stroke="#8a6a12" stroke-width="3"/>
<!-- system xc- -->
<rect x="140" y="30" width="60" height="62" rx="10" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<text x="215" y="100" font-size="16" fill="#1b2a3a">system xc<tspan font-size="11" dy="-6">−</tspan></text>
<path d="M150,12 L150,120" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M190,120 L190,14" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="40" y="30" font-size="16" fill="#1b2a3a">cystine in</text>
<text x="205" y="24" font-size="16" fill="#1b2a3a">glutamate out</text>
<!-- erastin -->
<text x="300" y="36" font-size="16" font-weight="bold" fill="#e8590c">erastin</text>
<line x1="296" y1="32" x2="210" y2="56" stroke="#e8590c" stroke-width="3"/><line x1="206" y1="44" x2="212" y2="68" stroke="#e8590c" stroke-width="5"/>
<!-- inside chain -->
<rect x="60" y="140" width="180" height="44" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="150" y="168" font-size="18" text-anchor="middle" fill="#1b2a3a">2 cysteine</text>
<line x1="242" y1="162" x2="300" y2="162" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="306" y="140" width="220" height="44" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="416" y="168" font-size="18" text-anchor="middle" fill="#1b2a3a">glutathione (GSH)</text>
<line x1="526" y1="162" x2="600" y2="162" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<!-- GPX4 -->
<rect x="606" y="132" width="150" height="60" rx="10" fill="#1b2a3a"/>
<text x="681" y="160" font-size="20" text-anchor="middle" fill="#fff" font-weight="bold">GPX4</text>
<text x="681" y="182" font-size="14" text-anchor="middle" fill="#fff">(contains selenium)</text>
<text x="790" y="128" font-size="16" font-weight="bold" fill="#e8590c">RSL3</text>
<line x1="788" y1="132" x2="764" y2="148" stroke="#e8590c" stroke-width="3"/><line x1="757" y1="138" x2="769" y2="158" stroke="#e8590c" stroke-width="5"/>
<!-- reaction -->
<rect x="430" y="250" width="200" height="52" rx="8" fill="#fde8d7" stroke="#e8590c" stroke-width="2"/>
<text x="530" y="273" font-size="17" text-anchor="middle" fill="#1b2a3a">lipid–OOH</text>
<text x="530" y="293" font-size="14" text-anchor="middle" fill="#1b2a3a">(peroxide: dangerous)</text>
<rect x="740" y="250" width="200" height="52" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
<text x="840" y="273" font-size="17" text-anchor="middle" fill="#1b2a3a">lipid–OH</text>
<text x="840" y="293" font-size="14" text-anchor="middle" fill="#1b2a3a">(alcohol: harmless)</text>
<line x1="632" y1="276" x2="734" y2="276" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="681" y1="194" x2="681" y2="268" stroke="#1b2a3a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="690" y="230" font-size="15" fill="#1b2a3a">2 GSH → GSSG</text>
<!-- iron side -->
<rect x="60" y="250" width="250" height="52" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="118" y="273" font-size="17" fill="#1b2a3a">free iron (Fe<tspan font-size="11" dy="-6">2+</tspan><tspan dy="6">)</tspan></text>
<text x="185" y="293" font-size="14" text-anchor="middle" fill="#1b2a3a">from transferrin, ferritin</text>
<line x1="312" y1="276" x2="424" y2="276" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="318" y="266" font-size="15" fill="#1b2a3a">makes more</text>
<text x="60" y="335" font-size="15" fill="#e8590c" font-weight="bold">iron chelator (deferoxamine) blocks</text>
<!-- outcome -->
<text x="500" y="378" font-size="18" text-anchor="middle" fill="#1b2a3a">Block the import, the glutathione or GPX4, or add iron:</text>
<text x="500" y="404" font-size="18" text-anchor="middle" fill="#c92a2a" font-weight="bold">peroxides win, the membrane fails: ferroptosis.</text>
</svg>
