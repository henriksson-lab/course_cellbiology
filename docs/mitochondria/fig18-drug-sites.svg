<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1098ad"/></marker>
  </defs>
  <rect x="0" y="70" width="1000" height="110" fill="#fdf6f7"/>
  <rect x="0" y="240" width="1000" height="80" fill="#f8e9ec"/>
  <rect x="0" y="180" width="1000" height="60" fill="#ecc9d1"/>
  <line x1="0" y1="180" x2="1000" y2="180" stroke="#a8324a" stroke-width="2.5"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#a8324a" stroke-width="2.5"/>
  <text x="990" y="96" font-size="15" fill="#a8324a" font-weight="700" text-anchor="end">intermembrane space</text>
  <text x="990" y="312" font-size="15" fill="#a8324a" font-weight="700" text-anchor="end">matrix</text>
  <path d="M90,280 L90,215 L190,212 L280,215 L330,150 L380,215 L380,280" fill="none" stroke="#c99700" stroke-width="3" stroke-dasharray="7 5"/>
  <g stroke="#a8324a" stroke-width="2.5" fill="#fff"><rect x="60" y="170" width="60" height="80" rx="10"/><rect x="250" y="172" width="56" height="76" rx="10"/><rect x="352" y="172" width="56" height="76" rx="10"/></g>
  <g font-size="20" font-weight="700" fill="#a8324a" text-anchor="middle"><text x="90" y="217">I</text><text x="278" y="217">III</text><text x="380" y="217">IV</text></g>
  <circle cx="190" cy="212" r="13" fill="#fff3bf" stroke="#c99700" stroke-width="2"/><text x="190" y="217" font-size="13" font-weight="700" text-anchor="middle">Q</text>
  <circle cx="330" cy="146" r="13" fill="#fff3bf" stroke="#c99700" stroke-width="2"/><text x="330" y="151" font-size="13" font-weight="700" text-anchor="middle">c</text>
  <rect x="540" y="172" width="64" height="76" rx="14" fill="#fff" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="572" y1="248" x2="572" y2="270" stroke="#1b2a3a" stroke-width="6"/>
  <circle cx="572" cy="292" r="22" fill="#fff" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="572" y="216" font-size="13" font-weight="700" text-anchor="middle">ATP</text><text x="572" y="232" font-size="13" font-weight="700" text-anchor="middle">synth.</text>
  <!-- uncoupler shuttle -->
  <line x1="770" y1="110" x2="770" y2="300" stroke="#1098ad" stroke-width="3.5" marker-end="url(#h)"/>
  <circle cx="770" cy="150" r="12" fill="none" stroke="#e8590c" stroke-width="3"/>
  <circle cx="770" cy="272" r="12" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="752" y="104" font-size="16" font-weight="700" fill="#1098ad">H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan></text>
  <!-- drug labels -->
  <g font-size="16">
    <text x="20" y="28" font-weight="700" fill="#e8590c">metformin</text>
    <text x="20" y="48">partly blocks I (high dose; debated)</text>
    <line x1="80" y1="56" x2="84" y2="168" stroke="#e8590c" stroke-width="2"/>
    <text x="300" y="28" font-weight="700" fill="#e8590c">cyanide (CN<tspan font-size="10.9" dy="-6.4">−</tspan><tspan dy="6.4">), CO, azide</tspan></text>
    <text x="300" y="48">bind the iron in IV where O<tspan font-size="10.9" dy="4.0">2</tspan><tspan dy="-4.0"> binds</tspan></text>
    <line x1="380" y1="56" x2="380" y2="168" stroke="#e8590c" stroke-width="2"/>
    <text x="440" y="350" font-weight="700" fill="#e8590c">oligomycin</text>
    <text x="440" y="370">blocks the H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> channel</tspan></text>
    <line x1="490" y1="334" x2="546" y2="246" stroke="#e8590c" stroke-width="2"/>
    <text x="20" y="350" font-weight="700" fill="#e8590c">rotenone (I), antimycin A (III)</text>
    <text x="20" y="370">research tools; rotenone is a fish poison</text>
    <text x="700" y="28" font-weight="700" fill="#e8590c">DNP, FCCP: uncouplers</text>
    <text x="700" y="48">weak acids that carry H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> across</tspan></text>
    <text x="700" y="68">the membrane, bypassing ATP synthase</text>
    <text x="800" y="210">energy of the</text>
    <text x="800" y="230">gradient → <tspan font-weight="700" fill="#c92a2a">heat</tspan></text>
  </g>
</svg>
