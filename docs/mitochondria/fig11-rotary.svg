<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1098ad"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <rect x="0" y="0" width="620" height="100" fill="#fdf6f7"/>
  <rect x="0" y="160" width="620" height="260" fill="#f8e9ec"/>
  <rect x="0" y="100" width="620" height="60" fill="#ecc9d1"/>
  <line x1="0" y1="100" x2="620" y2="100" stroke="#a8324a" stroke-width="2.5"/><line x1="0" y1="160" x2="620" y2="160" stroke="#a8324a" stroke-width="2.5"/>
  <text x="10" y="24" font-size="16" font-weight="700" fill="#a8324a">intermembrane space</text>
  <text x="10" y="410" font-size="16" font-weight="700" fill="#a8324a">matrix</text>
  <!-- c-ring (rotor) -->
  <rect x="130" y="92" width="150" height="76" rx="20" fill="#f2c94c" stroke="#1b2a3a" stroke-width="2.5"/>
  <g stroke="#b08900" stroke-width="2"><line x1="150" y1="96" x2="150" y2="164"/><line x1="168" y1="94" x2="168" y2="166"/><line x1="186" y1="94" x2="186" y2="166"/><line x1="205" y1="94" x2="205" y2="166"/><line x1="224" y1="94" x2="224" y2="166"/><line x1="242" y1="94" x2="242" y2="166"/><line x1="260" y1="96" x2="260" y2="164"/></g>
  <!-- a subunit (stator) -->
  <rect x="280" y="92" width="44" height="76" rx="8" fill="#868e96" stroke="#1b2a3a" stroke-width="2"/>
  <text x="302" y="136" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">a</text>
  <!-- peripheral stalk -->
  <rect x="318" y="160" width="16" height="190" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- central stalk -->
  <rect x="196" y="168" width="18" height="110" fill="#7048e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <!-- F1 head -->
  <ellipse cx="225" cy="330" rx="100" ry="66" fill="#fff" stroke="#1b2a3a" stroke-width="2.5"/>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <ellipse cx="170" cy="325" rx="30" ry="40" fill="#e6f4ea"/><ellipse cx="225" cy="345" rx="30" ry="42" fill="#fde2cf"/><ellipse cx="280" cy="325" rx="30" ry="40" fill="#e6f4ea"/>
  </g>
  <rect x="200" y="270" width="20" height="40" fill="#7048e8"/>
  <text x="225" y="352" font-size="15" font-weight="700" text-anchor="middle">β</text>
  <text x="170" y="332" font-size="15" text-anchor="middle">α</text>
  <text x="280" y="332" font-size="15" text-anchor="middle">α</text>
  <!-- H+ path -->
  <path d="M300,40 C300,80 292,96 286,110" fill="none" stroke="#1098ad" stroke-width="3.5" marker-end="url(#h)"/>
  <path d="M276,150 C270,180 262,190 258,214" fill="none" stroke="#1098ad" stroke-width="3.5" marker-end="url(#h)"/>
  <text x="310" y="40" font-size="17" font-weight="700" fill="#1098ad">H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8"> in</tspan></text>
  <text x="268" y="232" font-size="17" font-weight="700" fill="#1098ad">H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8"> out</tspan></text>
  <!-- rotation arrow -->
  <path d="M140,190 Q205,222 268,190" fill="none" stroke="#e8590c" stroke-width="4" marker-end="url(#r)"/>
  <text x="108" y="215" font-size="16" font-weight="700" fill="#e8590c">turns</text>
  <!-- labels -->
  <g font-size="16">
    <text x="360" y="120" font-weight="700">rotor: ring of c subunits</text>
    <text x="360" y="140">(8 in animals) + central stalk</text>
    <text x="360" y="196" font-weight="700">stator: a subunit,</text>
    <text x="360" y="216">peripheral stalk, α<tspan font-size="10.9" dy="4.0">3</tspan><tspan dy="-4.0">β</tspan><tspan font-size="10.9" dy="4.0">3</tspan><tspan dy="-4.0"> head</tspan></text>
    <text x="360" y="280" font-weight="700">each β site in turn:</text>
    <text x="360" y="300">binds ADP + P<tspan font-size="10.9" dy="4.0">i</tspan><tspan dy="-4.0"> → makes ATP</tspan></text>
    <text x="360" y="320">→ releases ATP</text>
    <text x="360" y="370" font-weight="700" fill="#2b8a3e">one turn: 8 H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> → 3 ATP</tspan></text>
    <text x="360" y="392">so ≈ 2.7 H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> per ATP</tspan></text>
  </g>
  <line x1="236" y1="282" x2="352" y2="276" stroke="#1b2a3a"/>
</svg>
