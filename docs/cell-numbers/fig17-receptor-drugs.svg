<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <rect x="20" y="120" width="840" height="26" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <text x="850" y="112" text-anchor="end" font-size="14" fill="#8a6a12">plasma membrane</text>
  <!-- EGF -->
  <circle cx="200" cy="40" r="12" fill="#2b8a3e"/>
  <text x="220" y="45" font-size="15">EGF (mitogen)</text>
  <!-- receptor dimer -->
  <rect x="170" y="58" width="24" height="70" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="198" y="58" width="24" height="70" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="170" y="138" width="24" height="56" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="198" y="138" width="24" height="56" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="140" y="96" text-anchor="end" font-weight="bold">EGFR</text>
  <text x="140" y="175" text-anchor="end" font-size="15">kinase</text>
  <!-- antibody -->
  <g stroke="#e8590c" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M290,93 L258,93 M258,93 L232,76 M258,93 L232,110"/>
  </g>
  
  <text x="305" y="80" fill="#c2410c" font-weight="bold">cetuximab</text>
  <text x="305" y="102" font-size="15" fill="#c2410c">antibody, blocks from outside</text>
  <!-- TKI -->
  <path d="M230,172 l10,-10 l10,10 l-10,10 z" fill="#e8590c"/>
  <text x="262" y="170" fill="#c2410c" font-weight="bold">erlotinib</text>
  <text x="262" y="190" font-size="15" fill="#c2410c">small molecule, blocks the ATP site</text>
  <!-- downstream -->
  <line x1="196" y1="198" x2="196" y2="232" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="146" y="236" width="100" height="38" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="196" y="261" text-anchor="middle">RAS</text>
  <line x1="248" y1="255" x2="300" y2="255" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="304" y="236" width="130" height="38" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="369" y="261" text-anchor="middle">ERK</text>
  <line x1="436" y1="255" x2="488" y2="255" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="496" y="261" font-weight="bold">pass the restriction point, divide</text>
  <!-- mutant RAS -->
  <path d="M196,278 L196,300" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="40" y="304" width="560" height="62" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2.5"/>
  <text x="56" y="330"><tspan font-weight="bold">KRAS mutated</tspan> (about 40 % of colorectal cancers): RAS is</text>
  <text x="56" y="354">on by itself, so blocking the receptor above it does not help.</text>
  <text x="620" y="330" font-size="15" fill="#555">→ test the tumour</text>
  <text x="620" y="352" font-size="15" fill="#555">before treatment</text>
</svg>
