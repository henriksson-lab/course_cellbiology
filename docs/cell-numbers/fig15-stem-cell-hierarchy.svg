<text x="190" y="40" font-size="15">cells move up</text>
<text x="200" y="92" font-weight="bold">Differentiated</text><text x="200" y="114" font-size="15">do the job, no division; shed</text><text x="200" y="134" font-size="15">at the top after about 4–5 days</text>
<text x="200" y="210" font-weight="bold" fill="#b5651d">Transit-amplifying cells</text><text x="200" y="232" font-size="15">divide fast a few times,</text><text x="200" y="252" font-size="15">then stop</text>
<text x="200" y="330" font-weight="bold" fill="#6b4fa0">Stem cells</text><text x="200" y="352" font-size="15">divide slowly; on average one</text><text x="200" y="372" font-size="15">daughter stays a stem cell</text>
