<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold">Triggers</text>
  <rect x="20" y="42" width="235" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="137" y="68" text-anchor="middle">short telomeres</text>
  <rect x="20" y="96" width="235" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="137" y="122" text-anchor="middle">DNA damage (X-rays)</text>
  <rect x="20" y="150" width="235" height="40" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="137" y="176" text-anchor="middle">oncogene (RAS, BRAF)</text>
  <rect x="20" y="204" width="235" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="137" y="230" text-anchor="middle">oxidative stress</text>
  <line x1="258" y1="62" x2="318" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="258" y1="116" x2="318" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="258" y1="170" x2="318" y2="182" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="258" y1="224" x2="318" y2="192" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="430" y="28" text-anchor="middle" font-weight="bold">Two brakes</text>
  <rect x="322" y="92" width="216" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="430" y="118" text-anchor="middle">p53 → p21</text>
  <rect x="322" y="166" width="216" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="430" y="192" text-anchor="middle">p16 → Rb stays active</text>
  <line x1="540" y1="112" x2="598" y2="140" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="540" y1="186" x2="598" y2="160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="602" y="60" width="260" height="190" rx="14" fill="#cfe0f4" stroke="#2f5d9e" stroke-width="2.5"/>
  <text x="732" y="88" text-anchor="middle" font-weight="bold">Senescent cell</text>
  <text x="618" y="118" font-size="16">• never divides again</text>
  <text x="618" y="144" font-size="16">• large, flat; SA-β-gal+</text>
  <text x="618" y="170" font-size="16">• resists apoptosis</text>
  <text x="618" y="196" font-size="16">• secretes inflammatory</text>
  <text x="632" y="218" font-size="16">signals (SASP)</text>
  <text x="20" y="290" font-size="16"><tspan font-weight="bold" fill="#2b8a3e">Good:</tspan> stops a cell with an oncogene or damaged DNA (a barrier to cancer); helps wound healing.</text>
  <text x="20" y="318" font-size="16"><tspan font-weight="bold" fill="#c2410c">Bad:</tspan> senescent cells pile up with age; their SASP inflames the tissue around them.</text>
</svg>
