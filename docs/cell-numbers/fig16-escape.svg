<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- telomere length strip -->
  <text x="20" y="28" font-size="15" fill="#555">telomere length</text>
  <path d="M140,14 L560,30 L560,36 L140,44 Z" fill="#2a7f8f" opacity="0.8"/>
  <path d="M560,30 L700,33 L700,33 L560,36 Z" fill="#2a7f8f" opacity="0.8"/>
  <rect x="700" y="22" width="180" height="22" fill="#2a7f8f" opacity="0.5"/>
  <text x="790" y="38" text-anchor="middle" font-size="14" fill="#fff">kept stable</text>
  <!-- boxes -->
  <rect x="20" y="70" width="150" height="70" rx="10" fill="#fff" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="95" y="100" text-anchor="middle" font-weight="bold">primary cell</text>
  <text x="95" y="124" text-anchor="middle" font-size="15">divides</text>
  <line x1="172" y1="105" x2="250" y2="105" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="211" y="96" text-anchor="middle" font-size="14">~50 PD</text>
  <rect x="254" y="70" width="190" height="70" rx="10" fill="#cfe0f4" stroke="#2f5d9e" stroke-width="2.5"/>
  <text x="349" y="100" text-anchor="middle" font-weight="bold">senescence</text>
  <text x="349" y="124" text-anchor="middle" font-size="15">p53 and Rb stop it</text>
  <!-- bypass -->
  <path d="M349,142 L349,190" stroke="#e8590c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="362" y="172" font-size="15" fill="#c2410c">p53 and Rb lost (mutation,</text>
  <text x="362" y="191" font-size="15" fill="#c2410c">viral protein): keeps dividing</text>
  <rect x="254" y="200" width="190" height="80" rx="10" fill="#f1f3f5" stroke="#6c757d" stroke-width="2.5"/>
  <text x="349" y="228" text-anchor="middle" font-weight="bold">crisis</text>
  <text x="349" y="250" text-anchor="middle" font-size="15">chromosome ends fuse;</text>
  <text x="349" y="270" text-anchor="middle" font-size="15">most cells die</text>
  <line x1="446" y1="240" x2="540" y2="240" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="493" y="226" text-anchor="middle" font-size="14">rare cell</text>
  <rect x="544" y="196" width="170" height="88" rx="10" fill="#fbeedd" stroke="#d9822b" stroke-width="2.5"/>
  <text x="629" y="224" text-anchor="middle" font-weight="bold">turns on</text>
  <text x="629" y="246" text-anchor="middle" font-weight="bold">telomerase</text>
  <text x="629" y="270" text-anchor="middle" font-size="14">(or ALT, ~10 %)</text>
  <line x1="716" y1="240" x2="740" y2="240" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="744" y="196" width="140" height="88" rx="10" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="814" y="230" text-anchor="middle" font-weight="bold">immortal</text>
  <text x="814" y="252" text-anchor="middle" font-weight="bold">cell line</text>
  <text x="814" y="274" text-anchor="middle" font-size="14">e.g. HeLa</text>
  <text x="20" y="325" font-size="15" fill="#555">Each step is selected: only cells that broke the brake keep growing. Genome damage from crisis stays.</text>
</svg>
