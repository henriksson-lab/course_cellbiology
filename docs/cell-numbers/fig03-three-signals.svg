<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- membrane band -->
  <rect x="20" y="92" width="860" height="26" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <text x="185" y="140" font-size="14" fill="#8a6a12">plasma membrane</text>
  <text x="30" y="80" font-size="14" fill="#555">outside</text>
  <text x="815" y="140" font-size="14" fill="#555">cytosol</text>
  <!-- three columns -->
  <g>
    <text x="150" y="30" text-anchor="middle" font-weight="bold">Mitogen</text>
    <circle cx="150" cy="58" r="11" fill="#2b8a3e"/>
    <rect x="140" y="72" width="20" height="58" rx="6" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="150" y1="134" x2="150" y2="186" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="150" y="212" text-anchor="middle" font-weight="bold">DIVIDE</text>
    <text x="150" y="234" text-anchor="middle" font-size="15">pass the restriction point</text>
    <ellipse cx="122" cy="290" rx="26" ry="20" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="122" cy="290" r="8" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <ellipse cx="178" cy="290" rx="26" ry="20" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="178" cy="290" r="8" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="150" y="342" text-anchor="middle" font-size="15">e.g. PDGF, EGF</text>
  </g>
  <g>
    <text x="450" y="30" text-anchor="middle" font-weight="bold">Growth factor</text>
    <path d="M439,47 h22 v22 h-22 z" fill="#d9822b"/>
    <rect x="440" y="72" width="20" height="58" rx="6" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="450" y1="134" x2="450" y2="186" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="450" y="212" text-anchor="middle" font-weight="bold">GROW</text>
    <text x="450" y="234" text-anchor="middle" font-size="15">make more protein (mTOR)</text>
    <ellipse cx="400" cy="290" rx="18" ry="14" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="400" cy="290" r="6" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <line x1="425" y1="290" x2="455" y2="290" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
    <ellipse cx="497" cy="290" rx="36" ry="28" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="497" cy="290" r="10" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="450" y="342" text-anchor="middle" font-size="15">e.g. IGF-1, insulin</text>
  </g>
  <g>
    <text x="750" y="30" text-anchor="middle" font-weight="bold">Survival factor</text>
    <path d="M750,46 l12,12 l-12,12 l-12,-12 z" fill="#3b5bab"/>
    <rect x="740" y="72" width="20" height="58" rx="6" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
    <line x1="750" y1="134" x2="750" y2="186" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="750" y="212" text-anchor="middle" font-weight="bold">SURVIVE</text>
    <text x="750" y="234" text-anchor="middle" font-size="15">block apoptosis</text>
    <ellipse cx="705" cy="290" rx="28" ry="22" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="705" cy="290" r="8" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="750" y="296" text-anchor="middle" font-size="15">vs</text>
    <circle cx="785" cy="280" r="9" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="802" cy="296" r="7" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="783" cy="302" r="6" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <circle cx="802" cy="275" r="5" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="750" y="342" text-anchor="middle" font-size="15">without it: cell dies</text>
  </g>
  <rect x="190" y="360" width="520" height="34" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="450" y="383" text-anchor="middle" font-weight="bold">cell number = divisions − deaths</text>
</svg>
