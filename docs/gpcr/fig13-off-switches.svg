<text x="196" y="270" font-size="16" text-anchor="start" fill="#1b2a3a">pumps in the ER (SERCA) and plasma membrane return Ca<tspan font-size="10.9" dy="-6.1">2+</tspan><tspan dy="6.1"> to 100 nM;</tspan></text>
<text x="196" y="294" font-size="16" text-anchor="start" fill="#1b2a3a">IP<tspan font-size="10.9" dy="3.5">3</tspan><tspan dy="-3.5"> is dephosphorylated; DAG is converted to other lipids</tspan></text>
<text x="500" y="24" font-size="16" text-anchor="middle" fill="#1b2a3a" font-style="italic">Each active state has its own way back. The slowest off-switch sets how long the signal lasts.</text></svg>
