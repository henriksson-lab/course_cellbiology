<polygon points="830,130 838,138 830,146 822,138" fill="#e8590c" stroke="#1b2a3a" stroke-width="1"/>
<line x1="805" y1="126" x2="838" y2="146" stroke="#c92a2a" stroke-width="3"/>
<line x1="838" y1="126" x2="805" y2="146" stroke="#c92a2a" stroke-width="3"/>
<text x="730" y="214.0" font-size="15" text-anchor="start" fill="#1b2a3a">The toxin modifies Gαi (still</text>
<text x="730" y="232.75" font-size="15" text-anchor="start" fill="#1b2a3a">holding GDP). The receptor can</text>
<text x="730" y="251.5" font-size="15" text-anchor="start" fill="#1b2a3a">no longer activate it: Gi stays</text>
<text x="730" y="270.25" font-size="15" text-anchor="start" fill="#1b2a3a">off, so its brake on adenylyl</text>
<text x="730" y="289.0" font-size="15" text-anchor="start" fill="#1b2a3a">cyclase is lost and cAMP rises.</text>
<text x="730" y="344.0" font-size="15" text-anchor="start" fill="#e8590c" font-weight="700">Both toxins attach an ADP-ribose</text>
<text x="730" y="362.75" font-size="15" text-anchor="start" fill="#e8590c" font-weight="700">group (orange diamond) to Gα,</text>
<text x="730" y="381.5" font-size="15" text-anchor="start" fill="#e8590c" font-weight="700">at different sites, with opposite</text>
<text x="730" y="400.25" font-size="15" text-anchor="start" fill="#e8590c" font-weight="700">effects on cAMP signalling.</text></svg>
