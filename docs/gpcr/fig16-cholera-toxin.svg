<text x="488" y="30" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="700">Na<tspan font-size="10.2" dy="-5.7">+</tspan><tspan dy="5.7"> and water follow:</tspan></text>
<text x="488" y="50" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="700">watery diarrhoea</text>
