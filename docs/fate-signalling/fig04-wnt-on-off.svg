<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b8a3e"/></marker>
    <g id="bcat"><ellipse rx="30" ry="15" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/></g>
    <g id="dc">
      <circle cx="-16" cy="-6" r="16" fill="#cfd8dc" stroke="#1b2a3a" stroke-width="1.5"/>
      <circle cx="16" cy="-6" r="16" fill="#b0bec5" stroke="#1b2a3a" stroke-width="1.5"/>
      <circle cx="0" cy="16" r="16" fill="#90a4ae" stroke="#1b2a3a" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- ===== panel 1: no Wnt ===== -->
  <rect x="5" y="5" width="485" height="480" rx="14" fill="#fbfaf5" stroke="#ccc"/>
  <text x="20" y="32" font-weight="700" font-size="19">No Wnt: target genes off</text>
  <g transform="translate(0 20)">
  <rect x="5" y="62" width="485" height="22" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <rect x="60" y="48" width="26" height="50" rx="7" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="98" y="56" font-size="15">Frizzled (receptor), empty</text>
  <!-- new beta-catenin -->
  <use href="#bcat" x="75" y="160"/>
  <text x="75" y="198" text-anchor="middle" font-size="15">β-catenin</text>
  <text x="75" y="216" text-anchor="middle" font-size="15">(newly made)</text>
  <path d="M108,160 L182,160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <use href="#dc" x="222" y="156"/>
  <text x="222" y="208" text-anchor="middle" font-size="15">destruction complex</text>
  <text x="222" y="226" text-anchor="middle" font-size="15">(APC, Axin, GSK3)</text>
  <path d="M260,160 L352,160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="306" y="146" text-anchor="middle" font-size="14">+P, +Ub</text>
  <!-- proteasome -->
  <rect x="358" y="136" width="96" height="48" rx="14" fill="#d9d2c5" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="382" y1="136" x2="382" y2="184" stroke="#1b2a3a"/><line x1="406" y1="136" x2="406" y2="184" stroke="#1b2a3a"/><line x1="430" y1="136" x2="430" y2="184" stroke="#1b2a3a"/>
  <text x="406" y="208" text-anchor="middle" font-size="15">proteasome</text>
  <text x="247" y="262" text-anchor="middle" font-size="15">β-catenin is tagged and destroyed within minutes</text>
  <!-- nucleus -->
  <rect x="25" y="290" width="445" height="160" rx="40" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="50" y="318" fill="#6b4fa0">nucleus</text>
  <line x1="45" y1="400" x2="450" y2="400" stroke="#1b2a3a" stroke-width="4"/>
  <rect x="110" y="380" width="70" height="30" rx="6" fill="#c3b4e3" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="145" y="401" text-anchor="middle" font-size="15">TCF</text>
  <rect x="96" y="340" width="98" height="30" rx="12" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="145" y="361" text-anchor="middle" font-size="15">repressor</text>
  <rect x="270" y="388" width="150" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="345" y="406" text-anchor="middle" font-size="15">Wnt target genes</text>
  <text x="345" y="436" text-anchor="middle" font-size="15" fill="#c92a2a" font-weight="700">off</text>

  </g>
  <!-- ===== panel 2: Wnt ===== -->
  <rect x="510" y="5" width="485" height="480" rx="14" fill="#fbfaf5" stroke="#ccc"/>
  <text x="525" y="32" font-weight="700" font-size="19">Wnt present: target genes on</text>
  <g transform="translate(0 20)">
  <rect x="510" y="62" width="485" height="22" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <rect x="566" y="48" width="26" height="50" rx="7" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="596" y="48" width="16" height="50" rx="5" fill="#74a9cf" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="589" cy="36" r="12" fill="#e03131" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="570" y="41" text-anchor="end" font-size="15">Wnt</text>
  <text x="622" y="56" font-size="15">Frizzled + co-receptor</text>
  <!-- destruction complex held at membrane -->
  <rect x="571" y="102" width="44" height="18" rx="9" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <use href="#dc" x="593" y="146"/>
  <line x1="562" y1="120" x2="626" y2="178" stroke="#c92a2a" stroke-width="4"/>
  <line x1="626" y1="120" x2="562" y2="178" stroke="#c92a2a" stroke-width="4"/>
  <text x="640" y="134" font-size="15">destruction complex pulled</text>
  <text x="640" y="152" font-size="15">to the receptor and blocked</text>
  <!-- accumulating beta-catenin -->
  <use href="#bcat" x="700" y="210"/>
  <use href="#bcat" x="770" y="228"/>
  <use href="#bcat" x="735" y="250"/>
  <text x="815" y="206" font-size="15">β-catenin</text>
  <text x="815" y="224" font-size="15">builds up</text>
  <!-- nucleus -->
  <rect x="530" y="290" width="445" height="160" rx="40" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="555" y="318" fill="#6b4fa0">nucleus</text>
  <line x1="550" y1="400" x2="955" y2="400" stroke="#1b2a3a" stroke-width="4"/>
  <rect x="615" y="380" width="70" height="30" rx="6" fill="#c3b4e3" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="650" y="401" text-anchor="middle" font-size="15">TCF</text>
  <use href="#bcat" x="650" y="363"/>
  <rect x="775" y="388" width="150" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="850" y="406" text-anchor="middle" font-size="15">Wnt target genes</text>
  <path d="M775,386 L775,362 L830,362" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
  <text x="850" y="338" text-anchor="middle" font-size="15" fill="#2b8a3e" font-weight="700">on</text>
  <text x="850" y="436" text-anchor="middle" font-size="14">MYC, cyclin D1: divide</text>
  <path d="M728,266 C715,300 690,320 668,342" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  </g>
</svg>
