<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- axes -->
  <line x1="150" y1="40" x2="150" y2="250" stroke="#444" stroke-width="2"/>
  <line x1="150" y1="250" x2="960" y2="250" stroke="#444" stroke-width="2"/>
  <text x="132" y="150" font-size="15" text-anchor="middle" transform="rotate(-90 132 150)">signal concentration</text>
  <!-- source -->
  <rect x="62" y="270" width="80" height="60" rx="8" fill="#e03131" fill-opacity=".85" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="102" y="296" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">source</text>
  <text x="102" y="315" text-anchor="middle" font-size="14" fill="#fff">cells</text>
  <!-- gradient (exponential decay) -->
  <path d="M150,52 C260,120 330,160 420,190 C520,220 640,236 960,246" fill="none" stroke="#e03131" stroke-width="4"/>
  <!-- thresholds -->
  <line x1="150" y1="135" x2="960" y2="135" stroke="#868e96" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="955" y="127" text-anchor="end" font-size="15">high threshold</text>
  <line x1="150" y1="205" x2="960" y2="205" stroke="#868e96" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="955" y="197" text-anchor="end" font-size="15">low threshold</text>
  <!-- boundaries -->
  <line x1="290" y1="135" x2="290" y2="330" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="490" y1="205" x2="490" y2="330" stroke="#1b2a3a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- row of cells -->
  <g stroke="#1b2a3a" stroke-width="1.5">
    <rect x="150" y="270" width="35" height="60" fill="#3b5bab"/><rect x="185" y="270" width="35" height="60" fill="#3b5bab"/><rect x="220" y="270" width="35" height="60" fill="#3b5bab"/><rect x="255" y="270" width="35" height="60" fill="#3b5bab"/>
    <rect x="290" y="270" width="40" height="60" fill="#fff"/><rect x="330" y="270" width="40" height="60" fill="#fff"/><rect x="370" y="270" width="40" height="60" fill="#fff"/><rect x="410" y="270" width="40" height="60" fill="#fff"/><rect x="450" y="270" width="40" height="60" fill="#fff"/>
    <rect x="490" y="270" width="47" height="60" fill="#e8b923"/><rect x="537" y="270" width="47" height="60" fill="#e8b923"/><rect x="584" y="270" width="47" height="60" fill="#e8b923"/><rect x="631" y="270" width="47" height="60" fill="#e8b923"/><rect x="678" y="270" width="47" height="60" fill="#e8b923"/><rect x="725" y="270" width="47" height="60" fill="#e8b923"/><rect x="772" y="270" width="47" height="60" fill="#e8b923"/><rect x="819" y="270" width="47" height="60" fill="#e8b923"/><rect x="866" y="270" width="47" height="60" fill="#e8b923"/><rect x="913" y="270" width="47" height="60" fill="#e8b923"/>
  </g>
  <text x="220" y="356" text-anchor="middle" font-size="15">fate A</text>
  <text x="220" y="374" text-anchor="middle" font-size="14">(above both)</text>
  <text x="390" y="356" text-anchor="middle" font-size="15">fate B</text>
  <text x="390" y="374" text-anchor="middle" font-size="14">(between)</text>
  <text x="725" y="356" text-anchor="middle" font-size="15">fate C (below both thresholds)</text>
  <path d="M560,60 L860,60" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="560" y="48" font-size="15">distance from the source</text>
  <text x="560" y="86" font-size="15">the signal is made at one end,</text>
  <text x="560" y="105" font-size="15">spreads and is broken down</text>
</svg>
