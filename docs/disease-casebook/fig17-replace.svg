<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1000" height="360" fill="#ffffff"/>
<text x="240" y="24" font-size="18" fill="#1b2a3a" font-weight="700" text-anchor="middle">Enzyme replacement: the cell takes it up</text>
<text x="14" y="58" font-size="15" fill="#1b2a3a" font-weight="700" text-anchor="start">blood</text>
<rect x="10" y="104" width="460" height="196" fill="#fbfaf5"/>
<rect x="10" y="90" width="460" height="14" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
<text x="14" y="294" font-size="15" fill="#8a6a12" font-weight="700" text-anchor="start">macrophage</text>
<circle cx="120" cy="62" r="11" fill="#2e8b57"/><path d="M131 58 l10 -8 l8 6" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="158" y="58" font-size="15" fill="#2e8b57" font-weight="700" text-anchor="start">infused enzyme,</text>
<text x="158" y="76" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">sugar tag (orange)</text>
<path d="M120 90 V104" stroke="#1b2a3a" stroke-width="3"/><path d="M110 82 q10 12 20 0" fill="none" stroke="#1b2a3a" stroke-width="3"/>
<text x="40" y="128" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="start">receptor</text>
<path d="M140 126 Q180 156 214 174" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="256" cy="190" r="40" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="256" y="195" font-size="13" fill="#2e8b57" font-weight="700" text-anchor="middle">endosome</text>
<path d="M296 198 L332 208" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="384" cy="222" r="48" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2.5"/>
<text x="384" y="214" font-size="14" fill="#2e8b57" font-weight="700" text-anchor="middle">lysosome:</text>
<text x="384" y="232" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="middle">stored lipid</text>
<text x="384" y="248" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="middle">digested</text>
<text x="14" y="326" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">Works for soluble lysosomal enzymes (Gaucher, Fabry, Pompe).</text>
<text x="14" y="346" font-size="15" fill="#c92a2a" font-weight="400" text-anchor="start">Does not cross the blood–brain barrier.</text>
<line x1="490" y1="40" x2="490" y2="350" stroke="#ced4da" stroke-width="1.5"/>
<text x="755" y="24" font-size="18" fill="#1b2a3a" font-weight="700" text-anchor="middle">Gene therapy: the cell makes the protein</text>
<polygon points="582.0,66.0 571.0,85.1 549.0,85.1 538.0,66.0 549.0,46.9 571.0,46.9" fill="#f8f9fa" stroke="#e8590c" stroke-width="3"/>
<path d="M550 66 q5 -8 10 0 q5 8 10 0" fill="none" stroke="#6b4fa0" stroke-width="2.5"/>
<text x="594" y="62" font-size="15" fill="#e8590c" font-weight="700" text-anchor="start">AAV virus shell</text>
<text x="594" y="80" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">carrying a working gene</text>
<rect x="510" y="104" width="480" height="196" fill="#fbfaf5"/>
<rect x="510" y="90" width="480" height="14" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
<text x="976" y="294" font-size="15" fill="#8a6a12" font-weight="700" text-anchor="end">motor neuron</text>
<path d="M560 92 Q590 180 676 198" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="524" y="236" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="start">endocytosis,</text>
<text x="524" y="252" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="start">escape</text>
<ellipse cx="770" cy="205" rx="88" ry="74" fill="#efebf7" stroke="#6b4fa0" stroke-width="2.5"/>
<text x="770" y="160" font-size="15" fill="#6b4fa0" font-weight="700" text-anchor="middle">nucleus</text>
<path d="M748 200 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0" fill="none" stroke="#6b4fa0" stroke-width="3"/>
<text x="770" y="246" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="middle">gene stays as</text>
<text x="770" y="262" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="middle">a DNA circle</text>
<path d="M860 200 L900 200" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="944" y="186" font-size="14" fill="#1b2a3a" font-weight="400" text-anchor="middle">mRNA →</text>
<text x="944" y="206" font-size="14" fill="#2b8a3e" font-weight="700" text-anchor="middle">protein</text>
<text x="944" y="222" font-size="14" fill="#2b8a3e" font-weight="700" text-anchor="middle">(SMN)</text>
<text x="514" y="326" font-size="15" fill="#1b2a3a" font-weight="400" text-anchor="start">Onasemnogene (SMA): one infusion. Limits: gene size</text>
<text x="514" y="346" font-size="15" fill="#c92a2a" font-weight="400" text-anchor="start">(about 4.7 kb), immune reaction to the virus, high cost.</text>
</svg>