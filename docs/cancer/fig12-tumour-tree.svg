<circle cx="490" cy="228" r="11" fill="#2754a3"/>
<circle cx="540" cy="228" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="590" cy="228" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="640" cy="228" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<text x="420" y="268" font-size="16">mut. f</text>
<circle cx="490" cy="262" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="540" cy="262" r="11" fill="#2754a3"/>
<circle cx="590" cy="262" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="640" cy="262" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<text x="420" y="302" font-size="16">mut. g</text>
<circle cx="490" cy="296" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="540" cy="296" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="590" cy="296" r="11" fill="#d6457a"/>
<circle cx="640" cy="296" r="11" fill="#d6457a"/>
