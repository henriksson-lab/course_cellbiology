<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
<text x="160" y="30" font-size="19" font-weight="700" text-anchor="middle">1. Sample 4 regions</text>
<path d="M60 200 C50 110 140 60 220 80 C300 95 310 170 290 230 C270 300 180 330 120 300 C80 280 65 250 60 200Z" fill="#f3e3ea" stroke="#a8324a" stroke-width="2.5"/>
<circle cx="120" cy="140" r="26" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="120" y="146" font-size="17" text-anchor="middle" font-weight="700">R1</text>
<circle cx="220" cy="130" r="26" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="220" y="136" font-size="17" text-anchor="middle" font-weight="700">R2</text>
<circle cx="240" cy="240" r="26" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="240" y="246" font-size="17" text-anchor="middle" font-weight="700">R3</text>
<circle cx="130" cy="260" r="26" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="130" y="266" font-size="17" text-anchor="middle" font-weight="700">R4</text>
<text x="175" y="360" font-size="16" text-anchor="middle">sequence the DNA of each piece</text>
<text x="175" y="382" font-size="16" text-anchor="middle">(and of normal blood cells)</text>
<text x="530" y="30" font-size="19" font-weight="700" text-anchor="middle">2. Which mutation is where?</text>
<text x="490" y="66" font-size="16" text-anchor="middle" font-weight="700">R1</text>
<text x="540" y="66" font-size="16" text-anchor="middle" font-weight="700">R2</text>
<text x="590" y="66" font-size="16" text-anchor="middle" font-weight="700">R3</text>
<text x="640" y="66" font-size="16" text-anchor="middle" font-weight="700">R4</text>
<text x="420" y="98" font-size="16">mut. a</text>
<circle cx="490" cy="92" r="11" fill="#1b2a3a"/>
<circle cx="540" cy="92" r="11" fill="#1b2a3a"/>
<circle cx="590" cy="92" r="11" fill="#1b2a3a"/>
<circle cx="640" cy="92" r="11" fill="#1b2a3a"/>
