<circle cx="540" cy="330" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="590" cy="330" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="640" cy="330" r="11" fill="#d6457a"/>
<text x="530" y="382" font-size="16" text-anchor="middle">a–c in every region; d–h only in some</text>
<text x="900" y="30" font-size="19" font-weight="700" text-anchor="middle">3. Draw the family tree</text>
<line x1="900" y1="340" x2="900" y2="220" stroke="#1b2a3a" stroke-width="10"/>
<text x="912" y="290" font-size="16">trunk: a, b, c</text>
<text x="912" y="310" font-size="15" fill="#555">(in the first cancer cell)</text>
<path d="M900 222 L820 140" stroke="#2754a3" stroke-width="7" fill="none"/><text x="846" y="204" font-size="16" fill="#2754a3">d</text>
<path d="M820 140 L780 80" stroke="#2754a3" stroke-width="5"/><path d="M820 140 L860 80" stroke="#2754a3" stroke-width="5"/>
<path d="M900 222 L980 140" stroke="#d6457a" stroke-width="7" fill="none"/><text x="944" y="204" font-size="16" fill="#d6457a">g</text>
<path d="M980 140 L940 80" stroke="#d6457a" stroke-width="5"/><path d="M980 140 L1020 80" stroke="#d6457a" stroke-width="5"/>
<text x="780" y="68" font-size="16" font-weight="700" text-anchor="middle">R1</text>
<text x="766" y="112" font-size="15" text-anchor="middle">e</text>
<text x="860" y="68" font-size="16" font-weight="700" text-anchor="middle">R2</text>
<text x="878" y="112" font-size="15" text-anchor="middle">f</text>
<text x="940" y="68" font-size="16" font-weight="700" text-anchor="middle">R3</text>
<text x="1020" y="68" font-size="16" font-weight="700" text-anchor="middle">R4</text>
<text x="1034" y="112" font-size="15" text-anchor="middle">h</text>
<text x="900" y="382" font-size="16" text-anchor="middle">a biopsy from one region misses</text>
<text x="900" y="404" font-size="16" text-anchor="middle">the branch mutations of the others</text>
</svg>