<circle cx="490" cy="126" r="11" fill="#1b2a3a"/>
<circle cx="540" cy="126" r="11" fill="#1b2a3a"/>
<circle cx="590" cy="126" r="11" fill="#1b2a3a"/>
<circle cx="640" cy="126" r="11" fill="#1b2a3a"/>
<text x="420" y="166" font-size="16">mut. c</text>
<circle cx="490" cy="160" r="11" fill="#1b2a3a"/>
<circle cx="540" cy="160" r="11" fill="#1b2a3a"/>
<circle cx="590" cy="160" r="11" fill="#1b2a3a"/>
<circle cx="640" cy="160" r="11" fill="#1b2a3a"/>
<text x="420" y="200" font-size="16">mut. d</text>
<circle cx="490" cy="194" r="11" fill="#2754a3"/>
<circle cx="540" cy="194" r="11" fill="#2754a3"/>
<circle cx="590" cy="194" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
<circle cx="640" cy="194" r="11" fill="none" stroke="#c9ced6" stroke-width="2"/>
