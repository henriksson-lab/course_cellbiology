<text x="660" y="116" font-size="16">→ tumours often in both eyes, young child</text>
<text x="20" y="210" font-size="20" font-weight="700">Sporadic retinoblastoma</text>
<text x="20" y="234" font-size="16">both hits must happen in the same cell, by chance</text>
<circle cx="50" cy="280" r="21" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
<circle cx="50" cy="280" r="4" fill="#6b4fa0"/>
