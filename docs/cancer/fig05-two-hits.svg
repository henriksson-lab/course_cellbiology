<circle cx="600" cy="280" r="4" fill="#6b4fa0"/>
<text x="660" y="286" font-size="16">→ one tumour, one eye, later</text>
<rect x="30" y="378" width="7" height="12" fill="#e8590c"/><text x="46" y="389" font-size="16">= one RB1 copy lost (a "hit")</text>
<circle cx="330" cy="384" r="12" fill="#fde3d3" stroke="#e8590c" stroke-width="3"/><text x="350" y="389" font-size="16">= no working RB1: a tumour starts</text>
<text x="30" y="440" font-size="17">Knudson (1971): the timing of cases fits <tspan font-weight="700">one</tspan> extra hit in inherited cases and <tspan font-weight="700">two</tspan> in sporadic cases.</text>
<text x="30" y="466" font-size="17">One mutant copy is inherited as a <tspan font-weight="700">dominant</tspan> risk, but works as <tspan font-weight="700">recessive</tspan> in each cell.</text>
</svg>