<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2a3a"/></marker></defs>
  <!-- membrane -->
  <rect x="20" y="70" width="1060" height="26" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <text x="1070" y="62" font-size="15" text-anchor="end" fill="#8a6a12">plasma membrane</text>
  <!-- kinase cascade -->
  <text x="40" y="40" font-size="20" font-weight="700">Kinase signalling</text>
  <circle cx="120" cy="52" r="10" fill="#2b8a3e"/><text x="138" y="57" font-size="15">growth factor</text>
  <rect x="96" y="62" width="48" height="52" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="120" y="93" font-size="14" text-anchor="middle">RTK</text>
  <text x="160" y="128" font-size="15">EGFR mutated (lung),</text>
  <text x="160" y="147" font-size="15">HER2 amplified (breast)</text>
  <g stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"><line x1="120" y1="116" x2="120" y2="168"/><line x1="120" y1="212" x2="120" y2="248"/><line x1="120" y1="292" x2="120" y2="328"/></g>
  <rect x="80" y="170" width="80" height="40" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="120" y="196" font-size="17" text-anchor="middle">RAS</text>
  <text x="172" y="196" font-size="15">mutated in ~1 in 5 cancers (pancreas, colon, lung)</text>
  <rect x="80" y="250" width="80" height="40" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="120" y="276" font-size="17" text-anchor="middle">RAF</text>
  <text x="172" y="276" font-size="15">BRAF V600E in ~half of melanomas</text>
  <rect x="62" y="330" width="116" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="120" y="356" font-size="17" text-anchor="middle">MEK → ERK</text>
  <line x1="180" y1="356" x2="366" y2="386" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  
  <!-- BCR-ABL -->
  <rect x="560" y="130" width="230" height="74" rx="10" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <rect x="578" y="146" width="80" height="26" fill="#d9e4f2"/><rect x="658" y="146" width="112" height="26" fill="#fde3d3"/>
  <text x="618" y="165" font-size="14" text-anchor="middle">BCR</text><text x="714" y="165" font-size="14" text-anchor="middle">ABL kinase</text>
  <text x="675" y="194" font-size="15" text-anchor="middle">fusion: always on (CML)</text>
  <!-- Wnt -->
  <text x="830" y="130" font-size="20" font-weight="700">Fate signalling</text>
  <rect x="830" y="150" width="200" height="54" rx="10" fill="#fff" stroke="#e8590c" stroke-width="3"/>
  <text x="930" y="172" font-size="15" text-anchor="middle">APC lost (destruction</text>
  <text x="930" y="192" font-size="15" text-anchor="middle">complex broken)</text>
  <line x1="930" y1="206" x2="930" y2="246" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="855" y="250" width="150" height="40" rx="8" fill="#fff" stroke="#1b2a3a" stroke-width="2"/><text x="930" y="276" font-size="16" text-anchor="middle">β-catenin stays</text>
  <line x1="930" y1="292" x2="930" y2="328" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="930" y="350" font-size="15" text-anchor="middle">TCF target genes on</text>
  <text x="930" y="370" font-size="15" text-anchor="middle">(~80 % of colon cancers)</text>
  <!-- nucleus -->
  <ellipse cx="560" cy="400" rx="200" ry="50" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="560" y="396" font-size="17" text-anchor="middle" font-weight="700">nucleus: "divide!"</text>
  <text x="560" y="418" font-size="15" text-anchor="middle">growth genes on (MYC, cyclin D), no signal needed</text>
  <line x1="675" y1="206" x2="600" y2="348" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="880" y1="372" x2="752" y2="392" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="440" width="18" height="14" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="46" y="453" font-size="15">orange outline: often hit in cancer</text>
</svg>
