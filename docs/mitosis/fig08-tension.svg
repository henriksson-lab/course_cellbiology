<line x1="207.0" y1="190.0" x2="67.0" y2="190.0" stroke="#555555" stroke-width="2.2" stroke-dasharray="7 5"/>
<line x1="207.0" y1="202.0" x2="67.0" y2="216.4" stroke="#555555" stroke-width="2.2" stroke-dasharray="7 5"/>
