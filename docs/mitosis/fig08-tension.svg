<text x="270" y="330" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >kinetochores sit inside Aurora B's reach:</text>
<text x="270" y="352" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >phosphorylated, microtubules released</text>
<text x="820" y="30" font-size="19" text-anchor="middle" font-weight="bold" fill="#2b8a3e" >Tension: hold on</text>
