<text x="820" y="330" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >kinetochores pulled out of reach:</text>
<text x="820" y="352" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >not phosphorylated, attachment stable</text>
