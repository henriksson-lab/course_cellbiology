<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig04: cohesin holds sister chromatids together from S phase; condensin folds each chromatid into loops in prophase; arm cohesin is removed in prophase/prometaphase, centromere cohesin is protected until anaphase. Cartoon, not to scale. -->
