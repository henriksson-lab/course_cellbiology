<text x="550" y="345" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >short, stiff chromatids,</text>
<text x="550" y="366" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >about 10 000× shorter than their DNA</text>
