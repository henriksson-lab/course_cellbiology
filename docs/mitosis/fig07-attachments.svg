<text x="135.0" y="272" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >pole: bioriented</text>
<text x="135.0" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="#2b8a3e" >correct</text>
