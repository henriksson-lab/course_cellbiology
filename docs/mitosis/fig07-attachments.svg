<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="352" viewBox="0 0 1100 352" font-family="Helvetica, Arial, sans-serif">
<!-- fig07: four ways a chromosome can attach to the spindle: amphitelic (correct), monotelic, syntelic, merotelic. The orange halo marks an unattached kinetochore. -->
