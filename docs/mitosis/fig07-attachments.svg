<circle cx="578" cy="150" r="11" fill="#555555"/>
<circle cx="792" cy="150" r="11" fill="#555555"/>
<text x="685.0" y="250" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >both sisters to one</text>
<text x="685.0" y="272" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >pole: no tension</text>
<text x="685.0" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="#c92a2a" >Aurora B releases it</text>
