<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig09: the spindle assembly checkpoint. An unattached kinetochore catalyses Mad2 activation and assembly of the MCC, which blocks APC/C-Cdc20. When all kinetochores are attached, APC/C-Cdc20 ubiquitylates securin and cyclin B for destruction. -->
<defs><marker id="ak" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker><marker id="ao" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker><marker id="ag" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#2b8a3e"/></marker><marker id="ab" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1c4fa0"/></marker><marker id="ar" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c92a2a"/></marker><marker id="am" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#555555"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#e8590c" >Any kinetochore unattached</text>
<circle cx="95" cy="120" r="34" fill="#e8590c" fill-opacity="0.2" stroke="#e8590c" stroke-width="3"/><circle cx="95" cy="120" r="12" fill="#1b2a3a"/>
<text x="95" y="180" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >unattached</text>
<text x="95" y="200" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >kinetochore</text>
<line x1="140.0" y1="120.0" x2="205.0" y2="120.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)" />
<rect x="210" y="80" width="210" height="80" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
<text x="315.0" y="116.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >Mad2 changes</text>
<text x="315.0" y="136.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >shape (activated)</text>
<line x1="425.0" y1="120.0" x2="490.0" y2="120.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)" />
<rect x="495" y="70" width="230" height="100" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
<text x="610.0" y="106.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >MCC</text>
<text x="610.0" y="126.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >Mad2 + BubR1 + Bub3</text>
<text x="610.0" y="146.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >+ Cdc20 (captured)</text>
<line x1="730" y1="120" x2="808" y2="120" stroke="#c92a2a" stroke-width="3"/><line x1="810" y1="102" x2="810" y2="138" stroke="#c92a2a" stroke-width="5"/>
<rect x="818" y="80" width="200" height="80" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2.5"/>
<text x="918.0" y="116.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >APC/C–Cdc20</text>
<text x="918.0" y="136.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >blocked</text>
<text x="918" y="186" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >→ cell waits in mitosis</text>
<line x1="20.0" y1="222.0" x2="1080.0" y2="222.0" stroke="#d0d4d9" stroke-width="2" />
<text x="20" y="256" font-size="19" text-anchor="start" font-weight="bold" fill="#2b8a3e" >Every kinetochore attached</text>
<rect x="210" y="290" width="210" height="80" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="315.0" y="326.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >no new MCC;</text>
<text x="315.0" y="346.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >old MCC taken apart</text>
<line x1="425.0" y1="330.0" x2="490.0" y2="330.0" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#ag)" />
<rect x="495" y="290" width="230" height="80" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="610.0" y="326.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >APC/C–Cdc20</text>
<text x="610.0" y="346.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >active (E3 ligase)</text>
<line x1="730.0" y1="330.0" x2="812.0" y2="330.0" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#ag)" />
<rect x="818" y="272" width="200" height="116" rx="10" fill="#ffffff" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="918.0" y="306.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >ubiquitin tags on</text>
<text x="918.0" y="326.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >securin → separase</text>
<text x="918.0" y="346.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >free; cyclin B →</text>
<text x="918.0" y="366.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >CDK1 off</text>
<circle cx="95" cy="330" r="12" fill="#1b2a3a"/><line x1="30.0" y1="324.0" x2="83.0" y2="324.0" stroke="#555555" stroke-width="2" />
<line x1="30.0" y1="330.0" x2="83.0" y2="330.0" stroke="#555555" stroke-width="2" />
<line x1="30.0" y1="336.0" x2="83.0" y2="336.0" stroke="#555555" stroke-width="2" />
<text x="95" y="375" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >all attached</text>
<line x1="140.0" y1="330.0" x2="205.0" y2="330.0" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#ag)" />
</svg>
