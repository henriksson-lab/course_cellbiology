<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig11: the anaphase switch. APC/C-Cdc20 tags securin for destruction; free separase cuts the kleisin subunit of cohesin, and the sisters separate. Cyclin B destruction turns CDK1 off for mitotic exit. Cartoon. -->
<defs><marker id="ak" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker><marker id="ao" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker><marker id="ag" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#2b8a3e"/></marker><marker id="ab" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1c4fa0"/></marker><marker id="ar" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c92a2a"/></marker><marker id="am" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#555555"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="60" width="180" height="80" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="110.0" y="96.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >APC/C–Cdc20</text>
<text x="110.0" y="116.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >(+ ubiquitin)</text>
<line x1="205.0" y1="100.0" x2="270.0" y2="100.0" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#ag)" />
<ellipse cx="360" cy="100" rx="78" ry="38" fill="#e7f5ff" stroke="#1c4fa0" stroke-width="2.5"/><text x="345" y="106" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >separase</text>
<ellipse cx="430" cy="68" rx="40" ry="20" fill="#f1f3f5" stroke="#868e96" stroke-width="2.5"/><text x="430" y="73" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >securin</text>
<text x="360" y="170" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >securin blocks separase</text>
<line x1="472.0" y1="60.0" x2="560.0" y2="42.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)" />
<text x="568" y="40" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a" >securin destroyed</text>
<text x="568" y="60" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a" >(proteasome)</text>
<line x1="445.0" y1="100.0" x2="580.0" y2="100.0" stroke="#1c4fa0" stroke-width="3" marker-end="url(#ab)" />
<ellipse cx="660" cy="105" rx="70" ry="34" fill="#e7f5ff" stroke="#1c4fa0" stroke-width="2.5"/><text x="660" y="111" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >separase</text>
<text x="660" y="162" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >free and active</text>
<line x1="735.0" y1="105.0" x2="800.0" y2="105.0" stroke="#1c4fa0" stroke-width="3" marker-end="url(#ab)" />
<text x="767" y="90" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c4fa0" >cuts</text>
<rect x="899.0" y="45.0" width="22" height="120" rx="11.0" fill="#6b4fa0" stroke="#1b2a3a" stroke-width="1.2" transform="rotate(0 910.0 105.0)"/>
<rect x="939.0" y="45.0" width="22" height="120" rx="11.0" fill="#6b4fa0" stroke="#1b2a3a" stroke-width="1.2" transform="rotate(0 950.0 105.0)"/>
<path d="M882,101 A48,16 0 0 1 978,101" fill="none" stroke="#2b8a3e" stroke-width="5"/>
<path d="M978,111 A48,16 0 0 1 936,125" fill="none" stroke="#2b8a3e" stroke-width="5"/>
<path d="M924,125 A48,16 0 0 1 882,111" fill="none" stroke="#2b8a3e" stroke-width="5"/>
<text x="930" y="196" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >kleisin of cohesin cut:</text>
<text x="930" y="216" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >sisters released</text>
<line x1="20.0" y1="250.0" x2="1080.0" y2="250.0" stroke="#d0d4d9" stroke-width="2" />
<rect x="20" y="280" width="180" height="80" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="110.0" y="316.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >APC/C–Cdc20</text>
<text x="110.0" y="336.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >(+ ubiquitin)</text>
<line x1="205.0" y1="320.0" x2="270.0" y2="320.0" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#ag)" />
<rect x="275" y="285" width="170" height="70" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2.5"/>
<text x="360.0" y="316.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >cyclin B</text>
<text x="360.0" y="336.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >destroyed</text>
<line x1="450.0" y1="320.0" x2="515.0" y2="320.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)" />
<rect x="520" y="285" width="190" height="70" rx="10" fill="#f8f9fa" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="615.0" y="316.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >CDK1 activity</text>
<text x="615.0" y="336.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >falls</text>
<line x1="715.0" y1="320.0" x2="780.0" y2="320.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)" />
<rect x="785" y="275" width="295" height="90" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="932.5" y="306.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a" >mitotic exit</text>
<text x="932.5" y="326.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >phosphatases win: envelope</text>
<text x="932.5" y="346.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a" >reforms, cytokinesis</text>
</svg>
