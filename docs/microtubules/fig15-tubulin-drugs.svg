<line x1="732" y1="110" x2="782" y2="96.5" stroke="#555555" stroke-width="1.6"/>
<line x1="732" y1="110" x2="782" y2="110.0" stroke="#555555" stroke-width="1.6"/>
<line x1="732" y1="110" x2="782" y2="123.5" stroke="#555555" stroke-width="1.6"/>
<line x1="732" y1="110" x2="782" y2="137.0" stroke="#555555" stroke-width="1.6"/>
<circle cx="848" cy="110" r="5" fill="#c99a06" stroke="#1b2a3a" stroke-width="1"/>
<line x1="848" y1="110" x2="798" y2="83.0" stroke="#555555" stroke-width="1.6"/>
<line x1="848" y1="110" x2="798" y2="96.5" stroke="#555555" stroke-width="1.6"/>
<line x1="848" y1="110" x2="798" y2="110.0" stroke="#555555" stroke-width="1.6"/>
<line x1="848" y1="110" x2="798" y2="123.5" stroke="#555555" stroke-width="1.6"/>
<line x1="848" y1="110" x2="798" y2="137.0" stroke="#555555" stroke-width="1.6"/>
<rect x="784" y="80.6" width="12" height="12" rx="3" fill="#9b7fc4" stroke="#1b2a3a" stroke-width="1"/>
<rect x="784" y="95.9" width="12" height="12" rx="3" fill="#9b7fc4" stroke="#1b2a3a" stroke-width="1"/>
<rect x="784" y="112.1" width="12" height="12" rx="3" fill="#9b7fc4" stroke="#1b2a3a" stroke-width="1"/>
<rect x="784" y="127.4" width="12" height="12" rx="3" fill="#9b7fc4" stroke="#1b2a3a" stroke-width="1"/>
<text x="790" y="190" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">spindle cannot pull: arrest</text>
<text x="790" y="210" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">in mitosis, then cell death</text>
<text x="1000" y="32" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Long axon</text>
<circle cx="920" cy="110" r="20" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
<path d="M940,104 L1080,104 M940,116 L1080,116" fill="none" stroke="#8a6a12" stroke-width="2.5"/>
<circle cx="962" cy="110" r="4.5" fill="#fbeedd" stroke="#d9822b" stroke-width="1.5"/>
<circle cx="994" cy="110" r="4.5" fill="#fbeedd" stroke="#d9822b" stroke-width="1.5"/>
<circle cx="1026" cy="110" r="4.5" fill="#fbeedd" stroke="#d9822b" stroke-width="1.5"/>
<circle cx="1058" cy="110" r="4.5" fill="#fbeedd" stroke="#d9822b" stroke-width="1.5"/>
<text x="1000" y="160" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">transport along the axon</text>
<text x="1000" y="180" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">is disturbed: numb, tingling</text>
<text x="1000" y="200" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">fingers and toes (neuropathy)</text>
<text x="895" y="262" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Cancer cells divide often: the main effect.</text>
<text x="895" y="282" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Nerves with the longest axons: the main side effect.</text>
</svg>
