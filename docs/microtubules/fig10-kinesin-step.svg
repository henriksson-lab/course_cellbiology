<text x="550" y="316" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Hand over hand: the heads take turns leading. One ATP per 8-nm step, about 100 steps per</text>
<text x="550" y="338" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">second, and about a hundred steps (1 µm) before the motor lets go: it is processive.</text>
