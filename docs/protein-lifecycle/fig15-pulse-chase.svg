<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect x="40" y="60" width="90" height="34" fill="#e8590c" fill-opacity="0.85"/>
<rect x="130" y="60" width="730" height="34" fill="#e9ecef" stroke="#adb5bd"/>
<text x="85" y="83" text-anchor="middle" fill="#ffffff" font-weight="bold">pulse</text>
<text x="495" y="83" text-anchor="middle" font-weight="bold">chase</text>
<text x="40" y="30" font-size="15">10 min with radioactive</text><text x="40" y="48" font-size="15">methionine (<tspan dy="-6" font-size="11">35</tspan><tspan dy="6">S)</tspan></text>
<text x="240" y="30" font-size="15">then a large excess of normal methionine: new molecules</text><text x="240" y="48" font-size="15">are unlabelled, so only the first cohort carries the label</text>
<line x1="130" y1="94" x2="130" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="130" y="138" text-anchor="middle" font-size="15">0 min</text>
<line x1="220" y1="94" x2="220" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="220" y="138" text-anchor="middle" font-size="15">30 min</text>
<line x1="310" y1="94" x2="310" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="310" y="138" text-anchor="middle" font-size="15">60 min</text>
<line x1="490" y1="94" x2="490" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="490" y="138" text-anchor="middle" font-size="15">120 min</text>
<line x1="850" y1="94" x2="850" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="840" y="138" text-anchor="middle" font-size="15">240 min</text>
<text x="40" y="172" font-size="15">At each time: lyse cells → pull out X with an antibody (immunoprecipitation) → SDS gel → film (autoradiography)</text>
<rect x="250" y="196" width="400" height="80" rx="6" fill="#f8f9fa" stroke="#adb5bd"/>
<rect x="270" y="226" width="56" height="16" rx="4" fill="rgb(30,30,30)"/>
<text x="298" y="296" text-anchor="middle" font-size="14">0</text>
<rect x="346" y="226" width="56" height="16" rx="4" fill="rgb(95,95,95)"/>
<text x="374" y="296" text-anchor="middle" font-size="14">30</text>
<rect x="422" y="226" width="56" height="16" rx="4" fill="rgb(142,142,142)"/>
<text x="450" y="296" text-anchor="middle" font-size="14">60</text>
<rect x="498" y="226" width="56" height="16" rx="4" fill="rgb(198,198,198)"/>
<text x="526" y="296" text-anchor="middle" font-size="14">120</text>
<rect x="574" y="226" width="56" height="16" rx="4" fill="rgb(240,240,240)"/>
<text x="602" y="296" text-anchor="middle" font-size="14">240</text>
<text x="238" y="239" text-anchor="end" font-size="15">labelled X</text>
<text x="450" y="318" text-anchor="middle" font-size="15">minutes of chase</text>
<text x="450" y="346" text-anchor="middle" font-size="15">the band halves every t½ (here 60 min)</text>
<text x="680" y="222" font-size="15">No drug needed, so the</text><text x="680" y="240" font-size="15">cell works normally. A</text><text x="680" y="258" font-size="15">shift in band size also</text><text x="680" y="276" font-size="15">shows processing</text>
</svg>