<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <g id="ub"><circle r="11" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/><text y="4" text-anchor="middle" font-size="10" font-weight="bold">Ub</text></g>
  </defs>
  <text x="200" y="26" text-anchor="middle" font-weight="bold">PROTAC: a molecule with two heads</text>
  <!-- E3 (cereblon) -->
  <path d="M60,250 v-80 a20,20 0 0 1 20,-20 h120 a20,20 0 0 1 20,20 v80 z" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/>
  <text x="140" y="214" text-anchor="middle" font-weight="bold" fill="#0b7285">E3 ligase</text>
  <text x="140" y="236" text-anchor="middle" font-size="15" fill="#0b7285">(e.g. cereblon)</text>
  <!-- target -->
  <path d="M230,80 c-10,-40 60,-60 100,-30 c30,24 20,70 -20,74 c-40,4 -70,-6 -80,-44 z" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <!-- PROTAC -->
  <circle cx="140" cy="150" r="13" fill="#e8590c"/>
  <path d="M140,137 C140,110 230,110 240,96" fill="none" stroke="#e8590c" stroke-width="5"/>
  <circle cx="246" cy="90" r="13" fill="#e8590c"/>
  <text x="300" y="86" text-anchor="middle" font-weight="bold" fill="#1971c2">target</text>
  <use href="#ub" x="246" y="130"/><use href="#ub" x="268" y="140"/><use href="#ub" x="292" y="146"/>
  <text x="350" y="160" font-size="15">target is</text>
  <text x="350" y="178" font-size="15">ubiquitinated</text>
  <text x="200" y="282" text-anchor="middle" font-size="15">one head binds the target, the other an E3;</text>
  <text x="200" y="300" text-anchor="middle" font-size="15">the target is destroyed by the proteasome and</text>
  <text x="200" y="318" text-anchor="middle" font-size="15">the PROTAC is free to find the next one</text>
  <!-- divider -->
  <line x1="450" y1="20" x2="450" y2="320" stroke="#ced4da" stroke-width="2"/>
  <text x="680" y="26" text-anchor="middle" font-weight="bold">Molecular glue: lenalidomide</text>
  <path d="M520,250 v-80 a20,20 0 0 1 20,-20 h120 a20,20 0 0 1 20,20 v80 z" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/>
  <text x="600" y="214" text-anchor="middle" font-weight="bold" fill="#0b7285">cereblon</text>
  <text x="600" y="236" text-anchor="middle" font-size="15" fill="#0b7285">(part of an E3)</text>
  <path d="M590,128 c-4,-40 60,-60 100,-34 c30,22 18,62 -24,64 c-30,2 -70,0 -76,-30 z" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/>
  <path d="M594,154 l12,-16 l16,10 l-6,12 z" fill="#e8590c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="660" y="106" text-anchor="middle" font-weight="bold" fill="#2b8a3e">IKZF1/3</text>
  <use href="#ub" x="706" y="150"/><use href="#ub" x="728" y="160"/><use href="#ub" x="752" y="164"/>
  <text x="700" y="198" font-size="15">a protein cereblon</text>
  <text x="700" y="216" font-size="15">never binds alone</text>
  <text x="680" y="282" text-anchor="middle" font-size="15">the drug (orange) sits in cereblon and makes</text>
  <text x="680" y="300" text-anchor="middle" font-size="15">a new sticky surface: a new substrate is tagged</text>
  <text x="680" y="318" text-anchor="middle" font-size="15">(myeloma cells need IKZF1 and IKZF3 to live)</text>
</svg>
