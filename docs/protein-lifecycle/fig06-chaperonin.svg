<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <g id="barrel">
      <!-- two rings of a chaperonin, cut open: left and right walls -->
      <rect x="-70" y="0" width="34" height="68" rx="8" fill="#fff0f6" stroke="#a61e4d" stroke-width="2.5"/>
      <rect x="36" y="0" width="34" height="68" rx="8" fill="#fff0f6" stroke="#a61e4d" stroke-width="2.5"/>
      <rect x="-70" y="72" width="34" height="68" rx="8" fill="#fff0f6" stroke="#a61e4d" stroke-width="2.5"/>
      <rect x="36" y="72" width="34" height="68" rx="8" fill="#fff0f6" stroke="#a61e4d" stroke-width="2.5"/>
      <rect x="-36" y="70" width="72" height="4" fill="#a61e4d"/>
    </g>
  </defs>
  <!-- 1 -->
  <use href="#barrel" x="130" y="80"/>
  <path d="M110,74 c-14,-20 10,-36 22,-22 c10,12 30,-10 34,8 c4,16 -22,26 -34,18 c-10,-6 -16,6 -22,-4 z" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <circle cx="116" cy="70" r="5" fill="#8a6a12"/><circle cx="160" cy="66" r="5" fill="#8a6a12"/>
  <text x="130" y="250" text-anchor="middle">1. A misfolded chain</text>
  <text x="130" y="270" text-anchor="middle">binds the open ring</text>
  <!-- 2 -->
  <use href="#barrel" x="450" y="80"/>
  <rect x="378" y="52" width="144" height="26" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="2.5"/>
  <text x="450" y="45" text-anchor="middle" font-size="15">lid (GroES) + 7 ATP</text>
  <path d="M432,120 c-10,-24 26,-34 34,-12 c8,20 -26,32 -34,12 z" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="450" y="250" text-anchor="middle">2. Closed in a cage: it folds</text>
  <text x="450" y="270" text-anchor="middle">alone, for about 10 s</text>
  <!-- 3 -->
  <use href="#barrel" x="770" y="80"/>
  <circle cx="770" cy="48" r="24" fill="#d0ebff" stroke="#1971c2" stroke-width="2.5"/>
  <circle cx="770" cy="48" r="9" fill="#8a6a12" fill-opacity="0.85"/>
  <text x="770" y="250" text-anchor="middle">3. ATP split, lid off:</text>
  <text x="770" y="270" text-anchor="middle">folded protein leaves</text>
  <line x1="225" y1="150" x2="345" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="545" y1="150" x2="665" y2="150" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
