<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <!-- chain -->
  <path d="M30,80 C120,40 180,120 270,80 S420,40 480,80 S640,120 700,80 S820,50 870,80" fill="none" stroke="#1971c2" stroke-width="7" stroke-linecap="round"/>
  <text x="30" y="125" font-size="15" fill="#1971c2">one protein chain</text>
  <!-- marks -->
  <line x1="120" y1="68" x2="120" y2="36" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="120" cy="24" r="17" fill="#ffec99" stroke="#e67700" stroke-width="2.5"/><text x="120" y="30" text-anchor="middle" font-weight="bold">P</text>
  <text x="120" y="100" text-anchor="middle" font-size="15">Ser</text>
  <line x1="340" y1="68" x2="340" y2="36" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="340" cy="24" r="17" fill="#a5d8ff" stroke="#1864ab" stroke-width="2.5"/><text x="340" y="30" text-anchor="middle" font-weight="bold" font-size="15">Ac</text>
  <text x="340" y="100" text-anchor="middle" font-size="15">Lys</text>
  <line x1="560" y1="96" x2="560" y2="36" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="560" cy="24" r="17" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/><text x="560" y="30" text-anchor="middle" font-weight="bold" font-size="15">Ub</text>
  <circle cx="598" cy="24" r="17" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/><text x="598" y="30" text-anchor="middle" font-weight="bold" font-size="15">Ub</text>
  <circle cx="636" cy="24" r="17" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.5"/><text x="636" y="30" text-anchor="middle" font-weight="bold" font-size="15">Ub</text>
  <text x="560" y="124" text-anchor="middle" font-size="15">Lys</text>
  <line x1="790" y1="64" x2="790" y2="36" stroke="#1b2a3a" stroke-width="2"/>
  <circle cx="790" cy="24" r="17" fill="#eebefa" stroke="#862e9c" stroke-width="2.5"/><text x="790" y="30" text-anchor="middle" font-weight="bold" font-size="15">Me</text>
  <text x="790" y="100" text-anchor="middle" font-size="15">Lys, Arg</text>
  <!-- boxes -->
  <g fill="#ffffff" stroke="#adb5bd" stroke-width="1.5">
    <rect x="18" y="146" width="204" height="184" rx="10"/><rect x="238" y="146" width="204" height="184" rx="10"/>
    <rect x="458" y="146" width="204" height="184" rx="10"/><rect x="678" y="146" width="204" height="184" rx="10"/>
  </g>
  <g font-weight="bold"><text x="120" y="172" text-anchor="middle">Phosphorylation</text><text x="340" y="172" text-anchor="middle">Acetylation</text>
  <text x="560" y="172" text-anchor="middle">Ubiquitination</text><text x="780" y="172" text-anchor="middle">Methylation</text></g>
  <g font-size="15">
    <text x="30" y="200">on: kinase (+ATP)</text><text x="30" y="222">off: phosphatase</text>
    <text x="30" y="252">adds 2 negative</text><text x="30" y="272">charges; changes</text><text x="30" y="292">shape and binding</text><text x="30" y="312">in seconds</text>
    <text x="250" y="200">on: acetyltransferase</text><text x="250" y="222">off: deacetylase</text>
    <text x="250" y="252">removes the + charge</text><text x="250" y="272">of lysine; histones</text><text x="250" y="292">loosen DNA, enzymes</text><text x="250" y="312">change activity</text>
    <text x="470" y="200">on: E1, E2, E3</text><text x="470" y="222">off: deubiquitinase</text>
    <text x="470" y="252">a chain of ubiquitins:</text><text x="470" y="272">"destroy me", or a</text><text x="470" y="292">signal for sorting</text><text x="470" y="312">and signalling</text>
    <text x="690" y="200">on: methyltransferase</text><text x="690" y="222">off: demethylase</text>
    <text x="690" y="252">no charge change;</text><text x="690" y="272">read by binding</text><text x="690" y="292">proteins (histones:</text><text x="690" y="312">gene regulation)</text>
  </g>
</svg>
