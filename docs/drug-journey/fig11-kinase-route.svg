<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="white"/>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6a12"/></marker><marker id="cyto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbfaf5"/></marker><marker id="nuc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b4fa0"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7f8f"/></marker><marker id="golgi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9822b"/></marker><marker id="endo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e8b57"/></marker><marker id="drug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker><marker id="mito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs><text x="25" y="30" font-size="24" fill="#1b2a3a" font-weight="700">Imatinib acts on an existing protein inside the cell</text><rect x="220" y="65" width="750" height="280" rx="25" stroke="#8a6a12" fill="#fbfaf5" stroke-width="2.5"/><text x="245" y="94" font-size="18" fill="#1b2a3a">cytosol</text><circle cx="75" cy="194" r="12" stroke="#e8590c" fill="#e8590c" stroke-width="2.5"/><text x="25" y="247" font-size="19" fill="#e8590c" font-weight="700">free drug</text><path d="M94,194 L292,194" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#drug)"/><rect x="220" y="125" width="18" height="140" rx="0" stroke="#8a6a12" fill="#f6f0de" stroke-width="2.5"/><text x="30" y="100" font-size="18" fill="#1b2a3a">cell entry depends on</text><text x="30" y="127" font-size="18" fill="#1b2a3a">exposure and transport</text><rect x="300" y="145" width="210" height="105" rx="12" stroke="#6b4fa0" fill="#efebf7" stroke-width="2.5"/><text x="316" y="175" font-size="21" fill="#6b4fa0" font-weight="700">BCR–ABL1</text><text x="316" y="207" font-size="18" fill="#1b2a3a">kinase activity</text><text x="316" y="234" font-size="18" fill="#1b2a3a">inhibited</text><circle cx="487" cy="173" r="9" stroke="#e8590c" fill="#e8590c" stroke-width="2.5"/><path d="M510,194 L574,194" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="580" y="145" width="170" height="105" rx="12" stroke="#6b4fa0" fill="#efebf7" stroke-width="2.5"/><text x="596" y="175" font-size="21" fill="#6b4fa0" font-weight="700">Signalling</text><text x="596" y="207" font-size="18" fill="#1b2a3a">growth / survival</text><text x="596" y="234" font-size="18" fill="#1b2a3a">signals decrease</text><path d="M750,175 L805,125" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M750,215 L805,280" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="810" y="78" width="140" height="94" rx="12" stroke="#6b4fa0" fill="#efebf7" stroke-width="2.5"/><text x="826" y="108" font-size="21" fill="#6b4fa0" font-weight="700">Cell cycle</text><text x="826" y="140" font-size="18" fill="#1b2a3a">may arrest</text><rect x="810" y="250" width="140" height="76" rx="12" stroke="#a8324a" fill="#f8e9ec" stroke-width="2.5"/><text x="826" y="280" font-size="21" fill="#a8324a" font-weight="700">Apoptosis</text><text x="826" y="312" font-size="18" fill="#1b2a3a">may increase</text><text x="300" y="294" font-size="18" fill="#1b2a3a">Response depends on target dependence</text><text x="300" y="321" font-size="18" fill="#1b2a3a">and downstream state.</text><text x="25" y="377" font-size="20" fill="#1b2a3a">No ER/Golgi passage is required for the inhibitor to bind its cytosolic target.</text>
</svg>
