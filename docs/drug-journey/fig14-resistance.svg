="19" fill="#1b2a3a" font-weight="700">Sensitive model</text><text x="265" y="126" font-size="19" fill="#1b2a3a">Adequate</text><text x="500" y="126" font-size="19" fill="#1b2a3a">Strong</text><text x="745" y="126" font-size="19" fill="#1b2a3a">Decrease</text><line x1="25" x2="975" y1="160" y2="160" stroke="#d8dde3"/><text x="25" y="183" font-size="19" fill="#e8590c" font-weight="700">Increased efflux</text><text x="265" y="183" font-size="19" fill="#e8590c">Reduced</text><text x="500" y="183" font-size="19" fill="#e8590c">Reduced</text><text x="745" y="183" font-size="19" fill="#e8590c">Persist</text><line x1="25" x2="975" y1="217" y2="217" stroke="#d8dde3"/><text x="25" y="240" font-size="19" fill="#e8590c" font-weight="700">Resistant target</text><text x="265" y="240" font-size="19" fill="#e8590c">Can be unchanged</text><text x="500" y="240" font-size="19" fill="#e8590c">Reduced</text><text x="745" y="240" font-size="19" fill="#e8590c">Persist</text><line x1="25" x2="975" y1="274" y2="274" stroke="#d8dde3"/><text x="25" y="297" font-size="19" fill="#e8590c" font-weight="700">Downstream bypass</text><text x="265" y="297" font-size="19" fill="#e8590c">Can be unchanged</text><text x="500" y="297" font-size="19" fill="#e8590c">Can remain strong</text><text x="745" y="297" font-size="19" fill="#e8590c">Persist</text><text x="25" y="359" font-size="19" fill="#1b2a3a">Measure exposure, target engagement and pathway output; cell number alone cannot locate the defect.</text>
