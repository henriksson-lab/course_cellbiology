<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="white"/>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6a12"/></marker><marker id="cyto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbfaf5"/></marker><marker id="nuc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b4fa0"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7f8f"/></marker><marker id="golgi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9822b"/></marker><marker id="endo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e8b57"/></marker><marker id="drug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker><marker id="mito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs><text x="26" y="30" font-size="24" fill="#1b2a3a" font-weight="700">Same cell, different routes to an effect</text><rect x="25" y="60" width="205" height="115" rx="12" stroke="#e8590c" fill="#fff5ed" stroke-width="2.5"/><text x="41" y="90" font-size="21" fill="#e8590c" font-weight="700">mRNA–LNP</text><text x="41" y="122" font-size="18" fill="#1b2a3a">Protect RNA</text><text x="41" y="149" font-size="18" fill="#1b2a3a">and deliver it</text><rect x="285" y="60" width="205" height="115" rx="12" stroke="#6b4fa0" fill="#efebf7" stroke-width="2.5"/><text x="301" y="90" font-size="21" fill="#6b4fa0" font-weight="700">Cytosol</text><text x="301" y="122" font-size="18" fill="#1b2a3a">Release mRNA</text><text x="301" y="149" font-size="18" fill="#1b2a3a">for translation</text><rect x="545" y="60" width="205" height="115" rx="12" stroke="#2a7f8f" fill="#e6f3f5" stroke-width="2.5"/><text x="561" y="90" font-size="21" fill="#2a7f8f" font-weight="700">New protein</text><text x="561" y="122" font-size="18" fill="#1b2a3a">ER → Golgi for a</text><text x="561" y="149" font-size="18" fill="#1b2a3a">membrane antigen</text><rect x="805" y="60" width="170" height="115" rx="12" stroke="#8a6a12" fill="#f6f0de" stroke-width="2.5"/><text x="821" y="90" font-size="21" fill="#8a6a12" font-weight="700">Response</text><text x="821" y="122" font-size="18" fill="#1b2a3a">Display and</text><text x="821" y="149" font-size="18" fill="#1b2a3a">immune signals</text><rect x="25" y="225" width="205" height="115" rx="12" stroke="#e8590c" fill="#fff5ed" stroke-width="2.5"/><text x="41" y="255" font-size="21" fill="#e8590c" font-weight="700">Imatinib</text><text x="41" y="287" font-size="18" fill="#1b2a3a">Reach the cell</text><text x="41" y="314" font-size="18" fill="#1b2a3a">as a small molecule</text><rect x="285" y="225" width="205" height="115" rx="12" stroke="#8a6a12" fill="#f6f0de" stroke-width="2.5"/><text x="301" y="255" font-size="21" fill="#8a6a12" font-weight="700">Inside the cell</text><text x="301" y="287" font-size="18" fill="#1b2a3a">Free drug must</text><text x="301" y="314" font-size="18" fill="#1b2a3a">reach its target</text><rect x="545" y="225" width="205" height="115" rx="12" stroke="#6b4fa0" fill="#efebf7" stroke-width="2.5"/><text x="561" y="255" font-size="21" fill="#6b4fa0" font-weight="700">Existing kinase</text><text x="561" y="287" font-size="18" fill="#1b2a3a">Bind BCR–ABL1</text><text x="561" y="314" font-size="18" fill="#1b2a3a">and inhibit activity</text><rect x="805" y="225" width="170" height="115" rx="12" stroke="#a8324a" fill="#f8e9ec" stroke-width="2.5"/><text x="821" y="255" font-size="21" fill="#a8324a" font-weight="700">Response</text><text x="821" y="287" font-size="18" fill="#1b2a3a">Less growth</text><text x="821" y="314" font-size="18" fill="#1b2a3a">and survival</text><path d="M230,117 L285,117" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M490,117 L545,117" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M750,117 L805,117" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M230,282 L285,282" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M490,282 L545,282" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><path d="M750,282 L805,282" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ink)"/><text x="26" y="374" font-size="20" fill="#1b2a3a">Delivery → molecular action → cellular response: measure each link separately.</text>
</svg>
