<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="410" fill="#ffffff"/>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
<marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
<marker id="as" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker>
<marker id="bar" markerWidth="4" markerHeight="20" refX="2" refY="10" orient="auto" markerUnits="userSpaceOnUse"><rect x="0" y="0" width="4" height="20" fill="#1b2a3a"/></marker>
</defs>
<rect x="60" y="70" width="780" height="330" rx="40" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
<ellipse cx="610" cy="295" rx="185" ry="92" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
<text x="770.0" y="262.0" font-size="15" text-anchor="middle" fill="#6b4fa0" font-weight="bold" >nucleus</text>
<text x="200.0" y="26.0" font-size="17" text-anchor="middle" fill="#c92a2a" font-weight="bold" >water-soluble signal</text>
<text x="200.0" y="46.0" font-size="15" text-anchor="middle" fill="#8a8f98" font-weight="normal" >(adrenaline, peptides, growth factors)</text>
<circle cx="200.0" cy="58.0" r="7" fill="#c92a2a"/>
<rect x="185" y="62" width="30" height="40" rx="6" fill="#1b2a3a" opacity="0.85"/>
<text x="232.0" y="92.0" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="normal" >receptor in the</text>
<text x="232.0" y="110.0" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="normal" >plasma membrane</text>
<line x1="200.0" y1="108.0" x2="200.0" y2="160.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="200.0" y="182.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >relay inside the cell:</text>
<text x="200.0" y="202.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >second messengers,</text>
<text x="200.0" y="222.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >kinases</text>
<text x="200.0" y="256.0" font-size="15" text-anchor="middle" fill="#e8590c" font-weight="bold" >changes existing</text>
<text x="200.0" y="276.0" font-size="15" text-anchor="middle" fill="#e8590c" font-weight="bold" >proteins: seconds</text>
<path d="M290,300 C350,310 390,312 420,312" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
<text x="300.0" y="335.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >(and later genes)</text>
<text x="610.0" y="26.0" font-size="17" text-anchor="middle" fill="#c92a2a" font-weight="bold" >fat-soluble signal</text>
<text x="610.0" y="46.0" font-size="15" text-anchor="middle" fill="#8a8f98" font-weight="normal" >(cortisol, oestrogen, thyroid hormone)</text>
<circle cx="565.0" cy="58.0" r="7" fill="#c92a2a"/>
<path d="M565,66 C565,90 565,105 565,118" fill="none" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#as)"/>
<text x="580.0" y="98.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >crosses the bilayer</text>
<path d="M545,135 h40 v30 h-40 z" fill="#2a7f8f" opacity="0.85"/><circle cx="565.0" cy="127.0" r="7" fill="#c92a2a"/>
<text x="600.0" y="145.0" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="normal" >receptor in cytosol</text>
<text x="600.0" y="163.0" font-size="15" text-anchor="start" fill="#1b2a3a" font-weight="normal" >or nucleus</text>
<line x1="565.0" y1="170.0" x2="565.0" y2="236.0" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M490,292 C530,274 570,310 610,292 S690,274 730,292" fill="none" stroke="#6b4fa0" stroke-width="5"/>
<path d="M550,252 h30 v30 h-30 z" fill="#2a7f8f" opacity="0.85"/><circle cx="565.0" cy="246.0" r="7" fill="#c92a2a"/>
<text x="610.0" y="326.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >binds DNA, turns genes on or off</text>
<text x="610.0" y="350.0" font-size="16" text-anchor="middle" fill="#e8590c" font-weight="bold" >new proteins: hours</text>

</svg>
