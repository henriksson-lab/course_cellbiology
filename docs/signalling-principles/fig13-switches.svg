<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Helvetica, Arial, sans-serif">
<rect width="880" height="312" fill="#ffffff"/>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
<marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
<marker id="as" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker>
<marker id="bar" markerWidth="4" markerHeight="20" refX="2" refY="10" orient="auto" markerUnits="userSpaceOnUse"><rect x="0" y="0" width="4" height="20" fill="#1b2a3a"/></marker>
</defs>
<text x="210.0" y="24.0" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >phosphorylation</text>
<rect x="20" y="140" width="120" height="70" rx="35" fill="#e9ecef" stroke="#8a8f98" stroke-width="3"/>
<text x="80.0" y="170.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >protein</text>
<text x="80.0" y="192.0" font-size="15" text-anchor="middle" fill="#8a8f98" font-weight="normal" >OFF</text>
<rect x="280" y="140" width="120" height="70" rx="35" fill="#fde3d3" stroke="#e8590c" stroke-width="3"/>
<text x="340.0" y="170.0" font-size="16" text-anchor="middle" fill="#e8590c" font-weight="bold" >protein–P</text>
<text x="340.0" y="192.0" font-size="15" text-anchor="middle" fill="#e8590c" font-weight="normal" >ON</text>
<path d="M120,136 C170,82 250,82 300,136" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a)"/>
<path d="M300,214 C250,268 170,268 120,214" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a)"/>
<text x="210.0" y="52.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >protein kinase</text>
<text x="210.0" y="71.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >adds phosphate</text>
<text x="210.0" y="282.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >protein phosphatase</text>
<text x="210.0" y="301.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >removes phosphate</text>
<text x="210.0" y="128.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >ATP → ADP</text>
<text x="210.0" y="234.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >releases Pᵢ</text>
<text x="670.0" y="24.0" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >GTP-binding protein</text>
<rect x="480" y="140" width="120" height="70" rx="35" fill="#e9ecef" stroke="#8a8f98" stroke-width="3"/>
<text x="540.0" y="170.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >GDP-bound</text>
<text x="540.0" y="192.0" font-size="15" text-anchor="middle" fill="#8a8f98" font-weight="normal" >OFF</text>
<rect x="740" y="140" width="120" height="70" rx="35" fill="#fde3d3" stroke="#e8590c" stroke-width="3"/>
<text x="800.0" y="170.0" font-size="16" text-anchor="middle" fill="#e8590c" font-weight="bold" >GTP-bound</text>
<text x="800.0" y="192.0" font-size="15" text-anchor="middle" fill="#e8590c" font-weight="normal" >ON</text>
<path d="M580,136 C630,82 710,82 760,136" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a)"/>
<path d="M760,214 C710,268 630,268 580,214" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a)"/>
<text x="670.0" y="52.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >GEF</text>
<text x="670.0" y="71.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >swaps GDP for GTP</text>
<text x="670.0" y="282.0" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >GAP</text>
<text x="670.0" y="301.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >speeds GTP hydrolysis</text>
<text x="670.0" y="128.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >GDP out, GTP in</text>
<text x="670.0" y="234.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >GTP → GDP + Pᵢ</text>
<line x1="455" y1="20" x2="455" y2="305" stroke="#e3e6ea" stroke-width="2"/>

</svg>
