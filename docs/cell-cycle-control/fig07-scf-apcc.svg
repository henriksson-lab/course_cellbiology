<svg xmlns="http://www.w3.org/2000/svg" width="920" height="408" viewBox="0 0 920 408" font-family="Helvetica, Arial, sans-serif">
<!-- fig07: when the two ubiquitin ligases of the cell cycle act. SCF (bar, blue) works from late G1 to G2 on phosphorylated targets; APC/C with Cdc20 at anaphase, APC/C with Cdh1 from late M through G1. M phase is drawn wider than its real length. Schematic. -->
<rect x="60" y="40" width="280" height="300" fill="#fbe9e9"/>
<text x="200.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2a3a">G1</text>
<rect x="340" y="40" width="210" height="300" fill="#e8f5ea"/>
<text x="445.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2a3a">S</text>
<rect x="550" y="40" width="110" height="300" fill="#dcf0df"/>
<text x="605.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2a3a">G2</text>
<rect x="660" y="40" width="120" height="300" fill="#c8e9cf"/>
<text x="720.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2a3a">M</text>
<rect x="780" y="40" width="80" height="300" fill="#fbe9e9"/>
<text x="820.0" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2a3a">G1</text>
<rect x="260" y="70" width="400" height="26" rx="6" fill="#1c7ed6"/>
<text x="265" y="89" font-size="16" font-weight="bold" fill="#ffffff">SCF</text>
<text x="265" y="122" font-size="16" fill="#1b2a3a">tags proteins that a kinase has phosphorylated:</text>
<text x="265" y="143" font-size="16" fill="#1b2a3a">the CDK inhibitor p27, then cyclin E itself</text>
<rect x="700" y="180" width="80" height="26" rx="6" fill="#c2255c"/>
<text x="692" y="174" font-size="16" font-weight="bold" text-anchor="end" fill="#c2255c">APC/C–Cdc20</text>
<text x="692" y="222" font-size="16" text-anchor="end" fill="#1b2a3a">at anaphase: securin and cyclin B →</text>
<text x="692" y="243" font-size="16" text-anchor="end" fill="#1b2a3a">sister chromatids separate, the cell leaves M</text>
<rect x="750" y="280" width="110" height="26" rx="6" fill="#a61e4d"/>
<rect x="60" y="280" width="200" height="26" rx="6" fill="#a61e4d"/>
<text x="68" y="299" font-size="16" font-weight="bold" fill="#ffffff">APC/C–Cdh1</text>
<text x="275" y="299" font-size="16" fill="#1b2a3a">keeps mitotic cyclins low in G1; switched off at the G1/S transition</text>
<text x="460" y="372" font-size="17" text-anchor="middle" fill="#1b2a3a">Tagged proteins get a ubiquitin chain and are destroyed by the proteasome.</text>
<text x="460" y="396" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Destruction cannot be undone, so the cycle cannot run backwards.</text>
</svg>