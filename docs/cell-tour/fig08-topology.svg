<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" font-family="Helvetica, Arial, sans-serif">
  <!-- fig08: topology. Cytosol side (cytosol + nucleoplasm) vs lumen side (ER, Golgi, vesicles, lysosomes = topologically outside). Fills show topology; strokes use the shared colour key. -->
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#e8590c"/></marker></defs>
  <rect x="0" y="0" width="760" height="530" fill="#dbe7f3"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Outside the cell</text>
  <rect x="30" y="50" width="700" height="440" rx="40" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
  <path d="M 343 250 C 420 250, 420 160, 480 160 L 545 160" fill="none" stroke="#2a7f8f" stroke-width="24" stroke-linecap="round"/>
  <ellipse cx="220" cy="250" rx="130" ry="100" fill="#dbe7f3" stroke="#6b4fa0" stroke-width="3"/>
  <path d="M 343 250 C 420 250, 420 160, 480 160 L 545 160" fill="none" stroke="#dbe7f3" stroke-width="17" stroke-linecap="round"/>
  <ellipse cx="220" cy="250" rx="115" ry="85" fill="#fbfaf5" stroke="#6b4fa0" stroke-width="3"/>
  <g transform="translate(220.0 157.5) rotate(-90.0)">
    <rect x="-11" y="-7" width="22" height="14" fill="#fbfaf5"/>
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#6b4fa0" stroke-width="3"/><line x1="-10" y1="7" x2="10" y2="7" stroke="#6b4fa0" stroke-width="3"/>
  </g>
  <g transform="translate(97.5 250.0) rotate(180.0)">
    <rect x="-11" y="-7" width="22" height="14" fill="#fbfaf5"/>
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#6b4fa0" stroke-width="3"/><line x1="-10" y1="7" x2="10" y2="7" stroke="#6b4fa0" stroke-width="3"/>
  </g>
  <g transform="translate(220.0 342.5) rotate(90.0)">
    <rect x="-11" y="-7" width="22" height="14" fill="#fbfaf5"/>
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#6b4fa0" stroke-width="3"/><line x1="-10" y1="7" x2="10" y2="7" stroke="#6b4fa0" stroke-width="3"/>
  </g>
  <g transform="translate(126.2 190.5) rotate(-132.5)">
    <rect x="-11" y="-7" width="22" height="14" fill="#fbfaf5"/>
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#6b4fa0" stroke-width="3"/><line x1="-10" y1="7" x2="10" y2="7" stroke="#6b4fa0" stroke-width="3"/>
  </g>
  <g transform="translate(126.2 309.5) rotate(132.5)">
    <rect x="-11" y="-7" width="22" height="14" fill="#fbfaf5"/>
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#6b4fa0" stroke-width="3"/><line x1="-10" y1="7" x2="10" y2="7" stroke="#6b4fa0" stroke-width="3"/>
  </g>
  <text x="220" y="240" font-size="17" fill="#6b4fa0" text-anchor="middle" font-weight="bold">Nucleoplasm</text>
  <text x="220" y="262" font-size="15" fill="#1b2a3a" text-anchor="middle">(cytosol side, joined</text>
  <text x="220" y="280" font-size="15" fill="#1b2a3a" text-anchor="middle">through nuclear pores)</text>
  <circle cx="580" cy="160" r="14" fill="#dbe7f3" stroke="#2a7f8f" stroke-width="3.5"/>
  <line x1="597" y1="168" x2="612" y2="196" stroke="#e8590c" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="588.0" y="215" width="104" height="14" rx="7" fill="#dbe7f3" stroke="#d9822b" stroke-width="3.5"/>
  <rect x="580.0" y="240" width="120" height="14" rx="7" fill="#dbe7f3" stroke="#d9822b" stroke-width="3.5"/>
  <rect x="588.0" y="265" width="104" height="14" rx="7" fill="#dbe7f3" stroke="#d9822b" stroke-width="3.5"/>
  <line x1="662" y1="200" x2="662" y2="92" stroke="#e8590c" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M 642 52 A 20 20 0 1 0 682 52" fill="#dbe7f3" stroke="#8a6a12" stroke-width="3.5"/>
  <rect x="644" y="46" width="36" height="9" fill="#dbe7f3"/>
  <path d="M 500 492 L 500 470 A 22 22 0 1 1 544 470 L 544 492" fill="#dbe7f3" stroke="#8a6a12" stroke-width="3.5"/>
  <rect x="502" y="486" width="40" height="10" fill="#dbe7f3"/>
  <line x1="522" y1="440" x2="522" y2="402" stroke="#e8590c" stroke-width="2.2" marker-end="url(#arr)"/>
  <circle cx="522" cy="370" r="26" fill="#dbe7f3" stroke="#2e8b57" stroke-width="3.5"/>
  <rect x="140" y="390" width="200" height="66" rx="33" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
  <path d="M 172 400 L 308 400 A 23 23 0 0 1 308 446 L 172 446 A 23 23 0 0 1 172 400 Z" fill="#f3d3da" stroke="#a8324a" stroke-width="2.2"/>
  <text x="240" y="428" font-size="15" fill="#a8324a" text-anchor="middle" font-weight="bold">matrix</text>
  <text x="400" y="110" font-size="16" fill="#2a7f8f" text-anchor="middle" font-weight="bold">ER lumen</text>
  <line x1="404" y1="105" x2="450" y2="160" stroke="#1b2a3a" stroke-width="1.2"/>
  <circle cx="450" cy="160" r="2.5" fill="#1b2a3a"/>
  <text x="480" y="120" font-size="16" fill="#2a7f8f" text-anchor="start" font-weight="bold"></text>
  <text x="640" y="302" font-size="16" fill="#d9822b" text-anchor="middle" font-weight="bold">Golgi</text>
  <text x="600" y="330" font-size="16" fill="#2e8b57" text-anchor="start" font-weight="bold">Lysosome</text>
  <line x1="596" y1="325" x2="546" y2="362" stroke="#1b2a3a" stroke-width="1.2"/>
  <circle cx="546" cy="362" r="2.5" fill="#1b2a3a"/>
  <text x="380" y="400" font-size="16" fill="#a8324a" text-anchor="start" font-weight="bold">Mitochondrion</text>
  <text x="80" y="140" font-size="16" fill="#6b4fa0" text-anchor="start" font-weight="bold">Nuclear pore</text>
  <line x1="76" y1="135" x2="100" y2="192" stroke="#1b2a3a" stroke-width="1.2"/>
  <circle cx="100" cy="192" r="2.5" fill="#1b2a3a"/>
  <text x="400" y="320" font-size="18" fill="#1b2a3a" text-anchor="middle" font-style="italic">cytosol</text>
  <text x="380" y="420" font-size="15" fill="#1b2a3a">its own space:</text>
  <text x="380" y="438" font-size="15" fill="#1b2a3a">two membranes</text>
  <text x="785" y="70" font-size="18" font-weight="bold" fill="#1b2a3a">Two sides of every membrane</text>
  <rect x="785" y="105" width="30" height="30" rx="4" fill="#fbfaf5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="827" y="125" font-size="16" fill="#1b2a3a" font-weight="bold">Cytosol side</text>
  <text x="827" y="146" font-size="16" fill="#1b2a3a">cytosol + nucleoplasm</text>
  <rect x="785" y="187" width="30" height="30" rx="4" fill="#dbe7f3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="827" y="207" font-size="16" fill="#1b2a3a" font-weight="bold">Lumen side</text>
  <text x="827" y="228" font-size="16" fill="#1b2a3a">ER, nuclear envelope gap,</text>
  <text x="827" y="249" font-size="16" fill="#1b2a3a">Golgi, vesicles, lysosomes,</text>
  <text x="827" y="270" font-size="16" fill="#1b2a3a">and the outside of the cell</text>
  <rect x="785" y="311" width="30" height="30" rx="4" fill="#f3d3da" stroke="#a8324a" stroke-width="1.5"/>
  <text x="827" y="331" font-size="16" fill="#1b2a3a" font-weight="bold">Mitochondrial matrix</text>
  <text x="827" y="352" font-size="16" fill="#1b2a3a">a third, separate space</text>
  <text x="785" y="413" font-size="16" fill="#1b2a3a"><tspan font-weight="bold" fill="#e8590c">Orange arrows:</tspan></text>
  <text x="785" y="435" font-size="16" fill="#1b2a3a">vesicles bud and fuse, so lumen</text>
  <text x="785" y="456" font-size="16" fill="#1b2a3a">contents never touch the cytosol.</text>
  <text x="785" y="488" font-size="15" fill="#1b2a3a" font-style="italic">Fill colours show topology here;</text>
  <text x="785" y="507" font-size="15" fill="#1b2a3a" font-style="italic">outline colours follow the course key.</text>
</svg>
