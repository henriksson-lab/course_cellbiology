<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="345" viewBox="0 0 1120 345" font-family="Helvetica, Arial, sans-serif">
  <!-- fig16: HeLa timeline, from one patient to a global tool, and the consent debate -->
  <line x1="40" y1="150" x2="1100" y2="150" stroke="#1b2a3a" stroke-width="3"/>
  <circle cx="135" cy="150" r="9" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
  <line x1="135" y1="138" x2="135" y2="110" stroke="#e8590c" stroke-width="1.5"/>
  <text x="135" y="37" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="middle">1951</text>
  <text x="135" y="58" font-size="16" fill="#1b2a3a" text-anchor="middle">Cells from Henrietta Lacks's</text>
  <text x="135" y="79" font-size="16" fill="#1b2a3a" text-anchor="middle">tumour grow in the lab.</text>
  <text x="135" y="100" font-size="16" fill="#1b2a3a" text-anchor="middle">She was not asked.</text>
  <circle cx="310" cy="150" r="9" fill="#1b2a3a" stroke="#ffffff" stroke-width="2"/>
  <line x1="310" y1="162" x2="310" y2="190" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="310" y="212" font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1953–55</text>
  <text x="310" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle">HeLa mass-produced to</text>
  <text x="310" y="257" font-size="16" fill="#1b2a3a" text-anchor="middle">test the polio vaccine</text>
  <circle cx="490" cy="150" r="9" fill="#1b2a3a" stroke="#ffffff" stroke-width="2"/>
  <line x1="490" y1="138" x2="490" y2="110" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="490" y="58" font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1960s–70s</text>
  <text x="490" y="79" font-size="16" fill="#1b2a3a" text-anchor="middle">Many 'other' cell lines</text>
  <text x="490" y="100" font-size="16" fill="#1b2a3a" text-anchor="middle">turn out to be HeLa</text>
  <circle cx="665" cy="150" r="9" fill="#1b2a3a" stroke="#ffffff" stroke-width="2"/>
  <line x1="665" y1="162" x2="665" y2="190" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="665" y="212" font-size="19" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1984</text>
  <text x="665" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle">HPV-18 found in HeLa:</text>
  <text x="665" y="257" font-size="16" fill="#1b2a3a" text-anchor="middle">a virus causes cervical</text>
  <text x="665" y="278" font-size="16" fill="#1b2a3a" text-anchor="middle">cancer → HPV vaccine</text>
  <circle cx="840" cy="150" r="9" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
  <line x1="840" y1="138" x2="840" y2="110" stroke="#e8590c" stroke-width="1.5"/>
  <text x="840" y="37" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="middle">2013</text>
  <text x="840" y="58" font-size="16" fill="#1b2a3a" text-anchor="middle">HeLa genome published</text>
  <text x="840" y="79" font-size="16" fill="#1b2a3a" text-anchor="middle">without family consent;</text>
  <text x="840" y="100" font-size="16" fill="#1b2a3a" text-anchor="middle">NIH agreement follows</text>
  <circle cx="1005" cy="150" r="9" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
  <line x1="1005" y1="162" x2="1005" y2="190" stroke="#e8590c" stroke-width="1.5"/>
  <text x="1005" y="212" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="middle">2021–23</text>
  <text x="1005" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle">WHO honours Henrietta</text>
  <text x="1005" y="257" font-size="16" fill="#1b2a3a" text-anchor="middle">Lacks; family settles</text>
  <text x="1005" y="278" font-size="16" fill="#1b2a3a" text-anchor="middle">with a company</text>
  <circle cx="60" cy="323" r="7" fill="#e8590c"/><text x="74" y="328" font-size="15" fill="#1b2a3a">consent and ownership</text>
  <circle cx="270" cy="323" r="7" fill="#1b2a3a"/><text x="284" y="328" font-size="15" fill="#1b2a3a">science and medicine</text>
</svg>
