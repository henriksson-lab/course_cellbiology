<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Helvetica, Arial, sans-serif">
  <!-- fig08: nuclear import. Importin alpha reads the NLS, importin beta carries the complex through the FG meshwork of the pore, Ran-GTP in the nucleus releases the cargo, and importin beta returns bound to Ran-GTP. Cartoon shapes, not to scale. -->
  <defs><marker id="ak" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
  <rect x="0" y="0" width="520" height="440" fill="#fbfaf5"/>
  <rect x="554" y="0" width="546" height="440" fill="#efebf7"/>
  <rect x="520" y="0" width="34" height="440" fill="#dbe7f3"/>
  <line x1="520" y1="40" x2="520" y2="160" stroke="#6b4fa0" stroke-width="4"/>
  <line x1="520" y1="330" x2="520" y2="420" stroke="#6b4fa0" stroke-width="4"/>
  <line x1="554" y1="40" x2="554" y2="160" stroke="#6b4fa0" stroke-width="4"/>
  <line x1="554" y1="330" x2="554" y2="420" stroke="#6b4fa0" stroke-width="4"/>
  <path d="M 520 160 Q 537 146 554 160" fill="none" stroke="#6b4fa0" stroke-width="4"/>
  <path d="M 520 330 Q 537 344 554 330" fill="none" stroke="#6b4fa0" stroke-width="4"/>
  <path d="M 522 174 q 8 -7 16 0 q 8 7 16 0" fill="none" stroke="#b197fc" stroke-width="2"/>
  <path d="M 522 210 q 8 -7 16 0 q 8 7 16 0" fill="none" stroke="#b197fc" stroke-width="2"/>
  <path d="M 522 245 q 8 -7 16 0 q 8 7 16 0" fill="none" stroke="#b197fc" stroke-width="2"/>
  <path d="M 522 280 q 8 -7 16 0 q 8 7 16 0" fill="none" stroke="#b197fc" stroke-width="2"/>
  <path d="M 522 316 q 8 -7 16 0 q 8 7 16 0" fill="none" stroke="#b197fc" stroke-width="2"/>
  <text x="20" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">CYTOSOL</text>
  <text x="1080" y="30" font-size="18" fill="#6b4fa0" text-anchor="end" font-weight="bold">NUCLEUS</text>
  <text x="566" y="150" font-size="15" fill="#6b4fa0" text-anchor="start" font-weight="bold">nuclear pore</text>
  <text x="566" y="350" font-size="15" fill="#7950f2" text-anchor="start" font-weight="bold">FG repeats</text>
  <rect x="116" y="260" width="68" height="40" rx="14" fill="#a5d8ff" stroke="#1c4fa0" stroke-width="2"/>
  <text x="144" y="286" font-size="14" fill="#1c4fa0" text-anchor="middle" font-weight="bold">cargo</text>
  <rect x="164" y="253" width="22" height="11" rx="3" fill="#6b4fa0"/>
  <ellipse cx="175" cy="236" rx="15" ry="19" fill="#dee2e6" stroke="#868e96" stroke-width="2"/>
  <text x="175" y="242" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">α</text>
  <path d="M 145 244 A 31 31 0 1 1 205 244" fill="none" stroke="#495057" stroke-width="12" stroke-linecap="round"/>
  <text x="129" y="214" font-size="18" fill="#495057" text-anchor="middle" font-weight="bold">β</text>
  <text x="198" y="268" font-size="14" fill="#6b4fa0" text-anchor="start" font-weight="bold">NLS</text>
  <circle cx="40" cy="360" r="14" fill="#1b2a3a"/>
  <text x="40" y="366" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <text x="64" y="356" font-size="15" fill="#1b2a3a" text-anchor="start">importin α binds the NLS,</text>
  <text x="64" y="376" font-size="15" fill="#1b2a3a" text-anchor="start">importin β binds α</text>
  <path d="M 238 270 L 440 270" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <rect x="478" y="250" width="68" height="40" rx="14" fill="#a5d8ff" stroke="#1c4fa0" stroke-width="2"/>
  <text x="506" y="276" font-size="14" fill="#1c4fa0" text-anchor="middle" font-weight="bold">cargo</text>
  <rect x="526" y="243" width="22" height="11" rx="3" fill="#6b4fa0"/>
  <ellipse cx="537" cy="226" rx="15" ry="19" fill="#dee2e6" stroke="#868e96" stroke-width="2"/>
  <text x="537" y="232" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">α</text>
  <path d="M 507 234 A 31 31 0 1 1 567 234" fill="none" stroke="#495057" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="360" r="14" fill="#1b2a3a"/>
  <text x="300" y="366" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <text x="324" y="356" font-size="15" fill="#1b2a3a" text-anchor="start">β slips through the</text>
  <text x="324" y="376" font-size="15" fill="#1b2a3a" text-anchor="start">FG meshwork (~10 ms)</text>
  <path d="M 590 270 L 660 270" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <path d="M 735 204 A 31 31 0 1 1 795 204" fill="none" stroke="#495057" stroke-width="12" stroke-linecap="round"/>
  <text x="719" y="174" font-size="18" fill="#495057" text-anchor="middle" font-weight="bold">β</text>
  <circle cx="765" cy="194" r="20" fill="#e8590c"/>
  <text x="765" y="193" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Ran</text>
  <text x="765" y="206" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">GTP</text>
  <text x="810" y="190" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Ran-GTP</text>
  <path d="M 760 262 L 840 330" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <rect x="866" y="350" width="68" height="40" rx="14" fill="#a5d8ff" stroke="#1c4fa0" stroke-width="2"/>
  <text x="894" y="376" font-size="14" fill="#1c4fa0" text-anchor="middle" font-weight="bold">cargo</text>
  <rect x="914" y="343" width="22" height="11" rx="3" fill="#6b4fa0"/>
  <ellipse cx="925" cy="326" rx="15" ry="19" fill="#dee2e6" stroke="#868e96" stroke-width="2"/>
  <text x="925" y="332" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">α</text>
  <circle cx="600" cy="400" r="14" fill="#1b2a3a"/>
  <text x="600" y="406" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <text x="624" y="396" font-size="15" fill="#1b2a3a" text-anchor="start">Ran-GTP binds β:</text>
  <text x="624" y="416" font-size="15" fill="#1b2a3a" text-anchor="start">cargo and α let go</text>
  <text x="1060" y="360" font-size="15" fill="#1c4fa0" text-anchor="end" font-weight="bold">cargo stays</text>
  <text x="1060" y="380" font-size="15" fill="#1c4fa0" text-anchor="end" font-weight="bold">inside</text>
  <path d="M 730 150 C 690 80, 460 70, 300 100" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <circle cx="230" cy="100" r="14" fill="#1b2a3a"/>
  <text x="230" y="106" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
  <text x="254" y="140" font-size="15" fill="#1b2a3a" text-anchor="start">β returns bound to Ran-GTP; in the</text>
  <text x="254" y="160" font-size="15" fill="#1b2a3a" text-anchor="start">cytosol GTP is split and β is free again</text>
  <text x="840" y="92" font-size="14" fill="#1b2a3a" text-anchor="start" font-style="italic">(α goes back out</text>
  <text x="840" y="110" font-size="14" fill="#1b2a3a" text-anchor="start" font-style="italic">with its own exportin)</text>
</svg>
