  <text x="332" y="346" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">GDP</text>
  <rect x="80" y="236" width="60" height="36" rx="13" fill="#a5d8ff" stroke="#1c4fa0" stroke-width="2"/>
