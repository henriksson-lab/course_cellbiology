<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Helvetica, Arial, sans-serif">
  <!-- fig09: the Ran gradient gives direction. RanGEF on chromatin makes Ran-GTP in the nucleus, RanGAP in the cytosol turns it into Ran-GDP. Exportin binds NES cargo only together with Ran-GTP and lets go when the GTP is split in the cytosol. Cartoon. -->
  <defs><marker id="ak" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="ao" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
  <rect x="0" y="0" width="520" height="430" fill="#fbfaf5"/>
