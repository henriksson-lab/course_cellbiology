  <text x="20" y="132" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">RanGAP (on the cytosolic face of the pore)</text>
  <text x="20" y="152" font-size="15" fill="#1b2a3a" text-anchor="start">makes Ran split its GTP: mostly Ran-GDP here</text>
