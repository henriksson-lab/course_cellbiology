  <text x="825" y="380" font-size="16" fill="#1b2a3a" text-anchor="middle">export blocked: tumour suppressors build up</text>
  <text x="825" y="402" font-size="16" fill="#1b2a3a" text-anchor="middle">in the nucleus and trigger cell death</text>
