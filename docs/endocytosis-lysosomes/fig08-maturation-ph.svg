<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 1000 380" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1098ad"/></marker>
  </defs>
  <rect y="45" width="1000" height="380" fill="#fbfaf5"/>
  <!-- four compartments -->
  <g>
    <circle cx="100" cy="110" r="34" fill="#fbfaf5" stroke="#8a6a12" stroke-width="4"/>
    <text x="100" y="172" text-anchor="middle" font-weight="bold">vesicle</text>
    <text x="100" y="192" text-anchor="middle">from the surface</text>

    <ellipse cx="335" cy="110" rx="62" ry="46" fill="#eef7f1" stroke="#2e8b57" stroke-width="3.5"/>
    <path d="M395,95 L440,75" stroke="#2e8b57" stroke-width="7" stroke-linecap="round"/>
    <text x="335" y="182" text-anchor="middle" font-weight="bold">early endosome</text>
    <text x="335" y="202" text-anchor="middle">2–5 min · Rab5</text>

    <circle cx="590" cy="110" r="52" fill="#d3ebdd" stroke="#2e8b57" stroke-width="3.5"/>
    <g fill="#fbfaf5" stroke="#2e8b57" stroke-width="2"><circle cx="572" cy="98" r="11"/><circle cx="606" cy="92" r="11"/><circle cx="590" cy="125" r="11"/><circle cx="616" cy="122" r="9"/><circle cx="565" cy="126" r="9"/></g>
    <text x="590" y="182" text-anchor="middle" font-weight="bold">late endosome</text>
    <text x="590" y="202" text-anchor="middle">10–20 min · Rab7</text>

    <circle cx="850" cy="110" r="52" fill="#b9dfc8" stroke="#2e8b57" stroke-width="4.5"/>
    <text x="850" y="182" text-anchor="middle" font-weight="bold">lysosome</text>
    <text x="850" y="202" text-anchor="middle">30–60 min</text>
    <path d="M140,110 L265,110" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M402,128 L530,118" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M647,110 L790,110" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  </g>
  <!-- pH scale -->
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e7f5f8"/><stop offset="1" stop-color="#1098ad"/></linearGradient></defs>
  <rect x="60" y="232" width="850" height="26" rx="6" fill="url(#g)"/>
  <g font-weight="bold" text-anchor="middle"><text x="100" y="282">pH 7.4</text><text x="335" y="282">pH 6.0–6.5</text><text x="590" y="282">pH 5.0–5.5</text><text x="850" y="282">pH 4.5–5</text></g>
  <text x="935" y="250" text-anchor="start" fill="#1098ad" font-weight="bold">H</text>
  <text x="954" y="242" font-size="12" fill="#1098ad" font-weight="bold">+</text>
  <!-- V-ATPase cartoon -->
  <g transform="translate(0,22)">
  <rect x="300" y="318" width="420" height="16" fill="#cfe9da" stroke="#2e8b57" stroke-width="2"/>
  <text x="290" y="300" text-anchor="end">lumen</text>
  <text x="290" y="362" text-anchor="end">cytosol</text>
  <rect x="490" y="306" width="40" height="40" rx="8" fill="#5c7a8a"/>
  <ellipse cx="510" cy="364" rx="28" ry="16" fill="#5c7a8a"/>
  <path d="M470,388 C480,376 492,372 500,370" fill="none" stroke="#1b2a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="430" y="393" text-anchor="middle" font-size="15">ATP → ADP</text>
  <path d="M552,372 C566,360 566,320 552,296" fill="none" stroke="#1098ad" stroke-width="2.5" marker-end="url(#arh)"/>
  <text x="575" y="350" fill="#1098ad" font-weight="bold">H</text><text x="588" y="343" font-size="12" fill="#1098ad" font-weight="bold">+</text>
  <text x="740" y="314" font-weight="bold">V-ATPase</text>
  <text x="740" y="334">pumps H<tspan font-size="12" dy="-6">+</tspan><tspan dy="6"> in, using ATP;</tspan></text>
  <text x="740" y="354">in every endosome</text>
  <text x="740" y="374">and lysosome</text>
  </g>
</svg>
