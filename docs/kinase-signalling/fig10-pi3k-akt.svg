<text x="650" y="346" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">glucose uptake (insulin)</text>
<text x="450" y="396" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Survival and growth, while the MAP kinase branch drives division.</text>
