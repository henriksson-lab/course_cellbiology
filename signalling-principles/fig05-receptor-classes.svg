<text x="190.0" y="26.0" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >ion-channel-coupled</text>
<rect x="20" y="110" width="340" height="60" fill="#f6f0de" stroke="none"/>
<line x1="20" y1="110" x2="360" y2="110" stroke="#8a6a12" stroke-width="3"/><line x1="20" y1="170" x2="360" y2="170" stroke="#8a6a12" stroke-width="3"/>
<text x="30.0" y="98.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >outside</text>
<text x="30.0" y="194.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >cytosol</text>
<text x="190.0" y="292.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >signal opens a channel:</text>
<text x="190.0" y="312.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >ions flow in milliseconds</text>
<line x1="380" y1="10" x2="380" y2="315" stroke="#e3e6ea" stroke-width="2"/>
<text x="570.0" y="26.0" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >G-protein-coupled (GPCR)</text>
<rect x="400" y="110" width="340" height="60" fill="#f6f0de" stroke="none"/>
<line x1="400" y1="110" x2="740" y2="110" stroke="#8a6a12" stroke-width="3"/><line x1="400" y1="170" x2="740" y2="170" stroke="#8a6a12" stroke-width="3"/>
<text x="410.0" y="98.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >outside</text>
<text x="410.0" y="194.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >cytosol</text>
<text x="570.0" y="292.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >receptor activates a G protein,</text>
<text x="570.0" y="312.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >which switches on enzymes or channels</text>
<line x1="760" y1="10" x2="760" y2="315" stroke="#e3e6ea" stroke-width="2"/>
<text x="950.0" y="26.0" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="bold" >enzyme-coupled</text>
<rect x="780" y="110" width="340" height="60" fill="#f6f0de" stroke="none"/>
<line x1="780" y1="110" x2="1120" y2="110" stroke="#8a6a12" stroke-width="3"/><line x1="780" y1="170" x2="1120" y2="170" stroke="#8a6a12" stroke-width="3"/>
<text x="790.0" y="98.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >outside</text>
<text x="790.0" y="194.0" font-size="14" text-anchor="start" fill="#8a8f98" font-weight="normal" >cytosol</text>
<text x="950.0" y="292.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >receptor is (or recruits) an enzyme,</text>
<text x="950.0" y="312.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >often a kinase: P on tyrosines</text>
