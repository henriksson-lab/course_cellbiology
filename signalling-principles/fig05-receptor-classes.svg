<circle cx="978" cy="208" r="11" fill="#e8590c"/><text x="978.0" y="213.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold" >P</text>
<circle cx="925.0" cy="58.0" r="9" fill="#c92a2a"/>
<text x="996.0" y="208.0" font-size="15" text-anchor="start" fill="#2a7f8f" font-weight="bold" >kinase</text>
<text x="925.0" y="258.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >example: insulin, EGF receptors</text>

