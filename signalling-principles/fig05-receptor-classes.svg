<text x="204.0" y="222.0" font-size="15" text-anchor="start" fill="#1c4fa0" font-weight="bold" >Na⁺ in</text>
<text x="190.0" y="258.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >example: acetylcholine receptor</text>
