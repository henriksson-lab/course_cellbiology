<text x="550.0" y="220.0" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="normal" >7 helices</text>
<text x="570.0" y="258.0" font-size="14" text-anchor="middle" fill="#8a8f98" font-weight="normal" >example: β-adrenergic receptor</text>
<rect x="878" y="45" width="34" height="55" rx="12" fill="#d8dee6" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="890" y="100" width="10" height="80" fill="#1b2a3a"/>
