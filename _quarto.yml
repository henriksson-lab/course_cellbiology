project:
  type: website
  output-dir: docs
  # Built interactive demos (make demos) and their image assets, copied into docs/.
  resources:
    - demos/dist/
    - demos/assets/
  render:
    # Order is set by the sidebar below, not by these globs. One level deep per
    # unit; plan/ holds internal working docs and is excluded from the site.
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    # Unfinished unit (not in the sidebar yet).
    - "!mitochondria/"
    - "!unused-figures/"
    - "!tools/"
    - "!edit-notes/"
    - "!node_modules/"
    - "!demos/"
    - "!canvas-quiz/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!contentplan.md"
    - "!designprinciples.md"
    - "!authors.md"

