<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" font-family="Helvetica, Arial, sans-serif">
  <!-- fig14: a correlation has three possible causal explanations -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <text x="220.0" y="26" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Observation: they go together</text>
  <line x1="80" y1="280" x2="360" y2="280" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="80" y1="280" x2="80" y2="40" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="220.0" y="306" font-size="15" fill="#1b2a3a" text-anchor="middle">amount of protein X per cell</text>
  <text x="64" y="160.0" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 64 160.0)">division rate</text>
  <circle cx="178.6" cy="172.2" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="119.4" cy="206.3" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="228.4" cy="158.6" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="221.7" cy="153.8" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="111.2" cy="241.3" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="123.7" cy="223.1" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="202.2" cy="167.6" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="154.9" cy="213.4" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="250.0" cy="115.6" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="195.7" cy="184.8" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="332.0" cy="52.0" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="170.5" cy="183.0" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="136.3" cy="205.2" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="294.4" cy="97.9" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="144.9" cy="235.4" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="190.0" cy="194.0" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="231.2" cy="146.1" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="150.8" cy="204.8" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="262.4" cy="145.9" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="240.1" cy="138.9" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="209.0" cy="178.1" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <circle cx="266.8" cy="95.4" r="5" fill="#3b5bab" fill-opacity="0.75"/>
  <text x="700" y="26" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Three stories fit the same data</text>
  <text x="430" y="78" font-size="15" fill="#1b2a3a">1.</text>
  <rect x="455.0" y="56" width="110" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="510" y="77" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <rect x="670.0" y="56" width="120" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="730" y="77" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">division</text>
  <line x1="567" y1="72" x2="667" y2="72" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="800" y="77" font-size="14" fill="#1b2a3a">X drives division</text>
  <text x="430" y="148" font-size="15" fill="#1b2a3a">2.</text>
  <rect x="455.0" y="126" width="110" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="510" y="147" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <rect x="670.0" y="126" width="120" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="730" y="147" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">division</text>
  <line x1="668" y1="142" x2="568" y2="142" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="800" y="147" font-size="14" fill="#1b2a3a">dividing cells make</text>
  <text x="800" y="164" font-size="14" fill="#1b2a3a">more X (reverse)</text>
  <text x="430" y="238" font-size="15" fill="#1b2a3a">3.</text>
  <rect x="565.0" y="196" width="110" height="32" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <text x="620" y="217" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Z</text>
  <rect x="455.0" y="246" width="110" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="510" y="267" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">X</text>
  <rect x="670.0" y="246" width="120" height="32" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="730" y="267" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">division</text>
  <line x1="590" y1="225" x2="545" y2="245" stroke="#e8590c" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="650" y1="225" x2="695" y2="245" stroke="#e8590c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="800" y="230" font-size="14" fill="#e8590c">a third factor Z (for</text>
  <text x="800" y="247" font-size="14" fill="#e8590c">example a growth signal)</text>
  <text x="800" y="264" font-size="14" fill="#e8590c">drives both: X does nothing</text>
  <text x="530.0" y="345" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">Only a perturbation (change X, keep everything else the same) tells them apart.</text>
</svg>
