<text x="687.5" y="54.0" font-size="15" text-anchor="middle" fill="#1b2a3a">cuts old (ADP) filaments</text>
<line x1="550.0" y1="20.0" x2="550.0" y2="400.0" stroke="#dee2e6" stroke-width="1" />
<text x="962.5" y="30.0" font-size="19" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Cross-linkers</text>
<text x="962.5" y="54.0" font-size="15" text-anchor="middle" fill="#1b2a3a">bundles and networks</text>
