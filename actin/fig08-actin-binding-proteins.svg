<text x="137.5" y="30.0" font-size="19" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Profilin</text>
<text x="137.5" y="54.0" font-size="15" text-anchor="middle" fill="#1b2a3a">delivers ATP-actin to + ends</text>
<text x="412.5" y="30.0" font-size="19" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Capping protein</text>
<text x="412.5" y="54.0" font-size="15" text-anchor="middle" fill="#1b2a3a">stops a + end</text>
<line x1="275.0" y1="20.0" x2="275.0" y2="400.0" stroke="#dee2e6" stroke-width="1" />
