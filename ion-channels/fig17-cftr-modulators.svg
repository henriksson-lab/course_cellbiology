<svg xmlns="http://www.w3.org/2000/svg" width="910" height="465" viewBox="0 0 910 465" font-family="Helvetica, Arial, sans-serif">
  <!-- fig17: matching the CFTR modulator to the molecular defect -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="a2b8a3e" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2b8a3e"/></marker><marker id="ae8590c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
<text x="20" y="32" font-size="19" text-anchor="start" font-weight="bold" fill="#1b2a3a">F508del (ΔF508): folding defect</text>
<rect x="20" y="62" width="200" height="120" rx="30" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="120" y="88" font-size="16" text-anchor="middle" font-weight="bold" fill="#2a7f8f">ER</text>
<path d="M70,140 q12,-30 24,0 t24,0 t24,0 t24,0" fill="none" stroke="#1b2a3a" stroke-width="5" stroke-linecap="round"/>
<text x="120" y="172" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">misfolded CFTR</text>
<path d="M225,95 L420,70" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a1b2a3a)"/>
<text x="320" y="66" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a" font-style="italic">no drug</text>
<text x="430" y="76" font-size="16" text-anchor="start" font-weight="bold" fill="#c92a2a">degraded: almost no CFTR</text>
<text x="430" y="96" font-size="16" text-anchor="start" font-weight="bold" fill="#c92a2a">reaches the surface</text>
<path d="M225,150 L560,150" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a1b2a3a)"/>
<rect x="306" y="134" width="128" height="32" rx="16" fill="#e8590c"/><text x="370" y="156" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">corrector</text>
<rect x="580" y="120" width="320" height="60" fill="#f6f0de"/><line x1="580" y1="120" x2="900" y2="120" stroke="#8a6a12" stroke-width="4"/><line x1="580" y1="180" x2="900" y2="180" stroke="#8a6a12" stroke-width="4"/>
<rect x="706" y="115" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="748" y="115" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<line x1="740" y1="196" x2="740" y2="92" stroke="#2b8a3e" stroke-width="3.5" marker-end="url(#a2b8a3e)"/>
<text x="740" y="218" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">folds better and</text>
<text x="740" y="236" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">reaches the membrane</text>
<text x="232" y="200" font-size="15" text-anchor="start" font-weight="bold" fill="#e8590c">elexacaftor, tezacaftor</text>
<line x1="20" y1="260" x2="900" y2="260" stroke="#ced4da" stroke-width="2"/>
<text x="20" y="282" font-size="19" text-anchor="start" font-weight="bold" fill="#1b2a3a">G551D: gating defect</text>
<rect x="20" y="320" width="310" height="60" fill="#f6f0de"/><line x1="20" y1="320" x2="330" y2="320" stroke="#8a6a12" stroke-width="4"/><line x1="20" y1="380" x2="330" y2="380" stroke="#8a6a12" stroke-width="4"/>
<rect x="141" y="315" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="183" y="315" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="163" y="343" width="24" height="10" rx="3" fill="#c92a2a"/>
<text x="20" y="420" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">at the surface, but</text>
<text x="20" y="439" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">the gate stays shut</text>
<path d="M345,350 L560,350" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#a1b2a3a)"/>
<rect x="388" y="334" width="128" height="32" rx="16" fill="#e8590c"/><text x="452" y="356" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">potentiator</text>
<text x="452" y="394" font-size="15" text-anchor="middle" font-weight="bold" fill="#e8590c">ivacaftor</text>
<rect x="580" y="320" width="320" height="60" fill="#f6f0de"/><line x1="580" y1="320" x2="900" y2="320" stroke="#8a6a12" stroke-width="4"/><line x1="580" y1="380" x2="900" y2="380" stroke="#8a6a12" stroke-width="4"/>
<rect x="706" y="315" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="748" y="315" width="26" height="70" rx="8" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<line x1="740" y1="410" x2="740" y2="292" stroke="#2b8a3e" stroke-width="3.5" marker-end="url(#a2b8a3e)"/>
<text x="740" y="432" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">gate opens more often:</text>
<text x="690.3" y="451" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Cl<tspan font-size="10.2" dy="-6.3">−</tspan><tspan dy="6.3"> flows again</tspan></text>
</svg>
