<text x="470" y="305" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Carbonyl oxygens sit</text>
<text x="470" y="326" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">where the water was:</text>
<text x="470" y="347" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">the ion feels at home.</text>
<text x="722.9" y="34" font-size="19" text-anchor="start" font-weight="bold" fill="#1b2a3a">Na<tspan font-size="12.9" dy="-8.0">+</tspan><tspan dy="8.0"> in the filter</tspan></text>
