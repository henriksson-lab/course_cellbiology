<circle cx="790" cy="160" r="15" fill="#1c7ed6" stroke="#1b2a3a" stroke-width="1"/><text x="778.9" y="165" font-size="12" text-anchor="start" font-weight="bold" fill="#ffffff">Na<tspan font-size="8.2" dy="-5.0">+</tspan></text>
<text x="790" y="208" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">too far</text>
<text x="790" y="305" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Smaller ion: oxygens</text>
<text x="790" y="326" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">are too far away.</text>
<text x="721.0" y="347" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">Na<tspan font-size="10.9" dy="-6.7">+</tspan><tspan dy="6.7"> keeps its water</tspan></text>
<text x="790" y="368" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">and stays out.</text>
