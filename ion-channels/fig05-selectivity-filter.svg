<text x="150" y="305" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Water oxygens (red)</text>
<text x="150" y="326" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">hug the ion. Taking</text>
<text x="150" y="347" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">them off costs energy.</text>
<text x="408.2" y="34" font-size="19" text-anchor="start" font-weight="bold" fill="#1b2a3a">K<tspan font-size="12.9" dy="-8.0">+</tspan><tspan dy="8.0"> in the filter</tspan></text>
