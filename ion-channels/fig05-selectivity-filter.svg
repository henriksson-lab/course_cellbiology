<svg xmlns="http://www.w3.org/2000/svg" width="950" height="390" viewBox="0 0 950 390" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: why the K+ channel filter passes K+ but not the smaller Na+ -->
