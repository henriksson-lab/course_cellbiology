<text x="344" y="205.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+40</text>
<line x1="324" y1="168.0" x2="336" y2="168.0" stroke="#1b2a3a" stroke-width="2"/>
<text x="344" y="173.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+60</text>
<line x1="324" y1="136.0" x2="336" y2="136.0" stroke="#1b2a3a" stroke-width="2"/>
<text x="344" y="141.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+80</text>
<line x1="324" y1="104.0" x2="336" y2="104.0" stroke="#1b2a3a" stroke-width="2"/>
<text x="344" y="109.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+100</text>
<line x1="324" y1="72.0" x2="336" y2="72.0" stroke="#1b2a3a" stroke-width="2"/>
<text x="344" y="77.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+120</text>
<line x1="324" y1="40.0" x2="336" y2="40.0" stroke="#1b2a3a" stroke-width="2"/>
<text x="344" y="45.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5c6670">+140</text>
<text x="330" y="22" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">membrane potential (mV)</text>
<line x1="240" y1="56.0" x2="330" y2="56.0" stroke="#c2255c" stroke-width="3"/>
<text x="117.6" y="62.0" font-size="17" text-anchor="start" font-weight="bold" fill="#c2255c">E<tspan font-size="11.6" dy="4.8">Ca</tspan><tspan dy="-4.8"> ≈ +130 mV</tspan></text>
<line x1="240" y1="156.8" x2="330" y2="156.8" stroke="#1c7ed6" stroke-width="3"/>
<text x="127.0" y="162.8" font-size="17" text-anchor="start" font-weight="bold" fill="#1c7ed6">E<tspan font-size="11.6" dy="4.8">Na</tspan><tspan dy="-4.8"> ≈ +67 mV</tspan></text>
<line x1="240" y1="366.40000000000003" x2="330" y2="366.40000000000003" stroke="#2b8a3e" stroke-width="3"/>
<text x="130.3" y="366.40000000000003" font-size="17" text-anchor="start" font-weight="bold" fill="#2b8a3e">E<tspan font-size="11.6" dy="4.8">Cl</tspan><tspan dy="-4.8"> ≈ −64 mV</tspan></text>
<line x1="240" y1="406.40000000000003" x2="330" y2="406.40000000000003" stroke="#8e44ad" stroke-width="3"/>
<text x="133.5" y="418.40000000000003" font-size="17" text-anchor="start" font-weight="bold" fill="#8e44ad">E<tspan font-size="11.6" dy="4.8">K</tspan><tspan dy="-4.8"> ≈ −89 mV</tspan></text>
<circle cx="330" cy="376.0" r="9" fill="#e8590c" stroke="#1b2a3a"/>
<line x1="382" y1="376.0" x2="420" y2="376.0" stroke="#e8590c" stroke-width="2"/>
<text x="430" y="356.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a">At rest: ≈ −70 mV</text>
<text x="430" y="378.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a">mostly K<tspan font-size="10.9" dy="-6.7">+</tspan><tspan dy="6.7"> channels open → close to E</tspan><tspan font-size="10.9" dy="4.5">K</tspan></text>
<circle cx="330" cy="208.0" r="9" fill="#e8590c" stroke="#1b2a3a"/>
<line x1="382" y1="208.0" x2="420" y2="208.0" stroke="#e8590c" stroke-width="2"/>
<text x="430" y="188.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a">Peak of an action potential: ≈ +35 mV</text>
<text x="430" y="210.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a">many Na<tspan font-size="10.9" dy="-6.7">+</tspan><tspan dy="6.7"> channels open → towards E</tspan><tspan font-size="10.9" dy="4.5">Na</tspan></text>
<text x="430" y="56" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">The membrane potential is a weighted</text>
<text x="430" y="78" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">average of the E values. The weights</text>
<text x="430" y="100" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">are how many channels for each ion</text>
<text x="430" y="122" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">are open (the permeability).</text>
</svg>
