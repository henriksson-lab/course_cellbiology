<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Helvetica, Arial, sans-serif">
  <!-- fig16: Ca2+ gradients and channels turn Ca2+ into a signal -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="ac2255c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2255c"/></marker><marker id="ae8590c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
<text x="250" y="32" font-size="17" text-anchor="start" font-weight="bold" fill="#c2255c">Outside: Ca<tspan font-size="11.6" dy="-7.1">2+</tspan><tspan dy="7.1"> ≈ 1–2 mM</tspan></text>
<rect x="20" y="70" width="860" height="330" rx="30" fill="#fbfaf5" stroke="#8a6a12" stroke-width="8"/>
<rect x="20" y="70" width="860" height="330" rx="30" fill="none" stroke="#f6f0de" stroke-width="3"/>
<text x="349.1" y="108" font-size="17" text-anchor="start" font-weight="bold" fill="#c2255c">Cytosol at rest: Ca<tspan font-size="11.6" dy="-7.1">2+</tspan><tspan dy="7.1"> ≈ 0.0001 mM (100 nM)</tspan></text>
<rect x="170" y="58" width="22" height="26" rx="5" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="208" y="58" width="22" height="26" rx="5" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="200" y1="40" x2="200" y2="160" stroke="#c2255c" stroke-width="4" marker-end="url(#ac2255c)"/>
<text x="240" y="160" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Ca<tspan font-size="10.2" dy="-6.3">2+</tspan><tspan dy="6.3"> channel in the</tspan></text>
<text x="240" y="179" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">plasma membrane</text>
<text x="240" y="198" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">(voltage- or ligand-gated)</text>
<rect x="560" y="200" width="270" height="150" rx="40" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="695" y="270" font-size="18" text-anchor="middle" font-weight="bold" fill="#2a7f8f">ER</text>
<text x="642.6" y="294" font-size="16" text-anchor="start" font-weight="bold" fill="#c2255c">Ca<tspan font-size="10.9" dy="-6.7">2+</tspan><tspan dy="6.7"> ≈ 0.5 mM</tspan></text>
<rect x="584" y="190" width="18" height="22" rx="4" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="618" y="190" width="18" height="22" rx="4" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="610" y1="240" x2="610" y2="150" stroke="#c2255c" stroke-width="4" marker-end="url(#ac2255c)"/>
<text x="477.5" y="142" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">ER Ca<tspan font-size="10.2" dy="-6.3">2+</tspan><tspan dy="6.3"> channel</tspan></text>
<text x="590" y="161" font-size="15" text-anchor="end" font-weight="normal" fill="#1b2a3a">(opened by a</text>
<text x="590" y="180" font-size="15" text-anchor="end" font-weight="normal" fill="#1b2a3a">second messenger)</text>
<circle cx="830" cy="72" r="16" fill="#fff3bf" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="830" y1="110" x2="830" y2="36" stroke="#c2255c" stroke-width="2.5" marker-end="url(#ac2255c)"/>
<text x="812" y="36" font-size="15" text-anchor="end" font-weight="normal" fill="#1b2a3a">pump</text>
<circle cx="760" cy="350" r="15" fill="#fff3bf" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="760" y1="388" x2="760" y2="330" stroke="#c2255c" stroke-width="2.5" marker-end="url(#ac2255c)"/>
<text x="782" y="390" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">pump</text>
<rect x="70" y="250" width="420" height="120" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="85" y="278" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">A few open channels raise cytosolic Ca<tspan font-size="10.9" dy="-6.7">2+</tspan></text>
<text x="85" y="300" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">10–100× within milliseconds. Ca<tspan font-size="10.9" dy="-6.7">2+</tspan><tspan dy="6.7">-binding</tspan></text>
<text x="85" y="322" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">proteins turn this into action: secretion,</text>
<text x="85" y="344" font-size="16" text-anchor="start" font-weight="normal" fill="#1b2a3a">muscle contraction, gene expression.</text>
</svg>
