<text x="680" y="90" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stretch</text>
<text x="880" y="90" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stretch</text>
<text x="780" y="310" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Tension in the membrane</text>
<text x="780" y="330" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">pulls the blades and</text>
<text x="780" y="350" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">opens the pore</text>
<text x="780" y="382" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">e.g. Piezo channels</text>
<text x="780" y="402" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(touch, blood flow)</text>
</svg>
