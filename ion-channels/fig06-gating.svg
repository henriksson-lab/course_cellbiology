<svg xmlns="http://www.w3.org/2000/svg" width="940" height="415" viewBox="0 0 940 415" font-family="Helvetica, Arial, sans-serif">
  <!-- fig06: three ways to open a channel: voltage, ligand, mechanical force -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="a1c7ed6" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1c7ed6"/></marker><marker id="ae8590c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker></defs>
<text x="160" y="30" font-size="21" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Voltage</text>
<rect x="20" y="150" width="280" height="66" fill="#f6f0de"/><line x1="20" y1="150" x2="300" y2="150" stroke="#8a6a12" stroke-width="4"/><line x1="20" y1="216" x2="300" y2="216" stroke="#8a6a12" stroke-width="4"/>
<rect x="103.0" y="136" width="42" height="94" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="175.0" y="136" width="42" height="94" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<line x1="160" y1="60" x2="160" y2="268" stroke="#1c7ed6" stroke-width="4" marker-end="url(#a1c7ed6)"/>
<rect x="222" y="144" width="26" height="66" rx="10" fill="#ffe8cc" stroke="#1b2a3a" stroke-width="2"/>
<text x="235" y="164" font-size="18" text-anchor="middle" font-weight="bold" fill="#c92a2a">+</text>
<text x="235" y="183" font-size="18" text-anchor="middle" font-weight="bold" fill="#c92a2a">+</text>
<text x="235" y="202" font-size="18" text-anchor="middle" font-weight="bold" fill="#c92a2a">+</text>
<line x1="263" y1="202" x2="263" y2="152" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)"/>
<text x="233" y="132" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">sensor</text>
<text x="30" y="120" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">outside</text>
<text x="30" y="246" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">inside</text>
<text x="160" y="310" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Charged sensor moves when</text>
<text x="160" y="330" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">the inside becomes less</text>
<text x="160" y="350" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">negative (depolarisation)</text>
<text x="51.2" y="382" font-size="15" text-anchor="start" font-weight="bold" fill="#1b2a3a">e.g. voltage-gated Na<tspan font-size="10.2" dy="-6.3">+</tspan><tspan dy="6.3"> channel</tspan></text>
<text x="160" y="402" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(nerve, muscle)</text>
<text x="470" y="30" font-size="21" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Ligand</text>
<rect x="330" y="150" width="280" height="66" fill="#f6f0de"/><line x1="330" y1="150" x2="610" y2="150" stroke="#8a6a12" stroke-width="4"/><line x1="330" y1="216" x2="610" y2="216" stroke="#8a6a12" stroke-width="4"/>
<rect x="413.0" y="136" width="42" height="94" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/><rect x="485.0" y="136" width="42" height="94" rx="12" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<line x1="470" y1="60" x2="470" y2="268" stroke="#1c7ed6" stroke-width="4" marker-end="url(#a1c7ed6)"/>
<path d="M423,136 l11,-18 l11,18 z" fill="#e0a800" stroke="#1b2a3a" stroke-width="1.5"/>
<path d="M495,136 l11,-18 l11,18 z" fill="#e0a800" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="562" y="100" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">acetylcholine</text>
<line x1="542" y1="106" x2="514" y2="124" stroke="#5c6670" stroke-width="1.5"/>
<text x="470" y="310" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">A signal molecule binds</text>
<text x="470" y="330" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">and the pore opens</text>
<text x="470" y="382" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">e.g. nicotinic acetylcholine</text>
<text x="470" y="402" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">receptor (nerve–muscle junction)</text>
<text x="780" y="30" font-size="21" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Mechanical force</text>

