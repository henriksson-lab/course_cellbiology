<text x="625" y="214" font-size="14" fill="#1b2a3a" text-anchor="middle">bar = 10 µm</text>
<line x1="20" y1="226" x2="498" y2="226" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="20" y="246" font-size="14" fill="#1b2a3a" text-anchor="start">One channel per label, imaged one after another.</text>
<text x="20" y="264" font-size="14" fill="#1b2a3a" text-anchor="start">The colours are chosen by the scientist (false colour).</text>
<text x="20" y="282" font-size="14" fill="#1b2a3a" text-anchor="start">Ask: what was labelled, and how (antibody, GFP, dye)?</text>
<line x1="512" y1="226" x2="662" y2="226" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="512" y="246" font-size="14" fill="#1b2a3a" text-anchor="start">Yellow = red and</text>
<text x="512" y="264" font-size="14" fill="#1b2a3a" text-anchor="start">green in the same</text>
<text x="512" y="282" font-size="14" fill="#1b2a3a" text-anchor="start">spot (within ~200 nm).</text>
<text x="512" y="300" font-size="14" fill="#1b2a3a" text-anchor="start">Not proof of binding.</text>
<line x1="676" y1="226" x2="826" y2="226" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="676" y="246" font-size="14" fill="#1b2a3a" text-anchor="start">Cells without X,</text>
<text x="676" y="264" font-size="14" fill="#1b2a3a" text-anchor="start">same settings:</text>
<text x="676" y="282" font-size="14" fill="#1b2a3a" text-anchor="start">no green, so the</text>
<text x="676" y="300" font-size="14" fill="#1b2a3a" text-anchor="start">signal is specific.</text>
</svg>