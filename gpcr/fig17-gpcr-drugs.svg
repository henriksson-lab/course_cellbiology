<text x="484" y="132" font-size="14" text-anchor="start" fill="#5f3dc4" font-weight="700">μ-opioid receptor</text>
<ellipse cx="450" cy="176" rx="22.400000000000002" ry="16.0" fill="#fcc419" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="450" y="180.8" font-size="13.600000000000001" text-anchor="middle" fill="#1b2a3a" font-weight="700">Gα</text>
<text x="482" y="182" font-size="16" text-anchor="start" fill="#c77c02" font-weight="700">Gi</text>
<text x="510" y="222" font-size="15" text-anchor="middle" fill="#5c6b7a" font-style="italic">pain-signalling neuron</text>
<text x="368" y="262" font-size="15" text-anchor="start" fill="#1b2a3a">less cAMP; βγ opens K<tspan font-size="10.2" dy="-5.7">+</tspan></text>
<text x="368" y="284" font-size="15" text-anchor="start" fill="#1b2a3a">and closes Ca<tspan font-size="10.2" dy="-5.7">2+</tspan><tspan dy="5.7"> channels</tspan></text>
<text x="368" y="306" font-size="15" text-anchor="start" fill="#1b2a3a">→ less transmitter release,</text>
<text x="368" y="328" font-size="15" text-anchor="start" fill="#1b2a3a">less pain</text>
<text x="368" y="350" font-size="15" text-anchor="start" fill="#1b2a3a">risks: slow breathing, tolerance</text>
