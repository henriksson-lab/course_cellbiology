<text x="824" y="132" font-size="14" text-anchor="start" fill="#5f3dc4" font-weight="700">GLP-1 receptor</text>
<ellipse cx="790" cy="176" rx="22.400000000000002" ry="16.0" fill="#fcc419" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="790" y="180.8" font-size="13.600000000000001" text-anchor="middle" fill="#1b2a3a" font-weight="700">Gα</text>
<text x="822" y="182" font-size="16" text-anchor="start" fill="#c77c02" font-weight="700">Gs</text>
<text x="850" y="222" font-size="15" text-anchor="middle" fill="#5c6b7a" font-style="italic">pancreatic β cell (and brain)</text>
<text x="708" y="262" font-size="15" text-anchor="start" fill="#1b2a3a">more cAMP → more insulin,</text>
<text x="708" y="284" font-size="15" text-anchor="start" fill="#1b2a3a">but only when glucose is</text>
<text x="708" y="306" font-size="15" text-anchor="start" fill="#1b2a3a">high; less appetite (brain)</text>
<text x="708" y="328" font-size="15" text-anchor="start" fill="#1b2a3a">→ type 2 diabetes, obesity</text>
<text x="708" y="350" font-size="15" text-anchor="start" fill="#1b2a3a">lasts a week: binds albumin</text></svg>
