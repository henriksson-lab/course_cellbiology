<text x="510" y="40" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="700">Opioid</text>
<text x="510" y="62" font-size="15" text-anchor="middle" fill="#1b2a3a" font-style="italic">morphine, fentanyl</text>
