<text x="144" y="132" font-size="14" text-anchor="start" fill="#5f3dc4" font-weight="700">β<tspan font-size="9.5" dy="3.1">1</tspan><tspan dy="-3.1">-adrenergic receptor</tspan></text>
<ellipse cx="110" cy="176" rx="22.400000000000002" ry="16.0" fill="#ced4da" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="110" y="180.8" font-size="13.600000000000001" text-anchor="middle" fill="#1b2a3a" font-weight="700">Gα</text>
<text x="142" y="182" font-size="16" text-anchor="start" fill="#c77c02" font-weight="700">Gs</text>
<text x="170" y="222" font-size="15" text-anchor="middle" fill="#5c6b7a" font-style="italic">heart muscle cell</text>
<text x="28" y="262" font-size="15" text-anchor="start" fill="#1b2a3a">blocks adrenaline:</text>
<text x="28" y="284" font-size="15" text-anchor="start" fill="#1b2a3a">less cAMP and PKA</text>
<text x="28" y="306" font-size="15" text-anchor="start" fill="#1b2a3a">→ slower, weaker beat</text>
<text x="28" y="328" font-size="15" text-anchor="start" fill="#1b2a3a">→ lower blood pressure,</text>
<text x="28" y="350" font-size="15" text-anchor="start" fill="#1b2a3a">less strain on the heart</text>
