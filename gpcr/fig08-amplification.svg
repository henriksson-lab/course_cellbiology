<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" font-family="Helvetica, Arial, sans-serif"><rect width="1010" height="470" fill="#ffffff"/><rect x="305.0" y="30" width="190" height="44" rx="8" fill="#1971c2" stroke="#1b2a3a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="400" y="59" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="700">1 active receptor</text>
<text x="660" y="50" font-size="15" text-anchor="start" fill="#1b2a3a">1 hormone molecule bound</text>
<path d="M400.0,76.0 L400.0,99.0" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
<path d="M400.0,110.0 L393.9,99.0 L406.1,99.0 Z" fill="#1b2a3a"/>
<rect x="290.0" y="114" width="220" height="44" rx="8" fill="#c77c02" stroke="#1b2a3a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="400" y="143" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="700">≈ 8 Gαs–GTP</text>
<text x="660" y="134" font-size="15" text-anchor="start" fill="#1b2a3a">active receptor (a GEF) activates G proteins</text>
<text x="660" y="153" font-size="15" text-anchor="start" fill="#1b2a3a">one after another</text>
<text x="16" y="143" font-size="15" text-anchor="start" fill="#2b8a3e" font-weight="700">enzyme-like: gain</text>
<path d="M400.0,160.0 L400.0,183.0" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
<path d="M400.0,194.0 L393.9,183.0 L406.1,183.0 Z" fill="#1b2a3a"/>
<rect x="235.0" y="198" width="330" height="44" rx="8" fill="#2f9e44" stroke="#1b2a3a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="400" y="227" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="700">≈ 700 cAMP</text>
<text x="660" y="218" font-size="15" text-anchor="start" fill="#1b2a3a">each Gαs switches on a cyclase that makes</text>
<text x="660" y="237" font-size="15" text-anchor="start" fill="#1b2a3a">cAMP</text>
<text x="16" y="227" font-size="15" text-anchor="start" fill="#2b8a3e" font-weight="700">enzyme: gain</text>
<path d="M400.0,244.0 L400.0,267.0" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
<path d="M400.0,278.0 L393.9,267.0 L406.1,267.0 Z" fill="#1b2a3a"/>
<rect x="275.0" y="282" width="250" height="44" rx="8" fill="#0b7285" stroke="#1b2a3a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="400" y="311" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="700">≈ 100 active PKA</text>
<text x="660" y="302" font-size="15" text-anchor="start" fill="#1b2a3a">4 cAMP bind one PKA, which frees 2 C subunits</text>
<text x="16" y="311" font-size="15" text-anchor="start" fill="#868e96" font-weight="700">binding: no gain</text>
<path d="M400.0,328.0 L400.0,351.0" fill="none" stroke="#1b2a3a" stroke-width="2.2"/>
<path d="M400.0,362.0 L393.9,351.0 L406.1,351.0 Z" fill="#1b2a3a"/>
<rect x="180.0" y="366" width="440" height="44" rx="8" fill="#d08c00" stroke="#1b2a3a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="400" y="395" font-size="18" text-anchor="middle" fill="#1b2a3a" font-weight="700">≈ 3000 glucose per second</text>
<text x="660" y="386" font-size="15" text-anchor="start" fill="#1b2a3a">each PKA (via two more kinases) makes enzymes</text>
<text x="660" y="405" font-size="15" text-anchor="start" fill="#1b2a3a">that cut glycogen</text>
<text x="16" y="395" font-size="15" text-anchor="start" fill="#2b8a3e" font-weight="700">enzymes: gain</text>
<text x="400" y="462" font-size="14" text-anchor="middle" fill="#5c6b7a" font-style="italic">per active receptor; illustrative numbers from the demo model, not measurements</text></svg>
