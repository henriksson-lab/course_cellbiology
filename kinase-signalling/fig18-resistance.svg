<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig18: how tumours escape kinase inhibitors - gatekeeper, bypass, feedback relief -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker><marker id="ac92a2a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c92a2a"/></marker></defs>
<text x="150" y="26" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">1. Gatekeeper mutation</text>
<text x="450" y="26" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">2. Bypass</text>
<text x="750" y="26" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">3. Feedback relief</text>
<line x1="300" y1="40" x2="300" y2="390" stroke="#d0d4da" stroke-width="1.5"/>
<line x1="600" y1="40" x2="600" y2="390" stroke="#d0d4da" stroke-width="1.5"/>
<path d="M70,70 L230,70 L230,200 L170,200 L170,130 L130,130 L130,200 L70,200 Z" fill="#e7f0fb" stroke="#2a78d6" stroke-width="2.5"/>
<circle cx="158" cy="140" r="13" fill="#c92a2a" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="158" y="145" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">M</text>
<rect x="134" y="160" width="32" height="30" rx="8" fill="#e8590c" stroke="none" stroke-width="0" opacity="0.45"/>
<text x="150" y="230" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">T → M at the pocket entrance:</text>
<text x="150" y="248" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">the drug no longer fits,</text>
<text x="150" y="266" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">ATP still does</text>
<text x="150" y="300" font-size="14" text-anchor="middle" font-weight="bold" fill="#c92a2a">EGFR T790M (gefitinib, erlotinib)</text>
<text x="150" y="318" font-size="14" text-anchor="middle" font-weight="bold" fill="#c92a2a">BCR-ABL T315I (imatinib)</text>
<text x="150" y="350" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Answer: next-generation drug</text>
<text x="150" y="368" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(osimertinib; ponatinib)</text>
<rect x="357.0" y="62.0" width="86" height="36" rx="12" fill="#e5decb" stroke="#8a6a12" stroke-width="2.5"/>
<text x="400" y="85.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">EGFR</text>
<rect x="370.0" y="107" width="60" height="30" rx="15" fill="#e8590c" stroke="none" stroke-width="0"/>
<text x="400" y="128" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">drug</text>
<rect x="467.0" y="62.0" width="76" height="36" rx="12" fill="#dee0e3" stroke="#6b7280" stroke-width="2.5"/>
<text x="505" y="85.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">MET</text>
<text x="505" y="116" font-size="13" text-anchor="middle" font-weight="bold" fill="#c92a2a">amplified</text>
<rect x="407.0" y="172.0" width="86" height="36" rx="12" fill="#cdede2" stroke="#1baf7a" stroke-width="2.5"/>
<text x="450" y="195.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Ras</text>
<line x1="400" y1="138" x2="430" y2="170" stroke="#adb5bd" stroke-width="2.5" stroke-dasharray="4 4"/>
<path d="M500,124 L470,170" fill="none" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#ac92a2a)" stroke-linejoin="round"/>
<rect x="400.0" y="232.0" width="100" height="36" rx="12" fill="#e2d5f1" stroke="#7b3fbf" stroke-width="2.5"/>
<text x="450" y="255.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">ERK on</text>
<path d="M450,208 L450,230" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<text x="450" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Another receptor, or a mutation</text>
<text x="450" y="318" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">further down (NRAS, MEK),</text>
<text x="450" y="336" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">turns the pathway back on</text>
<text x="450" y="368" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Answer: combine drugs</text>
<rect x="707.0" y="57.0" width="86" height="34" rx="12" fill="#e5decb" stroke="#8a6a12" stroke-width="2.5"/>
<text x="750" y="79.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">EGFR</text>
<rect x="707.0" y="117.0" width="86" height="34" rx="12" fill="#cdede2" stroke="#1baf7a" stroke-width="2.5"/>
<text x="750" y="139.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Ras</text>
<rect x="685.0" y="177.0" width="130" height="34" rx="12" fill="#d0e1f6" stroke="#2a78d6" stroke-width="2.5"/>
<text x="750" y="199.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">BRAF V600E</text>
<rect x="610.0" y="179" width="64" height="30" rx="15" fill="#e8590c" stroke="none" stroke-width="0"/>
<text x="642" y="200" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">vemu</text>
<rect x="707.0" y="237.0" width="86" height="34" rx="12" fill="#e2d5f1" stroke="#7b3fbf" stroke-width="2.5"/>
<text x="750" y="259.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">ERK</text>
<path d="M750,91 L750,115" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<path d="M750,151 L750,175" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<path d="M750,211 L750,235" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<path d="M793,254 H840 V134 H798" fill="none" stroke="#adb5bd" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
<text x="846" y="200" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">brake</text>
<text x="846" y="216" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">off</text>
<text x="750" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Less ERK → less feedback →</text>
<text x="750" y="318" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">EGFR and Ras switch RAF on again</text>
<text x="750" y="336" font-size="14" text-anchor="middle" font-weight="bold" fill="#c92a2a">(BRAF V600E colon cancer)</text>
<text x="750" y="368" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Answer: add an EGFR antibody</text>
<text x="750" y="386" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">or a MEK inhibitor</text>
</svg>
