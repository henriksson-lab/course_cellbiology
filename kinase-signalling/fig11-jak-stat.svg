<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig11: JAK-STAT - the shortest route from receptor to gene -->
<defs><marker id="a1b2a3a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
<rect x="0" y="0" width="900" height="60" rx="0" fill="#eef4fa" stroke="none" stroke-width="0"/>
<rect x="0" y="60" width="900" height="26" rx="0" fill="#f6f0de" stroke="none" stroke-width="0"/>
<line x1="0" y1="60" x2="900" y2="60" stroke="#8a6a12" stroke-width="3"/>
<line x1="0" y1="86" x2="900" y2="86" stroke="#8a6a12" stroke-width="3"/>
<rect x="0" y="86" width="900" height="314" rx="0" fill="#fbfaf5" stroke="none" stroke-width="0"/>
<ellipse cx="720" cy="330" rx="170" ry="60" fill="#efebf7" stroke="#6b4fa0" stroke-width="2.5"/>
<circle cx="150" cy="16" r="11" fill="#2b8a3e" stroke="#1b2a3a" stroke-width="1"/>
<text x="170" y="22" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">cytokine</text>
<rect x="122" y="26" width="24" height="100" rx="8" fill="#e9ecef" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="110" cy="112" rx="22" ry="18" fill="#aac9ef" stroke="#2a78d6" stroke-width="2"/>
<text x="110" y="118" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">JAK</text>
<circle cx="132" cy="150" r="10" fill="#f2c94c" stroke="#9a6b00" stroke-width="1.5"/>
<text x="132" y="155" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P</text>
<rect x="154" y="26" width="24" height="100" rx="8" fill="#e9ecef" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="190" cy="112" rx="22" ry="18" fill="#aac9ef" stroke="#2a78d6" stroke-width="2"/>
<text x="190" y="118" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">JAK</text>
<circle cx="168" cy="150" r="10" fill="#f2c94c" stroke="#9a6b00" stroke-width="1.5"/>
<text x="168" y="155" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P</text>
<text x="150" y="186" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">1. JAKs phosphorylate</text>
<text x="150" y="204" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">each other and the receptor</text>
<rect x="317.0" y="113.0" width="86" height="38" rx="12" fill="#cdede2" stroke="#1baf7a" stroke-width="2.5"/>
<text x="360" y="137.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">STAT</text>
<circle cx="412" cy="132" r="10" fill="#f2c94c" stroke="#9a6b00" stroke-width="1.5"/>
<text x="412" y="137" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P</text>
<path d="M200,150 L312,140" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<text x="360" y="186" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">2. STAT docks (SH2)</text>
<text x="360" y="204" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">and is phosphorylated</text>
<rect x="482.0" y="114.0" width="76" height="36" rx="12" fill="#cdede2" stroke="#1baf7a" stroke-width="2.5"/>
<text x="520" y="137.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">STAT</text>
<rect x="562.0" y="114.0" width="76" height="36" rx="12" fill="#cdede2" stroke="#1baf7a" stroke-width="2.5"/>
<text x="600" y="137.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">STAT</text>
<circle cx="560" cy="112" r="10" fill="#f2c94c" stroke="#9a6b00" stroke-width="1.5"/>
<text x="560" y="117" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P</text>
<circle cx="560" cy="152" r="10" fill="#f2c94c" stroke="#9a6b00" stroke-width="1.5"/>
<text x="560" y="157" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P</text>
<path d="M426,132 L478,132" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<text x="560" y="186" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">3. Two P-STATs bind</text>
<text x="560" y="204" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">each other (SH2 to P-Tyr)</text>
<path d="M600,214 L690,282" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a1b2a3a)" stroke-linejoin="round"/>
<text x="720" y="312" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">4. Enters the nucleus,</text>
<text x="720" y="332" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">binds DNA, turns on genes</text>
<path d="M600,358 C640,348 680,368 720,358 C760,348 800,368 840,358" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="130" y="300" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Signals from interferons, IL-6,</text>
<text x="130" y="320" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">EPO (red blood cells), growth hormone.</text>
<text x="130" y="350" font-size="15" text-anchor="start" font-weight="normal" fill="#c92a2a">JAK2 V617F: always on → too many</text>
<text x="130" y="370" font-size="15" text-anchor="start" font-weight="normal" fill="#c92a2a">blood cells. Drug: ruxolitinib.</text>
</svg>
