<text x="640" y="46" font-size="15" text-anchor="start" font-weight="bold" fill="#1f77b4">kinesin, out to the tip (anterograde):</text>
<text x="640" y="66" font-size="15" text-anchor="start" font-weight="normal" fill="#1f77b4">new vesicles, membrane proteins, mitochondria</text>
<line x1="620" y1="262" x2="260" y2="262" stroke="#7b3f99" stroke-width="4" marker-end="url(#arP)"/>
<text x="640" y="267" font-size="15" text-anchor="start" font-weight="bold" fill="#7b3f99">dynein, back to the cell body (retrograde):</text>
<text x="640" y="287" font-size="15" text-anchor="start" font-weight="normal" fill="#7b3f99">endosomes, signals from the tip, worn-out parts</text>
<text x="560" y="316" font-size="15" text-anchor="middle" font-weight="normal" fill="#555">All microtubules in the axon have their + end towards the tip (arrowheads).</text>
