<text x="785" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">linked: sliding → bending</text>
<text x="890" y="90" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Cilia (many per cell,</text>
<text x="890" y="110" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">beat like oars) and</text>
<text x="890" y="130" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">flagella (one, sperm)</text>
<text x="890" y="150" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">share this machine.</text>
<text x="890" y="190" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">It grows from a</text>
<text x="890" y="210" font-size="15" text-anchor="start" font-weight="bold" fill="#1b2a3a">basal body</text>
<text x="890" y="230" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">(a centriole).</text>
