<circle cx="796" cy="96" r="6" fill="#b9c8d8" stroke="#1b2a3a" stroke-width="1"/>
<circle cx="808" cy="96" r="6" fill="#6f8fae" stroke="#1b2a3a" stroke-width="1"/>
<circle cx="802" cy="154" r="6" fill="#b9c8d8" stroke="#1b2a3a" stroke-width="1"/>
<circle cx="814" cy="154" r="6" fill="#6f8fae" stroke="#1b2a3a" stroke-width="1"/>
<text x="687.5" y="196" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">peel dimers off the ends,</text>
<text x="687.5" y="216" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">or hold free dimers away:</text>
<text x="687.5" y="236" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">more catastrophes</text>
<text x="962.5" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Cut</text>
<text x="962.5" y="52" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a" font-style="italic">katanin, spastin</text>
<rect x="851" y="110" width="100" height="26" rx="3" fill="#c7d0da" stroke="#1b2a3a" stroke-width="1.5"/><line x1="853" y1="117" x2="949" y2="117" stroke="#9aa8b6" stroke-width="1"/><line x1="853" y1="123" x2="949" y2="123" stroke="#9aa8b6" stroke-width="1"/><line x1="853" y1="129" x2="949" y2="129" stroke="#9aa8b6" stroke-width="1"/>
<rect x="971" y="110" width="100" height="26" rx="3" fill="#c7d0da" stroke="#1b2a3a" stroke-width="1.5"/><line x1="973" y1="117" x2="1069" y2="117" stroke="#9aa8b6" stroke-width="1"/><line x1="973" y1="123" x2="1069" y2="123" stroke="#9aa8b6" stroke-width="1"/><line x1="973" y1="129" x2="1069" y2="129" stroke="#9aa8b6" stroke-width="1"/>
<ellipse cx="961" cy="123" rx="13" ry="26" fill="none" stroke="#8e44ad" stroke-width="6"/>
<text x="961" y="86" font-size="14" text-anchor="middle" font-weight="normal" fill="#8e44ad">ATP-driven ring</text>
<text x="962.5" y="196" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">cut a microtubule in two:</text>
<text x="962.5" y="216" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">new ends, new short</text>
<text x="962.5" y="236" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">microtubules</text>
