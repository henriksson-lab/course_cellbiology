<path d="M234,136 q8,22 22,26" fill="none" stroke="#2b6f9e" stroke-width="4" stroke-linecap="round"/>
<text x="137.5" y="196" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">bind along the side;</text>
<text x="137.5" y="216" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">fewer catastrophes;</text>
<text x="137.5" y="236" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">space microtubules apart</text>
<text x="412.5" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Track the + end</text>
<text x="412.5" y="52" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a" font-style="italic">EB1 and friends</text>
<rect x="301" y="110" width="200" height="26" rx="3" fill="#c7d0da" stroke="#1b2a3a" stroke-width="1.5"/><line x1="303" y1="117" x2="499" y2="117" stroke="#9aa8b6" stroke-width="1"/><line x1="303" y1="123" x2="499" y2="123" stroke="#9aa8b6" stroke-width="1"/><line x1="303" y1="129" x2="499" y2="129" stroke="#9aa8b6" stroke-width="1"/>
<rect x="449" y="104" width="56" height="38" rx="14" fill="#2f9e44" fill-opacity="0.75" stroke="none"/>
<text x="524" y="129" font-size="22" text-anchor="start" font-weight="bold" fill="#1b2a3a">+</text>
<text x="412.5" y="196" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">ride on the growing end;</text>
<text x="412.5" y="216" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">recruit other proteins</text>
<text x="412.5" y="236" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(and light up the tip)</text>
<text x="687.5" y="30" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Take apart</text>
<text x="687.5" y="52" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a" font-style="italic">kinesin-13, stathmin</text>
<rect x="576" y="110" width="160" height="26" rx="3" fill="#c7d0da" stroke="#1b2a3a" stroke-width="1.5"/><line x1="578" y1="117" x2="734" y2="117" stroke="#9aa8b6" stroke-width="1"/><line x1="578" y1="123" x2="734" y2="123" stroke="#9aa8b6" stroke-width="1"/><line x1="578" y1="129" x2="734" y2="129" stroke="#9aa8b6" stroke-width="1"/>
