<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" font-family="Helvetica, Arial, sans-serif">
<!-- fig11: optical trap bead assay with one kinesin; schematic stepping record (illustrative, not measured data). -->
<defs><marker id="ar" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker><marker id="arO" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker><marker id="arB" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1f77b4"/></marker><marker id="arP" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#7b3f99"/></marker><marker id="arG" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#2f9e44"/></marker><marker id="arR" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c92a2a"/></marker></defs>
<text x="250" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Optical trap ("optical tweezers")</text>
<path d="M150,40 L350,40 L272,150 L228,150 Z" fill="#e03131" stroke="none" stroke-width="0" fill-opacity="0.13"/>
<path d="M228,150 L272,150 L350,260 L150,260 Z" fill="#e03131" stroke="none" stroke-width="0" fill-opacity="0.13"/>
<text x="360" y="70" font-size="15" text-anchor="start" font-weight="normal" fill="#e03131">focused laser beam</text>
<rect x="30" y="272" width="440" height="22" rx="0" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
<text x="250" y="316" font-size="15" text-anchor="middle" font-weight="normal" fill="#555" font-style="italic">glass surface</text>
<rect x="60" y="250" width="380" height="20" rx="4" fill="#c7d0da" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="48" y="266" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a">−</text>
<text x="452" y="266" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a">+</text>
<circle cx="250" cy="150" r="48" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="250" y="150" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">plastic bead</text>
<text x="250" y="168" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(1 µm)</text>
<path d="M262,196 C266,214 268,224 276,234" fill="none" stroke="#1f77b4" stroke-width="5"/>
<ellipse cx="268" cy="243" rx="12" ry="7" fill="#1f77b4" stroke="#1b2a3a" stroke-width="1"/>
<ellipse cx="292" cy="243" rx="12" ry="7" fill="#1f77b4" stroke="#1b2a3a" stroke-width="1"/>
<text x="320" y="222" font-size="15" text-anchor="start" font-weight="bold" fill="#1f77b4">one kinesin</text>
<text x="30" y="120" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">The light holds the</text>
<text x="30" y="140" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">bead like a spring.</text>
<text x="30" y="168" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Its position is read</text>
<text x="30" y="188" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">to about 1 nm.</text>
<text x="835.0" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">What the trap records</text>
<line x1="600" y1="270" x2="1070" y2="270" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="600" y1="40" x2="600" y2="270" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="835.0" y="296" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">time (fractions of a second)</text>
<text x="556" y="155.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a" transform="rotate(-90 556 155.0)">bead position (nm)</text>
