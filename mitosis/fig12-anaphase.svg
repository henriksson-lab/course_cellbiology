<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig12: anaphase A (chromatids move to the poles as kinetochore microtubules shorten) and anaphase B (the poles move apart: interpolar microtubules slide, cortical dynein pulls). Cartoon. -->
