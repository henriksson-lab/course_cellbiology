<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
<!-- fig14: cytokinesis. The central spindle marks the equator; a RhoGEF activates RhoA there; RhoA switches on formins (actin) and Rho kinase (myosin II); the contractile ring closes; abscission cuts the midbody. Cartoon. -->
