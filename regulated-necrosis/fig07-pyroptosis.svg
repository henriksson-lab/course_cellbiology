<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<!-- fig07: pyroptosis: two signals, the inflammasome, caspase-1, gasdermin D pores and IL-1beta -->
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
<text x="20" y="24" font-size="16" fill="#1b2a3a">outside</text>
<!-- membrane, with gap for GSDMD pores on the right -->
<rect x="20" y="50" width="960" height="22" fill="#f6f0de"/>
<line x1="20" y1="50" x2="700" y2="50" stroke="#8a6a12" stroke-width="3"/><line x1="20" y1="72" x2="700" y2="72" stroke="#8a6a12" stroke-width="3"/>
<line x1="760" y1="50" x2="840" y2="50" stroke="#8a6a12" stroke-width="3"/><line x1="760" y1="72" x2="840" y2="72" stroke="#8a6a12" stroke-width="3"/>
<line x1="900" y1="50" x2="980" y2="50" stroke="#8a6a12" stroke-width="3"/><line x1="900" y1="72" x2="980" y2="72" stroke="#8a6a12" stroke-width="3"/>
<!-- signal 1: LPS on TLR4 -->
<rect x="92" y="32" width="18" height="58" rx="5" fill="#dbe4ee" stroke="#1b2a3a" stroke-width="2"/>
<path d="M88,20 l8,-8 l8,8 l8,-8 l8,8" fill="none" stroke="#1b2a3a" stroke-width="3"/>
<text x="125" y="28" font-size="16" fill="#1b2a3a">LPS on TLR4</text>
<text x="20" y="118" font-size="17" font-weight="bold" fill="#1b2a3a">1. Priming</text>
<line x1="101" y1="94" x2="101" y2="146" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="20" y="152" width="220" height="70" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="35" y="180" font-size="17" fill="#1b2a3a">NF-κB: cell makes</text>
<text x="35" y="206" font-size="17" fill="#1b2a3a">pro-IL-1β and NLRP3</text>
<!-- signal 2: toxin, K+ efflux -->
<rect x="330" y="36" width="34" height="50" rx="6" fill="#ffffff" stroke="#e8590c" stroke-width="3"/>
<text x="374" y="28" font-size="16" fill="#1b2a3a">toxin (nigericin): K<tspan font-size="11" dy="-6">+</tspan><tspan dy="6"> leaks out</tspan></text>
<circle cx="347" cy="112" r="11" fill="#8e44ad"/><text x="340" y="117" font-size="12" font-weight="bold" fill="#fff">K<tspan font-size="8" dy="-4">+</tspan></text>
<line x1="347" y1="98" x2="347" y2="14" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="290" y="160" font-size="17" font-weight="bold" fill="#1b2a3a">2. Danger signal</text>
<!-- inflammasome -->
<line x1="400" y1="168" x2="430" y2="210" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<g stroke="#1b2a3a" stroke-width="1.5">
<circle cx="470" cy="260" r="20" fill="#d9e7f7"/><circle cx="505" cy="240" r="20" fill="#d9e7f7"/><circle cx="540" cy="260" r="20" fill="#d9e7f7"/>
<circle cx="505" cy="280" r="16" fill="#f2c9a0"/>
<circle cx="472" cy="305" r="14" fill="#efd3e6"/><circle cx="505" cy="315" r="14" fill="#efd3e6"/><circle cx="538" cy="305" r="14" fill="#efd3e6"/>
</g>
<text x="300" y="242" font-size="16" fill="#1b2a3a">NLRP3 (blue)</text>
<text x="300" y="266" font-size="16" fill="#1b2a3a">+ ASC (tan)</text>
<text x="300" y="290" font-size="16" fill="#1b2a3a">+ pro-caspase-1</text>
<text x="400" y="356" font-size="17" font-weight="bold" fill="#1b2a3a">inflammasome</text>
<text x="570" y="222" font-size="16" fill="#e8590c" font-weight="bold">MCC950</text><line x1="590" y1="228" x2="568" y2="240" stroke="#e8590c" stroke-width="3"/><line x1="562" y1="228" x2="572" y2="250" stroke="#e8590c" stroke-width="5"/>
<line x1="560" y1="285" x2="620" y2="285" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="628" y="262" width="150" height="46" rx="8" fill="#1b2a3a"/>
<text x="703" y="291" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">caspase-1</text>
<!-- cuts gasdermin D -->
<path d="M720,260 L728,96" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="710" y="150" font-size="16" text-anchor="end" fill="#1b2a3a">cuts gasdermin D;</text><text x="710" y="170" font-size="16" text-anchor="end" fill="#1b2a3a">its N-terminal fragments</text><text x="710" y="190" font-size="16" text-anchor="end" fill="#1b2a3a">form pores (≈ 20 nm)</text>
<!-- GSDMD pores -->
<g fill="#e8590c" stroke="#1b2a3a" stroke-width="1.2">
<rect x="702" y="40" width="12" height="42" rx="4"/><rect x="746" y="40" width="12" height="42" rx="4"/>
<rect x="842" y="40" width="12" height="42" rx="4"/><rect x="886" y="40" width="12" height="42" rx="4"/>
</g>
<!-- IL-1beta -->
<path d="M778,300 C850,300 880,250 870,96" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="800" y="335" font-size="16" fill="#1b2a3a">cuts pro-IL-1β → IL-1β,</text>
<text x="800" y="355" font-size="16" fill="#1b2a3a">which leaves through</text>
<text x="800" y="375" font-size="16" fill="#1b2a3a">the pores</text>
<circle cx="870" cy="22" r="7" fill="#c2255c"/><circle cx="888" cy="12" r="6" fill="#c2255c"/><circle cx="852" cy="12" r="6" fill="#c2255c"/>
<text x="900" y="28" font-size="16" fill="#1b2a3a">IL-1β</text>
<!-- outcome -->
<text x="500" y="420" font-size="18" text-anchor="middle" fill="#1b2a3a">Water rushes in through the pores: the cell swells and bursts.</text>
<text x="500" y="448" font-size="18" text-anchor="middle" fill="#c92a2a" font-weight="bold">Strongly inflammatory: IL-1β plus everything inside the cell.</text>
</svg>
