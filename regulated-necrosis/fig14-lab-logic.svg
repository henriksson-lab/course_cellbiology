<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif">
<!-- fig14: how to tell the death types apart: membrane first, then marker + rescue by an inhibitor -->
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
<rect x="330" y="10" width="340" height="56" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="500.0" y="33" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Cells die after a stimulus.</text>
<text x="500.0" y="53" font-size="16" text-anchor="middle" fill="#1b2a3a">Step 1: annexin V / PI over time</text>
<rect x="40" y="110" width="300" height="60" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="190.0" y="135" font-size="16" text-anchor="middle" fill="#1b2a3a">AV+ PI− first (membrane intact),</text>
<text x="190.0" y="155" font-size="16" text-anchor="middle" fill="#1b2a3a">PI+ only late</text>
<rect x="560" y="110" width="400" height="60" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="736.5" y="135" font-size="16" text-anchor="middle" fill="#1b2a3a">PI+ early, almost no AV+ PI− stage:</text>
<text x="736.5" y="155" font-size="16" text-anchor="middle" fill="#1b2a3a">the membrane breaks (lytic death)</text>
<line x1="420" y1="68" x2="250" y2="106" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="580" y1="68" x2="720" y2="106" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="240" width="300" height="96" rx="8" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
<text x="190.0" y="273" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Apoptosis</text>
<text x="190.0" y="293" font-size="16" text-anchor="middle" fill="#1b2a3a">marker: cleaved caspase-3</text>
<text x="190.0" y="313" font-size="16" text-anchor="middle" fill="#1b2a3a">rescue: z-VAD</text>
<line x1="190" y1="172" x2="190" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="760" y="205" font-size="16" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Step 2: which marker appears, and which inhibitor rescues?</text>
<line x1="760" y1="172" x2="760" y2="186" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="432.5" y1="214" x2="432.5" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="360" y="240" width="145" height="96" rx="8" fill="#fde8d7" stroke="#e8590c" stroke-width="2"/>
<text x="432.5" y="273" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Necroptosis</text>
<text x="432.5" y="293" font-size="15" text-anchor="middle" fill="#1b2a3a">p-MLKL</text>
<text x="432.5" y="313" font-size="15" text-anchor="middle" fill="#1b2a3a">necrostatin-1</text>
<line x1="584.5" y1="214" x2="584.5" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="512" y="240" width="145" height="96" rx="8" fill="#fde8d7" stroke="#e8590c" stroke-width="2"/>
<text x="584.5" y="273" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Pyroptosis</text>
<text x="584.5" y="293" font-size="15" text-anchor="middle" fill="#1b2a3a">GSDMD-N, IL-1β</text>
<text x="584.5" y="313" font-size="15" text-anchor="middle" fill="#1b2a3a">MCC950, z-VAD</text>
<line x1="736.5" y1="214" x2="736.5" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="664" y="240" width="145" height="96" rx="8" fill="#fde8d7" stroke="#e8590c" stroke-width="2"/>
<text x="736.5" y="273" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Ferroptosis</text>
<text x="736.5" y="293" font-size="15" text-anchor="middle" fill="#1b2a3a">lipid peroxides</text>
<text x="736.5" y="313" font-size="15" text-anchor="middle" fill="#1b2a3a">ferrostatin-1</text>
<line x1="888.5" y1="214" x2="888.5" y2="236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="816" y="240" width="145" height="96" rx="8" fill="#f1f3f5" stroke="#888" stroke-width="2"/>
<text x="888.5" y="273" font-size="15" text-anchor="middle" fill="#1b2a3a" font-weight="bold">Accidental</text>
<text x="888.5" y="293" font-size="15" text-anchor="middle" fill="#1b2a3a">none</text>
<text x="888.5" y="313" font-size="15" text-anchor="middle" fill="#1b2a3a">nothing</text>
<text x="40" y="378" font-size="16" fill="#1b2a3a">Always: a control without the stimulus, a marker, and a rescue that agree. A marker shows a pathway is <tspan font-style="italic">active</tspan>;</text>
<text x="40" y="402" font-size="16" fill="#1b2a3a">a rescue (or knockout) shows it is <tspan font-style="italic">necessary</tspan>. Inhibitors are never perfectly specific, so confirm with a knockout.</text>
</svg>