<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="390" fill="white"/>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6a12"/></marker><marker id="cyto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbfaf5"/></marker><marker id="nuc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b4fa0"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7f8f"/></marker><marker id="golgi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9822b"/></marker><marker id="endo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e8b57"/></marker><marker id="drug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker><marker id="mito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs><text x="24" y="30" font-size="23" fill="#1b2a3a" font-weight="700">The mRNA stays cytosolic; the nascent protein takes the secretory route</text><rect x="25" y="75" width="290" height="230" rx="12" stroke="#2a7f8f" fill="#e6f3f5" stroke-width="2.5"/><rect x="25" y="75" width="290" height="83" rx="0" stroke="#2a7f8f" fill="#fbfaf5" stroke-width="2.5"/><text x="45" y="102" font-size="18" fill="#1b2a3a">cytosol</text><text x="45" y="275" font-size="19" fill="#2a7f8f" font-weight="700">ER lumen</text><path d="M78,136 q10,-16 20,0 t20,0 t20,0" fill="none" stroke="#6b4fa0" stroke-width="4"/><circle cx="184" cy="147" r="24" stroke="#1b2a3a" fill="#e6e9ed" stroke-width="2.5"/><circle cx="184" cy="122" r="16" stroke="#1b2a3a" fill="#e6e9ed" stroke-width="2.5"/><path d="M184,143 L184,190 Q220,200 222,229" fill="none" stroke="#e8590c" stroke-width="5"/><text x="45" y="335" font-size="18" fill="#1b2a3a">mRNA + ribosome</text><text x="170" y="229" font-size="18" fill="#e8590c">protein</text><text x="42" y="61" font-size="18" fill="#2a7f8f" font-weight="700">1. ER targeting during translation</text><path d="M315,203 L380,203" fill="none" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#er)"/><circle cx="414" cy="203" r="33" stroke="#2a7f8f" fill="#e6f3f5" stroke-width="2.5"/><path d="M454,203 L430,203 L420,193 M430,203 L420,213" stroke="#e8590c" stroke-width="4" fill="none"/><text x="370" y="276" font-size="19" fill="#2a7f8f">vesicle</text><path d="M447,203 L512,203" fill="none" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#er)"/><rect x="535" y="111" width="14" height="170" rx="6" stroke="#d9822b" fill="#fbeedd" stroke-width="2.5"/><rect x="558" y="111" width="14" height="170" rx="6" stroke="#d9822b" fill="#fbeedd" stroke-width="2.5"/><rect x="581" y="111" width="14" height="170" rx="6" stroke="#d9822b" fill="#fbeedd" stroke-width="2.5"/><rect x="604" y="111" width="14" height="170" rx="6" stroke="#d9822b" fill="#fbeedd" stroke-width="2.5"/><text x="525" y="61" font-size="20" fill="#d9822b" font-weight="700">2. Golgi</text><text x="518" y="322" font-size="18" fill="#1b2a3a">processing</text><text x="518" y="349" font-size="18" fill="#1b2a3a">and sorting</text><path d="M618,203 L708,203" fill="none" stroke="#d9822b" stroke-width="2.5" marker-end="url(#golgi)"/><circle cx="742" cy="203" r="32" stroke="#d9822b" fill="#fbeedd" stroke-width="2.5"/><path d="M781,203 L758,203 L748,193 M758,203 L748,213" stroke="#e8590c" stroke-width="4" fill="none"/><path d="M774,203 L857,203" fill="none" stroke="#d9822b" stroke-width="2.5" marker-end="url(#golgi)"/><rect x="860" y="75" width="26" height="230" rx="0" stroke="#8a6a12" fill="#f6f0de" stroke-width="2.5"/><path d="M873,205 L906,205 L928,184 M906,205 L928,226" stroke="#e8590c" stroke-width="5" fill="none"/><text x="800" y="61" font-size="20" fill="#8a6a12" font-weight="700">3. Cell surface</text><text x="914" y="112" font-size="17" fill="#8a6a12">outside</text><text x="842" y="300" font-size="17" fill="#1b2a3a" text-anchor="end">cytosol</text><text x="700" y="335" font-size="18" fill="#1b2a3a">ER lumen-facing domain</text><text x="700" y="362" font-size="18" fill="#1b2a3a">becomes extracellular.</text>
</svg>
