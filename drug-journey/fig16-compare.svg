<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="410" fill="white"/>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6a12"/></marker><marker id="cyto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbfaf5"/></marker><marker id="nuc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b4fa0"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7f8f"/></marker><marker id="golgi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9822b"/></marker><marker id="endo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e8b57"/></marker><marker id="drug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker><marker id="mito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs><text x="25" y="32" font-size="24" fill="#1b2a3a" font-weight="700">Choose the measurement that matches the molecular job</text><text x="330" y="82" font-size="23" fill="#e8590c" font-weight="700">mRNA–LNP</text><text x="665" y="82" font-size="23" fill="#e8590c" font-weight="700">Imatinib</text><line x1="25" x2="975" y1="103" y2="103" stroke="#d8dde3"/><text x="25" y="128" font-size="19" fill="#1b2a3a" font-weight="700">Therapeutic cargo</text><text x="330" y="128" font-size="18" fill="#1b2a3a">Instructions for a new protein</text><text x="665" y="128" font-size="18" fill="#1b2a3a">A small-molecule inhibitor</text><line x1="25" x2="975" y1="149" y2="149" stroke="#d8dde3"/><text x="25" y="174" font-size="19" fill="#1b2a3a" font-weight="700">Critical access step</text><text x="330" y="174" font-size="18" fill="#1b2a3a">Endosomal release to cytosol</text><text x="665" y="174" font-size="18" fill="#1b2a3a">Free drug reaches the kinase</text><line x1="25" x2="975" y1="195" y2="195" stroke="#d8dde3"/><text x="25" y="220" font-size="19" fill="#1b2a3a" font-weight="700">Molecular action</text><text x="330" y="220" font-size="18" fill="#1b2a3a">Translation; protein sorting</text><text x="665" y="220" font-size="18" fill="#1b2a3a">Inhibit an existing kinase</text><line x1="25" x2="975" y1="241" y2="241" stroke="#d8dde3"/><text x="25" y="266" font-size="19" fill="#1b2a3a" font-weight="700">Early evidence</text><text x="330" y="266" font-size="18" fill="#1b2a3a">New protein; correct location</text><text x="665" y="266" font-size="18" fill="#1b2a3a">Target engagement / activity</text><line x1="25" x2="975" y1="287" y2="287" stroke="#d8dde3"/><text x="25" y="312" font-size="19" fill="#1b2a3a" font-weight="700">Later response</text><text x="330" y="312" font-size="18" fill="#1b2a3a">Immune response in context</text><text x="665" y="312" font-size="18" fill="#1b2a3a">Growth arrest / death in context</text><text x="25" y="385" font-size="19" fill="#1b2a3a">In both: reaching the cell is one step; demonstrating the intended effect needs more evidence.</text>
</svg>
