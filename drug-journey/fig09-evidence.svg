<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="white"/>
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a6a12"/></marker><marker id="cyto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbfaf5"/></marker><marker id="nuc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b4fa0"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a7f8f"/></marker><marker id="golgi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9822b"/></marker><marker id="endo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e8b57"/></marker><marker id="drug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker><marker id="mito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs><text x="25" y="33" font-size="24" fill="#1b2a3a" font-weight="700">How do we know which barrier was crossed?</text><text x="25" y="78" font-size="20" fill="#1b2a3a" font-weight="700">Observation</text><text x="265" y="78" font-size="20" fill="#1b2a3a" font-weight="700">One possible measurement</text><text x="650" y="78" font-size="20" fill="#1b2a3a" font-weight="700">What it does not establish</text><line x1="25" x2="975" y1="95" y2="95" stroke="#d8dde3"/><text x="25" y="123" font-size="19" fill="#6b4fa0" font-weight="700">Cell-associated label</text><text x="265" y="115" font-size="18" fill="#1b2a3a">Microscopy or flow cytometry</text><text x="265" y="139" font-size="18" fill="#1b2a3a">with surface-label controls</text><text x="650" y="123" font-size="18" fill="#1b2a3a">Cytosolic delivery or translation</text><line x1="25" x2="975" y1="165" y2="165" stroke="#d8dde3"/><text x="25" y="193" font-size="19" fill="#6b4fa0" font-weight="700">Cytosolic RNA</text><text x="265" y="185" font-size="18" fill="#1b2a3a">Validated fractionation + RNA assay</text><text x="265" y="209" font-size="18" fill="#1b2a3a">with compartment-purity controls</text><text x="650" y="193" font-size="18" fill="#1b2a3a">Correct protein folding or trafficking</text><line x1="25" x2="975" y1="235" y2="235" stroke="#d8dde3"/><text x="25" y="263" font-size="19" fill="#6b4fa0" font-weight="700">New protein</text><text x="265" y="255" font-size="18" fill="#1b2a3a">Reporter or antigen assay</text><text x="265" y="279" font-size="18" fill="#1b2a3a">with untransfected controls</text><text x="650" y="263" font-size="18" fill="#1b2a3a">Intact protein on the cell surface</text><line x1="25" x2="975" y1="305" y2="305" stroke="#d8dde3"/><text x="25" y="333" font-size="19" fill="#6b4fa0" font-weight="700">Surface antigen</text><text x="265" y="325" font-size="18" fill="#1b2a3a">Antibody on unpermeabilised cells;</text><text x="265" y="349" font-size="18" fill="#1b2a3a">compare with total protein</text><text x="650" y="333" font-size="18" fill="#1b2a3a">Effective immune priming in a person</text>
</svg>
