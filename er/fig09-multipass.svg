  <text x="740" y="298" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">stop-transfer closes it again.</text>
  <text x="740" y="328" font-size="15" text-anchor="start" font-weight="bold" fill="#1b2a3a">Odd number of TM segments:</text>
  <text x="740" y="348" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">N and C on opposite sides.</text>
  <text x="740" y="368" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Even number: same side.</text>
