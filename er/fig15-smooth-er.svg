<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig15: jobs of the smooth ER: lipid synthesis, drug metabolism by P450, and the Ca2+ store; cytosol on top -->
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="0" y="0" width="1000" height="180" fill="#fbfaf5"/>
  <rect x="0" y="214" width="1000" height="186" fill="#e6f3f5"/>
  <rect x="0" y="180" width="1000" height="34" fill="#2a7f8f" opacity="0.35"/>
  <line x1="0" y1="180" x2="1000" y2="180" stroke="#2a7f8f" stroke-width="3"/>
  <line x1="0" y1="214" x2="1000" y2="214" stroke="#2a7f8f" stroke-width="3"/>
  <ellipse cx="130" cy="150" rx="34" ry="20" fill="#ffe3e3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="130" y="155" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">enzyme</text>
  <text x="130" y="40" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Lipids</text>
  <text x="130" y="62" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">phospholipids, cholesterol,</text>
  <text x="130" y="80" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">steroid hormones</text>
  <circle cx="100" cy="186" r="5" fill="#8a6a12"/><line x1="100" y1="190" x2="100" y2="196" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="120" cy="186" r="5" fill="#8a6a12"/><line x1="120" y1="190" x2="120" y2="196" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="140" cy="186" r="5" fill="#8a6a12"/><line x1="140" y1="190" x2="140" y2="196" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="160" cy="186" r="5" fill="#8a6a12"/><line x1="160" y1="190" x2="160" y2="196" stroke="#8a6a12" stroke-width="2"/>
  <text x="130" y="248" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">made on the cytosolic side;</text>
  <text x="130" y="266" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">a scramblase moves</text>
  <text x="130" y="284" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">half to the other side</text>
  <line x1="400" y1="180" x2="400" y2="214" stroke="#3b5bdb" stroke-width="12" stroke-linecap="round"/>
  <path d="M400,180 L 420,150" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="446" cy="124" r="30" fill="#dee2e6" stroke="#1b2a3a" stroke-width="2"/>
  <text x="446" y="129" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">P450</text>
  <text x="400" y="40" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Drug metabolism</text>
  <text x="400" y="62" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">cytochrome P450 enzymes make</text>
  <text x="400" y="80" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">drugs more water-soluble</text>
  <text x="400" y="248" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">liver smooth ER grows when</text>
  <text x="400" y="266" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">there is much to break down</text>
  <rect x="698" y="154" width="44" height="74" rx="10" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="720" y="146" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">SERCA pump</text>
  <line x1="720" y1="170" x2="720" y2="244" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="750" y="270" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a">ATP</text>
  <rect x="844" y="160" width="16" height="68" rx="6" fill="#e9ecef" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="880" y="160" width="16" height="68" rx="6" fill="#e9ecef" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="870" y="142" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">IP3 receptor</text>
  <line x1="870" y1="254" x2="870" y2="154" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="745" y="40" font-size="18" text-anchor="start" font-weight="bold" fill="#c2255c">Ca<tspan dy='-7' font-size='11'>2+</tspan><tspan dy='7'> store</tspan></text>
  <text x="795.0" y="62" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">pumped in all the time,</text>
  <text x="795.0" y="80" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">released as a signal</text>
  <circle cx="700" cy="300" r="6" fill="#c2255c"/>
  <circle cx="735" cy="330" r="6" fill="#c2255c"/>
  <circle cx="770" cy="290" r="6" fill="#c2255c"/>
  <circle cx="820" cy="320" r="6" fill="#c2255c"/>
  <circle cx="860" cy="300" r="6" fill="#c2255c"/>
  <circle cx="900" cy="340" r="6" fill="#c2255c"/>
  <circle cx="760" cy="360" r="6" fill="#c2255c"/>
  <circle cx="840" cy="360" r="6" fill="#c2255c"/>
  <circle cx="904" cy="164" r="6" fill="#c2255c"/>
  <text x="560" y="280" font-size="15" text-anchor="start" font-weight="bold" fill="#c2255c">lumen: ~0.5 mM</text>
  <text x="560" y="300" font-size="15" text-anchor="start" font-weight="normal" fill="#c2255c">free Ca<tspan dy='-7' font-size='11'>2+</tspan></text>
  <text x="670" y="106" font-size="15" text-anchor="start" font-weight="bold" fill="#c2255c">cytosol: ~0.0001 mM free Ca<tspan dy='-7' font-size='11'>2+</tspan></text>
  <text x="12" y="30" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">cytosol</text>
  <text x="12" y="384" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">ER lumen</text>
</svg>
