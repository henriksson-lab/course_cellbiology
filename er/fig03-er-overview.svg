<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" font-family="Helvetica, Arial, sans-serif">
  <!-- fig03: the ER is one membrane system: nuclear envelope, rough ER sheets, smooth ER tubules, one lumen -->
  <defs>
    <marker id="a3" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="440" fill="#fbfaf5"/>
  <!-- nuclear envelope: two membranes with the lumen between -->
  <circle cx="170" cy="220" r="132" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
  <circle cx="170" cy="220" r="116" fill="#efebf7" stroke="#2a7f8f" stroke-width="3"/>
  <circle cx="170" cy="220" r="116" fill="none" stroke="#6b4fa0" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text x="170" y="215" font-size="20" text-anchor="middle" fill="#1b2a3a" font-weight="bold">nucleus</text>
  <!-- rough ER sheets, joined to the outer nuclear membrane -->
  <g fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3">
    <path d="M 296,160 C 330,150 340,128 380,128 L 600,128 Q 616,128 616,141 Q 616,154 600,154 L 384,154 C 352,154 340,172 300,182 Z"/>
    <path d="M 302,208 L 600,208 Q 616,208 616,221 Q 616,234 600,234 L 302,234 Z"/>
    <path d="M 300,258 C 340,268 352,286 384,286 L 600,286 Q 616,286 616,299 Q 616,312 600,312 L 380,312 C 340,312 330,290 296,280 Z"/>
  </g>
  <rect x="290" y="206" width="16" height="30" fill="#e6f3f5"/>
  <g fill="#1b2a3a">
    <circle cx="400" cy="121" r="4"/><circle cx="430" cy="121" r="4"/><circle cx="460" cy="121" r="4"/><circle cx="490" cy="121" r="4"/><circle cx="520" cy="121" r="4"/><circle cx="550" cy="121" r="4"/><circle cx="580" cy="121" r="4"/>
    <circle cx="410" cy="161" r="4"/><circle cx="440" cy="161" r="4"/><circle cx="470" cy="161" r="4"/><circle cx="500" cy="161" r="4"/><circle cx="530" cy="161" r="4"/><circle cx="560" cy="161" r="4"/><circle cx="590" cy="161" r="4"/>
    <circle cx="340" cy="201" r="4"/><circle cx="370" cy="201" r="4"/><circle cx="400" cy="201" r="4"/><circle cx="430" cy="201" r="4"/><circle cx="460" cy="201" r="4"/><circle cx="490" cy="201" r="4"/><circle cx="520" cy="201" r="4"/><circle cx="550" cy="201" r="4"/><circle cx="580" cy="201" r="4"/>
    <circle cx="340" cy="241" r="4"/><circle cx="370" cy="241" r="4"/><circle cx="400" cy="241" r="4"/><circle cx="430" cy="241" r="4"/><circle cx="460" cy="241" r="4"/><circle cx="490" cy="241" r="4"/><circle cx="520" cy="241" r="4"/><circle cx="550" cy="241" r="4"/><circle cx="580" cy="241" r="4"/>
    <circle cx="410" cy="279" r="4"/><circle cx="440" cy="279" r="4"/><circle cx="470" cy="279" r="4"/><circle cx="500" cy="279" r="4"/><circle cx="530" cy="279" r="4"/><circle cx="560" cy="279" r="4"/><circle cx="590" cy="279" r="4"/>
    <circle cx="400" cy="319" r="4"/><circle cx="430" cy="319" r="4"/><circle cx="460" cy="319" r="4"/><circle cx="490" cy="319" r="4"/><circle cx="520" cy="319" r="4"/><circle cx="550" cy="319" r="4"/><circle cx="580" cy="319" r="4"/>
  </g>
  <!-- smooth ER: a network of tubules joined to the sheets -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="tub" d="M 612,221 L 680,221 L 730,170 L 800,160 L 850,110 M 730,170 L 760,250 L 840,260 L 900,210 M 760,250 L 720,320 L 790,360 L 870,330 L 840,260 M 800,160 L 840,260 M 612,141 L 680,100 L 730,170 M 612,299 L 660,330 L 720,320" stroke="#2a7f8f" stroke-width="15"/>
    <path d="M 612,221 L 680,221 L 730,170 L 800,160 L 850,110 M 730,170 L 760,250 L 840,260 L 900,210 M 760,250 L 720,320 L 790,360 L 870,330 L 840,260 M 800,160 L 840,260 M 612,141 L 680,100 L 730,170 M 612,299 L 660,330 L 720,320" stroke="#e6f3f5" stroke-width="9"/>
  </g>
  <!-- labels -->
  <text x="20" y="34" font-size="18" fill="#1b2a3a" font-style="italic">cytosol</text>
  <text x="300" y="40" font-size="18" fill="#1b2a3a" font-weight="bold">rough ER</text>
  <text x="300" y="62" font-size="16" fill="#1b2a3a">flat sheets with ribosomes</text>
  <line x1="390" y1="70" x2="420" y2="112" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="690" y="40" font-size="18" fill="#1b2a3a" font-weight="bold">smooth ER</text>
  <text x="690" y="62" font-size="16" fill="#1b2a3a">tubules, no ribosomes</text>
  <line x1="760" y1="70" x2="790" y2="146" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a3)"/>
  <text x="20" y="410" font-size="16" fill="#1b2a3a">nuclear envelope: two membranes;</text>
  <text x="20" y="430" font-size="16" fill="#1b2a3a">the outer one is part of the ER</text>
  <line x1="120" y1="392" x2="110" y2="350" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="440" y="378" width="18" height="18" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="466" y="393" font-size="16" fill="#1b2a3a">ER lumen: one continuous space, from the nuclear envelope</text>
  <text x="466" y="415" font-size="16" fill="#1b2a3a">to the tips of the tubules (about 10 % of cell volume)</text>
</svg>
