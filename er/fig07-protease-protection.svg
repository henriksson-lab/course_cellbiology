<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" font-family="Helvetica, Arial, sans-serif">
  <!-- fig07: cell-free translation with and without microsomes, protease and detergent; gel result -->
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker></defs>
  <rect width="1000" height="356" fill="#ffffff"/>
  <circle cx="60" cy="24" r="14" fill="#1b2a3a"/>  <text x="60" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
  <text x="80" y="22" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">no microsomes</text>
  <path d="M80,150 q 10 -16 20 0 t 20 0 t 20 0" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="62" y1="150" x2="80" y2="150" stroke="#e8590c" stroke-width="9" stroke-linecap="round"/>
  <text x="110" y="200" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">precursor, with</text>
  <text x="110" y="218" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">its signal sequence</text>
  <circle cx="270" cy="24" r="14" fill="#1b2a3a"/>  <text x="270" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
  <text x="290" y="22" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">+ microsomes</text>
  <circle cx="330" cy="150" r="50" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="4"/>
  <circle cx="330" cy="150" r="18" fill="#dee2e6" stroke="#1b2a3a" stroke-width="2"/>
  <text x="330" y="226" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">inside the vesicle:</text>
  <text x="330" y="244" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">signal cut off</text>
  <circle cx="480" cy="24" r="14" fill="#1b2a3a"/>  <text x="480" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
  <text x="500" y="22" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">+ microsomes</text>
  <text x="500" y="41" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">+ protease</text>
  <circle cx="540" cy="150" r="50" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="4"/>
  <circle cx="540" cy="150" r="18" fill="#dee2e6" stroke="#1b2a3a" stroke-width="2"/>
  <text x="540" y="226" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">inside the vesicle:</text>
  <text x="540" y="244" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">signal cut off, protected</text>
  <path d="M463,110 a 7 7 0 1 1 0 0.1 M470,110 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M599,120 a 7 7 0 1 1 0 0.1 M606,120 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M473,198 a 7 7 0 1 1 0 0.1 M480,198 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M603,190 a 7 7 0 1 1 0 0.1 M610,190 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <circle cx="690" cy="24" r="14" fill="#1b2a3a"/>  <text x="690" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
  <text x="710" y="22" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">+ microsomes</text>
  <text x="710" y="41" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">+ protease + detergent</text>
  <circle cx="750" cy="150" r="50" fill="none" stroke="#2a7f8f" stroke-width="3" stroke-dasharray="6 9"/>
  <line x1="736" y1="144" x2="744" y2="147" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"/>
  <line x1="758" y1="160" x2="766" y2="163" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"/>
  <line x1="762" y1="134" x2="770" y2="137" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"/>
  <line x1="744" y1="168" x2="752" y2="171" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="226" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">membrane dissolved:</text>
  <text x="750" y="244" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">protein digested</text>
  <path d="M673,110 a 7 7 0 1 1 0 0.1 M680,110 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M809,120 a 7 7 0 1 1 0 0.1 M816,120 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M683,198 a 7 7 0 1 1 0 0.1 M690,198 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <path d="M813,190 a 7 7 0 1 1 0 0.1 M820,190 l 9 -4 l -3 9 z" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
  <text x="930" y="52" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">gel</text>
  <rect x="880" y="70" width="100" height="190" rx="4" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="901" y="282" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">1</text>
  <rect x="894" y="140" width="16" height="7" fill="#1b2a3a"/>
  <text x="923" y="282" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">2</text>
  <rect x="916" y="170" width="16" height="7" fill="#1b2a3a"/>
  <text x="945" y="282" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">3</text>
  <rect x="938" y="170" width="16" height="7" fill="#1b2a3a"/>
  <text x="967" y="282" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a">4</text>
  <text x="872" y="148" font-size="14" text-anchor="end" font-weight="normal" fill="#1b2a3a">larger</text>
  <text x="872" y="178" font-size="14" text-anchor="end" font-weight="normal" fill="#1b2a3a">smaller</text>
  <text x="20" y="310" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Protein made in a test tube from its mRNA. Microsomes = sealed vesicles of ER membrane, lumen inside.</text>
  <text x="20" y="332" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">Protease cannot cross a membrane: what is inside the vesicle survives, unless detergent opens it.</text>
</svg>
