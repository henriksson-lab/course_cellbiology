<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <!-- fig14: the unfolded protein response: IRE1, PERK and ATF6 sense unfolded proteins in the ER lumen; ER lumen on top in this figure -->
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="0" y="0" width="1000" height="120" fill="#e6f3f5"/>
  <rect x="0" y="154" width="1000" height="316" fill="#fbfaf5"/>
  <rect x="0" y="120" width="1000" height="34" fill="#2a7f8f" opacity="0.35"/>
  <line x1="0" y1="120" x2="1000" y2="120" stroke="#2a7f8f" stroke-width="3"/><line x1="0" y1="154" x2="1000" y2="154" stroke="#2a7f8f" stroke-width="3"/>
  <text x="12" y="26" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">ER lumen</text>
  <text x="12" y="180" font-size="17" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-style="italic">cytosol</text>
  <path d="M150,60 q 10 -20 20 0 t 20 0 t 20 0" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520,50 q 10 -20 20 0 t 20 0 t 20 0" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M800,60 q 10 -20 20 0 t 20 0 t 20 0" fill="none" stroke="#1b2a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="26" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">unfolded proteins pile up and pull BiP away from the sensors</text>
  <rect x="236" y="86" width="28" height="104" rx="8" fill="#f3d9fa" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="272" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">IRE1</text>
  <rect x="486" y="86" width="28" height="104" rx="8" fill="#d0ebff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="522" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">PERK</text>
  <rect x="736" y="86" width="28" height="104" rx="8" fill="#d3f9d8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="772" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">ATF6</text>
  <rect x="150" y="230" width="200" height="60" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="250" y="255" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">splices XBP1 mRNA</text>
  <text x="250" y="276" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">→ XBP1 (TF)</text>
  <line x1="250" y1="190" x2="250" y2="228" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="400" y="230" width="200" height="60" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="500" y="255" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">phosphorylates eIF2α</text>
  <text x="500" y="276" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">→ less translation</text>
  <line x1="500" y1="190" x2="500" y2="228" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="650" y="230" width="200" height="60" rx="10" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="750" y="255" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">moves to the Golgi,</text>
  <text x="750" y="276" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">is cut → ATF6 (TF)</text>
  <line x1="750" y1="190" x2="750" y2="228" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="120" y="330" width="760" height="70" rx="30" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
  <text x="140" y="356" font-size="15" text-anchor="start" font-weight="bold" fill="#6b4fa0">nucleus</text>
  <text x="500" y="362" font-size="16" text-anchor="middle" font-weight="normal" fill="#1b2a3a">more chaperones (BiP, PDI), more ERAD, more ER membrane</text>
  <text x="500" y="384" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">+ ATF4 (from PERK): if the stress lasts, CHOP → apoptosis</text>
  <line x1="250" y1="292" x2="260" y2="328" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="750" y1="292" x2="740" y2="328" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="520" y1="292" x2="540" y2="328" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="500" y="430" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Goal: less load in, more capacity, more removal. If balance cannot be restored, the cell dies.</text>
  <text x="500" y="454" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(TF = transcription factor)</text>
</svg>
