<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="m1007" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1b2a3a"/></marker></defs>
<rect width="900" height="370" fill="#fbfaf5"/>
<rect x="20" y="40" width="250" height="110" rx="8" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="145" y="72" font-size="17" fill="#2a7f8f" text-anchor="middle" font-weight="bold"><tspan dy="0">ER lumen</tspan></text>
<text x="145" y="98" font-size="16" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">more unfolded proteins</tspan></text>
<text x="145" y="120" font-size="16" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">than chaperones can fold</tspan></text>
<path d="M60,141 q6,-10 12,0 q6,10 12,0" stroke="#e8590c" stroke-width="2.5" fill="none" />
<path d="M100,141 q6,-10 12,0 q6,10 12,0" stroke="#e8590c" stroke-width="2.5" fill="none" />
<path d="M190,141 q6,-10 12,0 q6,10 12,0" stroke="#e8590c" stroke-width="2.5" fill="none" />
<path d="M230,141 q6,-10 12,0 q6,10 12,0" stroke="#e8590c" stroke-width="2.5" fill="none" />
<path d="M270,95L330,95" stroke="#1b2a3a" stroke-width="3" fill="none" marker-end="url(#m1007)"/>
<rect x="332" y="40" width="200" height="110" rx="8" fill="#fff" stroke="#e8590c" stroke-width="3"/>
<text x="432" y="72" font-size="17" fill="#e8590c" text-anchor="middle" font-weight="bold"><tspan dy="0">Sensors</tspan></text>
<text x="432" y="98" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">in the ER membrane:</tspan></text>
<text x="432" y="122" font-size="16" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">IRE1, PERK, ATF6</tspan></text>
<path d="M532,95L590,95" stroke="#1b2a3a" stroke-width="3" fill="none" marker-end="url(#m1007)"/>
<rect x="592" y="20" width="290" height="150" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="3"/>
<text x="737" y="48" font-size="17" fill="#2a7f8f" text-anchor="middle" font-weight="bold"><tspan dy="0">Unfolded protein response</tspan></text>
<text x="607" y="78" font-size="15" fill="#1b2a3a"><tspan dy="0">1. make fewer new proteins</tspan></text>
<text x="607" y="102" font-size="15" fill="#1b2a3a"><tspan dy="0">2. make more chaperones</tspan></text>
<text x="607" y="126" font-size="15" fill="#1b2a3a"><tspan dy="0">3. degrade more (ERAD)</tspan></text>
<text x="607" y="150" font-size="15" fill="#1b2a3a"><tspan dy="0">4. build more ER membrane</tspan></text>
<path d="M737,170 L737,215 L145,215 L145,155" stroke="#1b2a3a" stroke-width="3" fill="none" />
<path d="M145,170L145,153" stroke="#1b2a3a" stroke-width="3" fill="none" marker-end="url(#m1007)"/>
<text x="440" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">load falls: back to balance (negative feedback)</tspan></text>
<rect x="240" y="280" width="420" height="70" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
<text x="450" y="308" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">If the stress cannot be fixed, the same sensors</tspan></text>
<text x="450" y="330" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">switch the cell to apoptosis.</tspan></text>
</svg>
