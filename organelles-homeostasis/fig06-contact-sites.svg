<text x="600" y="40" font-size="17" fill="#1b2a3a" font-weight="bold"><tspan dy="0">Orange rings: contact sites</tspan></text>
<text x="600" y="64" font-size="16" fill="#1b2a3a"><tspan dy="0">The ER touches almost every</tspan></text>
<text x="600" y="86" font-size="16" fill="#1b2a3a"><tspan dy="0">organelle and the plasma membrane.</tspan></text>
