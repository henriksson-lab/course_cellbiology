<text x="740" y="330" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">tether proteins hold the</tspan></text>
<text x="740" y="350" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">membranes 10–30 nm apart</tspan></text>
<text x="740" y="382" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold"><tspan dy="0">No fusion: each organelle</tspan></text>
<text x="740" y="402" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">keeps its own lumen.</tspan></text>
<text x="740" y="422" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan dy="0">Molecules hop across.</tspan></text>
