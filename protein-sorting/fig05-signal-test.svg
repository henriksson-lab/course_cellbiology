<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" font-family="Helvetica, Arial, sans-serif">
  <!-- fig05: how do we know? A signal is sufficient (moves an unrelated protein) and necessary (a point mutation abolishes it). Cartoon fluorescence images, after the classic SV40 NLS experiments. -->
  <rect x="14" y="40" width="255" height="200" rx="8" fill="#0b0f14"/>
  <ellipse cx="141.5" cy="140" rx="105" ry="80" fill="rgba(64,192,87,0.55)" stroke="#2f9e44" stroke-opacity="0.5" stroke-width="2"/>
  <ellipse cx="149.5" cy="144" rx="42" ry="34" fill="#0b0f14"/>
  <ellipse cx="149.5" cy="144" rx="42" ry="34" fill="rgba(64,192,87,0.55)" stroke="#adb5bd" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="141.5" y="28" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">1. GFP alone (27 kDa)</text>
  <text x="141.5" y="268" font-size="16" fill="#1b2a3a" text-anchor="middle">small: diffuses</text>
  <text x="141.5" y="290" font-size="16" fill="#1b2a3a" text-anchor="middle">through pores</text>
  <rect x="295" y="40" width="255" height="200" rx="8" fill="#0b0f14"/>
  <ellipse cx="422.5" cy="140" rx="105" ry="80" fill="rgba(64,192,87,0.60)" stroke="#2f9e44" stroke-opacity="0.5" stroke-width="2"/>
  <ellipse cx="430.5" cy="144" rx="42" ry="34" fill="#0b0f14"/>
  <ellipse cx="430.5" cy="144" rx="42" ry="34" fill="rgba(64,192,87,0.05)" stroke="#adb5bd" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="422.5" y="28" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2. large enzyme + GFP</text>
  <text x="422.5" y="268" font-size="16" fill="#1b2a3a" text-anchor="middle">too big for pores:</text>
  <text x="422.5" y="290" font-size="16" fill="#1b2a3a" text-anchor="middle">stays in the cytosol</text>
  <rect x="576" y="40" width="255" height="200" rx="8" fill="#0b0f14"/>
  <ellipse cx="703.5" cy="140" rx="105" ry="80" fill="rgba(64,192,87,0.08)" stroke="#2f9e44" stroke-opacity="0.5" stroke-width="2"/>
  <ellipse cx="711.5" cy="144" rx="42" ry="34" fill="#0b0f14"/>
  <ellipse cx="711.5" cy="144" rx="42" ry="34" fill="rgba(64,192,87,0.95)" stroke="#adb5bd" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="703.5" y="28" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">3. large enzyme + GFP + NLS</text>
  <text x="703.5" y="268" font-size="16" fill="#1b2a3a" text-anchor="middle">PKKKRKV added:</text>
  <text x="703.5" y="290" font-size="16" fill="#1b2a3a" text-anchor="middle">imported</text>
  <rect x="857" y="40" width="255" height="200" rx="8" fill="#0b0f14"/>
  <ellipse cx="984.5" cy="140" rx="105" ry="80" fill="rgba(64,192,87,0.60)" stroke="#2f9e44" stroke-opacity="0.5" stroke-width="2"/>
  <ellipse cx="992.5" cy="144" rx="42" ry="34" fill="#0b0f14"/>
  <ellipse cx="992.5" cy="144" rx="42" ry="34" fill="rgba(64,192,87,0.05)" stroke="#adb5bd" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="984.5" y="28" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">4. … + mutant NLS</text>
  <text x="984.5" y="268" font-size="16" fill="#1b2a3a" text-anchor="middle">one K changed to T</text>
  <text x="984.5" y="290" font-size="16" fill="#1b2a3a" text-anchor="middle">(PKTKRKV): not imported</text>
  <text x="150" y="232" font-size="14" fill="#ced4da" text-anchor="middle">dashed: nucleus</text>
  <text x="557" y="332" font-size="17" fill="#2b8a3e" text-anchor="middle" font-weight="bold">2 vs 3: the NLS is sufficient</text>
  <text x="831" y="332" font-size="17" fill="#e8590c" text-anchor="middle" font-weight="bold">3 vs 4: the NLS is necessary</text>
</svg>
