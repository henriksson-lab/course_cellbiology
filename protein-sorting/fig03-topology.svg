<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="Helvetica, Arial, sans-serif">
  <!-- fig03: recap of topology. Fills show the spaces: cytosol side (cytosol + nucleoplasm), lumen side (ER, Golgi, vesicles, lysosomes = topologically outside), and the separate spaces of mitochondria and peroxisomes. Strokes use the colour key. -->
  <rect x="0" y="0" width="700" height="470" fill="#dbe7f3"/>
  <text x="16" y="28" font-size="17" fill="#1b2a3a" font-weight="bold">outside the cell</text>
  <rect x="20" y="44" width="660" height="410" rx="55" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
  <!-- nuclear envelope: two membranes with a lumen-side gap, pores join nucleoplasm and cytosol -->
  <ellipse cx="185" cy="225" rx="122" ry="112" fill="#dbe7f3" stroke="#6b4fa0" stroke-width="3"/>
  <ellipse cx="185" cy="225" rx="108" ry="98" fill="#fbfaf5" stroke="#6b4fa0" stroke-width="3"/>
  <rect x="176" y="108" width="18" height="22" fill="#fbfaf5"/>
  <line x1="176" y1="111" x2="176" y2="128" stroke="#6b4fa0" stroke-width="3"/>
  <line x1="194" y1="111" x2="194" y2="128" stroke="#6b4fa0" stroke-width="3"/>
  <rect x="176" y="320" width="18" height="22" fill="#fbfaf5"/>
  <line x1="176" y1="322" x2="176" y2="339" stroke="#6b4fa0" stroke-width="3"/>
  <line x1="194" y1="322" x2="194" y2="339" stroke="#6b4fa0" stroke-width="3"/>
  <text x="185" y="220" font-size="18" fill="#6b4fa0" text-anchor="middle" font-weight="bold">nucleoplasm</text>
  <text x="185" y="242" font-size="15" fill="#1b2a3a" text-anchor="middle">joined to the cytosol</text>
  <text x="185" y="260" font-size="15" fill="#1b2a3a" text-anchor="middle">through nuclear pores</text>
  <text x="185" y="96" font-size="15" fill="#6b4fa0" text-anchor="middle" font-weight="bold">nuclear pore</text>
  <!-- ER sheets continuous with the outer nuclear membrane -->
  <path d="M 300 180 C 330 170, 345 150, 380 150 L 420 150 C 440 150, 440 172, 420 172 L 385 172 C 360 172, 345 190, 305 200 Z" fill="#dbe7f3" stroke="#2a7f8f" stroke-width="3"/>
  <path d="M 305 250 C 340 255, 350 270, 385 270 L 425 270 C 445 270, 445 292, 425 292 L 385 292 C 350 292, 335 275, 300 268 Z" fill="#dbe7f3" stroke="#2a7f8f" stroke-width="3"/>
  <text x="455" y="167" font-size="17" fill="#2a7f8f" font-weight="bold">ER lumen</text>
  <!-- Golgi -->
  <path d="M 500 210 q -12 40 0 80 l 13 0 q -12 -40 0 -80 z" fill="#dbe7f3" stroke="#d9822b" stroke-width="2.5"/>
  <path d="M 524 210 q -12 40 0 80 l 13 0 q -12 -40 0 -80 z" fill="#dbe7f3" stroke="#d9822b" stroke-width="2.5"/>
  <path d="M 548 210 q -12 40 0 80 l 13 0 q -12 -40 0 -80 z" fill="#dbe7f3" stroke="#d9822b" stroke-width="2.5"/>
  <text x="530" y="200" font-size="17" fill="#d9822b" text-anchor="middle" font-weight="bold">Golgi</text>
  <circle cx="470" cy="250" r="9" fill="#dbe7f3" stroke="#2a7f8f" stroke-width="2.5"/>
  <circle cx="610" cy="235" r="9" fill="#dbe7f3" stroke="#d9822b" stroke-width="2.5"/>
  <!-- lysosome -->
  <circle cx="590" cy="350" r="30" fill="#dbe7f3" stroke="#2e8b57" stroke-width="3"/>
  <text x="590" y="404" font-size="17" fill="#2e8b57" text-anchor="middle" font-weight="bold">lysosome</text>
  <!-- mitochondrion: two membranes, matrix its own space -->
  <rect x="245" y="365" width="190" height="62" rx="31" fill="#fbfaf5" stroke="#a8324a" stroke-width="3"/>
  <rect x="256" y="375" width="168" height="42" rx="21" fill="#f3d3da" stroke="#a8324a" stroke-width="2"/>
  <text x="340" y="402" font-size="16" fill="#a8324a" text-anchor="middle" font-weight="bold">matrix</text>
  <text x="235" y="401" font-size="17" fill="#a8324a" text-anchor="end" font-weight="bold">mitochondrion</text>
  <!-- peroxisome -->
  <circle cx="420" cy="88" r="24" fill="#e9eef8" stroke="#3b5bab" stroke-width="3"/>
  <text x="452" y="94" font-size="17" fill="#3b5bab" font-weight="bold">peroxisome</text>
  <text x="330" y="335" font-size="18" fill="#1b2a3a" font-style="italic" text-anchor="middle">cytosol</text>
  <!-- legend -->
  <text x="720" y="70" font-size="19" fill="#1b2a3a" font-weight="bold">Which side is a protein on?</text>
  <rect x="720" y="98" width="28" height="28" rx="4" fill="#fbfaf5" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="760" y="110" font-size="17" fill="#1b2a3a" font-weight="bold">Cytosol side</text>
  <text x="760" y="131" font-size="16" fill="#1b2a3a">cytosol + nucleoplasm</text>
  <rect x="720" y="168" width="28" height="28" rx="4" fill="#dbe7f3" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="760" y="180" font-size="17" fill="#1b2a3a" font-weight="bold">Lumen side = outside</text>
  <text x="760" y="201" font-size="16" fill="#1b2a3a">ER, Golgi, vesicles,</text>
  <text x="760" y="221" font-size="16" fill="#1b2a3a">endosomes, lysosomes</text>
  <rect x="720" y="258" width="14" height="28" fill="#f3d3da" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="734" y="258" width="14" height="28" fill="#e9eef8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="760" y="270" font-size="17" fill="#1b2a3a" font-weight="bold">Own spaces</text>
  <text x="760" y="291" font-size="16" fill="#1b2a3a">mitochondrial matrix,</text>
  <text x="760" y="311" font-size="16" fill="#1b2a3a">peroxisome interior</text>
  <text x="720" y="370" font-size="16" fill="#1b2a3a">Vesicles move proteins between</text>
  <text x="720" y="391" font-size="16" fill="#1b2a3a">lumen-side spaces <tspan font-weight="bold">without</tspan> crossing</text>
  <text x="720" y="412" font-size="16" fill="#1b2a3a">a membrane. Entering the lumen</text>
  <text x="720" y="433" font-size="16" fill="#1b2a3a">side the first time <tspan font-weight="bold">does</tspan> cross one.</text>
</svg>
