<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
  <!-- fig10: the first fork happens during translation. Without an ER signal the protein is finished in the cytosol; with one, SRP brings the ribosome to the ER and the chain enters while it is made. Details in the ER lecture. -->
  <defs><marker id="ak" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
  <rect x="0" y="0" width="1100" height="400" fill="#fbfaf5"/>
  <line x1="470" y1="20" x2="470" y2="380" stroke="#ced4da" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="235" y="34" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold">No ER signal peptide</text>
  <path d="M 60 180 L 400 180" stroke="#868e96" stroke-width="3"/>
  <text x="380" y="172" font-size="14" fill="#868e96" text-anchor="middle">mRNA</text>
  <ellipse cx="200" cy="144" rx="26" ry="16" fill="#ced4da" stroke="#1b2a3a" stroke-width="1.5"/>
  <ellipse cx="200" cy="170" rx="34" ry="20" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M 200 128 C 190 100, 230 95, 220 75 C 210 55, 250 50, 260 70" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
  <text x="275" y="92" font-size="15" fill="#e8590c" text-anchor="start">protein folds</text>
  <text x="275" y="110" font-size="15" fill="#e8590c" text-anchor="start">in the cytosol</text>
  <text x="235" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle">Translation finishes in the cytosol.</text>
  <text x="235" y="264" font-size="16" fill="#1b2a3a" text-anchor="middle">Then the protein stays there, or other</text>
  <text x="235" y="288" font-size="16" fill="#1b2a3a" text-anchor="middle">signals take it to the nucleus,</text>
  <text x="235" y="312" font-size="16" fill="#1b2a3a" text-anchor="middle">mitochondria or peroxisomes</text>
  <text x="235" y="336" font-size="16" fill="#1b2a3a" text-anchor="middle">(after translation).</text>
  <text x="785" y="34" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">N-terminal ER signal peptide</text>
  <rect x="490" y="250" width="610" height="150" fill="#e6f3f5"/>
  <line x1="490" y1="250" x2="1100" y2="250" stroke="#2a7f8f" stroke-width="4"/>
  <line x1="490" y1="268" x2="1100" y2="268" stroke="#2a7f8f" stroke-width="4"/>
  <text x="1085" y="385" font-size="18" fill="#2a7f8f" text-anchor="end" font-weight="bold">ER lumen</text>
  <text x="1085" y="236" font-size="15" fill="#2a7f8f" text-anchor="end" font-weight="bold">ER membrane</text>
  <ellipse cx="580" cy="124" rx="26" ry="16" fill="#ced4da" stroke="#1b2a3a" stroke-width="1.5"/>
  <ellipse cx="580" cy="150" rx="34" ry="20" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M 580 108 L 588 80" stroke="#2a7f8f" stroke-width="7" stroke-linecap="round"/>
  <path d="M 572 70 q 16 -22 40 -8 l -6 14 q -16 -8 -26 6 z" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
  <text x="622" y="62" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">SRP</text>
  <text x="520" y="82" font-size="14" fill="#2a7f8f" text-anchor="end" font-weight="bold">signal</text>
  <text x="520" y="98" font-size="14" fill="#2a7f8f" text-anchor="end" font-weight="bold">peptide</text>
  <path d="M 625 150 C 680 160, 720 180, 770 205" fill="none" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <text x="580" y="200" font-size="15" fill="#1b2a3a" text-anchor="middle">1. SRP binds the</text>
  <text x="580" y="218" font-size="15" fill="#1b2a3a" text-anchor="middle">signal, pauses</text>
  <rect x="823" y="246" width="34" height="26" fill="#dee2e6" stroke="#1b2a3a" stroke-width="1.5"/>
  <ellipse cx="840" cy="194" rx="26" ry="16" fill="#ced4da" stroke="#1b2a3a" stroke-width="1.5"/>
  <ellipse cx="840" cy="220" rx="34" ry="20" fill="#adb5bd" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M 840 240 L 840 300 C 840 330, 880 330, 900 315 C 930 295, 960 330, 990 320" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
  <path d="M 790 330 L 806 300" stroke="#2a7f8f" stroke-width="7" stroke-linecap="round"/>
  <text x="780" y="352" font-size="14" fill="#2a7f8f" text-anchor="middle" font-weight="bold">signal peptide</text>
  <text x="780" y="370" font-size="14" fill="#2a7f8f" text-anchor="middle" font-weight="bold">cut off</text>
  <text x="940" y="180" font-size="15" fill="#1b2a3a" text-anchor="start">2. at the translocator,</text>
  <text x="940" y="198" font-size="15" fill="#1b2a3a" text-anchor="start">the chain enters the ER</text>
  <text x="940" y="216" font-size="15" fill="#1b2a3a" text-anchor="start">while it is being made</text>
  <text x="1000" y="345" font-size="15" fill="#e8590c" text-anchor="end">3. folds in the lumen</text>
</svg>
