<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" font-family="Helvetica, Arial, sans-serif">
  <!-- fig02: the question. Almost all proteins are made by ribosomes in the cytosol; each must reach one of many compartments. -->
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#e8590c"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="500" fill="#dbe7f3"/>
  <text x="1065" y="28" font-size="17" fill="#1b2a3a" text-anchor="end" font-weight="bold">outside the cell</text>
  <rect x="20" y="44" width="880" height="436" rx="60" fill="#fbfaf5" stroke="#8a6a12" stroke-width="5"/>
  <!-- nucleus -->
  <ellipse cx="170" cy="200" rx="105" ry="90" fill="#efebf7" stroke="#6b4fa0" stroke-width="3"/>
  <text x="170" y="206" font-size="19" fill="#6b4fa0" text-anchor="middle" font-weight="bold">nucleus</text>
  <!-- ER -->
  <path d="M 120 330 q 60 -25 120 0 q 60 25 120 0" fill="none" stroke="#2a7f8f" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
  <path d="M 120 330 q 60 -25 120 0 q 60 25 120 0" fill="none" stroke="#2a7f8f" stroke-width="3"/>
  <path d="M 120 380 q 60 -25 120 0 q 60 25 120 0" fill="none" stroke="#2a7f8f" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
  <path d="M 120 380 q 60 -25 120 0 q 60 25 120 0" fill="none" stroke="#2a7f8f" stroke-width="3"/>
  <text x="70" y="362" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">ER</text>
  <!-- mitochondrion -->
  <rect x="420" y="390" width="170" height="60" rx="30" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
  <text x="505" y="426" font-size="17" fill="#a8324a" text-anchor="middle" font-weight="bold">mitochondrion</text>
  <!-- peroxisome -->
  <circle cx="470" cy="100" r="30" fill="#e9eef8" stroke="#3b5bab" stroke-width="3"/>
  <text x="515" y="106" font-size="17" fill="#3b5bab" font-weight="bold">peroxisome</text>
  <!-- Golgi -->
  <path d="M 700 150 q -14 50 0 100 l 11 0 q -14 -50 0 -100 z" fill="#fbeedd" stroke="#d9822b" stroke-width="2.5"/>
  <path d="M 722 150 q -14 50 0 100 l 11 0 q -14 -50 0 -100 z" fill="#fbeedd" stroke="#d9822b" stroke-width="2.5"/>
  <path d="M 744 150 q -14 50 0 100 l 11 0 q -14 -50 0 -100 z" fill="#fbeedd" stroke="#d9822b" stroke-width="2.5"/>
  <text x="727" y="138" font-size="17" fill="#d9822b" text-anchor="middle" font-weight="bold">Golgi</text>
  <!-- lysosome -->
  <circle cx="790" cy="380" r="32" fill="#e3f3ea" stroke="#2e8b57" stroke-width="3"/>
  <text x="790" y="436" font-size="17" fill="#2e8b57" text-anchor="middle" font-weight="bold">lysosome</text>
  <!-- ribosomes in the middle -->
  <g fill="#ced4da" stroke="#1b2a3a" stroke-width="1">
    <ellipse cx="470" cy="250" rx="14" ry="9"/><ellipse cx="470" cy="236" rx="10" ry="6"/>
    <ellipse cx="510" cy="268" rx="14" ry="9"/><ellipse cx="510" cy="254" rx="10" ry="6"/>
    <ellipse cx="545" cy="240" rx="14" ry="9"/><ellipse cx="545" cy="226" rx="10" ry="6"/>
  </g>
  <text x="505" y="302" font-size="17" fill="#1b2a3a" text-anchor="middle">ribosomes</text>
  <text x="505" y="322" font-size="17" fill="#1b2a3a" text-anchor="middle">in the cytosol</text>
  <!-- arrows with question marks -->
  <g stroke="#e8590c" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#ah)">
    <line x1="455" y1="240" x2="283" y2="210"/>
    <line x1="460" y1="262" x2="352" y2="330"/>
    <line x1="575" y1="268" x2="575" y2="382"/>
    <line x1="490" y1="222" x2="476" y2="138"/>
    <line x1="565" y1="236" x2="688" y2="205"/>
    <line x1="590" y1="262" x2="760" y2="362"/>
    <line x1="575" y1="250" x2="896" y2="300"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">
    <text x="365" y="214">?</text>
    <text x="388" y="281">?</text>
    <text x="594" y="340">?</text>
    <text x="465" y="185">?</text>
    <text x="628" y="208">?</text>
    <text x="660" y="342">?</text>
    <text x="780" y="266">?</text>
  </g>
  <text x="990" y="294" font-size="16" fill="#8a6a12" text-anchor="middle" font-weight="bold">plasma membrane</text>
  <text x="990" y="314" font-size="16" fill="#8a6a12" text-anchor="middle" font-weight="bold">or outside</text>
</svg>
