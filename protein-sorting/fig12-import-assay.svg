<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Helvetica, Arial, sans-serif">
  <!-- fig12: how do we know? Import into isolated mitochondria in a test tube, read out by protease protection and gel electrophoresis. Schematic gel, not real data. -->
  <defs><marker id="ak" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
  <path d="M 74 110 L 74 200 Q 74 230 100 230 Q 126 230 126 200 L 126 110" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="2"/>
  <text x="100" y="258" font-size="15" fill="#1b2a3a" text-anchor="middle">precursor</text>
  <path d="M 76 170 q 7 -8 14 0 q 7 8 14 0" fill="none" stroke="#e8590c" stroke-width="3"/>
  <path d="M 104 170 l 8 0" stroke="#a8324a" stroke-width="5"/>
  <path d="M 92 200 q 7 -8 14 0 q 7 8 14 0" fill="none" stroke="#e8590c" stroke-width="3"/>
  <path d="M 120 200 l 8 0" stroke="#a8324a" stroke-width="5"/>
  <path d="M 78 135 q 7 -8 14 0 q 7 8 14 0" fill="none" stroke="#e8590c" stroke-width="3"/>
  <path d="M 106 135 l 8 0" stroke="#a8324a" stroke-width="5"/>
  <text x="100" y="286" font-size="14" fill="#555" text-anchor="middle">(radioactive,</text>
  <text x="100" y="304" font-size="14" fill="#555" text-anchor="middle">made in a test tube)</text>
  <path d="M 140 170 L 210 170" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <path d="M 234 110 L 234 200 Q 234 230 260 230 Q 286 230 286 200 L 286 110" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="2"/>
  <text x="260" y="258" font-size="15" fill="#1b2a3a" text-anchor="middle">+ mitochondria</text>
  <rect x="240" y="139" width="40" height="22" rx="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <rect x="236" y="179" width="40" height="22" rx="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <path d="M 238 120 q 7 -8 14 0 q 7 8 14 0" fill="none" stroke="#e8590c" stroke-width="3"/>
  <path d="M 266 120 l 8 0" stroke="#a8324a" stroke-width="5"/>
  <text x="260" y="286" font-size="14" fill="#555" text-anchor="middle">(isolated from cells;</text>
  <text x="260" y="304" font-size="14" fill="#555" text-anchor="middle">37 °C, a few minutes)</text>
  <path d="M 300 170 L 370 170" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ak)"/>
  <path d="M 404 110 L 404 200 Q 404 230 430 230 Q 456 230 456 200 L 456 110" fill="#f1f3f5" stroke="#1b2a3a" stroke-width="2"/>
  <text x="430" y="258" font-size="15" fill="#1b2a3a" text-anchor="middle">+ protease</text>
  <rect x="410" y="139" width="40" height="22" rx="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <rect x="406" y="179" width="40" height="22" rx="11" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="430" y="286" font-size="14" fill="#555" text-anchor="middle">(digests all protein</text>
  <text x="430" y="304" font-size="14" fill="#555" text-anchor="middle">still outside)</text>
  <text x="265" y="40" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold">The experiment</text>
  <text x="265" y="364" font-size="15" fill="#1b2a3a" text-anchor="middle">Uncoupler (CCCP): collapses the membrane</text>
  <text x="265" y="384" font-size="15" fill="#1b2a3a" text-anchor="middle">potential of the inner membrane.</text>
  <text x="265" y="408" font-size="15" fill="#1b2a3a" text-anchor="middle">Detergent: dissolves the membranes.</text>
  <text x="820" y="40" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Result (schematic gel)</text>
  <rect x="570" y="90" width="400" height="250" fill="#e9ecef" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="610.0" y="364" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">1</text>
  <rect x="580.0" y="174" width="60" height="12" rx="3" fill="#212529"/>
  <text x="690.0" y="364" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">2</text>
  <rect x="660.0" y="174" width="60" height="12" rx="3" fill="#212529"/>
  <rect x="660.0" y="224" width="60" height="12" rx="3" fill="#212529"/>
  <text x="770.0" y="364" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">3</text>
  <rect x="740.0" y="224" width="60" height="12" rx="3" fill="#212529"/>
  <text x="850.0" y="364" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">4</text>
  <text x="930.0" y="364" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">5</text>
  <text x="560" y="185" font-size="17" fill="#1b2a3a" text-anchor="end" font-weight="bold">p</text>
  <text x="560" y="235" font-size="17" fill="#1b2a3a" text-anchor="end" font-weight="bold">m</text>
  <text x="982" y="185" font-size="14" fill="#1b2a3a" text-anchor="start">precursor</text>
  <text x="982" y="235" font-size="14" fill="#1b2a3a" text-anchor="start">mature</text>
  <text x="982" y="251" font-size="14" fill="#1b2a3a" text-anchor="start">(shorter)</text>
  <text x="570" y="392" font-size="15" fill="#1b2a3a" text-anchor="start">1 precursor only · 2 + mitochondria · 3 + mitochondria,</text>
  <text x="570" y="412" font-size="15" fill="#1b2a3a" text-anchor="start">then protease · 4 as 3, with uncoupler CCCP ·</text>
  <text x="570" y="432" font-size="15" fill="#1b2a3a" text-anchor="start">5 as 3, with detergent</text>
</svg>
