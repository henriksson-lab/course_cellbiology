<text x="114.6" y="385" font-size="16" fill="#1b2a3a" font-style="italic"><tspan>The pump charges the battery with ATP. The other transporters use the downhill flow of Na</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> to move a second solute uphill.</tspan></text>
