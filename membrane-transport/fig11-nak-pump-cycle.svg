<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="Helvetica, Arial, sans-serif">
<!-- fig11: simplified cycle of the Na+/K+ pump (P-type ATPase): 3 Na+ out, 2 K+ in per ATP. Cartoon; real pump has more states. -->
<defs>
<marker id="ar" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker>
<marker id="ab" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1c4fa0"/></marker>
<marker id="ap" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#8e44ad"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c2255c"/></marker>
<marker id="ay" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#b8860b"/></marker>
<marker id="ah" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1098ad"/></marker>
</defs>
<rect x="8" y="40" width="245" height="80" fill="#eef3f8"/><rect x="8" y="190" width="245" height="120" fill="#fbfaf5"/><rect x="8" y="120" width="245" height="70" fill="#f6f0de"/><line x1="8" y1="120" x2="253" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="8" y1="190" x2="253" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M50.5,100 L108.5,100 L108.5,122 L84.5,190 L50.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M170.5,100 L112.5,100 L112.5,122 L136.5,190 L170.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="172.5" cy="216" rx="34" ry="24" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="31.6" y="26" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>1. Open inside: 3 Na</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> bind</tspan></text>
<rect x="288" y="40" width="245" height="80" fill="#eef3f8"/><rect x="288" y="190" width="245" height="120" fill="#fbfaf5"/><rect x="288" y="120" width="245" height="70" fill="#f6f0de"/><line x1="288" y1="120" x2="533" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="288" y1="190" x2="533" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M330.5,100 L364.5,100 L388.5,168 L388.5,190 L330.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M450.5,100 L416.5,100 L392.5,168 L392.5,190 L450.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="452.5" cy="216" rx="34" ry="24" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="452.5" cy="216" r="13" fill="#e8590c"/><text x="452.5" y="222" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
<text x="314.1" y="26" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>2. ATP → P: open outside</tspan></text>
<rect x="568" y="40" width="245" height="80" fill="#eef3f8"/><rect x="568" y="190" width="245" height="120" fill="#fbfaf5"/><rect x="568" y="120" width="245" height="70" fill="#f6f0de"/><line x1="568" y1="120" x2="813" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="568" y1="190" x2="813" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M610.5,100 L644.5,100 L668.5,168 L668.5,190 L610.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M730.5,100 L696.5,100 L672.5,168 L672.5,190 L730.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="732.5" cy="216" rx="34" ry="24" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="575.1" y="26" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>3. 2 K</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> bind, phosphate leaves</tspan></text>
<rect x="848" y="40" width="245" height="80" fill="#eef3f8"/><rect x="848" y="190" width="245" height="120" fill="#fbfaf5"/><rect x="848" y="120" width="245" height="70" fill="#f6f0de"/><line x1="848" y1="120" x2="1093" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="848" y1="190" x2="1093" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M890.5,100 L948.5,100 L948.5,122 L924.5,190 L890.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M1010.5,100 L952.5,100 L952.5,122 L976.5,190 L1010.5,190 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="1012.5" cy="216" rx="34" ry="24" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="880.5" y="26" font-size="16" fill="#1b2a3a" font-weight="bold"><tspan>4. Open inside: 2 K</tspan><tspan dy="-6" font-size="11">+</tspan><tspan dy="6"> out</tspan></text>
<text x="14" y="58" font-size="14" fill="#1b2a3a" font-style="italic">outside</text>
<text x="245" y="302" font-size="14" fill="#1b2a3a" text-anchor="end" font-style="italic">cytosol</text>
<circle cx="66.5" cy="250" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="51.0" y="255" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="100.5" cy="256" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="85.0" y="261" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="108.5" cy="214" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="93.0" y="219" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<text x="136.1" y="278" font-size="15" fill="#e8590c" font-weight="bold"><tspan>ATP binds</tspan></text>
<circle cx="360.5" cy="70" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="345.0" y="75" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="390.5" cy="62" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="375.0" y="67" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="420.5" cy="70" r="15" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="405.0" y="75" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<text x="436.7" y="278" font-size="15" fill="#e8590c" font-weight="bold"><tspan>ADP</tspan></text>
<circle cx="670.5" cy="138" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="660.5" y="143" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="646.5" cy="70" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="636.5" y="75" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<text x="701.1" y="278" font-size="15" fill="#e8590c" font-weight="bold"><tspan>P</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> leaves</tspan></text>
<circle cx="934.5" cy="238" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="924.5" y="243" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="968.5" cy="248" r="15" fill="#8e44ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="958.5" y="253" font-size="14" font-weight="bold" fill="#ffffff">K<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="243" y1="155" x2="290" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="523" y1="155" x2="570" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="803" y1="155" x2="850" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<path d="M1050.5,318 L1050.5,334 L28,334 L28,318" stroke="#1b2a3a" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="160.7" y="368" font-size="17" fill="#1b2a3a"><tspan>Per cycle: </tspan><tspan font-weight="bold">3 Na</tspan><tspan dy="-6" font-size="12">+</tspan><tspan dy="6" font-weight="bold"> out, 2 K</tspan><tspan dy="-6" font-size="12">+</tspan><tspan dy="6" font-weight="bold"> in, 1 ATP used</tspan><tspan>. One net positive charge leaves, so the pump is electrogenic.</tspan></text>
<text x="242.9" y="398" font-size="16" fill="#1b2a3a"><tspan>The phosphate sits on an aspartate in the pump: that is why it is called a </tspan><tspan font-weight="bold">P-type</tspan><tspan> pump.</tspan></text>
</svg>
