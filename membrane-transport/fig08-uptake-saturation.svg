<text x="300" y="210" font-size="17" fill="#e8590c" font-weight="bold">transporter: saturates</text>
<text x="348.4" y="315" font-size="17" fill="#1c4fa0" font-weight="bold">simple diffusion:</text>
<text x="348.4" y="337" font-size="17" fill="#1c4fa0" font-weight="bold">no saturation</text>
<text x="650" y="40" font-size="18" fill="#1b2a3a" font-weight="bold">The uptake assay</text>
<circle cx="666" cy="84" r="15" fill="#1b2a3a"/><text x="666" y="90" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="694" y="86" font-size="17" fill="#1b2a3a">Add glucose labelled with <tspan dy="-7" font-size="12">3</tspan><tspan dy="7">H</tspan></text><text x="694" y="109" font-size="17" fill="#1b2a3a">(radioactive) or a fluorescent tag.</text>
<circle cx="666" cy="159" r="15" fill="#1b2a3a"/><text x="666" y="165" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="694" y="161" font-size="17" fill="#1b2a3a">Stop after a short time</text><text x="694" y="184" font-size="17" fill="#1b2a3a">(e.g. 30 s) with ice-cold buffer.</text>
<circle cx="666" cy="234" r="15" fill="#1b2a3a"/><text x="666" y="240" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="694" y="236" font-size="17" fill="#1b2a3a">Wash, then measure the label</text><text x="694" y="259" font-size="17" fill="#1b2a3a">inside the cells.</text>
<circle cx="666" cy="309" r="15" fill="#1b2a3a"/><text x="666" y="315" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="694" y="311" font-size="17" fill="#1b2a3a">Repeat at many concentrations,</text><text x="694" y="334" font-size="17" fill="#1b2a3a">plot rate against concentration.</text>
<text x="650" y="390" font-size="16" fill="#1b2a3a" font-style="italic">Same shape as Michaelis–Menten kinetics:</text>
<text x="650" y="414" font-size="16" fill="#1b2a3a" font-style="italic">a limited number of binding sites.</text>
</svg>
