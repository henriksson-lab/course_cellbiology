<text x="124.5" y="318" font-size="17" fill="#1b2a3a"><tspan font-weight="bold">GLUT</tspan><tspan> (glucose)</tspan></text>
<text x="185.0" y="342" font-size="15" fill="#1b2a3a" text-anchor="middle">red blood cells, most tissues</text>
<circle cx="530.0" cy="80" r="17" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="514.5" y="85" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<polygon points="560.7,73.5 572.0,67 583.3,73.5 583.3,86.5 572.0,93 560.7,86.5" fill="#f2c14e" stroke="#1b2a3a"/>
<line x1="530.0" y1="99" x2="530.0" y2="230" stroke="#1c4fa0" stroke-width="3" marker-end="url(#ab)"/>
<line x1="572.0" y1="96" x2="572.0" y2="230" stroke="#b8860b" stroke-width="3" marker-end="url(#ay)"/>
<circle cx="530.0" cy="252" r="17" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="514.5" y="257" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<polygon points="560.7,245.5 572.0,239 583.3,245.5 583.3,258.5 572.0,265 560.7,258.5" fill="#f2c14e" stroke="#1b2a3a"/>
<text x="466.9" y="318" font-size="17" fill="#1b2a3a"><tspan font-weight="bold">SGLT</tspan><tspan> (Na</tspan><tspan dy="-6" font-size="12">+</tspan><tspan dy="6"> + glucose)</tspan></text>
<text x="550.0" y="342" font-size="15" fill="#1b2a3a" text-anchor="middle">gut and kidney epithelium</text>
<circle cx="895.0" cy="80" r="17" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="879.5" y="85" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<line x1="895.0" y1="99" x2="895.0" y2="230" stroke="#1c4fa0" stroke-width="3" marker-end="url(#ab)"/>
<circle cx="895.0" cy="252" r="17" fill="#1c4fa0" stroke="#1b2a3a" stroke-width="1.2"/><text x="879.5" y="257" font-size="14" font-weight="bold" fill="#ffffff">Na<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="937.0" cy="252" r="17" fill="#c2255c" stroke="#1b2a3a" stroke-width="1.2"/><text x="918.5" y="257" font-size="14" font-weight="bold" fill="#ffffff">Ca<tspan dy="-6" font-size="10">2+</tspan></text>
<line x1="937.0" y1="233" x2="937.0" y2="104" stroke="#c2255c" stroke-width="3" marker-end="url(#ag)"/>
<circle cx="937.0" cy="80" r="17" fill="#c2255c" stroke="#1b2a3a" stroke-width="1.2"/><text x="918.5" y="85" font-size="14" font-weight="bold" fill="#ffffff">Ca<tspan dy="-6" font-size="10">2+</tspan></text>
<text x="836.5" y="318" font-size="17" fill="#1b2a3a" font-weight="bold"><tspan>Na</tspan><tspan dy="-6" font-size="12">+</tspan><tspan dy="6">/Ca</tspan><tspan dy="-6" font-size="12">2+</tspan><tspan dy="6"> exchanger</tspan></text>
<text x="826.6" y="342" font-size="15" fill="#1b2a3a"><tspan>also the Na</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6">/H</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6"> exchanger</tspan></text>
<text x="550" y="390" font-size="16" fill="#1b2a3a" text-anchor="middle" font-style="italic">Uniport is passive. Symport and antiport can drive one solute uphill with the downhill flow of the other.</text>
</svg>
