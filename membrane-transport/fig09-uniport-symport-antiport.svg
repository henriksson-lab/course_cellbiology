<text x="185.0" y="28" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Uniport</text>
<text x="185.0" y="48" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">one solute</text>
<rect x="147.0" y="126" width="76" height="78" rx="14" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="550.0" y="28" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Symport</text>
<text x="550.0" y="48" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">two solutes, same direction</text>
<rect x="512.0" y="126" width="76" height="78" rx="14" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="915.0" y="28" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Antiport</text>
<text x="915.0" y="48" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">two solutes, opposite directions</text>
<rect x="877.0" y="126" width="76" height="78" rx="14" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="23" y="72" font-size="14" fill="#1b2a3a" font-style="italic">outside</text>
<text x="23" y="272" font-size="14" fill="#1b2a3a" font-style="italic">cytosol</text>
