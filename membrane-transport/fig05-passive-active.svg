<path d="M911,228 Q899,246 907,258" stroke="#e8590c" stroke-width="3" fill="none" marker-end="url(#ao)"/>
<text x="895" y="280" font-size="16" font-weight="bold" fill="#e8590c">ADP + P<tspan dy="4" font-size="11">i</tspan></text>
<text x="270" y="318" font-size="17" fill="#1b2a3a" text-anchor="middle">From high to low concentration: ΔG &lt; 0.</text>
<text x="270" y="343" font-size="17" fill="#1b2a3a" text-anchor="middle">Happens by itself, if there is a path.</text>
<text x="830" y="318" font-size="17" fill="#1b2a3a" text-anchor="middle">From low to high concentration: ΔG &gt; 0.</text>
<text x="830" y="343" font-size="17" fill="#1b2a3a" text-anchor="middle">Needs energy: ATP, light or another gradient.</text>
</svg>
