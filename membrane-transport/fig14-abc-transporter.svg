<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" font-family="Helvetica, Arial, sans-serif">
<!-- fig14: ABC transporter (exporter, e.g. P-glycoprotein): two membrane halves and two ATP-binding cassettes (NBDs). ATP binding flips it outward; hydrolysis resets it. Cartoon. -->
