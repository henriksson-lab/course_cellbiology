<text x="935.2" y="234" font-size="14" fill="#e8590c" font-weight="bold"><tspan>ADP</tspan></text>
<text x="852.0" y="296" font-size="15" fill="#1b2a3a" font-style="italic"><tspan>then resets to step 1</tspan></text>
<text x="64.2" y="296" font-size="15" fill="#1b2a3a" font-style="italic"><tspan>two ATP-binding cassettes (purple)</tspan></text>
