<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" font-family="Helvetica, Arial, sans-serif">
<!-- fig07: alternating access. A uniporter (GLUT-like) cycles outward-open, occluded, inward-open, and back. Cartoon. -->
<defs><marker id="ar" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker></defs>
<rect x="8" y="50" width="245" height="70" fill="#eef3f8"/><rect x="8" y="190" width="245" height="70" fill="#fbfaf5"/><rect x="8" y="120" width="245" height="70" fill="#f6f0de"/><line x1="8" y1="120" x2="253" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="8" y1="190" x2="253" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M70.5,100 L104.5,100 L128.5,188 L128.5,210 L70.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M190.5,100 L156.5,100 L132.5,188 L132.5,210 L190.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="130.5" y="32" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1. Open to the outside</text>
<rect x="288" y="50" width="245" height="70" fill="#eef3f8"/><rect x="288" y="190" width="245" height="70" fill="#fbfaf5"/><rect x="288" y="120" width="245" height="70" fill="#f6f0de"/><line x1="288" y1="120" x2="533" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="288" y1="190" x2="533" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M350.5,100 L384.5,100 L408.5,188 L408.5,210 L350.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M470.5,100 L436.5,100 L412.5,188 L412.5,210 L470.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="410.5" y="32" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">2. Solute binds</text>
<rect x="568" y="50" width="245" height="70" fill="#eef3f8"/><rect x="568" y="190" width="245" height="70" fill="#fbfaf5"/><rect x="568" y="120" width="245" height="70" fill="#f6f0de"/><line x1="568" y1="120" x2="813" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="568" y1="190" x2="813" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M630.5,100 L688.5,100 L688.5,130 Q666.5,155.0 688.5,180 L688.5,210 L630.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M750.5,100 L692.5,100 L692.5,130 Q714.5,155.0 692.5,180 L692.5,210 L750.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="690.5" y="32" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">3. Closed on both sides</text>
<rect x="848" y="50" width="245" height="70" fill="#eef3f8"/><rect x="848" y="190" width="245" height="70" fill="#fbfaf5"/><rect x="848" y="120" width="245" height="70" fill="#f6f0de"/><line x1="848" y1="120" x2="1093" y2="120" stroke="#8a6a12" stroke-width="3"/><line x1="848" y1="190" x2="1093" y2="190" stroke="#8a6a12" stroke-width="3"/>
<path d="M910.5,100 L968.5,100 L968.5,122 L944.5,210 L910.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><path d="M1030.5,100 L972.5,100 L972.5,122 L996.5,210 L1030.5,210 Z" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<text x="970.5" y="32" font-size="17" font-weight="bold" fill="#1b2a3a" text-anchor="middle">4. Open to the inside</text>
<polygon points="119.5,66 130.5,59 141.5,66 141.5,78 130.5,85 119.5,78" fill="#f2c14e" stroke="#1b2a3a"/>
<polygon points="399.5,162 410.5,155 421.5,162 421.5,174 410.5,181 399.5,174" fill="#f2c14e" stroke="#1b2a3a"/>
<polygon points="679.5,149 690.5,142 701.5,149 701.5,161 690.5,168 679.5,161" fill="#f2c14e" stroke="#1b2a3a"/>
<polygon points="959.5,230 970.5,223 981.5,230 981.5,242 970.5,249 959.5,242" fill="#f2c14e" stroke="#1b2a3a"/>
<text x="16" y="70" font-size="14" font-style="italic" fill="#1b2a3a">outside</text><text x="16" y="252" font-size="14" font-style="italic" fill="#1b2a3a">cytosol</text>
<line x1="237" y1="155" x2="292" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="517" y1="155" x2="572" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<line x1="797" y1="155" x2="852" y2="155" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
<path d="M970.5,262 L970.5,284 L130.5,284 L130.5,268" stroke="#1b2a3a" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="550" y="313" font-size="16" fill="#1b2a3a" text-anchor="middle">5. The empty transporter flips back. The cycle can run either way, so net flow goes down the gradient.</text>
<text x="150" y="350" font-size="17" fill="#1b2a3a">The binding site is <tspan font-weight="bold">never open to both sides at once</tspan>: there is never a hole through the membrane.</text>
</svg>
