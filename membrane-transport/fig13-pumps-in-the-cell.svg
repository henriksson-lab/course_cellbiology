<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif">
<!-- fig13: other ATP-driven pumps and where they sit: Ca2+ pumps in plasma membrane and ER (P-type), V-type H+ pump in lysosome, F-type ATP synthase in mitochondria (pump in reverse). Cartoon. -->
<defs>
<marker id="ar" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1b2a3a"/></marker>
<marker id="ao" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#e8590c"/></marker>
<marker id="ab" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1c4fa0"/></marker>
<marker id="ap" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#8e44ad"/></marker>
<marker id="ag" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#c2255c"/></marker>
<marker id="ay" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#b8860b"/></marker>
<marker id="ah" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,7 L0,13 Z" fill="#1098ad"/></marker>
</defs>
<rect x="10" y="10" width="1080" height="450" fill="#eef3f8"/>
<rect x="20" y="62" width="1060" height="390" rx="40" fill="#fbfaf5" stroke="#8a6a12" stroke-width="6"/>
<text x="30" y="38" font-size="15" fill="#1b2a3a" font-style="italic"><tspan>outside: Ca</tspan><tspan dy="-6" font-size="10">2+</tspan><tspan dy="6"> about 2 mM</tspan></text>
<text x="40" y="100" font-size="15" fill="#1b2a3a" font-style="italic"><tspan>cytosol: Ca</tspan><tspan dy="-6" font-size="10">2+</tspan><tspan dy="6"> about 0.1 µM, pH 7.2</tspan></text>
<rect x="446" y="44" width="48" height="38" rx="9" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="470" cy="126" r="17" fill="#c2255c" stroke="#1b2a3a" stroke-width="1.2"/><text x="451.5" y="131" font-size="14" font-weight="bold" fill="#ffffff">Ca<tspan dy="-6" font-size="10">2+</tspan></text>
<line x1="470" y1="106" x2="470" y2="34" stroke="#c2255c" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="506" y="36" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Ca</tspan><tspan dy="-6" font-size="10">2+</tspan><tspan dy="6" font-weight="bold"> pump</tspan><tspan> (P-type): Ca</tspan><tspan dy="-6" font-size="10">2+</tspan><tspan dy="6"> out of the cell</tspan></text>
<rect x="60" y="250" width="360" height="110" rx="40" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="80" y="345" font-size="16" fill="#2a7f8f" font-weight="bold">ER lumen</text>
<rect x="216" y="232" width="48" height="38" rx="9" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="240" cy="188" r="17" fill="#c2255c" stroke="#1b2a3a" stroke-width="1.2"/><text x="221.5" y="193" font-size="14" font-weight="bold" fill="#ffffff">Ca<tspan dy="-6" font-size="10">2+</tspan></text>
<line x1="240" y1="208" x2="240" y2="300" stroke="#c2255c" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="270" y="296" font-size="14" fill="#1b2a3a"></text>
<text x="145.0" y="395" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">SERCA</tspan><tspan> (P-type): fills the ER</tspan></text>
<text x="101.3" y="415" font-size="15" fill="#1b2a3a"><tspan>with Ca</tspan><tspan dy="-6" font-size="10">2+</tspan><tspan dy="6"> (thousands of times the cytosol)</tspan></text>
<circle cx="640" cy="290" r="82" fill="#e3f3ea" stroke="#2e8b57" stroke-width="3"/>
<text x="603.1" y="320" font-size="16" fill="#2e8b57" font-weight="bold"><tspan>lysosome</tspan></text>
<text x="609.6" y="342" font-size="15" fill="#2e8b57"><tspan>pH 4.5–5</tspan></text>
<rect x="616" y="188" width="48" height="40" rx="9" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="640" cy="170" rx="26" ry="16" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="580" cy="174" r="15" fill="#1098ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="570.0" y="179" font-size="14" font-weight="bold" fill="#ffffff">H<tspan dy="-6" font-size="10">+</tspan></text>
<path d="M596,178 Q634,182 638,242" stroke="#1098ad" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<circle cx="612" cy="280" r="13" fill="#1098ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="602.0" y="285" font-size="14" font-weight="bold" fill="#ffffff">H<tspan dy="-6" font-size="10">+</tspan></text>
<circle cx="670" cy="270" r="13" fill="#1098ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="660.0" y="275" font-size="14" font-weight="bold" fill="#ffffff">H<tspan dy="-6" font-size="10">+</tspan></text>
<text x="553.3" y="410" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">V-type H</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6" font-weight="bold"> pump</tspan><tspan>: acidifies</tspan></text>
<text x="549.1" y="430" font-size="15" fill="#1b2a3a"><tspan>lysosomes and endosomes</tspan></text>
<text x="672" y="176" font-size="14" fill="#e8590c" font-weight="bold">ATP</text>
<ellipse cx="920" cy="280" rx="135" ry="92" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
<ellipse cx="920" cy="280" rx="92" ry="60" fill="#fdf6f7" stroke="#a8324a" stroke-width="3"/>
<text x="916.0" y="322" font-size="16" fill="#a8324a" font-weight="bold"><tspan>matrix</tspan></text>
<rect x="810" y="258" width="36" height="44" rx="8" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/>
<ellipse cx="866" cy="280" rx="22" ry="26" fill="#9fb3c8" stroke="#1b2a3a" stroke-width="2"/><line x1="846" y1="280" x2="844" y2="280" stroke="#1b2a3a"/>
<circle cx="806" cy="232" r="14" fill="#1098ad" stroke="#1b2a3a" stroke-width="1.2"/><text x="796.0" y="237" font-size="14" font-weight="bold" fill="#ffffff">H<tspan dy="-6" font-size="10">+</tspan></text>
<path d="M806,247 Q802,276 830,282" stroke="#1098ad" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="890" y="274" font-size="14" fill="#e8590c" font-weight="bold"><tspan>ADP + P</tspan><tspan dy="4" font-size="10">i</tspan></text>
<text x="890" y="294" font-size="14" fill="#e8590c" font-weight="bold">→ ATP</text>
<text x="818.9" y="400" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">F-type ATP synthase</tspan><tspan>: H</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6"> flow</tspan></text>
<text x="807.3" y="420" font-size="15" fill="#1b2a3a"><tspan>in makes ATP (a pump in reverse)</tspan></text>
</svg>
