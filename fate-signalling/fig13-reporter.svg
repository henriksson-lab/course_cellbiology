<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b8a3e"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- construct -->
  <text x="20" y="30" font-weight="700" font-size="18">1. Build a reporter gene and put it into cells</text>
  <line x1="30" y1="100" x2="640" y2="100" stroke="#1b2a3a" stroke-width="4"/>
  <g stroke="#6b4fa0" stroke-width="1.5" fill="#d0bfe9">
    <rect x="50" y="88" width="30" height="24"/><rect x="84" y="88" width="30" height="24"/><rect x="118" y="88" width="30" height="24"/><rect x="152" y="88" width="30" height="24"/><rect x="186" y="88" width="30" height="24"/><rect x="220" y="88" width="30" height="24"/><rect x="254" y="88" width="30" height="24"/>
  </g>
  <text x="167" y="138" text-anchor="middle" font-size="15">binding sites for the pathway's</text>
  <text x="167" y="156" text-anchor="middle" font-size="15">transcription factor (here TCF)</text>
  <rect x="300" y="88" width="80" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="340" y="138" text-anchor="middle" font-size="15">weak promoter</text>
  <rect x="400" y="84" width="220" height="32" rx="4" fill="#ffe066" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="510" y="106" text-anchor="middle">luciferase (makes light)</text>
  <path d="M390,86 L390,64 L440,64" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
  <text x="510" y="148" text-anchor="middle" font-size="15">or GFP: glows green in living cells</text>
  <text x="660" y="84" font-size="15">Light measures how much the</text>
  <text x="660" y="103" font-size="15">factor is switched on, without</text>
  <text x="660" y="122" font-size="15">knowing the natural target genes.</text>
  <!-- bar chart -->
  <text x="20" y="205" font-weight="700" font-size="18">2. Measure light (illustrative numbers)</text>
  <line x1="300" y1="225" x2="300" y2="395" stroke="#444" stroke-width="2"/>
  <line x1="300" y1="395" x2="960" y2="395" stroke="#444" stroke-width="2"/>
  <text x="285" y="400" text-anchor="end" font-size="14">0</text>
  <text x="255" y="310" text-anchor="middle" font-size="15">light</text>
  <text x="255" y="328" text-anchor="middle" font-size="15">(relative)</text>
  <g font-size="15">
    <rect x="320" y="383" width="120" height="12" fill="#adb5bd" stroke="#1b2a3a"/>
    <text x="380" y="372" text-anchor="middle">no Wnt</text>
    <rect x="480" y="245" width="120" height="150" fill="#2b8a3e" stroke="#1b2a3a"/>
    <text x="540" y="236" text-anchor="middle">+ Wnt</text>
    <rect x="640" y="381" width="120" height="14" fill="#adb5bd" stroke="#1b2a3a"/>
    <text x="700" y="348" text-anchor="middle">+ Wnt, sites</text>
    <text x="700" y="367" text-anchor="middle">mutated (control)</text>
    <rect x="800" y="265" width="120" height="130" fill="#2b8a3e" stroke="#1b2a3a"/>
    <text x="860" y="238" text-anchor="middle">colon cancer</text>
    <text x="860" y="256" text-anchor="middle">cells, no Wnt</text>
  </g>
</svg>
