<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b8a3e"/></marker>
  </defs>
  <!-- oestradiol -->
  <rect x="5" y="5" width="485" height="240" rx="14" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="20" y="32" font-weight="700" font-size="18">Oestradiol: receptor on</text>
  <line x1="20" y1="190" x2="470" y2="190" stroke="#1b2a3a" stroke-width="4"/>
  <rect x="40" y="134" width="120" height="44" rx="8" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="90" y="161" text-anchor="middle" font-size="15">ER</text>
  <path d="M120,122 L150,122 L150,134" fill="#3b5bab" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="118" y="114" width="36" height="14" rx="4" fill="#3b5bab" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M136,150 L145,145 L154,150 L154,160 L145,165 L136,160 Z" fill="#e03131" stroke="#1b2a3a" stroke-width="1.2"/>
  <rect x="160" y="96" width="100" height="30" rx="12" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="210" y="116" text-anchor="middle" font-size="14">coactivator</text>
  <rect x="300" y="178" width="150" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="375" y="196" text-anchor="middle" font-size="15">growth genes</text>
  <path d="M300,176 L300,156 L346,156" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
  <text x="20" y="65" font-size="15">The hormone closes a lid (dark blue) on the</text>
  <text x="20" y="84" font-size="15">pocket; the lid forms the coactivator site.</text>
  <text x="20" y="228" font-size="15">ER-positive breast cancer cells divide.</text>
  <!-- tamoxifen -->
  <rect x="510" y="5" width="485" height="240" rx="14" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="525" y="32" font-weight="700" font-size="18" fill="#e8590c">Tamoxifen: receptor blocked</text>
  <line x1="525" y1="190" x2="975" y2="190" stroke="#1b2a3a" stroke-width="4"/>
  <rect x="545" y="134" width="120" height="44" rx="8" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="595" y="161" text-anchor="middle" font-size="15">ER</text>
  <rect x="664" y="132" width="14" height="36" rx="4" fill="#3b5bab" stroke="#1b2a3a" stroke-width="1.5"/>
  <path d="M632,150 L641,145 L650,150 L650,160 L641,165 L632,160 Z" fill="#e8590c" stroke="#1b2a3a" stroke-width="1.2"/>
  <path d="M650,155 L690,140" stroke="#e8590c" stroke-width="4"/>
  <text x="525" y="65" font-size="15">Tamoxifen fills the pocket but its long arm</text>
  <text x="525" y="84" font-size="15">pushes the lid aside: no coactivator site.</text>
  <rect x="805" y="178" width="150" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="880" y="196" text-anchor="middle" font-size="15">growth genes</text>
  <text x="880" y="222" text-anchor="middle" font-size="15" fill="#c92a2a" font-weight="700">off</text>
  <text x="525" y="228" font-size="15">Oestradiol cannot get in.</text>
</svg>
