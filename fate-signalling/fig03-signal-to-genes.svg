<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
  </defs>
  <!-- cell -->
  <rect x="20" y="70" width="600" height="390" rx="28" fill="#fbfaf5" stroke="#8a6a12" stroke-width="7"/>
  <text x="600" y="58" font-size="15" fill="#8a6a12" text-anchor="end">plasma membrane</text>
  <!-- signal and receptor -->
  <circle cx="160" cy="28" r="14" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="184" y="34">signal</text>
  <rect x="146" y="50" width="28" height="56" rx="8" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="186" y="98">receptor</text>
  <!-- relay -->
  <path d="M160,110 L160,148" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="80" y="152" width="160" height="44" rx="10" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle">relay proteins</text>
  <path d="M160,198 L160,236" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- latent TF -->
  <rect x="60" y="240" width="200" height="66" rx="10" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="160" y="266" text-anchor="middle">transcription factor</text>
  <text x="160" y="290" text-anchor="middle">waits in the cytosol</text>
  <text x="250" y="352" text-anchor="end" font-size="15">freed, it enters</text>
  <text x="250" y="371" text-anchor="end" font-size="15">the nucleus</text>
  <!-- nucleus -->
  <rect x="300" y="226" width="300" height="214" rx="60" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="450" y="254" text-anchor="middle" fill="#6b4fa0">nucleus</text>
  <!-- DNA -->
  <line x1="320" y1="402" x2="585" y2="402" stroke="#1b2a3a" stroke-width="4"/>
  <rect x="352" y="390" width="70" height="24" fill="#d0bfe9" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="387" y="433" text-anchor="middle" font-size="15">enhancer</text>
  <rect x="470" y="390" width="96" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="518" y="408" text-anchor="middle" font-size="15">target gene</text>
  <path d="M470,388 L470,368 L520,368" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M262,296 C320,310 330,345 348,360" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- active TF on DNA -->
  <ellipse cx="387" cy="370" rx="36" ry="18" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="387" y="376" text-anchor="middle" font-size="15">TF</text>
  <text x="450" y="290" text-anchor="middle" font-size="15">on: a set of genes</text>
  <text x="450" y="310" text-anchor="middle" font-size="15">(a programme), often</text>
  <text x="450" y="330" text-anchor="middle" font-size="15">including its own off-switch</text>
  <!-- right: five ways -->
  <text x="650" y="96" font-weight="700">Five ways to free the factor</text>
  <g font-size="16">
    <text x="650" y="140" font-weight="700">1. Stop destroying it</text>
    <text x="672" y="162">Wnt (β-catenin), NF-κB</text>
    <text x="650" y="202" font-weight="700">2. Cut it out of the membrane</text>
    <text x="672" y="224">Notch</text>
    <text x="650" y="264" font-weight="700">3. Phosphorylate it</text>
    <text x="672" y="286">TGF-β (SMADs)</text>
    <text x="650" y="326" font-weight="700">4. Stop making it a repressor</text>
    <text x="672" y="348">Hedgehog (Gli)</text>
    <text x="650" y="388" font-weight="700">5. The hormone binds the factor</text>
    <text x="672" y="410">nuclear receptors (steroids)</text>
  </g>
</svg>
