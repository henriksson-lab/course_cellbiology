<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b8a3e"/></marker>
    <g id="p"><circle r="10" fill="#fff3bf" stroke="#e8590c" stroke-width="2"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">P</text></g>
  </defs>
  <rect x="0" y="120" width="1000" height="310" fill="#fbfaf5"/>
  <rect x="0" y="100" width="1000" height="22" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  <text x="990" y="92" text-anchor="end" font-size="15" fill="#8a6a12">plasma membrane</text>
  <!-- ligand -->
  <circle cx="150" cy="44" r="13" fill="#e03131" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="176" cy="44" r="13" fill="#e03131" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="200" y="40">TGF-β</text>
  <text x="200" y="58" font-size="14">(a dimer)</text>
  <!-- receptors: type II (left) and type I (right) -->
  <rect x="122" y="66" width="30" height="96" rx="8" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="174" y="66" width="30" height="96" rx="8" fill="#74a9cf" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="112" y="160" width="50" height="36" rx="10" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="164" y="160" width="50" height="36" rx="10" fill="#74a9cf" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="137" y="216" text-anchor="middle" font-size="14">type II</text>
  <text x="189" y="216" text-anchor="middle" font-size="14">type I</text>
  <text x="163" y="236" text-anchor="middle" font-size="14">kinase receptors</text>
  <use href="#p" x="214" y="166"/>
  <path d="M155,170 C162,150 180,150 202,160" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ar)"/>
  <!-- SMAD2/3 phosphorylated -->
  <path d="M222,184 L290,206" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <ellipse cx="340" cy="214" rx="46" ry="17" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="340" y="219" text-anchor="middle" font-size="15">SMAD2/3</text>
  <use href="#p" x="392" y="198"/>
  <text x="340" y="252" text-anchor="middle" font-size="15">phosphorylated</text>
  <path d="M392,218 L452,218" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- complex with SMAD4 -->
  <ellipse cx="505" cy="204" rx="46" ry="17" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="505" y="209" text-anchor="middle" font-size="15">SMAD2/3</text>
  <use href="#p" x="557" y="188"/>
  <ellipse cx="520" cy="236" rx="42" ry="17" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="520" y="241" text-anchor="middle" font-size="15">SMAD4</text>
  <text x="574" y="240" font-size="15">binds SMAD4</text>
  <!-- nucleus -->
  <rect x="300" y="290" width="660" height="128" rx="36" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="322" y="318" fill="#6b4fa0">nucleus</text>
  <line x1="320" y1="386" x2="940" y2="386" stroke="#1b2a3a" stroke-width="4"/>
  <path d="M520,256 L520,332" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <ellipse cx="505" cy="352" rx="46" ry="15" fill="#ffd8a8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="505" y="357" text-anchor="middle" font-size="15">SMAD2/3</text>
  <ellipse cx="520" cy="372" rx="42" ry="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="586" y="358" width="94" height="28" rx="8" fill="#d0bfe9" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="633" y="378" text-anchor="middle" font-size="14">partner TF</text>
  <rect x="720" y="374" width="150" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="795" y="392" text-anchor="middle" font-size="15">target genes</text>
  <path d="M720,372 L720,350 L768,350" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
  <text x="780" y="330" font-size="14">stop dividing (p15, p21),</text>
  <text x="780" y="348" font-size="14">make matrix; SMAD7 (off)</text>
  <!-- left notes -->
  <text x="20" y="292" font-size="15">The receptor is itself</text>
  <text x="20" y="311" font-size="15">a serine/threonine kinase:</text>
  <text x="20" y="330" font-size="15">no relay chain is needed.</text>
  <text x="20" y="364" font-size="15">BMPs use the same plan</text>
  <text x="20" y="383" font-size="15">with SMAD1/5/8.</text>
</svg>
