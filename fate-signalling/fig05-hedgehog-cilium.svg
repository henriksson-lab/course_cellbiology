<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1b2a3a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a3a"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2b8a3e"/></marker>
    <rect id="ptch" x="-9" y="-16" width="18" height="32" rx="5" fill="#9bc5e8" stroke="#1b2a3a" stroke-width="1.5"/>
    <rect id="smo" x="-9" y="-16" width="18" height="32" rx="5" fill="#69db7c" stroke="#1b2a3a" stroke-width="1.5"/>
  </defs>

  <!-- ===== panel 1: no Hedgehog ===== -->
  <rect x="5" y="5" width="485" height="470" rx="14" fill="#fff" stroke="#ccc"/>
  <text x="20" y="32" font-weight="700" font-size="19">No Hedgehog: target genes off</text>
  <rect x="5" y="210" width="485" height="260" fill="#fbfaf5"/>
  <path d="M5,210 L100,210 L100,70 A20,20 0 0 1 140,70 L140,210 L490,210" fill="none" stroke="#8a6a12" stroke-width="6"/>
  <path d="M100,210 L100,70 A20,20 0 0 1 140,70 L140,210 Z" fill="#fbfaf5"/>
  <line x1="120" y1="78" x2="120" y2="210" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="152" y="72" font-weight="700">primary cilium</text>
  <use href="#ptch" x="100" y="130"/>
  <text x="152" y="122">Patched</text>
  <text x="152" y="140">(receptor) in the cilium</text>
  <use href="#smo" x="320" y="210"/>
  <text x="340" y="168" text-anchor="middle">Smoothened</text>
  <text x="340" y="186" text-anchor="middle">kept out, inactive</text>
  <!-- Gli processing -->
  <ellipse cx="90" cy="262" rx="34" ry="15" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="90" y="267" text-anchor="middle">Gli</text>
  <path d="M128,262 L198,262" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="163" y="250" text-anchor="middle" font-size="14">cut</text>
  <ellipse cx="226" cy="262" rx="22" ry="13" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="256" y="257">Gli repressor</text>
  <text x="256" y="275">(a short piece)</text>
  <!-- nucleus -->
  <rect x="25" y="320" width="445" height="140" rx="36" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="48" y="346" fill="#6b4fa0" font-size="16">nucleus</text>
  <line x1="45" y1="400" x2="450" y2="400" stroke="#1b2a3a" stroke-width="4"/>
  <path d="M226,278 L226,366" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <ellipse cx="226" cy="385" rx="22" ry="13" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="290" y="388" width="140" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="360" y="406" text-anchor="middle">target genes</text>
  <text x="360" y="438" text-anchor="middle" fill="#c92a2a" font-weight="700">off</text>

  <!-- ===== panel 2: Hedgehog ===== -->
  <rect x="510" y="5" width="485" height="470" rx="14" fill="#fff" stroke="#ccc"/>
  <text x="525" y="32" font-weight="700" font-size="19">Hedgehog present: target genes on</text>
  <rect x="510" y="210" width="485" height="260" fill="#fbfaf5"/>
  <path d="M510,210 L605,210 L605,70 A20,20 0 0 1 645,70 L645,210 L995,210" fill="none" stroke="#8a6a12" stroke-width="6"/>
  <path d="M605,210 L605,70 A20,20 0 0 1 645,70 L645,210 Z" fill="#fbfaf5"/>
  <line x1="625" y1="78" x2="625" y2="210" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
  <use href="#smo" x="645" y="110"/>
  <text x="664" y="104">Smoothened moves</text>
  <text x="664" y="122">into the cilium: active</text>
  <!-- Patched with Hh, moved out -->
  <use href="#ptch" x="850" y="210"/>
  <circle cx="850" cy="181" r="11" fill="#e03131" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="868" y="162">Hedgehog binds</text>
  <text x="868" y="180">Patched; Patched</text>
  <text x="868" y="198">leaves the cilium</text>
  <!-- Gli activator -->
  <ellipse cx="610" cy="262" rx="34" ry="15" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="610" y="267" text-anchor="middle">Gli</text>
  <text x="656" y="257">not cut: whole Gli</text>
  <text x="656" y="275">is an activator</text>
  <!-- nucleus -->
  <rect x="530" y="320" width="445" height="140" rx="36" fill="#efebf7" stroke="#6b4fa0" stroke-width="4"/>
  <text x="553" y="346" fill="#6b4fa0" font-size="16">nucleus</text>
  <line x1="550" y1="400" x2="955" y2="400" stroke="#1b2a3a" stroke-width="4"/>
  <path d="M640,276 C680,300 700,330 712,360" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <ellipse cx="720" cy="382" rx="34" ry="15" fill="#e8b923" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="795" y="388" width="140" height="24" fill="#fff" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="865" y="406" text-anchor="middle">target genes</text>
  <path d="M795,386 L795,362 L845,362" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arg)"/>
  <text x="878" y="368" fill="#2b8a3e" font-weight="700">on</text>
  <text x="865" y="438" text-anchor="middle" font-size="14">incl. Patched and Gli1</text>
</svg>
