<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1098ad"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="130" fill="#fdf6f7"/>
  <rect x="0" y="190" width="960" height="190" fill="#f8e9ec"/>
  <rect x="0" y="130" width="960" height="60" fill="#ecc9d1"/>
  <line x1="0" y1="130" x2="960" y2="130" stroke="#a8324a" stroke-width="2.5"/><line x1="0" y1="190" x2="960" y2="190" stroke="#a8324a" stroke-width="2.5"/>
  <text x="10" y="24" font-size="16" font-weight="700" fill="#a8324a">intermembrane space (→ cytosol): + side</text>
  <text x="10" y="370" font-size="16" font-weight="700" fill="#a8324a">matrix: − side, Δψ ≈ −160 mV</text>
  <!-- ATP synthase -->
  <rect x="90" y="122" width="70" height="76" rx="16" fill="#fff" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="125" y1="198" x2="125" y2="232" stroke="#1b2a3a" stroke-width="7"/>
  <circle cx="125" cy="262" r="30" fill="#fff" stroke="#1b2a3a" stroke-width="2.5"/>
  <line x1="100" y1="50" x2="100" y2="232" stroke="#1098ad" stroke-width="3.5" marker-end="url(#h)"/>
  <text x="62" y="46" font-size="16" font-weight="700" fill="#1098ad">≈ 2.7 H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan></text>
  <text x="125" y="318" font-size="16" font-weight="700" text-anchor="middle">ATP synthase</text>
  <text x="170" y="270" font-size="16">ADP + P<tspan font-size="10.9" dy="4.0">i</tspan><tspan dy="-4.0"> → <tspan font-weight="700" fill="#2b8a3e">ATP</tspan></tspan></text>
  <!-- ADP/ATP carrier -->
  <rect x="400" y="118" width="80" height="84" rx="14" fill="#fff" stroke="#2a7f8f" stroke-width="3"/>
  <line x1="425" y1="250" x2="425" y2="70" stroke="#2b8a3e" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="455" y1="70" x2="455" y2="250" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#k)"/>
  <text x="368" y="60" font-size="17" font-weight="700" fill="#2b8a3e">ATP<tspan font-size="11.6" dy="-6.8">4−</tspan><tspan dy="6.8"> out</tspan></text>
  <text x="440" y="280" font-size="17" font-weight="700">ADP<tspan font-size="11.6" dy="-6.8">3−</tspan><tspan dy="6.8"> in</tspan></text>
  <text x="440" y="318" font-size="16" font-weight="700" text-anchor="middle">ADP/ATP carrier</text>
  <text x="440" y="338" font-size="15" text-anchor="middle">one − charge out per cycle:</text>
  <text x="440" y="356" font-size="15" text-anchor="middle">pulled by Δψ</text>
  <!-- inhibitor -->
  <circle cx="490" cy="104" r="11" fill="#e8590c"/>
  <text x="508" y="96" font-size="15" font-weight="700" fill="#e8590c">bongkrekic acid,</text>
  <text x="508" y="114" font-size="15" font-weight="700" fill="#e8590c">atractyloside block it</text>
  <!-- phosphate carrier -->
  <rect x="700" y="118" width="70" height="84" rx="14" fill="#fff" stroke="#2a7f8f" stroke-width="3"/>
  <line x1="722" y1="60" x2="722" y2="250" stroke="#1b2a3a" stroke-width="3.5" marker-end="url(#k)"/>
  <line x1="750" y1="60" x2="750" y2="250" stroke="#1098ad" stroke-width="3.5" marker-end="url(#h)"/>
  <text x="680" y="50" font-size="17" font-weight="700">P<tspan font-size="11.6" dy="4.2">i</tspan><tspan dy="-4.2">&#8203;</tspan></text>
  <text x="744" y="50" font-size="17" font-weight="700" fill="#1098ad">+ H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8">&#8203;</tspan></text>
  <text x="735" y="282" font-size="16" font-weight="700" text-anchor="middle">phosphate carrier</text>
  <text x="673.9" y="302" font-size="15" text-anchor="start">uses 1 H<tspan font-size="10.2" dy="-6.0">+</tspan><tspan dy="6.0"> per P</tspan><tspan font-size="10.2" dy="3.8">i</tspan><tspan dy="-3.8">&#8203;</tspan></text>
  <text x="600" y="360" font-size="17" font-weight="700">total ≈ 2.7 + 1 ≈ 3.7 H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8"> per ATP in the cytosol</tspan></text>
</svg>
