<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <!-- membrane with charges -->
  <rect x="20" y="20" width="420" height="110" fill="#fdf6f7"/>
  <rect x="20" y="130" width="420" height="40" fill="#ecc9d1"/>
  <rect x="20" y="170" width="420" height="120" fill="#f8e9ec"/>
  <line x1="20" y1="130" x2="440" y2="130" stroke="#a8324a" stroke-width="2.5"/><line x1="20" y1="170" x2="440" y2="170" stroke="#a8324a" stroke-width="2.5"/>
  <text x="32" y="44" font-size="17" font-weight="700" fill="#a8324a">intermembrane space  pH ≈ 7.2</text>
  <text x="32" y="280" font-size="17" font-weight="700" fill="#a8324a">matrix  pH ≈ 7.7</text>
  <g font-size="22" font-weight="700" fill="#c92a2a"><text x="60" y="118">+ + + + + + + + + + + + + +</text></g>
  <g font-size="24" font-weight="700" fill="#1c4fa0"><text x="64" y="198">− − − − − − − − − − − − −</text></g>
  <g fill="#1098ad"><circle cx="70" cy="70" r="6"/><circle cx="120" cy="84" r="6"/><circle cx="175" cy="64" r="6"/><circle cx="230" cy="80" r="6"/><circle cx="290" cy="66" r="6"/><circle cx="345" cy="84" r="6"/><circle cx="400" cy="68" r="6"/>
    <circle cx="140" cy="240" r="6"/><circle cx="300" cy="232" r="6"/></g>
  <circle cx="40" cy="315" r="6" fill="#1098ad"/><text x="54" y="320" font-size="16">H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">: more outside the matrix than inside</tspan></text>
  <!-- the two parts -->
  <g font-size="18">
    <text x="470" y="44" font-weight="700">proton-motive force Δp = electrical + chemical</text>
    <text x="470" y="84"><tspan font-weight="700">Δψ</tspan> ≈ −160 mV (matrix negative)</text>
    <text x="470" y="108" font-size="16">voltage, as in the ion-channels lecture</text>
    <text x="470" y="146"><tspan font-weight="700">ΔpH</tspan> ≈ 0.5 unit × 61.5 mV ≈ 30 mV</text>
    <text x="470" y="170" font-size="16">concentration, as in the Nernst equation</text>
    <text x="470" y="210" font-weight="700" fill="#1098ad">Δp ≈ 190 mV  (≈ 180–220 mV)</text>
  </g>
  <!-- energy blocks -->
  <text x="470" y="252" font-size="17">energy of 1 mol H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8"> flowing in:  F × Δp ≈ 18 kJ</tspan></text>
  <g stroke="#fff" stroke-width="2"><rect x="470" y="268" width="100" height="34" fill="#1098ad"/><rect x="570" y="268" width="100" height="34" fill="#1098ad"/><rect x="670" y="268" width="100" height="34" fill="#1098ad"/></g>
  <g font-size="16" font-weight="700" fill="#fff" text-anchor="middle"><text x="520" y="291">H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan></text><text x="620" y="291">H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan></text><text x="720" y="291">H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4">&#8203;</tspan></text></g>
  <rect x="470" y="310" width="300" height="34" fill="#2b8a3e" stroke="#fff" stroke-width="2"/>
  <text x="620" y="333" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">make 1 mol ATP in the cell: ≈ 50–55 kJ</text>
  <text x="790" y="296" font-size="17" font-weight="700">3 × 18 ≈ 54 kJ</text>
  <text x="790" y="333" font-size="17" font-weight="700">≥ 3 H<tspan font-size="11.6" dy="-6.8">+</tspan><tspan dy="6.8"> per ATP</tspan></text>
</svg>
