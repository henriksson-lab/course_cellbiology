<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" fill="#1b2a3a">
  <defs><marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
  <text x="20" y="28" font-size="19" font-weight="700">1966: the acid bath (Jagendorf and Uribe)</text>
  <!-- step 1 -->
  <rect x="20" y="50" width="200" height="190" rx="10" fill="#fff4e6" stroke="#adb5bd"/>
  <text x="120" y="74" font-size="16" text-anchor="middle" font-weight="700">1. soak in pH 4</text>
  <ellipse cx="120" cy="160" rx="62" ry="46" fill="#fff" stroke="#2b8a3e" stroke-width="3"/>
  <g fill="#1098ad"><circle cx="95" cy="145" r="6"/><circle cx="125" cy="140" r="6"/><circle cx="150" cy="160" r="6"/><circle cx="105" cy="175" r="6"/><circle cx="135" cy="180" r="6"/><circle cx="40" cy="100" r="6"/><circle cx="200" cy="110" r="6"/><circle cx="40" cy="196" r="6"/><circle cx="200" cy="192" r="6"/></g>
  <text x="52" y="232" font-size="15">H<tspan font-size="10.2" dy="-6.0">+</tspan><tspan dy="6.0"> fill the vesicle</tspan></text>
  <line x1="228" y1="145" x2="268" y2="145" stroke="#1b2a3a" stroke-width="3" marker-end="url(#k)"/>
  <!-- step 2 -->
  <rect x="275" y="50" width="200" height="190" rx="10" fill="#e7f5ff" stroke="#adb5bd"/>
  <text x="375" y="74" font-size="16" text-anchor="middle" font-weight="700">2. move to pH 8</text>
  <text x="284.8" y="94" font-size="15" text-anchor="start">+ ADP + P<tspan font-size="10.2" dy="3.8">i</tspan><tspan dy="-3.8">, in the dark</tspan></text>
  <ellipse cx="375" cy="160" rx="62" ry="46" fill="#fff" stroke="#2b8a3e" stroke-width="3"/>
  <g fill="#1098ad"><circle cx="350" cy="145" r="6"/><circle cx="380" cy="140" r="6"/><circle cx="405" cy="160" r="6"/><circle cx="360" cy="175" r="6"/><circle cx="390" cy="180" r="6"/></g>
  <rect x="428" y="148" width="20" height="24" rx="4" fill="#1b2a3a"/>
  <text x="454" y="140" font-size="14" font-weight="700" fill="#2b8a3e">ATP!</text>
  <text x="292" y="232" font-size="15">H<tspan font-size="10.2" dy="-6.0">+</tspan><tspan dy="6.0"> exit via ATP synthase</tspan></text>
  <text x="20" y="272" font-size="16">Thylakoid vesicles from chloroplasts, no light and</text>
  <text x="20" y="294" font-size="16">no electron transport: <tspan font-weight="700">a pH difference alone</tspan></text>
  <text x="20" y="316" font-size="16"><tspan font-weight="700">makes ATP.</tspan></text>
  <!-- panel B -->
  <text x="520" y="28" font-size="19" font-weight="700">1974: build it from parts (Racker and Stoeckenius)</text>
  <rect x="520" y="50" width="460" height="190" rx="10" fill="#fbfaf5" stroke="#adb5bd"/>
  <circle cx="690" cy="148" r="78" fill="#fff" stroke="#8a6a12" stroke-width="4"/>
  <text x="690" y="152" font-size="15" text-anchor="middle">artificial vesicle</text>
  <text x="690" y="170" font-size="15" text-anchor="middle">(liposome)</text>
  <!-- light pump -->
  <rect x="604" y="98" width="26" height="34" rx="6" fill="#7b2cbf" transform="rotate(-35 617 115)"/>
  <path d="M566,70 L592,94 M556,90 L582,108" stroke="#f08c00" stroke-width="3"/>
  <text x="532" y="78" font-size="15" fill="#f08c00" font-weight="700">light</text>
  <!-- ATP synthase -->
  <rect x="752" y="180" width="24" height="30" rx="5" fill="#1b2a3a" transform="rotate(-40 764 195)"/>
  <circle cx="790" cy="222" r="13" fill="#1b2a3a"/>
  <g font-size="15">
    <text x="790" y="92" font-weight="700" fill="#7b2cbf">bacteriorhodopsin</text>
    <text x="790" y="112">light-driven H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> pump</tspan></text>
    <text x="790" y="130">(from an archaeon)</text>
    <text x="812" y="194" font-weight="700">ATP synthase</text>
    <text x="812" y="212">(from cow heart</text>
    <text x="812" y="230">mitochondria)</text>
  </g>
  <line x1="635" y1="100" x2="780" y2="96" stroke="#1b2a3a" stroke-width="1"/>
  <text x="520" y="272" font-size="16">Light → H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> pumped in → H</tspan><tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> flow out → <tspan font-weight="700" fill="#2b8a3e">ATP</tspan>.</tspan></text>
  <text x="520" y="294" font-size="16">Two proteins from different kingdoms share only one</text>
  <text x="520" y="316" font-size="16">thing: <tspan font-weight="700">the H<tspan font-size="10.9" dy="-6.4">+</tspan><tspan dy="6.4"> gradient across a sealed membrane</tspan>.</tspan></text>
  <rect x="20" y="340" width="960" height="46" rx="8" fill="#e3f4f7" stroke="#1098ad"/>
  <text x="36" y="369" font-size="17"><tspan font-weight="700">Conclusion:</tspan> the link between electron transport and ATP synthesis is the H<tspan font-size="12.2" dy="-7.2">+</tspan><tspan dy="7.2"> gradient (Mitchell, Nobel Prize 1978).</tspan></text>
</svg>
