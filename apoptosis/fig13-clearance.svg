<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
  <!-- dying cell -->
  <g transform="translate(210 200)">
    <circle cx="-62" cy="-50" r="16" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="66" cy="44" r="14" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle r="82" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle cx="-8" cy="4" r="16" fill="#6b4fa0"/><circle cx="18" cy="-12" r="11" fill="#6b4fa0"/>
    <g fill="#e8590c">
      <circle cx="82" cy="0" r="5"/><circle cx="71" cy="-41" r="5"/><circle cx="41" cy="-71" r="5"/><circle cx="0" cy="-82" r="5"/><circle cx="-41" cy="71" r="5"/><circle cx="-82" cy="0" r="5"/><circle cx="41" cy="71" r="5"/><circle cx="-71" cy="41" r="5"/><circle cx="0" cy="82" r="5"/>
    </g>
  </g>
  <text x="210" y="320" text-anchor="middle" font-weight="700">apoptotic cell</text>
  <!-- find-me signals -->
  <g fill="#1098ad"><circle cx="330" cy="70" r="5"/><circle cx="380" cy="52" r="5"/><circle cx="430" cy="66" r="5"/><circle cx="360" cy="96" r="5"/><circle cx="470" cy="45" r="5"/><circle cx="520" cy="72" r="5"/></g>
  <path d="M300,110 Q420,20 600,80" fill="none" stroke="#1098ad" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="330" y="28" font-size="17" fill="#0b7285" font-weight="700">"Find me": ATP, UTP, lipids diffuse out</text>
  <!-- macrophage -->
  <g transform="translate(790 200)">
    <path d="M-150,10 Q-160,-60 -110,-100 Q-40,-140 60,-120 Q170,-100 180,0 Q180,100 80,130 Q-40,150 -110,110 Q-170,80 -150,10 Z" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2.5"/>
    <circle cx="70" cy="20" r="36" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <g fill="#2e8b57"><rect x="-156" y="-14" width="16" height="8" rx="2"/><rect x="-158" y="14" width="16" height="8" rx="2"/><rect x="-150" y="40" width="16" height="8" rx="2"/><rect x="-148" y="-40" width="16" height="8" rx="2"/></g>
    <text x="10" y="-60" text-anchor="middle" font-weight="700" fill="#2e8b57">macrophage</text>
  </g>
  <!-- eat me link -->
  <line x1="300" y1="200" x2="622" y2="200" stroke="#e8590c" stroke-width="3" marker-end="url(#a)"/>
  <text x="460" y="190" text-anchor="middle" font-size="17" fill="#e8590c" font-weight="700">"Eat me": PS on the surface</text>
  <text x="460" y="226" text-anchor="middle" font-size="15">binds PS receptors on the macrophage</text>
  <!-- legend / bottom -->
  <circle cx="40" cy="358" r="6" fill="#e8590c"/><text x="54" y="364" font-size="16">phosphatidylserine (PS), flipped outside by a scramblase</text>
  <rect x="34" y="378" width="16" height="8" rx="2" fill="#2e8b57"/><text x="54" y="388" font-size="16">PS receptors</text>
  <text x="620" y="360" font-size="16">Live cells show <tspan font-weight="700">CD47</tspan>: "don't eat me".</text>
  <text x="620" y="384" font-size="16">The meal makes the macrophage calm: TGF-β, IL-10.</text>
</svg>
