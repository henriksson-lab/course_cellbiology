<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1100 290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
  <!-- 1 normal -->
  <g transform="translate(100 120)">
    <ellipse rx="80" ry="64" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle r="30" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <ellipse cx="-50" cy="-14" rx="14" ry="6" fill="#f8e9ec" stroke="#a8324a" stroke-width="1.5"/>
    <ellipse cx="48" cy="22" rx="14" ry="6" fill="#f8e9ec" stroke="#a8324a" stroke-width="1.5"/>
    <ellipse cx="40" cy="-34" rx="12" ry="5" fill="#f8e9ec" stroke="#a8324a" stroke-width="1.5"/>
  </g>
  <text x="100" y="222" text-anchor="middle" font-weight="700">healthy cell</text>
  <!-- 2 shrinks, chromatin condenses -->
  <g transform="translate(320 120)">
    <ellipse rx="58" ry="48" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle r="24" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <path d="M-21,-8 A23,23 0 0 1 8,-22 L5,-14 A15,15 0 0 0 -14,-4 Z" fill="#6b4fa0"/>
    <path d="M20,4 A21,21 0 0 1 -4,22 L-3,14 A13,13 0 0 0 13,3 Z" fill="#6b4fa0"/>
    <ellipse cx="-36" cy="18" rx="11" ry="5" fill="#f8e9ec" stroke="#a8324a" stroke-width="1.5"/>
  </g>
  <text x="320" y="222" text-anchor="middle" font-weight="700">shrinks;</text>
  <text x="320" y="242" text-anchor="middle" font-weight="700">chromatin condenses</text>
  <!-- 3 blebbing, nucleus fragments -->
  <g transform="translate(545 120)">
    <circle cx="-44" cy="-30" r="16" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="40" cy="-38" r="14" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="52" cy="22" r="15" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="-48" cy="28" r="13" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="0" cy="50" r="12" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <ellipse rx="52" ry="44" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle cx="-12" cy="-8" r="10" fill="#6b4fa0"/><circle cx="12" cy="-4" r="8" fill="#6b4fa0"/><circle cx="0" cy="14" r="9" fill="#6b4fa0"/>
  </g>
  <text x="545" y="222" text-anchor="middle" font-weight="700">membrane blebs;</text>
  <text x="545" y="242" text-anchor="middle" font-weight="700">nucleus breaks up</text>
  <!-- 4 apoptotic bodies -->
  <g transform="translate(760 120)">
    <circle cx="-30" cy="-26" r="22" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="-30" cy="-26" r="8" fill="#6b4fa0"/>
    <circle cx="28" cy="-22" r="18" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <ellipse cx="28" cy="-20" rx="9" ry="4" fill="#f8e9ec" stroke="#a8324a" stroke-width="1.5"/>
    <circle cx="-14" cy="30" r="20" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="-14" cy="30" r="7" fill="#6b4fa0"/>
    <circle cx="36" cy="28" r="15" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
    <g fill="#e8590c"><circle cx="-52" cy="-30" r="3"/><circle cx="-8" cy="-26" r="3"/><circle cx="46" cy="-24" r="3"/><circle cx="6" cy="32" r="3"/><circle cx="51" cy="30" r="3"/><circle cx="-34" cy="32" r="3"/></g>
  </g>
  <text x="760" y="222" text-anchor="middle" font-weight="700">apoptotic bodies</text>
  <circle cx="694" cy="237" r="4" fill="#e8590c"/><text x="702" y="242" font-size="15">= "eat me" signal</text>
  <!-- 5 engulfed -->
  <g transform="translate(985 120)">
    <path d="M-90,10 Q-90,-70 0,-72 Q90,-70 92,0 Q90,70 0,72 Q-80,72 -90,10 Z" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2.5"/>
    <circle cx="-10" cy="40" r="22" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <circle cx="-22" cy="-22" r="24" fill="#d2ead9" stroke="#2e8b57" stroke-width="1.5"/>
    <circle cx="-22" cy="-22" r="17" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/><circle cx="-22" cy="-22" r="6" fill="#6b4fa0"/>
    <circle cx="36" cy="-14" r="19" fill="#d2ead9" stroke="#2e8b57" stroke-width="1.5"/>
    <circle cx="36" cy="-14" r="13" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2"/>
  </g>
  <text x="985" y="222" text-anchor="middle" font-weight="700">eaten by a</text>
  <text x="985" y="242" text-anchor="middle" font-weight="700">macrophage</text>
  <!-- arrows -->
  <g stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)">
    <line x1="188" y1="120" x2="252" y2="120"/><line x1="386" y1="120" x2="474" y2="120"/>
    <line x1="608" y1="120" x2="704" y2="120"/><line x1="810" y1="120" x2="884" y2="120"/>
  </g>
  <rect x="150" y="270" width="800" height="48" rx="10" fill="#f6f0de" stroke="#8a6a12"/>
  <text x="550" y="300" text-anchor="middle" font-size="18" font-weight="700">The membrane stays intact all the way: nothing leaks out, so there is no inflammation.</text>
</svg>
