<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b2a3a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <!-- panel frames -->
  <rect x="5" y="5" width="330" height="350" rx="12" fill="#fbfaf5" stroke="#c9c3b0"/>
  <rect x="345" y="5" width="330" height="350" rx="12" fill="#fbfaf5" stroke="#c9c3b0"/>
  <rect x="685" y="5" width="330" height="350" rx="12" fill="#fbfaf5" stroke="#c9c3b0"/>
  <text x="170" y="36" text-anchor="middle" font-size="21" font-weight="700">1. Development</text>
  <text x="510" y="36" text-anchor="middle" font-size="21" font-weight="700">2. Damage</text>
  <text x="850" y="36" text-anchor="middle" font-size="21" font-weight="700">3. Immunity</text>

  <!-- 1: paddle to hand -->
  <g transform="translate(30 60)">
    <path d="M10,160 L10,70 Q10,20 60,15 Q110,20 110,70 L110,160 Z" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
    <g fill="#6b4fa0" opacity="0.8">
      <rect x="20" y="40" width="10" height="70" rx="5"/><rect x="45" y="30" width="10" height="80" rx="5"/>
      <rect x="70" y="32" width="10" height="78" rx="5"/><rect x="92" y="45" width="10" height="65" rx="5"/>
    </g>
    <g fill="#e8590c">
      <circle cx="38" cy="50" r="4"/><circle cx="37" cy="70" r="4"/><circle cx="39" cy="90" r="4"/>
      <circle cx="63" cy="45" r="4"/><circle cx="62" cy="65" r="4"/><circle cx="63" cy="88" r="4"/>
      <circle cx="86" cy="55" r="4"/><circle cx="87" cy="75" r="4"/><circle cx="86" cy="95" r="4"/>
    </g>
    <line x1="125" y1="95" x2="165" y2="95" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
    <path d="M180,160 L180,95 L182,40 Q186,30 192,40 L194,95 L200,95 L203,25 Q208,15 213,25 L216,95 L222,95 L226,28 Q231,18 236,28 L238,95 L244,95 L249,48 Q254,38 259,48 L260,160 Z" fill="#f6f0de" stroke="#8a6a12" stroke-width="2"/>
  </g>
  <text x="80" y="246" text-anchor="middle" font-size="15">webbed paddle</text>
  <text x="250" y="246" text-anchor="middle" font-size="15">fingers</text>
  <circle cx="30" cy="268" r="5" fill="#e8590c"/><text x="42" y="273" font-size="15">dying cells between the digits</text>
  <text x="20" y="306" font-size="15">Also: tadpole tail, half of all</text>
  <text x="20" y="326" font-size="15">new neurons, self-reactive T cells</text>

  <!-- 2: damaged cell -->
  <g transform="translate(510 140)">
    <circle r="78" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle r="36" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <path d="M-22,-8 Q-10,-22 0,-8 Q10,6 22,-8" fill="none" stroke="#6b4fa0" stroke-width="3"/>
    <path d="M-22,12 Q-12,0 -3,10" fill="none" stroke="#6b4fa0" stroke-width="3"/>
    <path d="M5,14 Q14,24 22,12" fill="none" stroke="#6b4fa0" stroke-width="3"/>
    <path d="M-3,10 L1,6 L-1,14 L5,14" fill="none" stroke="#e8590c" stroke-width="2.5"/>
    <text x="0" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4fa0">p53</text>
  </g>
  <text x="510" y="246" text-anchor="middle" font-size="15">broken DNA → p53 → die</text>
  <text x="360" y="290" font-size="15">DNA damage, oncogene activity,</text>
  <text x="360" y="310" font-size="15">ER stress, no growth factor:</text>
  <text x="360" y="330" font-size="15">a risky cell removes itself</text>

  <!-- 3: killer T cell and infected cell -->
  <g transform="translate(790 140)">
    <circle r="58" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2.5"/>
    <circle r="26" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="0" y="86" text-anchor="middle" font-size="15">killer T cell</text>
  </g>
  <g transform="translate(925 140)">
    <circle r="52" fill="#fbfaf5" stroke="#8a6a12" stroke-width="2.5"/>
    <circle r="22" fill="#efebf7" stroke="#6b4fa0" stroke-width="2"/>
    <g fill="#c2255c"><polygon points="-30,-22 -24,-30 -18,-22 -24,-14"/><polygon points="24,-30 30,-38 36,-30 30,-22"/><polygon points="-12,30 -6,22 0,30 -6,38"/><polygon points="28,14 34,6 40,14 34,22"/></g>
    <text x="0" y="80" text-anchor="middle" font-size="15">infected cell</text>
  </g>
  <line x1="846" y1="140" x2="866" y2="140" stroke="#e8590c" stroke-width="3" marker-end="url(#ao)"/>
  <text x="700" y="290" font-size="15">FasL and granzymes from the</text>
  <text x="700" y="310" font-size="15">killer cell start the target's own</text>
  <text x="700" y="330" font-size="15">death program; no inflammation</text>
</svg>
